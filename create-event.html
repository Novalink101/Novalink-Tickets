<script src="routing-engine.js"></script>
<script>
(function(){
'use strict';

function $(id){ return document.getElementById(id); }

// ===== STATE =====
var canvasWidth = 1200;
var canvasHeight = 800;
var gridSize = 50;
var snapToGrid = true;
var showGrid = true;
var autoLayoutEnabled = true;
var autoLayoutAxis = 'horizontal';
var sectionSpacingPx = 40;
var pxPerCm = 1;
var stage = { x: 500, y: 60, width: 200, height: 60, name: "STAGE" };
var levels = [{ id: 0, name: "Ground Floor", color: "#00FFFF", visible: true }];
var nextLevelId = 1;
var sectionRowOverrides = {};
var sectionRowCounts = {};
var sectionNames = {};
var sectionTierOverrides = {};
var sectionPositions = {};
var currentEditingSection = 0;
var tableMode = false;
var sectionTableRows = {};
var canvasElements = [];
var nextCanvasElementId = 1;
var expandedElementId = null;
var lastFoundSeat = null;
var ticketFlipped = false;

// ===== TIER SYSTEM =====
var TIER_KEYS = ["black", "gold", "silver", "cyan", "tier5", "tier6"];
var TIER_DEFAULTS = { black: "#1a202c", gold: "#ecc94b", silver: "#cbd5e1", cyan: "#00FFFF", tier5: "#a855f7", tier6: "#f472b6" };
var TIER_DEFAULT_NAMES = { black: "Elite", gold: "Gold", silver: "Silver", cyan: "Standard", tier5: "Platinum", tier6: "Diamond" };
var TIER_COLORS = Object.assign({}, TIER_DEFAULTS);
var TIER_NAMES = Object.assign({}, TIER_DEFAULT_NAMES);
var TIER_PRICES = { black: 0, gold: 0, silver: 0, cyan: 0, tier5: 0, tier6: 0 };

var MAX_TIERS = 6;
var MIN_TIERS = 2;
var DEFAULT_TIERS = 4;
var LARGE_VENUE_THRESHOLD = 5000;
var activeTierCount = DEFAULT_TIERS;

function getActiveTiers(){ return TIER_KEYS.slice(0, activeTierCount); }
function isTierActive(t){ return getActiveTiers().indexOf(t) !== -1; }
function tierIdToCap(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
function getTierLabel(tier){ return TIER_NAMES[tier] || tier; }

// Updated Plan object to hold feature flags
var currentPlan = { 
  id: "standard", 
  fee: 7, 
  limit: 500,
  features: {
    barcode: true,
    verticalBarcode: false,
    customDesign: false,
    scannerStaff: 5,
    whiteLabel: false,
    multiDay: false,
    unlimitedScanners: false
  }
};

var MARKER_TYPES = {
  exit:     { color: '#10b981', icon: '↗',  defaultLabel: 'EXIT' },
  entrance: { color: '#3b82f6', icon: '→',  defaultLabel: 'ENTRANCE' },
  bathroom: { color: '#a855f7', icon: '🚻', defaultLabel: 'WC' }
};

var tableConfig = {
  shape: "circular", chairsAround: 8, chairsPerSide: 2, chairsLongSide: 4, chairsShortSide: 1,
  circularDiameterCm: 150, squareSideCm: 100, rectWidthCm: 90, rectLengthCm: 180, spacingCm: 65
};

var TABLE_STD = {
  widthMin: 90, widthMax: 102, squareMin: 90, squareMax: 120,
  circMin: 90, circMax: 180, lengthMin: 120, lengthMax: 300,
  spacingMin: 61, spacingMax: 76, seatMin: 41, seatMax: 51
};

var levelColors = ["#00FFFF", "#facc15", "#a78bfa", "#fb7185", "#34d399", "#60a5fa", "#f97316", "#e879f9"];

/* ============ COLOUR HELPERS ============ */
function hexToRgbObj(hex){
  var c = String(hex || "").replace("#","");
  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  if (c.length !== 6) return null;
  return { r: parseInt(c.substring(0,2),16), g: parseInt(c.substring(2,4),16), b: parseInt(c.substring(4,6),16) };
}
function rgbObjToHex(c){
  return "#" + [c.r,c.g,c.b].map(function(x){ return Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2,"0"); }).join("");
}
function mixWithWhite(hex, ratio){
  var c = hexToRgbObj(hex); if (!c) return hex;
  return rgbObjToHex({ r: c.r + (255 - c.r) * ratio, g: c.g + (255 - c.g) * ratio, b: c.b + (255 - c.b) * ratio });
}
function mixWithBlack(hex, ratio){
  var c = hexToRgbObj(hex); if (!c) return hex;
  return rgbObjToHex({ r: c.r * (1 - ratio), g: c.g * (1 - ratio), b: c.b * (1 - ratio) });
}
function relativeLuminance(hex){
  var c = hexToRgbObj(hex); if (!c) return 0;
  var arr = [c.r, c.g, c.b].map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * arr[0] + 0.7152 * arr[1] + 0.0722 * arr[2];
}
function contrastTextOn(hex){ return relativeLuminance(hex) > 0.5 ? "#0a0f14" : "#ffffff"; }

function applyTierColors(){
  var root = document.documentElement;
  TIER_KEYS.forEach(function(name){
    var hex = TIER_COLORS[name] || TIER_DEFAULTS[name];
    root.style.setProperty("--tier-" + name, hex);
    root.style.setProperty("--tier-" + name + "-light", mixWithWhite(hex, 0.85));
    root.style.setProperty("--tier-" + name + "-text", contrastTextOn(hex));
    root.style.setProperty("--tier-" + name + "-text-light", mixWithBlack(hex, 0.45));
    var sw = $("tierSwatch" + tierIdToCap(name));
    if (sw) sw.style.background = hex;
  });
  updateTicketPreview();
}

/* ============ TICKET PALETTE ============ */
function getTicketPalette(hex){
  var lum = relativeLuminance(hex);
  var isDark = lum < 0.35;
  if (isDark) {
    return {
      c1: mixWithWhite(hex, 0.06),
      c2: mixWithBlack(hex, 0.45),
      text: "#ffffff",
      muted: "rgba(255,255,255,0.65)",
      logo: "#00FFFF",
      badgeBg: "rgba(255,255,255,0.15)",
      badgeText: "#ffffff"
    };
  }
  var c1 = mixWithWhite(hex, 0.92);
  var c2 = mixWithWhite(hex, 0.4);
  var text = contrastTextOn(c2);
  var isLightText = text === "#ffffff";
  return {
    c1: c1, c2: c2, text: text,
    muted: isLightText ? "rgba(255,255,255,0.7)" : "rgba(0,0,0,0.6)",
    logo: isLightText ? "#00FFFF" : "#1e2f4d",
    badgeBg: isLightText ? "rgba(255,255,255,0.15)" : "rgba(0,0,0,0.08)",
    badgeText: isLightText ? "#ffffff" : "#4a5568"
  };
}
function applyPaletteToCard(card, p){
  if (!card) return;
  card.style.setProperty("--ticket-bg-1", p.c1);
  card.style.setProperty("--ticket-bg-2", p.c2);
  card.style.setProperty("--ticket-text", p.text);
  card.style.setProperty("--ticket-muted", p.muted);
  card.style.setProperty("--ticket-logo", p.logo);
  card.style.setProperty("--ticket-badge-bg", p.badgeBg);
  card.style.setProperty("--ticket-badge-text", p.badgeText);
}
function applyTicketPalette(tier){
  var hex = TIER_COLORS[tier] || TIER_DEFAULTS[tier] || "#00FFFF";
  var p = getTicketPalette(hex);
  applyPaletteToCard($("dynamicTicket"), p);
  applyPaletteToCard($("dynamicTicketBack"), p);
}

/* ============ CURRENCY HELPERS ============ */
function readCost(){
  var v = parseFloat($("cost") ? $("cost").value : "");
  if (isNaN(v) || v < 0) v = 0;
  return Math.round(v * 100) / 100;
}
function formatCurrency(v){
  if (!v || v <= 0) return "R 0.00";
  return "R " + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function formatCurrencyCompact(v){
  if (v === undefined || v === null || isNaN(v)) return "R 0.00";
  return "R " + Number(v).toFixed(2);
}

function showToast(msg, type, ms) {
  type = type || "info"; ms = ms || 3000;
  var t = $("toast");
  var i = type === "error" ? "alert-circle" : (type === "success" ? "check-circle" : "info");
  t.className = "toast " + type;
  t.innerHTML = '<i data-lucide="' + i + '"></i><span>' + msg + '</span>';
  if (window.lucide) lucide.createIcons();
  requestAnimationFrame(function(){ t.classList.add("show"); });
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.classList.remove("show"); }, ms);
}

document.addEventListener("DOMContentLoaded", function(){
  if(window.lucide) lucide.createIcons();

  function rowLabel(index) { var n = index, label = ""; do { label = String.fromCharCode(65 + (n % 26)) + label; n = Math.floor(n / 26) - 1; } while (n >= 0); return label; }
  function blockLabel(index) { return String.fromCharCode(65 + index); }
  function tierTagText(t) { return getTierLabel(t); }
  function snap(v) { return snapToGrid ? Math.round(v / gridSize) * gridSize : v; }
  function clampInt(v, min, max, fallback) { var n = parseInt(v, 10); if (isNaN(n)) n = fallback; return Math.max(min, Math.min(max, n)); }
  function clampFloat(v, min, max, fallback) { var n = parseFloat(v); if (isNaN(n)) n = fallback; return Math.max(min, Math.min(max, n)); }
  function getSectionName(idx) { return sectionNames[idx] || ("Section " + blockLabel(idx)); }
  function setSectionName(idx, name) { if (name && name.trim()) sectionNames[idx] = name.trim(); else delete sectionNames[idx]; }
  function getSectionTierOverride(idx) {
    var t = sectionTierOverrides[idx] || null;
    if (t && !isTierActive(t)) t = null;
    return t;
  }
  function setSectionTierOverride(idx, tier) { if (tier && isTierActive(tier)) sectionTierOverrides[idx] = tier; else delete sectionTierOverrides[idx]; }
  function getRowCount(idx) { if (sectionRowCounts[idx] !== undefined) return sectionRowCounts[idx]; return parseInt($("totalLevel2").value) || 6; }
  function setRowCount(idx, v) { sectionRowCounts[idx] = Math.max(1, Math.min(52, v)); }

  function getDefaultTableCount() { return Math.max(1, Math.min(50, parseInt($("tableCount").value) || 4)); }
  function getSectionTableRows(idx) { var rows = sectionTableRows[idx]; if (!rows || !rows.length) return [{ count: getDefaultTableCount() }]; return rows; }
  function ensureSectionTableRows(idx) { if (!sectionTableRows[idx] || !sectionTableRows[idx].length) sectionTableRows[idx] = [{ count: getDefaultTableCount() }]; return sectionTableRows[idx]; }
  function getTableCount(idx) { return getSectionTableRows(idx).reduce(function(s, r) { return s + (r.count || 0); }, 0); }

  function getTableWidthCm() { if (tableConfig.shape === "circular") return tableConfig.circularDiameterCm; if (tableConfig.shape === "square") return tableConfig.squareSideCm; return tableConfig.rectWidthCm; }
  function getTableLengthCm() { if (tableConfig.shape === "rectangular") return tableConfig.rectLengthCm; return getTableWidthCm(); }
  function getSpacingCm() { return tableConfig.spacingCm; }
  function chairsPerTable() { var c = tableConfig; if (c.shape === "circular") return c.chairsAround; if (c.shape === "square") return c.chairsPerSide * 4; return (c.chairsLongSide + c.chairsShortSide) * 2; }
  function cmToPx(cm, extraScale) { return cm * pxPerCm * (extraScale === undefined ? 1 : extraScale); }
  function getSeatsForRow(sIdx, rIdx) { var d = sectionRowOverrides[sIdx]; if (d && d[rIdx] !== undefined) return d[rIdx]; return parseInt($("totalLevel3").value) || 10; }
  function getSectionPos(idx) {
    if (sectionPositions[idx]) return sectionPositions[idx];
    var count = parseInt($("totalLevel1").value) || 1;
    var gap = canvasWidth / (count + 1);
    var pos = { x: Math.round(gap * (idx + 1) - 120), y: 300, scale: 1, rotation: 0, levelId: levels[0].id };
    sectionPositions[idx] = pos;
    return pos;
  }
  function setSectionPos(idx, key, val) { if (!sectionPositions[idx]) getSectionPos(idx); sectionPositions[idx][key] = val; }

  function buildRowTierMap(totalRows, sectionIdx) {
    var override = (sectionIdx !== undefined) ? getSectionTierOverride(sectionIdx) : null;
    if (override) { var m = []; for (var i = 0; i < totalRows; i++) m.push(override); return m; }
    var active = getActiveTiers();
    var counts = {};
    active.forEach(function(t){
      var el = document.querySelector('.tier-rows-input[data-tier="' + t + '"]');
      counts[t] = el ? (parseInt(el.value) || 0) : 0;
    });
    var map = [];
    active.forEach(function(t){
      var c = counts[t];
      for (var i = 0; i < c && map.length < totalRows; i++) map.push(t);
    });
    var fallback = active[active.length - 1] || "cyan";
    while (map.length < totalRows) map.push(fallback);
    return map;
  }

  function calculateCapacity() {
    var sections = parseInt($("totalLevel1").value) || 0;
    var total = 0;
    if (tableMode) {
      var cpt = chairsPerTable();
      for (var s = 0; s < sections; s++) total += getTableCount(s) * cpt;
    } else {
      for (var s2 = 0; s2 < sections; s2++) {
        var rows = getRowCount(s2);
        for (var r = 0; r < rows; r++) total += getSeatsForRow(s2, r);
      }
    }
    $("totalCapacity").value = total;
    return total;
  }

  /* ============ TIER MANAGEMENT ============ */
  function updateTierCountOptions(){
    var sel = $("tierCount");
    if (!sel) return;
    var capacity = calculateCapacity();
    var allowExtra = capacity > LARGE_VENUE_THRESHOLD;
    Array.from(sel.options).forEach(function(opt){
      var n = parseInt(opt.value, 10);
      if (n > 4 && !allowExtra) opt.disabled = true;
      else opt.disabled = false;
    });
    if (!allowExtra && activeTierCount > 4) {
      activeTierCount = 4;
      sel.value = "4";
      showToast("Venue capacity dropped below 5,000 — tier count reduced to 4.", "info", 4000);
    }
    var hint = $("tierCountHint");
    if (hint) {
      hint.textContent = allowExtra
        ? "Venue capacity is above 5,000 — you can use up to 6 tiers."
        : "Minimum 2 tiers. Venue capacity must exceed 5,000 to enable 5 or 6 tiers.";
    }
  }

  function updateTierVisibility(){
    var active = getActiveTiers();
    TIER_KEYS.forEach(function(t){
      var visible = active.indexOf(t) !== -1;
      var display = visible ? "" : "none";
      var priceRow = document.querySelector('.tier-price-row[data-tier-row="' + t + '"]');
      if (priceRow) priceRow.style.display = display;
      var colorItem = document.querySelector('.tier-color-item[data-tier-color="' + t + '"]');
      if (colorItem) colorItem.style.display = display;
      var distItem = document.querySelector('.tier-dist-item[data-tier-dist="' + t + '"]');
      if (distItem) distItem.style.display = display;
    });
    var idx = currentEditingSection;
    if (sectionTierOverrides[idx] && !isTierActive(sectionTierOverrides[idx])) {
      delete sectionTierOverrides[idx];
    }
    var previewSel = $("tierColor");
    if (previewSel && !isTierActive(previewSel.value)) {
      var fallback = active[active.length - 1] || "cyan";
      previewSel.value = fallback;
    }
    syncTierNamesEverywhere();
    updateRevenueCalculator();
    updateTierSummary();
    renderSeatingPlan();
    if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
  }

  function rebuildTicketTierDropdown(){
    var sel = $("tierColor");
    if (!sel) return;
    var active = getActiveTiers();
    var prev = sel.value;
    sel.innerHTML = "";
    active.forEach(function(t){
      var opt = document.createElement("option");
      opt.value = t;
      opt.textContent = TIER_NAMES[t] || TIER_DEFAULT_NAMES[t] || t;
      sel.appendChild(opt);
    });
    if (active.indexOf(prev) !== -1) sel.value = prev;
    else sel.value = active[active.length - 1] || "cyan";
  }

  function rebuildSectionTierOverrideDropdown(){
    var sel = $("sectionTierOverride");
    if (!sel) return;
    var active = getActiveTiers();
    var prev = sel.value;
    sel.innerHTML = "";
    var opt0 = document.createElement("option");
    opt0.value = ""; opt0.textContent = "— Use Row Distribution —";
    sel.appendChild(opt0);
    active.forEach(function(t){
      var opt = document.createElement("option");
      opt.value = t;
      opt.textContent = TIER_NAMES[t] || TIER_DEFAULT_NAMES[t] || t;
      sel.appendChild(opt);
    });
    if (active.indexOf(prev) !== -1) sel.value = prev;
    else sel.value = "";
  }

  /* ============ SEAT COUNTING & REVENUE ============ */
  function getTierSeatCounts() {
    var counts = {};
    TIER_KEYS.forEach(function(t){ counts[t] = 0; });
    var sections = parseInt($("totalLevel1").value) || 0;
    var fallbackTier = getActiveTiers()[getActiveTiers().length - 1] || "cyan";
    if (tableMode) {
      var cpt = chairsPerTable();
      for (var s = 0; s < sections; s++) {
        var tier = getSectionTierOverride(s) || fallbackTier;
        var tables = getTableCount(s);
        counts[tier] = (counts[tier] || 0) + tables * cpt;
      }
    } else {
      for (var s2 = 0; s2 < sections; s2++) {
        var rows = getRowCount(s2);
        var map = buildRowTierMap(rows, s2);
        for (var r = 0; r < rows; r++) {
          var seats = getSeatsForRow(s2, r);
          counts[map[r]] = (counts[map[r]] || 0) + seats;
        }
      }
    }
    return counts;
  }

  function updateRevenueCalculator() {
    var counts = getTierSeatCounts();
    var active = getActiveTiers();
    var totalTickets = 0;
    var gross = 0;
    active.forEach(function(tier){
      var qty = counts[tier] || 0;
      totalTickets += qty;
      var price = TIER_PRICES[tier] || 0;
      var tierRev = qty * price;
      gross += tierRev;
      var revEl = document.querySelector('[data-rev-row="' + tier + '"]');
      if (revEl) revEl.textContent = formatCurrencyCompact(tierRev);
      var qtyEl = document.querySelector('[data-qty-badge="' + tier + '"]');
      if (qtyEl) qtyEl.textContent = qty + (qty === 1 ? " seat" : " seats");
    });
    var fee = gross * (currentPlan.fee / 100);
    var net = gross - fee;

    var limit = currentPlan.limit;
    var limitLabel = limit >= 999999 ? "unlimited" : limit;
    $("revTotalTickets").textContent = totalTickets + " / " + limitLabel;
    $("revGross").textContent = formatCurrency(gross);
    $("revFee").textContent = "− " + formatCurrency(fee);
    $("revNet").textContent = formatCurrency(net);

    var warn = $("revWarning"), warnTxt = $("revWarningText");
    if (totalTickets > limit && limit < 999999) {
      warnTxt.textContent = "Your capacity (" + totalTickets + ") exceeds the " + currentPlan.id.charAt(0).toUpperCase() + currentPlan.id.slice(1) + " plan limit of " + limit + " tickets. Upgrade to sell more, or reduce capacity.";
      warn.classList.remove("hidden");
    } else {
      warn.classList.add("hidden");
    }
  }

  function updatePlanDisplay() {
    $("revPlanName").textContent = currentPlan.id.charAt(0).toUpperCase() + currentPlan.id.slice(1) + " · " + currentPlan.fee + "%";
    $("revFeePct").textContent = currentPlan.fee + "%";
    document.querySelectorAll(".plan-card").forEach(function(card){
      var radio = card.querySelector("input[type=radio]");
      card.classList.toggle("selected", radio && radio.checked);
    });
    updateRevenueCalculator();
  }

  /* ============ PLAN FEATURE RESTRICTIONS ============ */
  function applyPlanRestrictions() {
    updateRevenueCalculator();

    // 1. Barcode Toggle (Assuming a UI element exists)
    // Standard+ has barcode. Basic only has QR.
    var barcodeToggle = $("barcodeToggle"); 
    if (barcodeToggle) {
        var barcodeRow = barcodeToggle.closest('.toggle-row');
        barcodeToggle.disabled = !currentPlan.features.barcode;
        if (barcodeRow) barcodeRow.classList.toggle('locked', !currentPlan.features.barcode);
        if (!currentPlan.features.barcode && barcodeToggle.checked) {
            barcodeToggle.checked = false;
            barcodeToggle.dispatchEvent(new Event('change'));
        }
    }

    // 2. Vertical Barcode / Custom Design (Premium+)
    var customDesignToggle = $("customDesignToggle"); 
    if (customDesignToggle) {
        var designRow = customDesignToggle.closest('.toggle-row');
        customDesignToggle.disabled = !currentPlan.features.customDesign;
        if (designRow) designRow.classList.toggle('locked', !currentPlan.features.customDesign);
        if (!currentPlan.features.customDesign && customDesignToggle.checked) {
            customDesignToggle.checked = false;
            customDesignToggle.dispatchEvent(new Event('change'));
        }
    }

    // 3. White-label / Multi-day (Enterprise only)
    var whiteLabelToggle = $("whiteLabelToggle"); 
    if (whiteLabelToggle) {
        var wlRow = whiteLabelToggle.closest('.toggle-row');
        whiteLabelToggle.disabled = !currentPlan.features.whiteLabel;
        if (wlRow) wlRow.classList.toggle('locked', !currentPlan.features.whiteLabel);
        if (!currentPlan.features.whiteLabel && whiteLabelToggle.checked) {
            whiteLabelToggle.checked = false;
            whiteLabelToggle.dispatchEvent(new Event('change'));
        }
    }

    // Optional: Display a toast warning
    // showToast("Plan updated: " + currentPlan.id.toUpperCase() + " features applied.", "info");
  }

  /* ============ TIER LABEL SYNC ============ */
  function syncTierNamesEverywhere() {
    rebuildTicketTierDropdown();
    rebuildSectionTierOverrideDropdown();
    TIER_KEYS.forEach(function(t){
      var label = document.querySelector('label[for="tierColor' + tierIdToCap(t) + '"]');
      if (label) label.textContent = TIER_NAMES[t];
      var distLabel = document.querySelector('label[for="tierRows' + tierIdToCap(t) + '"]');
      if (distLabel) distLabel.textContent = TIER_NAMES[t];
    });
    updateTicketPreview();
    renderSeatingPlan();
    if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
  }

  /* ============ TICKET PREVIEW ============ */
  function updateTicketPreview() {
    var eventName = $("eventName").value || "EVENT NAME";
    var dateVenue = ($("startDate").value || "DATE") + " · " + ($("venueAddress").value || "VENUE");
    var guestName = $("guestName").value || "GUEST NAME";
    var seatCode = NovalinkRoutingEngine.buildSeatCode($("seatBlock").value, $("seatRow").value, $("seatNum").value);
    var venue = $("venueAddress").value || "VENUE";

    $("prevEventName").textContent = eventName;
    $("prevDateVenue").textContent = dateVenue;
    $("prevGuestName").textContent = guestName;
    $("prevSeat").textContent = seatCode || "Seat not assigned";
    $("prevVenueLocation").textContent = venue;
    $("prevBackEventName").textContent = eventName;
    $("prevBackRef").textContent = "Ref: " + (seatCode ? seatCode.replace(/\s/g, "") : "NL-XXXXXX");

    var tier = $("tierColor").value;
    if (!isTierActive(tier)) tier = getActiveTiers()[getActiveTiers().length - 1] || "cyan";
    var tierLabel = (TIER_NAMES[tier] || tier).toUpperCase();
    $("prevTierBadge").textContent = tierLabel;
    $("prevBackTierBadge").textContent = tierLabel;
    applyTicketPalette(tier);
  }

  /* ============ TICKET FLIP ============ */
  function setTicketFlipped(flipped) {
    ticketFlipped = !!flipped;
    var inner = $("ticketFlipInner");
    var btn = $("flipTicketBtn");
    if (inner) inner.classList.toggle("flipped", ticketFlipped);
    if (btn) btn.textContent = ticketFlipped ? "↺ Front" : "↻ Flip";
  }

  function buildLegend() {
    var legend = document.createElement("div"); legend.className = "layout-legend";
    getActiveTiers().forEach(function(t){
      var el = document.createElement("div"); el.className = "lg-item";
      el.innerHTML = '<div class="lg-swatch ' + t + '"></div> ' + getTierLabel(t);
      legend.appendChild(el);
    });
    return legend;
  }

  function rebuildLevelsList() {
    var list = $("levelsList");
    list.innerHTML = "";
    levels.forEach(function(lv, i) {
      var item = document.createElement("div");
      item.className = "level-item";

  function tableUnitMetrics(scale) {
    scale = scale || 1;
    var k = pxPerCm * scale;
    var chairSize = Math.max(4, Math.min(60, Math.round(45 * k)));
    var gap = Math.max(2, Math.min(20, Math.round(5 * k)));
    var shape = tableConfig.shape;
    var W, H;
    if (shape === "circular" || shape === "square") { W = H = Math.max(20, getTableWidthCm()) * k; }
    else { W = Math.max(20, getTableLengthCm()) * k; H = Math.max(20, getTableWidthCm()) * k; }
    return { w: W, h: H, chairSize: chairSize, gap: gap, cellW: W + 2 * (gap + chairSize), cellH: H + 2 * (gap + chairSize) };
  }

  function buildTableUnit(shape, cfg, scale) {
    scale = scale || 1;
    var m = tableUnitMetrics(scale);
    var chairSize = m.chairSize, gap = m.gap, W = m.w, H = m.h;
    var chairs = [];
    if (shape === "circular") {
      var ringR = W / 2 + gap + chairSize / 2;
      var n = Math.max(1, cfg.chairsAround);
      for (var i = 0; i < n; i++) { var a = (-90 + (i * 360 / n)) * Math.PI / 180; chairs.push({ x: Math.cos(a) * ringR, y: Math.sin(a) * ringR, round: true }); }
    } else if (shape === "square") {
      var nS = Math.max(1, cfg.chairsPerSide);
      var off = W / 2 + gap + chairSize / 2;
      for (var i2 = 0; i2 < nS; i2++) { var x2 = -W / 2 + ((i2 + 0.5) * W / nS); chairs.push({ x: x2, y: -off }); chairs.push({ x: x2, y: off }); }
      for (var j2 = 0; j2 < nS; j2++) { var y2 = -H / 2 + ((j2 + 0.5) * H / nS); chairs.push({ x: -off, y: y2 }); chairs.push({ x: off, y: y2 }); }
    } else {
      var nl = Math.max(1, cfg.chairsLongSide);
      var ns = Math.max(1, cfg.chairsShortSide);
      var offY = H / 2 + gap + chairSize / 2;
      var offX = W / 2 + gap + chairSize / 2;
      for (var i3 = 0; i3 < nl; i3++) { var x3 = -W / 2 + ((i3 + 0.5) * W / nl); chairs.push({ x: x3, y: -offY }); chairs.push({ x: x3, y: offY }); }
      for (var j3 = 0; j3 < ns; j3++) { var y3 = -H / 2 + ((j3 + 0.5) * H / ns); chairs.push({ x: -offX, y: y3 }); chairs.push({ x: offX, y: y3 }); }
    }
    return { chairs: chairs, w: W, h: H, chairSize: chairSize, cellW: m.cellW, cellH: m.cellH };
  }

  function buildTableRowsGroup(rows, shape, cfg, tier, scale) {
    scale = scale || 1;
    if (!rows || !rows.length) rows = [{ count: 1 }];
    var unit = buildTableUnit(shape, cfg, scale);
    var gapX = Math.max(0, cmToPx(getSpacingCm(), scale));
    var gapY = Math.max(0, cmToPx(getSpacingCm(), scale));
    var maxCols = 1;
    rows.forEach(function(r) { if (r.count > maxCols) maxCols = r.count; });
    var totalW = maxCols * unit.cellW + Math.max(0, maxCols - 1) * gapX;
    var totalH = rows.length * unit.cellH + Math.max(0, rows.length - 1) * gapY;
    var wrap = document.createElement("div");
    wrap.className = "tbl-group";
    wrap.style.width = totalW + "px";
    wrap.style.height = totalH + "px";
    var tableNum = 0;
    rows.forEach(function(row, ri) {
      var count = Math.max(1, row.count);
      var rowW = count * unit.cellW + Math.max(0, count - 1) * gapX;
      var startX = (totalW - rowW) / 2;
      var cy = ri * (unit.cellH + gapY) + unit.cellH / 2;
      for (var i = 0; i < count; i++) {
        tableNum++;
        var cx = startX + i * (unit.cellW + gapX) + unit.cellW / 2;
        var t = document.createElement("div");
        t.className = "tbl-unit";
        t.style.left = cx + "px"; t.style.top = cy + "px";
        var shapeEl = document.createElement("div");
        shapeEl.className = "tbl-shape " + shape + " " + tier;
        shapeEl.style.width = unit.w + "px"; shapeEl.style.height = unit.h + "px";
        shapeEl.style.left = (-unit.w / 2) + "px"; shapeEl.style.top = (-unit.h / 2) + "px";
        shapeEl.textContent = tableNum;
        t.appendChild(shapeEl);
        unit.chairs.forEach(function(ch) {
          var cel = document.createElement("div");
          cel.className = "tbl-chair " + tier + (ch.round ? " round" : "");
          cel.style.width = unit.chairSize + "px"; cel.style.height = unit.chairSize + "px";
          cel.style.left = (ch.x - unit.chairSize / 2) + "px"; cel.style.top = (ch.y - unit.chairSize / 2) + "px";
          t.appendChild(cel);
        });
        wrap.appendChild(t);
      }
    });
    return wrap;
  }

  function tableValidationMessages() {
    var msgs = [];
    var shape = tableConfig.shape, w = getTableWidthCm(), len = getTableLengthCm();
    if (shape === "circular") {
      if (w < TABLE_STD.circMin) msgs.push({level:'warn', text:'Circular table diameter is ' + w + ' cm — standard event round table is 90–180 cm.'});
      else if (w > TABLE_STD.circMax) msgs.push({level:'warn', text:'Circular table diameter is ' + w + ' cm — very large rounds make conversation difficult.'});
    } else if (shape === "square") {
      if (w < TABLE_STD.squareMin) msgs.push({level:'warn', text:'Square table side is ' + w + ' cm — standard dining width is 90–102 cm.'});
      else if (w > TABLE_STD.squareMax) msgs.push({level:'info', text:'Square table side is ' + w + ' cm — fine for banquet seating.'});
    } else {
      if (w < TABLE_STD.widthMin) msgs.push({level:'warn', text:'Table width is ' + w + ' cm — standard dining is 90–102 cm wide.'});
      else if (w > TABLE_STD.widthMax) msgs.push({level:'warn', text:'Table width is ' + w + ' cm — standard dining is 90–102 cm wide.'});
      if (len < TABLE_STD.lengthMin) msgs.push({level:'warn', text:'Table length is ' + len + ' cm — 120 cm minimum for comfort.'});
      else if (len > TABLE_STD.lengthMax) msgs.push({level:'info', text:'Table length is ' + len + ' cm — very long tables are harder to converse across.'});
    }
    if (getSpacingCm() < TABLE_STD.spacingMin) msgs.push({level:'error', text:'Table spacing is only ' + getSpacingCm() + ' cm — below the 61–76 cm recommended.'});
    else if (getSpacingCm() > TABLE_STD.spacingMax) msgs.push({level:'info', text:'Table spacing is ' + getSpacingCm() + ' cm — above typical 61–76 cm.'});
    return msgs;
  }

  function updateTableValidation() {
    var out = $("tableValidationOut");
    if (!out) return;
    if (!tableMode) { out.innerHTML = ""; return; }
    var msgs = tableValidationMessages();
    out.innerHTML = "";
    if (!msgs.length) {
      var ok = document.createElement("div");
      ok.className = "tv-item ok";
      ok.innerHTML = '<span class="tv-icon">✓</span><span>All table settings are within standard ranges.</span>';
      out.appendChild(ok);
      return;
    }
    msgs.forEach(function(m) {
      var el = document.createElement("div");
      el.className = "tv-item " + m.level;
      var icon = document.createElement("span");
      icon.className = "tv-icon";
      icon.textContent = m.level === "error" ? "✕" : (m.level === "warn" ? "!" : "i");
      var text = document.createElement("span");
      text.textContent = m.text;
      el.appendChild(icon); el.appendChild(text);
      out.appendChild(el);
    });
  }

  function elementTypeLabel(item) {
    if (item.type === "shape") return item.shapeKind === "circle" ? "Circle" : (item.shapeKind === "square" ? "Square" : "Rectangle");
    if (item.type === "line") return "Line";
    if (item.type === "marker") return item.markerKind.charAt(0).toUpperCase() + item.markerKind.slice(1);
    return "Element";
  }
  function elementBadgeClass(item) {
    if (item.type === "line") return "line";
    if (item.type === "marker") return item.markerKind || "exit";
    return "";
  }
  function elementDisplayName(item) {
    if (item.type === "shape") return item.label || elementTypeLabel(item);
    if (item.type === "line")  return item.label || ("Line " + item.id);
    if (item.type === "marker") return item.label || (MARKER_TYPES[item.markerKind] || MARKER_TYPES.exit).defaultLabel;
    return "Element";
  }
  function elementDimsSummary(item) {
    if (item.type === "shape") return "W" + Math.round(item.w) + " × H" + Math.round(item.h) + " · " + Math.round(item.rotation) + "°";
    if (item.type === "line") {
      var dx = item.x2 - item.x1, dy = item.y2 - item.y1;
      var len = Math.round(Math.sqrt(dx*dx + dy*dy));
      var ang = Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
      return "L" + len + " · " + ang + "° · T" + item.thickness;
    }
    if (item.type === "marker") return "W" + Math.round(item.w) + " × H" + Math.round(item.h) + " · " + Math.round(item.rotation) + "°";
    return "";
  }

  function buildNumberInput(value, min, max, step, onChange) {
    var inp = document.createElement("input");
    inp.type = "number"; inp.min = min; inp.max = max;
    if (step !== undefined) inp.step = step;
    inp.value = value;
    inp.addEventListener("input", function() { var v = parseFloat(this.value); if (isNaN(v)) return; onChange(v); });
    inp.addEventListener("change", function() {
      var v = parseFloat(this.value); if (isNaN(v)) v = min;
      v = Math.max(min, Math.min(max, v)); this.value = v; onChange(v, true);
    });
    return inp;
  }
  function buildTextInput(value, maxLen, onChange) {
    var inp = document.createElement("input");
    inp.type = "text"; if (maxLen) inp.maxLength = maxLen; inp.value = value;
    inp.addEventListener("input", function() { onChange(this.value); });
    return inp;
  }
  function buildColorInput(value, onChange) {
    var inp = document.createElement("input");
    inp.type = "color"; inp.value = value;
    inp.addEventListener("input", function() { onChange(this.value); });
    return inp;

  function buildSelect(options, currentValue, onChange) {

      if (String(o.value) === String(currentValue)) opt.selected = true;

  }

  function buildElementEditor(item) {

    var nameInp = buildTextInput(item.label || "", 24, function(v) {

      if (nameEl) nameEl.textContent = elementDisplayName(item);

    if (item.type === "shape") buildShapeEditor(item, editor);

    else if (item.type === "marker") buildMarkerEditor(item, editor);
    var rowLevel = document.createElement("div"); rowLevel.className = "ed-row";
    var levelOpts = levels.map(function(lv) { return { value: lv.id, label: lv.name }; });

  function buildShapeEditor(item, editor) {
    var rowKind = document.createElement("div"); rowKind.className = "ed-row";
    var kindSel = buildSelect([
      { value: "rectangle", label: "Rectangle" },
      { value: "square", label: "Square" },
      { value: "circle", label: "Circle" }
    ], item.shapeKind, function(v) { item.shapeKind = v; if (v === "square" || v === "circle") { item.h = item.w; rebuildAnnotationList(); } renderFullscreen(); });
    rowKind.appendChild(buildField("Shape Kind", kindSel));

  function buildCanvasElement(item) {
    if (item.type === "shape") return buildShapeNode(item);

  function buildShapeNode(item) {

    el.style.background = item.color;
    el.style.borderRadius = (item.thickness / 2) + "px";
    el.style.transform = "rotate(" + angle + "deg)"; el.style.transformOrigin = "0 50%";
    el.style.zIndex = String(item.z || 6);

  }
  function buildMarkerNode(item) {
    var mt = MARKER_TYPES[item.markerKind] || MARKER_TYPES.exit;
    var el = document.createElement("div");
    el.className = "fs-element fs-element-marker";

  function hexToRgba(hex, alpha) {
    var c = String(hex).replace("#", "");
    if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    if (c.length !== 6) return "rgba(0,255,255," + alpha + ")";
    var r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }
  function shadeColor(hex, percent) {
    var c = String(hex).replace("#", "");
    if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    if (c.length !== 6) return hex;
    var r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
    r = Math.max(0, Math.min(255, r + percent));
    g = Math.max(0, Math.min(255, g + percent));
    b = Math.max(0, Math.min(255, b + percent));
    return "#" + [r,g,b].map(function(x){ return x.toString(16).padStart(2,"0"); }).join("");
  }
  function renderCanvasAnnotations(canvas) {
    canvas.querySelectorAll(".fs-element").forEach(function(el) { el.remove(); });

    sorted.forEach(function(item) {

  }

  function renderStandardLayout(container, sections, tableScale) {

  function renderSeatingPlan() {
    var container = $("seatingPlanPreview");
    container.innerHTML = "";
    var l1 = parseInt($("totalLevel1").value) || 0;
    if (l1 === 0) {
      container.innerHTML = '<div class="seating-plan-title">Add sections to begin</div>';
    } else if (tableMode) {
      renderTableLayout(container, Math.min(l1, 8), 0.5);
    } else {
      renderStandardLayout(container, Math.min(l1, 8));
    }
    if ($("seatingPlanOverlay").classList.contains("open")) {
      renderSeatingPlanFull();
    }
  }

  function renderSeatingPlanFull() {
    var container = $("seatingPlanFullInner");
    if (!container) return;
    container.innerHTML = "";
    var l1 = parseInt($("totalLevel1").value) || 0;
    if (l1 === 0) {
      container.innerHTML = '<div class="seating-plan-title">Add sections to begin</div>';
      if ($("spSummary")) $("spSummary").textContent = "";
      disableSeatFinder("Add sections to begin");
      return;
    }
    if (tableMode) renderTableLayout(container, l1, 1);
    else renderStandardLayout(container, l1, 1);

    $("spModeLabel").textContent = tableMode ? "TABLES" : "ROWS";
    if ($("spSummary")) {
      var sections = l1;
      var info = sections + " section" + (sections === 1 ? "" : "s");
      if (tableMode) {
        var totalTables = 0, totalRows = 0;
        for (var i = 0; i < sections; i++) { totalTables += getTableCount(i); totalRows += getSectionTableRows(i).length; }
        info += " · " + totalRows + " rows · " + totalTables + " tables · " + chairsPerTable() + " chairs/table";
      } else {
        var totalSeats = 0;
        for (var j = 0; j < sections; j++) { var r = getRowCount(j); for (var k = 0; k < r; k++) totalSeats += getSeatsForRow(j, k); }
        info += " · " + totalSeats + " seats";
      }
      $("spSummary").textContent = info;
    }

    if (tableMode) disableSeatFinder("Seat identifier works in Rows mode");
    else enableSeatFinder();

    if (window.lucide) lucide.createIcons();
  }

  function disableSeatFinder(msg) {
    var finder = $("seatFinder");
    var status = $("seatFinderStatus");
    if (finder) finder.classList.add("spf-disabled");
    if (status) { status.className = "spf-status info"; status.textContent = msg; }
  }

  function enableSeatFinder() {
    var finder = $("seatFinder");
    var status = $("seatFinderStatus");
    if (finder) finder.classList.remove("spf-disabled");
    rebuildSeatFinderDropdowns();
    if (lastFoundSeat) {
      applySeatHighlight(lastFoundSeat.secIdx, lastFoundSeat.rowIdx, lastFoundSeat.seatNum, true);
    } else if (status) {
      status.className = "spf-status info";
      status.textContent = "Pick a section, row and seat";
    }
  }

  function rebuildSeatFinderDropdowns() {
    var secSel = $("seatFinderSection");
    if (!secSel) return;
    var sections = parseInt($("totalLevel1").value) || 0;
    var prevSec = secSel.value;
    secSel.innerHTML = "";
    for (var i = 0; i < sections; i++) { var opt = document.createElement("option"); opt.value = i; opt.textContent = getSectionName(i); secSel.appendChild(opt); }
    if (prevSec !== "" && prevSec !== undefined && parseInt(prevSec) < sections) secSel.value = prevSec;
    updateSeatFinderRowOptions();
    updateSeatFinderSeatMax();
  }

  function updateSeatFinderRowOptions() {
    var secSel = $("seatFinderSection"), rowSel = $("seatFinderRow");
    if (!secSel || !rowSel) return;
    var secIdx = parseInt(secSel.value); if (isNaN(secIdx)) secIdx = 0;
    var rowCount = getRowCount(secIdx);
    var prevRow = rowSel.value;
    rowSel.innerHTML = "";
    for (var r = 0; r < rowCount; r++) { var opt = document.createElement("option"); opt.value = r; opt.textContent = "Row " + rowLabel(r); rowSel.appendChild(opt); }
    if (prevRow !== "" && prevRow !== undefined && parseInt(prevRow) < rowCount) rowSel.value = prevRow;
  }

  function updateSeatFinderSeatMax() {
    var secSel = $("seatFinderSection"), rowSel = $("seatFinderRow"), seatInp = $("seatFinderSeat");
    if (!secSel || !rowSel || !seatInp) return;
    var secIdx = parseInt(secSel.value); if (isNaN(secIdx)) secIdx = 0;
    var rowIdx = parseInt(rowSel.value); if (isNaN(rowIdx)) rowIdx = 0;
    var maxSeat = getSeatsForRow(secIdx, rowIdx);
    seatInp.max = maxSeat;
    var v = parseInt(seatInp.value);
    if (isNaN(v) || v < 1) seatInp.value = 1;
    else if (v > maxSeat) seatInp.value = maxSeat;

  function applySeatHighlight(secIdx, rowIdx, seatNum, silent) {

    inner.querySelectorAll(".seat-found").forEach(function(el) { el.classList.remove("seat-found"); });
    var target = inner.querySelector('[data-section-idx="' + secIdx + '"] [data-row-idx="' + rowIdx + '"] [data-seat-num="' + seatNum + '"]');
    if (!target) return false;
    target.classList.add("seat-found");
    if (!silent) {
      try { target.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" }); }
      catch(e) { target.scrollIntoView(); }

    return true;
  }

      status.className = "spf-status err";
      status.textContent = "Please choose a section, row and seat number.";
      return;
    }
    var totalSections = parseInt($("totalLevel1").value) || 0;
    if (secIdx < 0 || secIdx >= totalSections) { status.className = "spf-status err"; status.textContent = "That section does not exist."; return; }
    var rowCount = getRowCount(secIdx);
    if (rowIdx < 0 || rowIdx >= rowCount) { status.className = "spf-status err"; status.textContent = "Row " + rowLabel(rowIdx) + " does not exist in " + getSectionName(secIdx) + "."; return; }
    var maxSeat = getSeatsForRow(secIdx, rowIdx);
    if (seatNum < 1 || seatNum > maxSeat) { status.className = "spf-status err"; status.textContent = "Seat " + seatNum + " does not exist in Row " + rowLabel(rowIdx) + " (max " + maxSeat + ")."; return; }

    var ok = applySeatHighlight(secIdx, rowIdx, seatNum, false);
    if (!ok) { status.className = "spf-status err"; status.textContent = "Could not find that seat in the current layout."; return; }

    lastFoundSeat = { secIdx: secIdx, rowIdx: rowIdx, seatNum: seatNum };
    var seatTxt = getSectionName(secIdx) + ' · Row ' + rowLabel(rowIdx) + ' · Seat ' + seatNum;
    status.className = "spf-status ok";
    status.textContent = "✓ " + seatTxt;
  }

  function buildFSSection(sectionIdx) {
    var pos = getSectionPos(sectionIdx);

      el.appendChild(meta);
      el.appendChild(buildTableRowsGroup(rows, tableConfig.shape, tableConfig, tier, 1));
    } else {
      var rowCount = getRowCount(sectionIdx);
      var map = buildRowTierMap(rowCount, sectionIdx);
      loc.textContent = (lv ? lv.name.toUpperCase() : "—") + " · " + rowCount + " rows";
      if (lv) loc.style.color = lv.color;
      el.appendChild(loc); el.appendChild(stage);
      var rowsArea = document.createElement("div");
      rowsArea.className = "fs-rows-area";
      for (var r = 0; r < rowCount; r++) {
        var tierR = map[r] || "cyan";

        var rowEl = document.createElement("div");
        rowEl.className = "fs-row";

        rowEl.appendChild(seatsWrap);
        var tt = document.createElement("div"); tt.className = "fs-tier-tag " + tierR; tt.textContent = tierTagText(tierR);
        rowEl.appendChild(tt);
        rowsArea.appendChild(rowEl);
      }
      el.appendChild(rowsArea);
    }
    el.style.transformOrigin = "center center";
    el.style.transform = "rotate(" + pos.rotation + "deg) scale(" + pos.scale + ")";

  function autoLayoutSections(sectionEls, canvas) {
    if (!sectionEls.length) return;
    var spacing = Math.max(0, sectionSpacingPx);
    var baseY = Math.max(stage.y + stage.height + 60, 200);
    var baseX = spacing;
    if (autoLayoutAxis === "vertical") {
      var cursorY = baseY;
      sectionEls.forEach(function(item) {
        var pos = getSectionPos(item.idx), el = item.el;
        var natW = el.offsetWidth || 140, natH = el.offsetHeight || 120;
        var effW = natW * pos.scale, effH = natH * pos.scale;
        pos.x = Math.round((canvasWidth - natW) / 2);
        pos.y = Math.round(cursorY + (effH - natH) / 2);
        el.style.left = pos.x + "px"; el.style.top = pos.y + "px";
        el.style.transform = "rotate(" + pos.rotation + "deg) scale(" + pos.scale + ")";
        cursorY += effH + spacing;
      });
    } else {
      var cursorX = baseX;
      sectionEls.forEach(function(item) {
        var pos = getSectionPos(item.idx), el = item.el;
        var natW = el.offsetWidth || 140, natH = el.offsetHeight || 120;
        var effW = natW * pos.scale, effH = natH * pos.scale;
        pos.x = Math.round(cursorX + (effW - natW) / 2);
        pos.y = Math.round(baseY + (effH - natH) / 2);
        el.style.left = pos.x + "px"; el.style.top = pos.y + "px";
        el.style.transform = "rotate(" + pos.rotation + "deg) scale(" + pos.scale + ")";
        cursorX += effW + spacing;
      });
    }
  }

  function checkSectionOverlaps(sectionEls, canvas) {
    var warning = $("fsOverlapWarning"), text = $("fsOverlapText");
    if (!warning || !text) return;
    if (!sectionEls || sectionEls.length < 2) { warning.classList.add("hidden"); return; }
    var canvasRect = canvas.getBoundingClientRect();
    var boxes = sectionEls.map(function(item) {
      var r = item.el.getBoundingClientRect();
      return { name: getSectionName(item.idx), x1: r.left - canvasRect.left, y1: r.top - canvasRect.top, x2: r.right - canvasRect.left, y2: r.bottom - canvasRect.top };
    });
    var overlaps = [];
    for (var i = 0; i < boxes.length; i++) {
      for (var j = i + 1; j < boxes.length; j++) {
        var a = boxes[i], b = boxes[j];
        if (a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1) overlaps.push(a.name + " ↔ " + b.name);
      }
    }
    if (overlaps.length) {
      text.textContent = "Sections overlap: " + overlaps.join(", ") + " — adjust positions or turn on Auto Layout.";
      warning.classList.remove("hidden");
    } else warning.classList.add("hidden");
  }

  function buildSectionsData() {
    var sections = [];
    var count = parseInt($("totalLevel1").value) || 0;
    var wCm = getTableWidthCm(), lCm = getTableLengthCm(), spCm = getSpacingCm();
    for (var s = 0; s < count; s++) {
      var pos = getSectionPos(s);
      var lv = levels.find(function(x){return x.id === pos.levelId;});
      var base = { name: getSectionName(s), level: lv ? lv.name : null, x: pos.x, y: pos.y, scale: pos.scale, rotation: pos.rotation, tierOverride: getSectionTierOverride(s) };
      if (tableMode) {
        var rows = getSectionTableRows(s);
        var tier = getSectionTierOverride(s) || (getActiveTiers()[getActiveTiers().length - 1] || "cyan");
        var cpt = chairsPerTable();
        var flatTables = [];
        var tableNum = 0;
        rows.forEach(function(row, ri) {
          for (var k = 0; k < row.count; k++) {
            tableNum++;
            flatTables.push({ table: tableNum, row: rowLabel(ri), rowIndex: ri, shape: tableConfig.shape, widthCm: wCm, lengthCm: lCm, spacingCm: spCm, chairs: cpt, tier: tier });
          }
        });
        base.mode = "tables";
        base.tableRows = rows.map(function(r) { return r.count; });
        base.tableRowCount = rows.length;
        base.tableCount = getTableCount(s);
        base.tableShape = tableConfig.shape;
        base.tableWidthCm = wCm; base.tableLengthCm = lCm; base.tableSpacingCm = spCm;
        base.chairsPerTable = cpt;
        base.tables = flatTables;
        sections.push(base);
      } else {
        var rowCount = getRowCount(s);
        var map = buildRowTierMap(rowCount, s);
        var rowsData = [];
        for (var r = 0; r < rowCount; r++) {
          var seats = [];
          var seatCount = getSeatsForRow(s, r);
          for (var i = 0; i < seatCount; i++) seats.push({ seat: i + 1, tier: map[r] });
          rowsData.push({ row: rowLabel(r), seats: seats });
        }
        base.mode = "rows";
        base.rowCount = rowCount;
        base.rows = rowsData;
        sections.push(base);
      }
    }
    return sections;
  }

  function downloadFile(content, filename, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }
  function exportJson() {

    }, buildVenuePayload());

  function exportCsv() {
    var name = $("eventName").value || "Untitled Event";
    var lines;
    if (tableMode) {
      lines = ["Section,Level,TableRow,TableIndex,Shape,Width(cm),Length(cm),Spacing(cm),Chairs,Tier,X,Y,Scale,Rotation"];
      buildSectionsData().forEach(function(sec) {
        sec.tables.forEach(function(t) {
          lines.push(['"' + sec.name + '"', '"' + (sec.level||"") + '"', t.row, t.table, t.shape, t.widthCm, t.lengthCm, t.spacingCm, t.chairs, t.tier, sec.x, sec.y, sec.scale, sec.rotation].join(","));
        });
      });
    } else {
      lines = ["Section,Level,Row,Seat,Tier,X,Y,Scale,Rotation"];
      buildSectionsData().forEach(function(sec) {
        sec.rows.forEach(function(row) {
          row.seats.forEach(function(seat) {
            lines.push(['"' + sec.name + '"', '"' + (sec.level||"") + '"', row.row, seat.seat, seat.tier, sec.x, sec.y, sec.scale, sec.rotation].join(","));
          });
        });
      });
    }
    downloadFile(lines.join("\n"), name.toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-venue.csv", "text/csv");
    showToast("Venue exported as CSV", "success");
  }

  var STORAGE_KEY = "novalink_events";
  function generateLocalEventId() {
    return "local-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }
  function saveEvent() {
    var costVal = readCost();
    var counts = getTierSeatCounts();
    var active = getActiveTiers();
    var totalTickets = 0, gross = 0;
    active.forEach(function(t){
      totalTickets += counts[t] || 0;
      gross += (counts[t]||0) * (TIER_PRICES[t]||0);
    });
    var fee = gross * (currentPlan.fee / 100);
    var net = gross - fee;

    var payload = Object.assign({
      eventName: $("eventName").value,
      hostName: $("hostName").value,
      hostEmail: $("hostEmail").value,
      city: $("city").value,
      eventType: $("eventType").value,
      cost: costVal,
      costFormatted: formatCurrency(costVal),
      startDate: $("startDate").value,
      startTime: $("startTime").value,
      venueAddress: $("venueAddress").value,
      tierColor: $("tierColor").value,
      revenue: { gross: gross, fee: fee, net: net, planFeePct: currentPlan.fee, planId: currentPlan.id, totalTickets: totalTickets },
      createdAt: new Date().toISOString()
    }, buildVenuePayload());
    try {
      var existing = [];
      try { existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { existing = []; }
      if (!Array.isArray(existing)) existing = [];
      var id = generateLocalEventId();
      payload.id = id;
      existing.push(payload);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));
      showToast("Event saved locally · " + id, "success");
      return true;
    } catch (err) {
      console.error(err);
      showToast("Save failed: " + err.message, "error", 5000);
      return false;
    }
  }

  });

  function applyBasePriceToTiers(base){
    if (isNaN(base) || base < 0) return;
    var active = getActiveTiers();
    var multipliers = { black: 4, gold: 2.5, silver: 1.5, cyan: 1, tier5: 6, tier6: 8 };
    active.forEach(function(t){
      var mult = multipliers[t] || 1;
      var val = base * mult;
      var inp = document.querySelector('.tier-price-input[data-tier="' + t + '"]');
      if (inp) inp.value = val.toFixed(2);
      TIER_PRICES[t] = Math.round(val * 100) / 100;
    });
    updateRevenueCalculator();
  }

  /* ===== TIER COUNT ===== */
  $("tierCount").addEventListener("change", function(){
    var v = parseInt(this.value, 10);
    if (isNaN(v)) v = DEFAULT_TIERS;
    v = Math.max(MIN_TIERS, Math.min(MAX_TIERS, v));
    var capacity = calculateCapacity();
    var allowExtra = capacity > LARGE_VENUE_THRESHOLD;
    if (v > 4 && !allowExtra) {
      v = 4;
      showToast("Venue capacity must exceed 5,000 to use more than 4 tiers.", "error", 4000);
    }
    activeTierCount = v;
    this.value = String(v);
    updateTierVisibility();
  });

  /* ===== FLIP TICKET ===== */
  $("flipTicketBtn").addEventListener("click", function(){
    setTicketFlipped(!ticketFlipped);
  });
  var flipContainer = $("ticketFlipInner");
  if (flipContainer) {
    flipContainer.style.cursor = "pointer";
    flipContainer.addEventListener("click", function(e){
      if (e.target.closest("button, input, select, a")) return;
      setTicketFlipped(!ticketFlipped);
    });
  }

  /* ===== TIER NAME INPUTS ===== */
  document.querySelectorAll(".tier-name-input").forEach(function(inp){
    inp.addEventListener("input", function(){
      var t = this.dataset.tier;
      var v = this.value.trim() || TIER_DEFAULT_NAMES[t] || t;
      TIER_NAMES[t] = v;
      syncTierNamesEverywhere();
    });
    inp.addEventListener("blur", function(){
      if (!this.value.trim()) {
        var t = this.dataset.tier;
        this.value = TIER_NAMES[t] || TIER_DEFAULT_NAMES[t] || t;
      }
    });
  });

  /* ===== TIER PRICE INPUTS ===== */
  document.querySelectorAll(".tier-price-input").forEach(function(inp){
    inp.addEventListener("input", function(){
      var t = this.dataset.tier;
      var v = parseFloat(this.value);
      TIER_PRICES[t] = (isNaN(v) || v < 0) ? 0 : Math.round(v * 100) / 100;
      updateRevenueCalculator();
    });
    inp.addEventListener("blur", function(){
      var v = parseFloat(this.value);
      if (isNaN(v) || v < 0) v = 0;
      this.value = v.toFixed(2);
      TIER_PRICES[this.dataset.tier] = v;
      updateRevenueCalculator();
    });
  });

  /* ===== BASE PRICE INPUT ===== */
  var costInput = $("cost");
  if (costInput) {
    costInput.addEventListener("blur", function(){
      var v = parseFloat(this.value);
      if (isNaN(v) || v < 0) { this.value = ""; return; }
      this.value = v.toFixed(2);
    });
    costInput.addEventListener("input", function(){
      if (this.value && parseFloat(this.value) < 0) this.value = "";
    });
  }

  /* ===== TIER COLOUR PICKERS ===== */
  document.querySelectorAll(".tier-color-input").forEach(function(el){
    el.addEventListener("input", function(){
      var t = this.dataset.tier;
      TIER_COLORS[t] = this.value;
      applyTierColors();
      renderSeatingPlan();
      if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
    });
  });
  var resetBtn = $("resetTierColorsBtn");
  if (resetBtn) {
    resetBtn.addEventListener("click", function(){
      TIER_KEYS.forEach(function(name){
        TIER_COLORS[name] = TIER_DEFAULTS[name];
        var el = document.querySelector('.tier-color-input[data-tier="' + name + '"]');
        if (el) el.value = TIER_DEFAULTS[name];
      });
      applyTierColors();
      renderSeatingPlan();
      if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
      showToast("Tier colours reset", "success");
    });
  }

  /* ===== ROW DISTRIBUTION INPUTS ===== */
  document.querySelectorAll(".tier-rows-input").forEach(function(inp){
    inp.addEventListener("input", function(){
      updateTierSummary();
      updateRevenueCalculator();
      renderSeatingPlan();
      if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
    });
  });

  function updateTierSummary() {
    var defaultRows = parseInt($("totalLevel2").value) || 0;
    var sum = 0;
    getActiveTiers().forEach(function(t){
      var el = document.querySelector('.tier-rows-input[data-tier="' + t + '"]');
      sum += el ? (parseInt(el.value) || 0) : 0;
    });
    var s = $("tierDistSummary");
    if (!s) return;
    s.className = "tier-dist-summary";
    var lowest = getActiveTiers()[getActiveTiers().length - 1] || "cyan";
    if (sum === defaultRows) s.textContent = "✓ Perfect — " + sum + " rows assigned.";
    else if (sum < defaultRows) s.textContent = "Assigned " + sum + ". Rows beyond default to " + getTierLabel(lowest) + ".";
    else s.textContent = "Sum " + sum + " (extras ignored per section).";
  }

  /* ===== WIRING ===== */
  $("canvasWidth").addEventListener("change", function() { canvasWidth = Math.max(400, Math.min(3000, parseInt(this.value)||1200)); this.value = canvasWidth; updateScaleHints(); updateTableValidation(); renderFullscreen(); });
  $("canvasHeight").addEventListener("change", function() { canvasHeight = Math.max(400, Math.min(3000, parseInt(this.value)||800)); this.value = canvasHeight; updateScaleHints(); updateTableValidation(); renderFullscreen(); });
  $("gridSize").addEventListener("change", function() { gridSize = Math.max(10, Math.min(200, parseInt(this.value)||50)); this.value = gridSize; updateScaleHints(); renderFullscreen(); });
  $("snapToggle").addEventListener("change", function() { snapToGrid = this.checked; });
  $("pxPerCm").addEventListener("change", function() { readScale(); onTableConfigChange(); });

  function readStageInputs() {
    stage.x = parseInt($("stageX").value) || 0;
    stage.y = parseInt($("stageY").value) || 0;
    stage.width = Math.max(40, parseInt($("stageW").value) || 200);
    stage.height = Math.max(20, parseInt($("stageH").value) || 60);
    stage.name = $("stageName").value || "STAGE";
    renderFullscreen();
  }
  ["stageX","stageY","stageW","stageH","stageName"].forEach(function(id){ $(id).addEventListener("input", readStageInputs); });

  $("addLevelBtn").addEventListener("click", addLevel);
  $("tableModeToggle").addEventListener("change", applyTableModeUI);
  ["chairsAround","chairsPerSide","chairsLongSide","chairsShortSide","tableWidth","tableHeight","tableSpacing"]
    .forEach(function(id) { $(id).addEventListener("input", onTableConfigChange); });

  $("tableShape").addEventListener("change", function() {
    var prev = tableConfig.shape;
    var w = clampInt($("tableWidth").value, 20, 600, 100);
    if (prev === "circular") tableConfig.circularDiameterCm = w;
    else if (prev === "square") tableConfig.squareSideCm = w;
    else tableConfig.rectWidthCm = w;
    tableConfig.shape = this.value;
    $("tableWidth").value = getTableWidthCm();
    if (tableConfig.shape === "rectangular") $("tableHeight").value = tableConfig.rectLengthCm;
    onTableConfigChange();
  });

  $("tableCount").addEventListener("change", function() { var v = Math.max(1, Math.min(50, parseInt(this.value) || 4)); this.value = v; updateTableSummary(); updateTierCountOptions(); updateRevenueCalculator(); });
  $("addTableRowBtn").addEventListener("click", addTableRow);

  document.querySelectorAll(".annotation-tab").forEach(function(btn) {
    btn.addEventListener("click", function() {
      document.querySelectorAll(".annotation-tab").forEach(function(b){ b.classList.remove("active"); });
      this.classList.add("active");
      var target = this.getAttribute("data-anno");
      $("annoShapeBody").style.display = target === "shape" ? "" : "none";
      $("annoLineBody").style.display  = target === "line" ? "" : "none";
      $("annoExitBody").style.display  = target === "exit" ? "" : "none";
    });
  });
  $("addShapeBtn").addEventListener("click", addShapeElement);
  $("addLineBtn").addEventListener("click", addLineElement);
  $("addExitBtn").addEventListener("click", addMarkerElement);

  $("shapeKind").addEventListener("change", function() {
    var k = this.value;
    if (k === "square" || k === "circle") { var w = clampInt($("shapeW").value, 10, 2000, 100); $("shapeH").value = w; }
  });
  $("shapeW").addEventListener("input", function() {
    var k = $("shapeKind").value;
    if (k === "square" || k === "circle") $("shapeH").value = this.value;
  });
  function updateLineFormDerived() {
    var x1 = clampInt($("lineX1").value, 0, 3000, 0), y1 = clampInt($("lineY1").value, 0, 3000, 0);
    var x2 = clampInt($("lineX2").value, 0, 3000, 0), y2 = clampInt($("lineY2").value, 0, 3000, 0);
    var len = Math.round(Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1)));
    var ang = Math.round(Math.atan2(y2-y1, x2-x1) * 180 / Math.PI);
    $("lineLength").value = len; $("lineAngleOut").value = ang;
  }
  ["lineX1","lineY1","lineX2","lineY2"].forEach(function(id) { $(id).addEventListener("input", updateLineFormDerived); });
  $("markerKind").addEventListener("change", function() { var mt = MARKER_TYPES[this.value] || MARKER_TYPES.exit; $("exitLabelInput").value = mt.defaultLabel; });

  $("seatFinderSection").addEventListener("change", function() { updateSeatFinderRowOptions(); updateSeatFinderSeatMax(); clearSeatHighlight(true); });
  $("seatFinderRow").addEventListener("change", function() { updateSeatFinderSeatMax(); clearSeatHighlight(true); });
  $("seatFinderSeat").addEventListener("input", function() { clearSeatHighlight(true); });
  $("seatFinderSeat").addEventListener("keydown", function(e) { if (e.key === "Enter") { e.preventDefault(); findAndHighlightSeat(); } });
  $("seatFinderFindBtn").addEventListener("click", findAndHighlightSeat);
  $("seatFinderClearBtn").addEventListener("click", function() { clearSeatHighlight(false); });

  $("totalLevel1").addEventListener("input", function() {
    var v = parseInt(this.value) || 1;
    v = Math.max(1, Math.min(26, v));
    rebuildSectionTabs(); refreshSectionInputs(); rebuildRowOverrides(); rebuildTableRowsEditor();
    calculateCapacity(); updateTierCountOptions(); updateRevenueCalculator(); renderSeatingPlan(); updateTableSummary();
    if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
  });

  $("totalLevel2").addEventListener("change", function() {
    var v = Math.max(1, Math.min(52, parseInt(this.value)||6)); this.value = v;
    refreshSectionInputs(); rebuildRowOverrides(); calculateCapacity(); updateTierCountOptions(); updateRevenueCalculator(); updateTierSummary(); renderSeatingPlan();
  });
  $("totalLevel3").addEventListener("change", function() {
    var v = Math.max(4, Math.min(90, parseInt(this.value)||10)); this.value = v;
    rebuildRowOverrides(); calculateCapacity(); updateTierCountOptions(); updateRevenueCalculator(); renderSeatingPlan();
  });

  $("sectionNameInput").addEventListener("input", function() {
    setSectionName(currentEditingSection, this.value);
    rebuildSectionTabs(); renderSeatingPlan(); updateTableValidation();
    if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
  });

  $("sectionLevelSelect").addEventListener("change", function() { setSectionPos(currentEditingSection, "levelId", parseInt(this.value)); renderSeatingPlan(); if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen(); });

  $("sectionRowsInput").addEventListener("input", function() {
    if (tableMode) return;
    var v = parseInt(this.value); if (isNaN(v)) return;
    setRowCount(currentEditingSection, v);
    var rc = getRowCount(currentEditingSection);
    $("sectionRowsBadge").textContent = rc + (rc === 1 ? " row" : " rows");
    rebuildRowOverrides(); calculateCapacity(); updateTierCountOptions(); updateRevenueCalculator(); renderSeatingPlan();
    if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
  });

  $("sectionTierOverride").addEventListener("change", function() { setSectionTierOverride(currentEditingSection, this.value || null); updateRevenueCalculator(); renderSeatingPlan(); if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen(); });

  function disableAutoLayoutForManualEdit() {
    if (autoLayoutEnabled) {
      autoLayoutEnabled = false;
      var btn = $("fsToggleAuto");
      if (btn) btn.classList.remove("active");
      showToast("Manual positioning enabled", "info", 2200);
    }
  }

  $("sectionXInput").addEventListener("input", function() { setSectionPos(currentEditingSection, "x", snap(parseInt(this.value)||0)); disableAutoLayoutForManualEdit(); renderSeatingPlan(); if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen(); });
  $("sectionYInput").addEventListener("input", function() { setSectionPos(currentEditingSection, "y", snap(parseInt(this.value)||0)); disableAutoLayoutForManualEdit(); renderSeatingPlan(); if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen(); });
  $("sectionRotationInput").addEventListener("input", function() { setSectionPos(currentEditingSection, "rotation", parseInt(this.value)||0); renderSeatingPlan(); if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen(); });
  $("sectionScaleInput").addEventListener("input", function() {
    var v = parseFloat(this.value) || 1;
    setSectionPos(currentEditingSection, "scale", v);
    $("sectionScaleBadge").textContent = v.toFixed(2) + "×";
    renderSeatingPlan();
    if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
  });

  $("openFullscreen").addEventListener("click", function() { $("fullscreenOverlay").classList.add("open"); document.body.style.overflow = "hidden"; renderFullscreen(); });
  $("closeFullscreen").addEventListener("click", function() { $("fullscreenOverlay").classList.remove("open"); document.body.style.overflow = ""; });
  $("fsToggleGrid").addEventListener("click", function() { showGrid = !showGrid; this.classList.toggle("active", showGrid); renderFullscreen(); });
  $("fsToggleAuto").addEventListener("click", function() {
    autoLayoutEnabled = !autoLayoutEnabled;
    this.classList.toggle("active", autoLayoutEnabled);
    renderFullscreen();
    showToast(autoLayoutEnabled ? "Auto Layout ON" : "Auto Layout OFF");
  });
  $("fsToggleAxis").addEventListener("click", function() {
    autoLayoutAxis = autoLayoutAxis === "vertical" ? "horizontal" : "vertical";
    this.textContent = autoLayoutAxis === "vertical" ? "↕ Vertical" : "↔ Horizontal";
    if (autoLayoutEnabled) renderFullscreen();
  });
  $("fsSectionSpacing").addEventListener("input", function() { var v = Math.max(0, Math.min(500, parseInt(this.value) || 0)); sectionSpacingPx = v; if (autoLayoutEnabled) renderFullscreen(); });
  $("fsSectionSpacing").addEventListener("change", function() { var v = Math.max(0, Math.min(500, parseInt(this.value) || 40)); this.value = v; sectionSpacingPx = v; if (autoLayoutEnabled) renderFullscreen(); });
  $("fsResetView").addEventListener("click", function() {
    if (!confirm("Reset all section positions, scales and rotations?")) return;
    sectionPositions = {}; autoLayoutEnabled = true;
    autoLayoutAxis = tableMode ? "vertical" : "horizontal";
    var btn = $("fsToggleAuto"); if (btn) btn.classList.add("active");
    var axisBtn = $("fsToggleAxis"); if (axisBtn) axisBtn.textContent = autoLayoutAxis === "vertical" ? "↕ Vertical" : "↔ Horizontal";
    renderSeatingPlan(); renderFullscreen(); refreshSectionInputs();
    showToast("Positions reset", "success");
  });

  $("viewSeatingPlanFull").addEventListener("click", function() {
    $("seatingPlanOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
    lastFoundSeat = null;
    renderSeatingPlanFull();
  });
  $("closeSeatingPlanFull").addEventListener("click", function() {
    $("seatingPlanOverlay").classList.remove("open");
    document.body.style.overflow = "";
  });

  $("clearAllOverrides").addEventListener("click", function() {
    if (!confirm("Clear all section overrides, canvas elements, and reset positions?")) return;
    sectionRowOverrides = {}; sectionRowCounts = {}; sectionNames = {};
    sectionTierOverrides = {}; sectionPositions = {}; sectionTableRows = {};
    canvasElements = []; nextCanvasElementId = 1; expandedElementId = null;
    lastFoundSeat = null;
    levels = [{ id: 0, name: "Ground Floor", color: "#00FFFF", visible: true }];
    nextLevelId = 1; currentEditingSection = 0;
    autoLayoutEnabled = true; autoLayoutAxis = tableMode ? "vertical" : "horizontal";
    var btn = $("fsToggleAuto"); if (btn) btn.classList.add("active");
    var axisBtn = $("fsToggleAxis"); if (axisBtn) axisBtn.textContent = autoLayoutAxis === "vertical" ? "↕ Vertical" : "↔ Horizontal";
    rebuildLevelsList(); rebuildLevelSelect();
    rebuildSectionTabs(); refreshSectionInputs(); rebuildRowOverrides(); rebuildTableRowsEditor();
    rebuildAnnotationList();
    calculateCapacity(); updateTierCountOptions(); updateRevenueCalculator(); renderSeatingPlan(); updateTableSummary();
    if ($("fullscreenOverlay").classList.contains("open")) renderFullscreen();
  });

  $("exportJsonBtn").addEventListener("click", exportJson);
  $("exportCsvBtn").addEventListener("click", exportCsv);

  ["eventName","startDate","venueAddress","guestName","seatBlock","seatRow","seatNum"].forEach(function(id) { $(id).addEventListener("input", updateTicketPreview); });
  ["tierColor"].forEach(function(id) { $(id).addEventListener("change", updateTicketPreview); });
  ["seatBlock","seatRow"].forEach(function(id) { $(id).addEventListener("input", function() { this.value = this.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,1); }); });

  $("createEventForm").addEventListener("submit", function(e) {
    e.preventDefault();
    if (costInput) {
      var cv = parseFloat(costInput.value);
      if (isNaN(cv) || cv < 0) { showToast("Please enter a valid ticket price (0 or more).", "error"); costInput.focus(); return; }
      costInput.value = cv.toFixed(2);
    }
    var btn = $("submitBtn"); var orig = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = 'Saving...';
    saveEvent();
    btn.disabled = false; btn.innerHTML = orig;
    if(window.lucide) lucide.createIcons();
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      if ($("seatingPlanOverlay").classList.contains("open")) {
        $("seatingPlanOverlay").classList.remove("open");
        document.body.style.overflow = "";
      } else if ($("fullscreenOverlay").classList.contains("open")) {
        $("fullscreenOverlay").classList.remove("open");
        document.body.style.overflow = "";
      }
    }
  });

  /* ===== INIT ===== */
  applyTierColors();
  document.querySelectorAll(".tier-name-input").forEach(function(inp){
    TIER_NAMES[inp.dataset.tier] = inp.value || TIER_NAMES[inp.dataset.tier];
  });
  document.querySelectorAll(".tier-price-input").forEach(function(inp){
    var v = parseFloat(inp.value);
    TIER_PRICES[inp.dataset.tier] = (isNaN(v) || v < 0) ? 0 : v;
  });
  
  var checkedPlan = document.querySelector('input[name="plan"]:checked');
  if (checkedPlan) {
    currentPlan = { 
      id: checkedPlan.value, 
      fee: parseFloat(checkedPlan.dataset.fee) || 7, 
      limit: parseInt(checkedPlan.dataset.limit) || 500,
      features: {
        barcode: checkedPlan.value !== "basic",
        verticalBarcode: checkedPlan.value === "premium" || checkedPlan.value === "enterprise",
        customDesign: checkedPlan.value === "premium" || checkedPlan.value === "enterprise",
        scannerStaff: checkedPlan.value === "basic" ? 2 : (checkedPlan.value === "standard" ? 5 : (checkedPlan.value === "premium" ? 15 : 9999)),
        whiteLabel: checkedPlan.value === "enterprise",
        multiDay: checkedPlan.value === "enterprise",
        unlimitedScanners: checkedPlan.value === "enterprise"
      }
    };
  }
  
  updatePlanDisplay();

  rebuildLevelsList(); rebuildLevelSelect(); rebuildSectionTabs();
  readScale(); readTableConfig(); applyShapeUI();
  refreshSectionInputs(); rebuildRowOverrides(); rebuildTableRowsEditor();
  rebuildAnnotationList();
  calculateCapacity(); updateTicketPreview(); renderSeatingPlan();
  updateTierSummary(); updateTableSummary(); updateScaleHints(); updateLineFormDerived();
  $("tableOptionsPanel").style.display = "none";
  $("fsSectionSpacing").value = sectionSpacingPx;
  applyTableModeUI();
  activeTierCount = DEFAULT_TIERS;
  $("tierCount").value = String(activeTierCount);
  updateTierCountOptions();
  updateTierVisibility();
  updateRevenueCalculator();
  applyPlanRestrictions();
});
n
})();
  </script>
