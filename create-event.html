<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0f14" />
<title>Create an Event - Novalink</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --cyan-50:#ecfeff;--cyan-100:#cffafe;--cyan-400:#22d3ee;--cyan-500:#06b6d4;--cyan-600:#0891b2;--cyan-700:#0e7490;
  --bg:#ffffff;--bg-2:#f6f8fb;--surface:#ffffff;--surface-2:#f1f4f8;
  --border:#e4e9f0;--border-2:#d3dbe5;
  --text:#0a0f14;--text-2:#2b3644;--text-muted:#6b7787;
  --radius:14px;--max-width:800px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --navy:#1e2f4d;--cyan-logo:#7dd3e8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-2);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.container{max-width:var(--max-width);margin:0 auto;padding:0 24px;width:100%}
h1,h2,h3{line-height:1.15;font-weight:700}

.site-header{background:var(--bg);border-bottom:1px solid var(--border);padding:16px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.novalink-logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.novalink-logo .mark{width:32px;height:39px}
.novalink-logo .wordmark{font-weight:800;font-size:1.1rem;color:var(--navy)}
.back-link{color:var(--text-muted);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;text-decoration:none;transition:color 0.2s}
.back-link:hover{color:var(--cyan-600)}

.form-wrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;box-shadow:0 10px 30px rgba(10,15,20,0.05);width:100%;animation:fadeUp 0.5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.form-header{text-align:center;margin-bottom:28px}
.form-header h1{font-size:1.8rem;color:var(--navy);margin-bottom:8px}
.form-header p{color:var(--text-muted);font-size:14px}

.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em}
.form-group input, .form-group select, .form-group textarea{width:100%;padding:12px 16px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-size:14.5px;font-family:inherit;transition:border-color 0.2s, box-shadow 0.2s}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:none;border-color:var(--cyan-500);box-shadow:0 0 0 3px rgba(6,182,212,0.15);background:#fff}
.form-group textarea{resize:vertical;min-height:100px}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.form-row{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer;transition:all 0.2s ease;font-family:inherit;width:100%;text-decoration:none}
.btn-accent{background:linear-gradient(135deg,var(--cyan-400),var(--cyan-600));color:#04161c}
.btn-accent:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(6,182,212,0.35)}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--cyan-500);color:var(--cyan-700)}
.btn i{width:18px;height:18px}

.form-actions{margin-top:28px;display:flex;flex-direction:column;gap:12px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120%);background:#0a0f14;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;z-index:100;transition:transform 0.3s ease;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="novalink-logo">
      <svg class="mark" viewBox="0 0 60 74"><path fill="#3a5a8c" d="M34.5 4.2c-8.1 0-14.7 6.6-14.7 14.7v3.4c0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9v-3.4c0-4.9 4-8.9 8.9-8.9 4.9 0 8.9 4 8.9 8.9 0 3-1.5 5.7-3.9 7.3-1.4.9-1.8 2.8-.9 4.2.9 1.4 2.8 1.8 4.2.9 4.3-2.7 6.9-7.4 6.9-12.4 0-8.1-6.6-14.7-14.7-14.7z"/><path fill="#7dd3e8" d="M25.5 69.8c8.1 0 14.7-6.6 14.7-14.7v-3.4c0-1.6-1.3-2.9-2.9-2.9s-2.9 1.3-2.9 2.9v3.4c0 4.9-4 8.9-8.9 8.9-4.9 0-8.9-4-8.9-8.9 0-3 1.5-5.7 3.9-7.3 1.4-.9 1.8-2.8.9-4.2-.9-1.4-2.8-1.8-4.2-.9-4.3 2.7-6.9 7.4-6.9 12.4 0 8.1 6.6 14.7 14.7 14.7z"/></svg>
      <span class="wordmark">NOVALINK</span>
    </a>
    <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Home</a>
  </div>
</header>

<main class="form-wrapper">
  <div class="container">
    <div class="form-card">
      <div class="form-header">
        <h1>Create a New Event</h1>
        <p>Fill in the details below. You'll set up the seating map next.</p>
      </div>

      <form id="createEventForm">
        <div class="form-group">
          <label for="eventName">Event Name</label>
          <input type="text" id="eventName" placeholder="e.g., Neon Nights - Live at the Grand" required />
        </div>

        <div class="form-group">
          <label for="eventType">Event Type</label>
          <select id="eventType">
            <option value="theater">🎭 Theater</option>
            <option value="ballroom">🏛️ Ballroom</option>
            <option value="arena">🎪 Arena</option>
            <option value="outdoor">🌳 Outdoor / Festival</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="eventDate">Date</label>
            <input type="date" id="eventDate" required />
          </div>
          <div class="form-group">
            <label for="eventTime">Start Time</label>
            <input type="time" id="eventTime" required />
          </div>
        </div>

        <div class="form-group">
          <label for="venueName">Venue Name</label>
          <input type="text" id="venueName" placeholder="e.g., Grand Amphitheatre" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="venueCity">City</label>
            <input type="text" id="venueCity" placeholder="e.g., Johannesburg" required />
          </div>
          <div class="form-group">
            <label for="ticketPrice">Ticket Price (ZAR)</label>
            <input type="number" id="ticketPrice" placeholder="e.g., 250" min="0" required />
          </div>
        </div>

        <div class="form-group">
          <label for="eventDesc">Description (Optional)</label>
          <textarea id="eventDesc" placeholder="Tell attendees what to expect..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-accent" id="submitBtn">
            <i data-lucide="save"></i> Save & Generate Seat Map
          </button>
          <a href="create-trip.html" style="text-align:center; font-size:13.5px; color:var(--cyan-600); text-decoration:underline; margin-top:8px; display:block;">Looking to plan a multi-day trip instead? Create a trip →</a>
          <a href="index.html" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

function $(id){ return document.getElementById(id); }

function showToast(msg, type){
  var t = $("toast");
  t.innerHTML = '<i data-lucide="' + (type === 'success' ? 'check-circle' : 'alert-circle') + '"></i> ' + msg;
  t.className = "toast " + (type === 'success' ? 'success' : '');
  if(window.lucide) lucide.createIcons();
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 3000);
}

document.addEventListener("DOMContentLoaded", function(){
  if(window.lucide) lucide.createIcons();

  $("createEventForm").addEventListener("submit", function(e){
    e.preventDefault();
    var eventData = {
      name: $("eventName").value,
      type: $("eventType").value,
      date: $("eventDate").value,
      time: $("eventTime").value,
      venue: $("venueName").value,
      city: $("venueCity").value,
      price: $("ticketPrice").value,
      description: $("eventDesc").value,
      createdAt: new Date().toISOString()
    };
    console.log("Event Data:", eventData);
    showToast("Event saved! Redirecting to Seat Map...", "success");
    setTimeout(function(){
      alert("Data captured! In the next step, we will connect this to Firebase and your SeatPlan Studio.");
    }, 1500);
  });
});

})();
</script>
</body>
</html>
