<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event QR Generator</title>
    <!-- Free QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; background: #f0f0f0; }
        
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; margin: 5px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; }
        #btn-public { background: #d1d1d1; color: #333; }
        #btn-cyan { background: #a3e4d7; color: #333; }

        /* The Pink Box from your image */
        .qr-box {
            width: 250px;
            height: 250px;
            background-color: #fce4e4; /* Pink color */
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 15px;
            box-sizing: border-box;
        }

        /* This is where the QR code will render */
        #qrcode-canvas {
            display: none; /* Hidden until generated */
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="btn-public" onclick="generateQR('PUBLIC')">PUBLIC</button>
        <button id="btn-cyan" onclick="generateQR('CYAN')">CYAN</button>
    </div>

    <div class="qr-box">
        <canvas id="qrcode-canvas"></canvas>
    </div>

    <script>
        function generateQR(type) {
            const canvas = document.getElementById('qrcode-canvas');
            canvas.style.display = 'block';

            // This is the data that will be encoded into the QR code.
            // In your real app, this would be the unique Ticket ID.
            const qrData = JSON.stringify({
                ticketId: "ticket_" + Math.floor(Math.random() * 10000),
                eventId: "event_abc123",
                type: type,
                timestamp: new Date().toISOString()
            });

            // Generate the QR code onto the canvas
            QRCode.toCanvas(canvas, qrData, { width: 200, margin: 1 }, function (error) {
                if (error) console.error(error);
                console.log("QR Code generated for " + type);
            });
        }
    </script>
</body>
</html>
