   ══════════════════════════════════════════════════════════════ */
function enterChannelIdle(){
  if (isChannelIdle) return;
  isChannelIdle = true;
  mode = 'idle';

  var idle = $('idleOverlay');
  var idleTitle = $('idleTitle');
  var idleSub = $('idleSub');

  if (idleTitle){
    if (nextSlotStream){
      var nextStart = streamStartMs(nextSlotStream);
      var nextTitle = nextSlotStream.streamTitle || nextSlotStream.eventName || 'Next stream';
      idleTitle.textContent = 'Next: ' + nextTitle;
      idleSub.textContent = 'Back at ' + new Date(nextStart).toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit' });
    } else {
      idleTitle.textContent = 'Back soon';
      idleSub.textContent = 'This channel has no upcoming streams scheduled right now. Ads are playing until the next one starts.';
    }
  }

  if (idle) idle.classList.add('show');
  hideCurtain();
  clearPlayerIframe();
  stopGapAdLoop();

  // Continuous ad loop with retry
  startIdleAdLoop();
  refreshIcons();
}

function exitChannelIdle(){
  isChannelIdle = false;
  var idle = $('idleOverlay');
  if (idle) idle.classList.remove('show');
}

function startIdleAdLoop(){
  if (!isChannelIdle) return;

  var overlay = $('adOverlay');
  var showingAd = overlay && overlay.classList.contains('show');
  if (showingAd) return;

  var hasAds = (adPool.preroll.length || adPool.midroll.length || adPool.postroll.length);
  if (hasAds){
    showAd('preroll', function(){
      if (isChannelIdle){
        gapAdTimer = setTimeout(function(){ if (isChannelIdle) startIdleAdLoop(); }, 800);
      }
    });
  } else {
    // No ads available — just keep the idle overlay up
    gapAdRetryTimer = setTimeout(function(){ if (isChannelIdle) startIdleAdLoop(); }, 10000);
  }
}

/* ══════════════════════════════════════════════════════════════
   NETWORK
   ══════════════════════════════════════════════════════════════ */
function wireNetworkListeners(){
  if (wireNetworkListeners._bound) return;
  wireNetworkListeners._bound = true;
  window.addEventListener('offline', handleOffline);
  window.addEventListener('online', handleOnline);
  if (!navigator.onLine) handleOffline();
}
function handleOffline(){
  isOffline = true;
  var ov = $('offlineOverlay');
  if (ov) ov.classList.add('show');
  try { if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); } catch(e){}
  var nativeVid = document.getElementById('nativeVideoPlayer');
  if (nativeVid) try { nativeVid.pause(); } catch(e){}
}
function handleOnline(){
  isOffline = false;
  var ov = $('offlineOverlay');
  if (ov) ov.classList.remove('show');
  toast('Back online', 'success', 2000);
  if (mode === 'gap-ads' || mode === 'normal' || mode === 'idle'){ decideAndPlay(); }
}

/* ══════════════════════════════════════════════════════════════
   AUTO-HIDE CONTROLS
   ══════════════════════════════════════════════════════════════ */
function wireControlsAutoHide(){
  var player = $('nlPlayer');
  if (!player) return;
  function showControls(){
    player.classList.remove('hide-controls');
    player.classList.remove('hide-cursor');
    resetHideTimer();
  }
  function resetHideTimer(){
    clearTimeout(controlsHideTimer);
    controlsHideTimer = setTimeout(function(){
      var adOverlay = $('adOverlay');
      if (adOverlay && adOverlay.classList.contains('show')) return;
      var curtain = $('curtain');
      if (curtain && curtain.classList.contains('show')) return;
      var offline = $('offlineOverlay');
      if (offline && offline.classList.contains('show')) return;
      player.classList.add('hide-controls');
      player.classList.add('hide-cursor');
    }, CONTROLS_HIDE_MS);
  }
  ['mousemove','mousedown','touchstart','touchmove','click','keydown'].forEach(function(evt){
    player.addEventListener(evt, showControls, { passive: true });
  });
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') showControls();
  });
  resetHideTimer();
}

/* ══════════════════════════════════════════════════════════════
   DOUBLE-TAP SEEK
   ══════════════════════════════════════════════════════════════ */
function wireDoubleTap(){
  var zoneL = $('tapZoneLeft');
  var zoneR = $('tapZoneRight');
  var rippleL = $('tapRippleLeft');
  var rippleR = $('tapRippleRight');
  if (!zoneL || !zoneR) return;

  function handleTap(side){
    var now = Date.now();
    var elapsed = now - tapState.lastTapTime;
    var sameSide = tapState.lastTapSide === side;
    if (elapsed < DOUBLE_TAP_WINDOW && sameSide){
      tapState.lastTapTime = 0;
      tapState.lastTapSide = null;
      if (side === 'left') doSeek(-SEEK_STEP_S, rippleL);
      else doSeek(SEEK_STEP_S, rippleR);
    } else {
      tapState.lastTapTime = now;
      tapState.lastTapSide = side;
    }
  }
  zoneL.addEventListener('click', function(e){ e.stopPropagation(); handleTap('left'); });
  zoneR.addEventListener('click', function(e){ e.stopPropagation(); handleTap('right'); });
}

function doSeek(delta, rippleEl){
  var player = getActivePlayer();
  if (!player) return;

  if (player.type === 'youtube'){
    var cur = player.instance.getCurrentTime() || 0;
    var dur = player.instance.getDuration() || 0;
    var target = cur + delta;
    if (target < 0) target = 0;
    if (dur > 0 && target > dur - 0.5) target = dur - 0.5;
    player.instance.seekTo(target, true);
  } else {
    var v = player.instance;
    var newTime = v.currentTime + delta;
    if (newTime < 0) newTime = 0;
    if (isFinite(v.duration) && v.duration > 0 && newTime > v.duration - 0.5) newTime = v.duration - 0.5;
    try { v.currentTime = newTime; } catch(e){}
  }
  if (rippleEl){
    rippleEl.classList.add('show');
    clearTimeout(rippleEl._t);
    rippleEl._t = setTimeout(function(){ rippleEl.classList.remove('show'); }, 500);
  }
  updateJumpLiveButton();
  toast((delta > 0 ? '+' : '−') + Math.abs(delta) + 's', 'info', 700);
}

function getActivePlayer(){
  if (ytPlayer && ytReady) return { type: 'youtube', instance: ytPlayer };
  var nativeVid = document.getElementById('nativeVideoPlayer');
  if (nativeVid) return { type: 'native', instance: nativeVid };
  return null;
}

/* ══════════════════════════════════════════════════════════════
   PROGRESS BAR
   ══════════════════════════════════════════════════════════════ */
function wireProgressBar(){
  var bar = $('progressBar');
  var hover = $('progressHover');
  var pill = $('livePill');
  if (!bar) return;

  function getPercent(e){
    var rect = bar.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    return Math.max(0, Math.min(1, x / rect.width));
  }
  function showHoverAt(pct){
    if (!hover) return;
    var dur = getPlayerDuration();
    if (dur <= 0) return;
    hover.textContent = formatTime(pct * dur);
    hover.style.left = (pct * 100) + '%';
  }
  function seekTo(pct){
    var player = getActivePlayer();
    if (!player) return;
    var dur = getPlayerDuration();
    if (dur <= 0) return;
    if (liveSyncState.isLive && pct > 0.985){ seekToLiveEdge(); return; }
    var targetTime = pct * dur;
    if (player.type === 'youtube') player.instance.seekTo(targetTime, true);
    else { try { player.instance.currentTime = targetTime; } catch(e){} }
  }
  var dragging = false;
  function onDown(e){ dragging = true; bar.classList.add('dragging'); var pct = getPercent(e); showHoverAt(pct); updateProgressPreview(pct); }
  function onMove(e){ var pct = getPercent(e); showHoverAt(pct); if (dragging){ e.preventDefault(); updateProgressPreview(pct); } }
  function onUp(e){ if (!dragging) return; dragging = false; bar.classList.remove('dragging'); seekTo(getPercent(e)); }

  bar.addEventListener('mousedown', onDown);
  bar.addEventListener('mousemove', onMove);
  bar.addEventListener('mouseleave', function(){ if (!dragging && hover) hover.style.opacity = 0; });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  bar.addEventListener('touchstart', function(e){ e.preventDefault(); onDown(e); }, { passive: false });
  bar.addEventListener('touchmove', function(e){ e.preventDefault(); onMove(e); }, { passive: false });
  bar.addEventListener('touchend', function(e){ onUp(e); }, { passive: true });

  if (pill) pill.addEventListener('click', function(){ if (!pill.disabled) seekToLiveEdge(); });
}

function updateProgressPreview(pct){
  var played = $('progressPlayed');
  var handle = $('progressHandle');
  if (played) played.style.width = (pct * 100) + '%';
  if (handle) handle.style.left = (pct * 100) + '%';
}

function updateProgressFill(){
  var played = $('progressPlayed');
  var handle = $('progressHandle');
  var curEl = $('timeCurrent');
  var totEl = $('timeTotal');
  var pill = $('livePill');
  if (!played) return;

  var cur = getPlayerCurrentTime();
  var dur = getPlayerDuration();
  var player = getActivePlayer();
  var isNative = player && player.type === 'native';
  var v = isNative ? player.instance : null;

  if (v && v.seekable && v.seekable.length){
    liveSyncState.seekableStart = v.seekable.start(0);
    liveSyncState.seekableEnd = v.seekable.end(v.seekable.length - 1);
  }
  if (dur > 0){
    var pct = (cur / dur) * 100;
    played.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (handle) handle.style.left = Math.max(0, Math.min(100, pct)) + '%';
  }
  if (curEl) curEl.textContent = formatTime(cur);
  if (totEl) totEl.textContent = dur > 0 ? formatTime(dur) : 'LIVE';

  if (v && v.seekable && v.seekable.length){
    var behind = liveSyncState.seekableEnd - cur;
    liveSyncState.behindLive = behind;
    liveSyncState.isBehindLive = behind > 10;
  }
  if (currentPhase === 'live'){
    if (liveSyncState.isBehindLive){
      played.classList.add('behind');
      if (pill){ pill.className = 'nl-live-pill behind'; pill.textContent = 'Go Live'; pill.title = 'Jump back to the live edge'; }
    } else {
      played.classList.remove('behind');
      if (pill){ pill.className = 'nl-live-pill live'; pill.textContent = 'Live'; pill.title = 'You are at the live edge'; }
    }
  } else {
    played.classList.remove('behind');
    if (pill) pill.style.display = 'none';
  }
}

function getPlayerCurrentTime(){
  var player = getActivePlayer();
  if (!player) return 0;
  if (player.type === 'youtube'){ try { return player.instance.getCurrentTime() || 0; } catch(e){ return 0; } }
  return player.instance.currentTime || 0;
}
function getPlayerDuration(){
  var player = getActivePlayer();
  if (!player) return 0;
  if (player.type === 'youtube'){ try { return player.instance.getDuration() || 0; } catch(e){ return 0; } }
  var v = player.instance;
  if (liveSyncState.isLive && v.seekable && v.seekable.length) return v.seekable.end(v.seekable.length - 1);
  return isFinite(v.duration) ? v.duration : 0;
}
function seekToLiveEdge(){
  var player = getActivePlayer();
  if (!player) return;
  if (player.type === 'youtube'){
    var dur = player.instance.getDuration() || 0;
    if (dur > 0) player.instance.seekTo(dur - 0.5, true);
  } else {
    var v = player.instance;
    if (v.seekable && v.seekable.length){
      var end = v.seekable.end(v.seekable.length - 1);
      try { v.currentTime = Math.max(0, end - 0.5); } catch(e){}
    } else if (isFinite(v.duration) && v.duration > 0){
      try { v.currentTime = v.duration - 0.5; } catch(e){}
    }
  }
  toast('Jumped to live', 'success', 1200);
  updateProgressFill();
  updateJumpLiveButton();
}

/* ══════════════════════════════════════════════════════════════
   PLAYER CONTROLS
   ══════════════════════════════════════════════════════════════ */
function wirePlayerControls(){
  var pp = $('ctrlPlayPause');
  var mute = $('ctrlMute');
  var fs = $('ctrlFullscreen');
  var back = $('ctrlSeekBack');
  var fwd = $('ctrlSeekForward');
  var jumpLive = $('ctrlJumpLive');

  if (pp) pp.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube'){
      var st = player.instance.getPlayerState();
      if (st === 1) player.instance.pauseVideo(); else player.instance.playVideo();
    } else {
      if (player.instance.paused) player.instance.play(); else player.instance.pause();
    }
  });
  if (mute) mute.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube'){
      if (player.instance.isMuted()){ player.instance.unMute(); mute.innerHTML = icon('volume-2'); }
      else { player.instance.mute(); mute.innerHTML = icon('volume-x'); }
    } else {
      player.instance.muted = !player.instance.muted;
      mute.innerHTML = icon(player.instance.muted ? 'volume-x' : 'volume-2');
    }
    refreshIcons();
  });
  if (fs) fs.addEventListener('click', function(){
    var wrap = $('nlPlayer'); if (!wrap) return;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (wrap.requestFullscreen) wrap.requestFullscreen();
    else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
  });
  if (back) back.addEventListener('click', function(){ doSeek(-SEEK_STEP_S, $('tapRippleLeft')); });
  if (fwd) fwd.addEventListener('click', function(){ doSeek(SEEK_STEP_S, $('tapRippleRight')); });
  if (jumpLive) jumpLive.addEventListener('click', seekToLiveEdge);
}

function updateJumpLiveButton(){
  var btn = $('ctrlJumpLive');
  if (!btn) return;
  if (currentPhase !== 'live'){ btn.classList.remove('show'); return; }
  if (!liveSyncState.isBehindLive){ btn.classList.remove('show'); return; }
  btn.classList.add('show');
}

/* ══════════════════════════════════════════════════════════════
   DECIDE AND PLAY
   ══════════════════════════════════════════════════════════════ */
function decideAndPlay(){
  var phase = computePhase();
  currentPhase = phase;
  console.log('[Novalink] Phase:', phase, '| Segments:', getSegments().length);

  // Compute next slot target once
  if (!nextSlotStream){
    nextSlotStream = findNextSlotInChannel();
  }

  // ── Upcoming ──
  if (phase === 'upcoming'){
    exitChannelIdle();
    hideUpNext();
    mode = 'gap-ads';
    loadPlayerForIframeOnly();
    showCountdownCurtain();
    startGapAdLoop();
    renderPhaseUI();
    updateCountdownPill();
    updateQueueBanner();
    renderSegmentsList();
    return;
  }

  // ── Live ──
  if (phase === 'live'){
    exitChannelIdle();
    hideUpNext();
    mode = 'normal';
    stopGapAdLoop();
    hideQueueBanner();
    hideCurtain();

    var active = getActiveSegment();
    if (active){
      if (currentLoadedSegmentIndex !== active.index){
        currentLoadedSegmentIndex = active.index;
        loadSegment(active);
      }
    }
    renderPhaseUI();
    updateCountdownPill();
    renderSegmentsList();
    setupMidrollTimer();
    scheduleSlotEnd();

    if (adSettings.prerollEnabled && streamData.prerollEnabled !== false && !adState.firedPreroll){
      var hasAnyAds = adPool.preroll.length || adPool.midroll.length || adPool.postroll.length;
      if (hasAnyAds){
        adState.firedPreroll = true;
        showAd('preroll', function(){});
      }
    }
    return;
  }

  // ── Gap ──
  if (phase === 'gap'){
    mode = 'gap-ads';
    clearPlayerIframe();
    var nextSeg = getNextSegment();
    if (nextSeg) updateQueueBannerForSegment(nextSeg);
    showCountdownCurtain();
    startGapAdLoop();
    renderPhaseUI();
    updateCountdownPill();
    renderSegmentsList();
    return;
  }

  // ── Replay ──
  if (phase === 'replay'){
    mode = 'normal';
    stopGapAdLoop();
    hideQueueBanner();
    hideCurtain();
    var segs = getSegments();
    var last = segs[segs.length - 1];
    if (last && currentLoadedSegmentIndex !== segs.length - 1){
      currentLoadedSegmentIndex = segs.length - 1;
      loadSegment({ seg: last, index: segs.length - 1 });
    }
    renderPhaseUI();
    updateCountdownPill();
    renderSegmentsList();
    return;
  }

  // ── Ended ──
  if (phase === 'ended'){
    if (nextSlotStream) enterChannelIdle();
    else tryNextInQueue();
  }
}

function scheduleSlotEnd(){
  clearTimeout(slotEndTimer);
  var endMs = streamEndMs(streamData);
  if (!isFinite(endMs)) return;
  var delay = endMs - Date.now();
  if (delay <= 0) return;

  slotEndTimer = setTimeout(function(){
    console.log('[Novalink] Slot ended — advancing');
    var now = Date.now();
    // If next slot's start is within UP_NEXT_LEAD_MS, show the Up Next screen
    if (nextSlotStream){
      var nextStart = streamStartMs(nextSlotStream);
      if (nextStart - now <= UP_NEXT_LEAD_MS){
        showUpNext(nextSlotStream);
        setTimeout(goToNextSlot, 5000);
      } else {
        // Too far away — enter idle mode
        enterChannelIdle();
      }
    } else {
      enterChannelIdle();
    }
  }, delay);
}

function loadSegment(active){
  resolveStreamUrl({
    partnerId: streamData.partnerId,
    isNative: streamData.isNative,
    hlsUrl: streamData.hlsUrl,
    segments: streamData.segments,
    streamUrl: streamData.streamUrl
  }).then(function(result){
    if (!result.url){
      showCurtain('loading', 'Stream URL missing', 'This stream has no playable source configured.');
      return;
    }
    var protocol = result.protocol || 'hls';
    if (protocol === 'youtube') return loadYouTubePlayer(result.url);
    if (protocol === 'iframe') return loadIframePlayer(active.seg.url, active.seg.platform);
    if (protocol === 'dash') return loadDashPlayer(result.url);
    if (protocol === 'mpegts') return loadMpegTsPlayer(result.url);
    if (protocol === 'file') return loadDirectVideoPlayer(result.url);
    return loadHlsPlayer(result.url);
  }).catch(function(err){
    console.error('[resolveStreamUrl]', err);
    showCurtain('error', 'Unable to load stream', err.message || 'Please try again.');
  });
}

function clearPlayerIframe(){
  var host = $('ytPlayerHost');
  if (host) host.innerHTML = '';
  ytPlayer = null;
  ytReady = false;
  currentYtVideoId = null;
  var nativeVid = document.getElementById('nativeVideoPlayer');
  if (nativeVid) nativeVid.remove();
  if (window.dashjs && dashPlayer) { try { dashPlayer.reset(); } catch(e){} dashPlayer = null; }
  if (window.mpegts && mpegtsPlayer) { try { mpegtsPlayer.destroy(); } catch(e){} mpegtsPlayer = null; }
}

/* ══════════════════════════════════════════════════════════════
   PLAYER LOADERS
   ══════════════════════════════════════════════════════════════ */
function getHost(){ return $('ytPlayerHost'); }

function buildVideoEl(id){
  var v = document.createElement('video');
  v.id = id || 'nativeVideoPlayer';
  v.controls = false;
  v.autoplay = true;
  v.muted = true;
  v.playsInline = true;
  v.style.width = '100%';
  v.style.height = '100%';
  v.style.position = 'absolute';
  v.style.inset = '0';
  v.style.objectFit = 'contain';
  v.setAttribute('playsinline', '');
  return v;
}

function wireNativeVideoEvents(video){
  video.addEventListener('loadedmetadata', function(){ liveSyncState.duration = video.duration || 0; updateProgressFill(); });
  video.addEventListener('timeupdate', function(){ updateProgressFill(); updateJumpLiveButton(); });
  video.addEventListener('progress', function(){ updateProgressFill(); });
  video.addEventListener('waiting', function(){ var b = $('nlBuffering'); if (b) b.classList.add('show'); });
  video.addEventListener('playing', function(){
    var b = $('nlBuffering'); if (b) b.classList.remove('show');
    var pp = $('ctrlPlayPause'); if (pp) pp.innerHTML = icon('pause'); refreshIcons();
  });
  video.addEventListener('pause', function(){
    var pp = $('ctrlPlayPause'); if (pp) pp.innerHTML = icon('play'); refreshIcons();
  });
  video.addEventListener('canplay', function(){ var b = $('nlBuffering'); if (b) b.classList.remove('show'); });
  video.addEventListener('ended', function(){ handleSegmentEnd(); });
}

function loadHlsPlayer(url){
  var host = getHost(); if (!host) return;
  showCurtain('loading', 'Connecting to live stream…');
  clearPlayerIframe();
  var video = buildVideoEl('nativeVideoPlayer');
  wireNativeVideoEvents(video);
  liveSyncState.isLive = true;

  if (window.Hls && Hls.isSupported()){
    var hls = new Hls({ liveDurationInfinity: true });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){
      video.play().catch(function(e){ console.log('Autoplay blocked', e); });
      hideCurtain();
    });
    hls.on(Hls.Events.ERROR, function(event, data){
      console.error('HLS error:', data);
      if (data && data.fatal){
        switch (data.type){
          case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
          case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
          default: showCurtain('error', 'Stream Error', 'Could not connect to the HLS stream.'); break;
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    video.addEventListener('loadedmetadata', function(){
      video.play().catch(function(e){ console.log('Autoplay blocked', e); });
      hideCurtain();
    });
  }
  host.appendChild(video);
  updateJumpLiveButton();
}

function loadDashPlayer(url){
  var host = getHost(); if (!host) return;
  if (!window.dashjs){ showCurtain('error', 'DASH not supported', 'The dash.js library failed to load.'); return; }
  showCurtain('loading', 'Connecting to DASH stream…');
  clearPlayerIframe();
  var video = buildVideoEl('nativeVideoPlayer');
  wireNativeVideoEvents(video);
  liveSyncState.isLive = true;
  host.appendChild(video);
  try {
    dashPlayer = dashjs.MediaPlayer().create();
    dashPlayer.initialize(video, url, true);
    dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function(){ hideCurtain(); video.play().catch(function(){}); });
    dashPlayer.on(dashjs.MediaPlayer.events.ERROR, function(e){ console.error('DASH error:', e); showCurtain('error', 'Stream Error', 'Could not connect to the DASH stream.'); });
  } catch(e){ console.error('DASH init failed:', e); showCurtain('error', 'DASH error', e.message || ''); }
  updateJumpLiveButton();
}

function loadMpegTsPlayer(url){
  var host = getHost(); if (!host) return;
  if (!window.mpegts){ showCurtain('error', 'MPEG-TS not supported', 'The mpegts.js library failed to load.'); return; }
  showCurtain('loading', 'Connecting to MPEG-TS stream…');
  clearPlayerIframe();
  var video = buildVideoEl('nativeVideoPlayer');
  wireNativeVideoEvents(video);
  liveSyncState.isLive = true;
  host.appendChild(video);
  try {
    mpegtsPlayer = mpegts.createPlayer({ type: 'mpegts', url: url, isLive: true });
    mpegtsPlayer.attachMediaElement(video);
    mpegtsPlayer.load();
    mpegtsPlayer.play().then(function(){ hideCurtain(); }).catch(function(){ hideCurtain(); });
    mpegtsPlayer.on(mpegts.Events.ERROR, function(type, detail){ console.error('MPEG-TS error:', type, detail); showCurtain('error', 'Stream Error', 'Could not connect to the MPEG-TS stream.'); });
  } catch(e){ console.error('MPEG-TS init failed:', e); showCurtain('error', 'MPEG-TS error', e.message || ''); }
  updateJumpLiveButton();
}

function loadDirectVideoPlayer(url){
  var host = getHost(); if (!host) return;
  showCurtain('loading', 'Loading video…');
  clearPlayerIframe();
  var video = buildVideoEl('nativeVideoPlayer');
  wireNativeVideoEvents(video);
  liveSyncState.isLive = false;
  video.src = url;
  video.addEventListener('loadedmetadata', function(){ hideCurtain(); video.play().catch(function(){}); });
  host.appendChild(video);
  updateJumpLiveButton();
}

function loadYouTubePlayer(url){
  var host = getHost(); if (!host) return;
  clearPlayerIframe();
  var vid = extractYouTubeId(url);
  if (!vid){ showCurtain('loading', 'Invalid YouTube URL', 'Could not extract a video ID.'); return; }
  showCurtain('loading', 'Loading stream', 'Connecting to YouTube…');
  host.innerHTML = '<div id="ytPlayer"></div>';
  currentYtVideoId = vid;
  liveSyncState.isLive = true;
  if (window.YT && window.YT.Player) createYTPlayer(vid);
  else window.onYouTubeIframeAPIReady = function(){ createYTPlayer(vid); };
}

function loadIframePlayer(url, platform){
  var host = getHost(); if (!host) return;
  showCurtain('loading', 'Loading stream', 'Connecting to ' + platformLabel(platform) + '…');
  clearPlayerIframe();
  var embed = '';
  if (platform === 'twitch'){
    var ch = extractTwitchChannel(url);
    if (!ch){ showCurtain('loading', 'Invalid Twitch URL', ''); return; }
    var parent = location.hostname || 'localhost';
    embed = 'https://player.twitch.tv/?channel=' + encodeURIComponent(ch) + '&parent=' + parent + '&autoplay=true&muted=true';
  } else if (platform === 'vimeo'){
    var v2 = extractVimeoId(url);
    if (!v2){ showCurtain('loading', 'Invalid Vimeo URL', ''); return; }
    embed = 'https://player.vimeo.com/video/' + v2 + '?autoplay=1&muted=1';
  } else if (platform === 'facebook'){
    embed = buildFacebookEmbed(url);
  } else {
    embed = normalizeEmbedUrl(url, platform);
  }
  var iframe = document.createElement('iframe');
  iframe.src = embed;
  iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media; camera; microphone; clipboard-write';
  iframe.setAttribute('allowfullscreen', '');
  iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = '0';
  iframe.style.position = 'absolute';
  iframe.style.inset = '0';
  var loaded = false;
  iframe.addEventListener('load', function(){ if (!loaded){ loaded = true; hideCurtain(); } });
  setTimeout(function(){ if (!loaded){ loaded = true; hideCurtain(); } }, 4000);
  host.appendChild(iframe);
}

function createYTPlayer(videoId){
  ytPlayer = new YT.Player('ytPlayer', {
    videoId: videoId,
    playerVars: { autoplay: 1, mute: 1, rel: 0, playsinline: 1, iv_load_policy: 3, modestbranding: 1, controls: 0, disablekb: 1, color: 'white', origin: window.location.origin },
    events: {
      onReady: function(event){
        ytReady = true;
        hideCurtain();
        try { event.target.mute(); event.target.playVideo(); } catch(e){}
        var attempts = 0;
        clearInterval(autoplayRetryTimer);
        autoplayRetryTimer = setInterval(function(){
          attempts++;
          if (attempts > 8){ clearInterval(autoplayRetryTimer); return; }
          try { var state = event.target.getPlayerState(); if (state !== 1 && state !== 3) event.target.playVideo(); else clearInterval(autoplayRetryTimer); } catch(e){}
        }, 1000);
        clearInterval(liveCheckTimer);
        liveCheckTimer = setInterval(function(){ if (currentPhase === 'live'){ updateJumpLiveButton(); updateProgressFill(); } }, 2000);
      },
      onStateChange: function(event){
        var pp = $('ctrlPlayPause'); if (pp) pp.innerHTML = icon(event.data === 1 ? 'pause' : 'play'); refreshIcons();
        if (event.data === 0){
          if (adSettings.postrollEnabled && streamData.postrollEnabled !== false && !adState.firedPostroll){
            adState.firedPostroll = true;
            showAd('postroll', function(){ handleSegmentEnd(); });
          } else { handleSegmentEnd(); }
        }
        if (event.data === 1) updateJumpLiveButton();
      },
      onError: function(event){
        var msg = 'YouTube error. ';
        if (event.data === 2) msg += 'Video ID is invalid.';
        else if (event.data === 5) msg += 'HTML5 player cannot play this video.';
        else if (event.data === 100) msg += 'Video not found or is private.';
        else if (event.data === 101 || event.data === 150) msg += 'Video owner does not allow embedding.';
        else msg += 'Code: ' + event.data;
        toast(msg, 'error', 6000);
      }
    }
  });
}

function handleSegmentEnd(){
  var phase = computePhase();
  if (phase === 'gap'){ decideAndPlay(); }
  else if (phase === 'ended'){ decideAndPlay(); }
  else if (phase === 'live'){
    var segs = getSegments();
    var active = getActiveSegment();
    if (active && active.index < segs.length - 1){ decideAndPlay(); }
  }
}

function loadPlayerForIframeOnly(){
  var host = getHost();
  if (!host) return;
  if (host.innerHTML) return;
  var active = getActiveSegment() || (function(){
    var segs = getSegments();
    return segs[0] ? { seg: segs[0], index: 0 } : null;
  })();
  if (!active) return;
  loadSegment(active);
}

function tryNextInQueue(){
  var now = Date.now();
  var next = null;
  for (var i = 0; i < channelQueue.length; i++){
    var s = channelQueue[i];
    if (s.id === streamId) continue;
    var startMs = streamStartMs(s);
    if (startMs > now && startMs - now <= QUEUE_LOOKAHEAD_MS){
      if (!next || startMs < next.startMs) next = { stream: s, startMs: startMs };
    }
  }
  if (!next){
    mode = 'idle';
    stopGapAdLoop();
    enterChannelIdle();
    return;
  }
  nextStreamInQueue = next;
  var gapMs = next.startMs - now;
  if (gapMs <= GAP_ADS_MAX_MS){
    mode = 'gap-ads';
    updateQueueBanner();
    showCountdownCurtain();
    startGapAdLoop();
  } else {
    mode = 'idle';
    stopGapAdLoop();
    enterChannelIdle();
  }
}

function updateQueueBannerForSegment(nextSeg){
  var banner = $('queueBanner');
  var lbl = $('qbLbl');
  var title = $('qbTitle');
  var time = $('qbTime');
  if (!banner) return;
  if (lbl) lbl.textContent = 'Next segment';
  if (title) title.textContent = 'Segment ' + (nextSeg.index + 1) + ' · ' + platformLabel(nextSeg.seg.platform);
  if (time) time.textContent = formatDurationShort(nextSeg.seg.startMs - Date.now());
  banner.classList.add('show');
}

function updateQueueBanner(){
  var banner = $('queueBanner');
  var lbl = $('qbLbl');
  var title = $('qbTitle');
  var time = $('qbTime');
  if (!banner || !nextStreamInQueue){ if (banner) banner.classList.remove('show'); return; }
  if (lbl) lbl.textContent = 'Next up';
  if (title) title.textContent = nextStreamInQueue.stream.streamTitle || nextStreamInQueue.stream.eventName || 'Untitled';
  if (time) time.textContent = formatDurationShort(nextStreamInQueue.startMs - Date.now());
  banner.classList.add('show');
}

function hideQueueBanner(){
  var banner = $('queueBanner');
  if (banner) banner.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   GAP ADS LOOP
   ══════════════════════════════════════════════════════════════ */
function startGapAdLoop(){
  clearTimeout(gapAdTimer);
  clearTimeout(gapAdRetryTimer);
  if (isOffline) return;
  var overlay = $('adOverlay');
  var showingAd = overlay && overlay.classList.contains('show');
  if (showingAd) return;
  if (streamData.gapAdsEnabled === false){
    if (!($('curtain') && $('curtain').classList.contains('show'))) showCountdownCurtain();
    gapAdRetryTimer = setTimeout(function(){ if (mode === 'gap-ads') startGapAdLoop(); }, 5000);
    return;
  }
  var hasAds = (adPool.preroll.length || adPool.midroll.length || adPool.postroll.length);
  if (hasAds){
    adState.gapAdActive = true;
    showAd('preroll', function(){
      adState.gapAdActive = false;
      if (!$('curtain') || !$('curtain').classList.contains('show')) showCountdownCurtain();
      if (mode === 'gap-ads') gapAdTimer = setTimeout(function(){ if (mode === 'gap-ads') startGapAdLoop(); }, 400);
    });
  } else {
    if (!($('curtain') && $('curtain').classList.contains('show'))) showCountdownCurtain();
    gapAdRetryTimer = setTimeout(function(){ if (mode === 'gap-ads') startGapAdLoop(); }, 5000);
  }
}

function stopGapAdLoop(){
  clearTimeout(gapAdTimer);
  clearTimeout(gapAdRetryTimer);
  adState.gapAdActive = false;
}

/* ══════════════════════════════════════════════════════════════
   PHASE UI
   ══════════════════════════════════════════════════════════════ */
function renderPhaseUI(){
  var liveTag = $('playerLiveTag');
  var crumbLive = $('crumbLivePill');
  if (currentPhase === 'live'){
    if (liveTag) liveTag.style.display = 'inline-flex';
    if (crumbLive) crumbLive.style.display = 'inline-flex';
  } else {
    if (liveTag) liveTag.style.display = 'none';
    if (crumbLive) crumbLive.style.display = 'none';
  }
  updateJumpLiveButton();
}

function updateCountdownPill(){
  var pill = $('cdPill');
  var text = $('cdText');
  var lbl = $('cdLbl');
  if (!pill || !text) return;
  if (currentPhase === 'gap'){
    var nextSeg = getNextSegment();
    if (nextSeg){
      var diff = nextSeg.seg.startMs - Date.now();
      if (diff < 0) diff = 0;
      var s = Math.floor(diff / 1000);
      var d = Math.floor(s / 86400);
      var h = Math.floor((s % 86400) / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      var str = (d > 0 ? d + 'd ' : '') + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
      if (lbl) lbl.textContent = 'Next segment in';
      text.textContent = str;
      pill.classList.add('show');
      return;
    }
  }
  if ((mode === 'gap-ads' || mode === 'idle') && nextStreamInQueue){
    var diff2 = nextStreamInQueue.startMs - Date.now();
    if (diff2 < 0) diff2 = 0;
    var s2 = Math.floor(diff2 / 1000);
    var d2 = Math.floor(s2 / 86400);
    var h2 = Math.floor((s2 % 86400) / 3600);
    var m2 = Math.floor((s2 % 3600) / 60);
    var sec2 = s2 % 60;
    var str2 = (d2 > 0 ? d2 + 'd ' : '') + String(h2).padStart(2,'0') + ':' + String(m2).padStart(2,'0') + ':' + String(sec2).padStart(2,'0');
    if (lbl) lbl.textContent = 'Next in';
    text.textContent = str2;
    pill.classList.add('show');
    return;
  }
  if (currentPhase === 'upcoming'){
    var t = getTiming();
    if (!t.valid) return;
    var diff3 = t.startMs - Date.now();
    if (diff3 < 0) diff3 = 0;
    var s3 = Math.floor(diff3 / 1000);
    var d3 = Math.floor(s3 / 86400);
    var h3 = Math.floor((s3 % 86400) / 3600);
    var m3 = Math.floor((s3 % 3600) / 60);
    var sec3 = s3 % 60;
    var str3 = (d3 > 0 ? d3 + 'd ' : '') + String(h3).padStart(2,'0') + ':' + String(m3).padStart(2,'0') + ':' + String(sec3).padStart(2,'0');
    if (lbl) lbl.textContent = 'Live in';
    text.textContent = str3;
    pill.classList.add('show');
    return;
  }
  pill.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   TICKERS
   ══════════════════════════════════════════════════════════════ */
function startTickers(){
  clearInterval(countdownTimer);
  clearInterval(phaseTickTimer);
  clearInterval(progressTickTimer);
  clearInterval(idleCheckTimer);

  countdownTimer = setInterval(function(){
    updateCountdownPill();
    updateCurtainCountdown();
    if ((mode === 'gap-ads' || mode === 'idle') && nextStreamInQueue){
      var qbTime = $('qbTime');
      if (qbTime) qbTime.textContent = formatDurationShort(nextStreamInQueue.startMs - Date.now());
    }
    if (currentPhase === 'gap'){
      var nextSeg = getNextSegment();
      var qbTime2 = $('qbTime');
      if (nextSeg && qbTime2) qbTime2.textContent = formatDurationShort(nextSeg.seg.startMs - Date.now());
    }
  }, 1000);

  progressTickTimer = setInterval(function(){ updateProgressFill(); }, 500);

  phaseTickTimer = setInterval(function(){
    if (mode === 'gap-ads' && nextStreamInQueue && Date.now() >= nextStreamInQueue.startMs){
      window.location.href = 'view-stream.html?id=' + encodeURIComponent(nextStreamInQueue.stream.id);
      return;
    }
    var newPhase = computePhase();
    if (currentPhase === 'gap' && newPhase === 'live'){ decideAndPlay(); return; }
    if (newPhase === 'live'){
      var active = getActiveSegment();
      if (active && currentLoadedSegmentIndex !== active.index){ decideAndPlay(); return; }
    }
    if (newPhase !== currentPhase){
      currentPhase = newPhase;
      renderPhaseUI();
      updateCountdownPill();
      decideAndPlay();
    }
  }, 3000);

  // Idle mode: check every 30s if next slot's start is close enough to auto-advance
  idleCheckTimer = setInterval(function(){
    if (mode !== 'idle' && !isChannelIdle) return;
    if (!nextSlotStream) return;
    var nextStart = streamStartMs(nextSlotStream);
    if (!isFinite(nextStart)) return;
    var diff = nextStart - Date.now();
    // If next slot's start is within 30 seconds, redirect
    if (diff <= 30000 && diff > -60000){
      console.log('[Novalink] Idle → next slot starting now');
      window.location.href = 'view-stream.html?id=' + encodeURIComponent(nextSlotStream.id);
    }
  }, 30000);
}

/* ══════════════════════════════════════════════════════════════
   MIDROLL
   ══════════════════════════════════════════════════════════════ */
function setupMidrollTimer(){
  clearTimeout(adState.midrollTimerId);
  if (!adSettings.midrollEnabled) return;
  if (streamData.midrollEnabled === false) return;
  if (currentPhase !== 'live') return;
  var active = getActiveSegment();
  if (!active) return;
  if (adState.firedMidrollForSegment !== active.index){
    adState.firedMidroll = false;
    adState.firedMidrollForSegment = active.index;
  }
  if (adState.firedMidroll) return;
  var midMin = parseInt(streamData.midrollMinute, 10) || adSettings.midrollMinute || 30;
  var fireAt = active.seg.startMs + (midMin * 60000);
  var delay = Math.max(0, fireAt - Date.now());
  adState.midrollTimerId = setTimeout(function(){
    adState.firedMidroll = true;
    if (currentPhase === 'live') showAd('midroll', function(){});
  }, delay);
}

/* ══════════════════════════════════════════════════════════════
   ADS
   ══════════════════════════════════════════════════════════════ */
function loadAdsInBackground(){
  var settingsPromise = db.collection(SETTINGS).doc(SETTINGS_DOC).get().then(function(snap){
    if (snap.exists) adSettings = Object.assign({}, AD_DEFAULTS, snap.data() || {});
  }).catch(function(){});
  var poolPromise = db.collection(ADS).where('active', '==', true).limit(50).get().then(function(snap){
    adPool = { preroll: [], midroll: [], postroll: [] };
    var now = Date.now();
    snap.forEach(function(doc){
      var d = doc.data() || {};
      d.id = doc.id;
      if (d.startDate){ var s = new Date(d.startDate + 'T00:00').getTime(); if (!isNaN(s) && now < s) return; }
      if (d.endDate){ var e = new Date(d.endDate + 'T23:59:59').getTime(); if (!isNaN(e) && now > e) return; }
      if (!d.mediaUrl) return;
      var t = d.type || 'any';
      if (t === 'preroll' || t === 'any') adPool.preroll.push(d);
      if (t === 'midroll' || t === 'any') adPool.midroll.push(d);
      if (t === 'postroll' || t === 'any') adPool.postroll.push(d);
    });
  }).catch(function(){});
  return Promise.all([settingsPromise, poolPromise]);
}

function getRecentAdIds(){ try { var raw = sessionStorage.getItem('nl_recent_ads'); return raw ? JSON.parse(raw) : []; } catch(e){ return []; } }
function rememberAd(adId){
  var recent = getRecentAdIds();
  recent.push(adId);
  if (recent.length > RECENT_ADS_MAX) recent = recent.slice(-RECENT_ADS_MAX);
  try { sessionStorage.setItem('nl_recent_ads', JSON.stringify(recent)); } catch(e){}
}
function pickAd(slot){
  var pool = adPool[slot] || [];
  if (!pool.length) return null;
  var recent = getRecentAdIds();
  var fresh = pool.filter(function(ad){ return recent.indexOf(ad.id) === -1; });
  if (!fresh.length) fresh = pool;
  var total = fresh.reduce(function(sum, ad){ return sum + (ad.weight || 1); }, 0);
  var r = Math.random() * total;
  var acc = 0;
  for (var i = 0; i < fresh.length; i++){
    acc += fresh[i].weight || 1;
    if (r <= acc) return fresh[i];
  }
  return fresh[0];
}
function trackAdEvent(ad, type){
  if (!ad || !ad.id) return;
  try {
    var update = {};
    if (type === 'impression') update.impressions = firebase.firestore.FieldValue.increment(1);
    if (type === 'click') update.clicks = firebase.firestore.FieldValue.increment(1);
    db.collection(ADS).doc(ad.id).update(update).catch(function(){});
  } catch(e){}
}

function clearAdTimers(){
  clearInterval(adState.countdownTimerId);
  clearTimeout(adState.skipTimerId);
  clearTimeout(adState.adStartWatchdogId);
  clearTimeout(adState.adHardFallbackId);
  clearTimeout(adState.autoplayRetryId);
}

function showAd(slot, onComplete){
  var overlay = $('adOverlay'), media = $('adMedia'), title = $('adTitle');
  var cta = $('adCta'), ctaLabel = $('adCtaLabel');
  var skipBtn = $('adSkip'), skipText = $('adSkipText'), countdown = $('adCountdown');
  var progressFill = $('adProgressFill');
  var tapOverlay = $('adTap');
  if (!overlay || !media){ if (onComplete) onComplete(); return; }
  var player = $('nlPlayer');
  if (player) player.classList.remove('hide-controls');
  clearAdTimers();
  if (tapOverlay) tapOverlay.classList.remove('show');

  var ad = pickAd(slot);
  overlay.classList.add('show');
  media.innerHTML = '';
  progressFill.style.width = '0%';
  var skipAfter = parseInt(adSettings.skipAfterSeconds, 10);
  if (isNaN(skipAfter)) skipAfter = 5;

  var fsBtn = $('adFullscreen');
  if (fsBtn){
    fsBtn.onclick = function(){
      var wrap = $('nlPlayer'); if (!wrap) return;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    };
  }
  var skipStarted = false;
  function beginSkipCountdown(seconds){
    if (skipStarted) return;
    skipStarted = true;
    if (seconds === -1){ skipBtn.disabled = true; skipText.textContent = 'Ad'; countdown.textContent = ''; return; }
    var totalWait = (seconds || 0) + SKIP_EXTRA_DELAY_SECONDS;
    if (totalWait <= 0){ skipBtn.disabled = false; skipText.textContent = 'Skip ad'; countdown.textContent = ''; return; }
    var remaining = totalWait;
    skipBtn.disabled = true;
    skipText.textContent = 'Skip in';
    countdown.textContent = remaining;
    clearInterval(adState.countdownTimerId);
    adState.countdownTimerId = setInterval(function(){
      remaining--;
      if (remaining <= 0){
        clearInterval(adState.countdownTimerId);
        skipBtn.disabled = false; skipText.textContent = 'Skip ad'; countdown.textContent = '';
      } else { countdown.textContent = remaining; }
    }, 1000);
  }
  function fallbackToHouseAd(){
    media.innerHTML = '';
    media.appendChild(buildHouseAd());
    title.textContent = adSettings.houseAdTitle || 'Advertise on Novalink';
    cta.href = adSettings.houseAdUrl || 'mailto:ads@novalink.com';
    ctaLabel.textContent = adSettings.houseAdCtaLabel || 'Advertise here';
    beginSkipCountdown(skipAfter);
  }
  function attachRobustVideoPlayback(vid){
    var tryPlay = function(attempt){
      var p = vid.play();
      if (p && typeof p.then === 'function'){
        p.then(function(){}).catch(function(){
          if (attempt === 1){
            try { vid.muted = true; } catch(e){}
            adState.autoplayRetryId = setTimeout(function(){ tryPlay(2); }, 400);
          } else {
            if (tapOverlay){
              tapOverlay.classList.add('show');
              tapOverlay.onclick = function(){
                tapOverlay.classList.remove('show');
                try { vid.muted = false; } catch(e){}
                try { vid.play().catch(function(){}); } catch(e){}
              };
            }
            beginSkipCountdown(0);
          }
        });
      }
    };
    tryPlay(1);
  }

  if (ad){
    title.textContent = ad.title || 'Advertisement';
    cta.href = ad.clickUrl || '#';
    ctaLabel.textContent = ad.ctaLabel || 'Learn more';
    if (typeof ad.skipAfterSeconds === 'number') skipAfter = ad.skipAfterSeconds;
    if (ad.mediaType === 'video' && ad.mediaUrl){
      var vid = document.createElement('video');
      vid.src = ad.mediaUrl;
      vid.autoplay = true; vid.muted = false; vid.playsInline = true; vid.preload = 'auto';
      vid.setAttribute('playsinline', '');
      media.appendChild(vid);
      vid.addEventListener('timeupdate', function(){ if (vid.duration) progressFill.style.width = ((vid.currentTime / vid.duration) * 100) + '%'; });
      vid.addEventListener('ended', function(){ hideAd(); if (onComplete) onComplete(); });
      vid.addEventListener('error', function(){ fallbackToHouseAd(); });
      vid.addEventListener('playing', function(){ beginSkipCountdown(skipAfter); });
      adState.adStartWatchdogId = setTimeout(function(){
        if (!skipStarted){
          if (vid.readyState >= 2 && !vid.paused){ beginSkipCountdown(skipAfter); }
          else { fallbackToHouseAd(); }
        }
      }, AD_START_TIMEOUT_MS);
      adState.adHardFallbackId = setTimeout(function(){ if (!skipStarted){ beginSkipCountdown(skipAfter); } }, AD_HARD_FALLBACK_MS);
      attachRobustVideoPlayback(vid);
    } else if (ad.mediaUrl){
      var img = document.createElement('img');
      img.src = ad.mediaUrl; img.alt = ad.title || 'Ad';
      img.addEventListener('load', function(){ beginSkipCountdown(skipAfter); });
      img.addEventListener('error', function(){ fallbackToHouseAd(); });
      media.appendChild(img);
      adState.adHardFallbackId = setTimeout(function(){ if (!skipStarted) beginSkipCountdown(skipAfter); }, AD_HARD_FALLBACK_MS);
    } else {
      media.appendChild(buildHouseAd());
      beginSkipCountdown(skipAfter);
    }
    trackAdEvent(ad, 'impression');
    rememberAd(ad.id);
  } else {
    title.textContent = adSettings.houseAdTitle || 'Advertise on Novalink';
    cta.href = adSettings.houseAdUrl || 'mailto:ads@novalink.com';
    ctaLabel.textContent = adSettings.houseAdCtaLabel || 'Advertise here';
    media.appendChild(buildHouseAd());
    beginSkipCountdown(skipAfter);
  }
  cta.onclick = function(){ if (ad) trackAdEvent(ad, 'click'); };
  skipBtn.onclick = function(){ if (skipBtn.disabled) return; hideAd(); if (onComplete) onComplete(); };
  refreshIcons();
}

function hideAd(){
  var overlay = $('adOverlay');
  if (!overlay) return;
  overlay.classList.remove('show');
  var media = $('adMedia'); if (media) media.innerHTML = '';
  var tapOverlay = $('adTap'); if (tapOverlay) tapOverlay.classList.remove('show');
  clearAdTimers();
}

/* ══════════════════════════════════════════════════════════════
   LOAD
   ══════════════════════════════════════════════════════════════ */
function load(){
  var partnerTestId = getParam('partnerTest');
  if (partnerTestId){
    return db.collection(LIVE_PARTNERS).doc(partnerTestId).get()
      .then(function(snap){
        if (!snap.exists){ renderError('Partner not found', 'This partner channel does not exist.'); return; }
        var p = snap.data() || {};
        if (p.enabled === false && !isAdmin(auth.currentUser)){ renderError('Channel disabled', 'This partner channel is currently disabled.'); return; }
        partnerData = p;
        streamData = {
          id: '__partner__' + partnerTestId, _isPartnerTest: true,
          streamTitle: p.name || 'Partner Channel', eventName: p.name || 'Partner Channel',
          channelName: 'Partner Feed', isNative: true, hlsUrl: '__partner__',
          startDate: new Date().toISOString().slice(0,10), startTime: '00:00',
          durationMinutes: 1440, replayEnabled: true,
          prerollEnabled: true, midrollEnabled: false, postrollEnabled: false, gapAdsEnabled: false,
          partnerId: partnerTestId
        };
        currentPhase = computePhase();
        renderPage();
      })
      .catch(function(err){ console.error('[partnerTest]', err); renderError('Could not load partner', err.message || ''); });
  }

  streamId = getParam('id');
  if (!streamId){ renderError('No stream specified', 'This page needs a stream ID.'); return; }

  db.collection(STREAMS).doc(streamId).get()
    .then(function(doc){
      if (!doc.exists){ renderError('Stream not found', 'This stream may have been deleted.'); return; }
      streamData = doc.data() || {};
      streamData.id = doc.id;

      var partnerPromise = streamData.partnerId
        ? db.collection(LIVE_PARTNERS).doc(streamData.partnerId).get().then(function(ps){ if (ps.exists){ partnerData = ps.data() || {}; } }).catch(function(){})
        : Promise.resolve();

      var chId = streamData.channelId;
      var chPromise = chId
        ? db.collection(CHANNELS).doc(chId).get().then(function(cs){ if (cs.exists){ channelData = cs.data() || {}; channelData.id = cs.id; } }).catch(function(){})
        : Promise.resolve();

      var sibPromise = chId
        ? db.collection(STREAMS).where('channelId', '==', chId).limit(50).get().then(function(snap){
            channelQueue = [];
            siblingStreams = [];
            snap.forEach(function(s){
              var d = s.data() || {};
              d.id = s.id;
              channelQueue.push(d);
              if (s.id !== streamId) siblingStreams.push(d);
            });
            channelQueue.sort(function(a, b){ return streamStartMs(a) - streamStartMs(b); });
            siblingStreams.sort(function(a, b){
              var rank = { live:0, upcoming:1, replay:2, ended:3 };
              return (rank[computeStreamPhase(a)] || 4) - (rank[computeStreamPhase(b)] || 4);
            });
          }).catch(function(){})
        : Promise.resolve();

      Promise.all([chPromise, sibPromise, partnerPromise]).then(function(){
        currentPhase = computePhase();
        nextSlotStream = findNextSlotInChannel();
        renderPage();
      });
    })
    .catch(function(err){
      console.error('[load]', err);
      renderError('Could not load', err.message || 'Please try again.');
    });
}

document.addEventListener('DOMContentLoaded', function(){
  refreshIcons();
  $('signInBtn').addEventListener('click', function(){ window.location.href = 'index.html#signin'; });
  $('userChip').addEventListener('click', function(){
    if (!currentUser) return;
    if (confirm('Sign out of ' + (currentUser.email || 'your account') + '?')){
      auth.signOut().then(function(){ toast('Signed out.', 'success'); });
    }
  });
  auth.onAuthStateChanged(function(user){ applyAuth(user); });
  load();
});

window.addEventListener('beforeunload', function(){
  if (countdownTimer) clearInterval(countdownTimer);
  if (phaseTickTimer) clearInterval(phaseTickTimer);
  if (progressTickTimer) clearInterval(progressTickTimer);
  if (autoplayRetryTimer) clearInterval(autoplayRetryTimer);
  if (liveCheckTimer) clearInterval(liveCheckTimer);
  if (controlsHideTimer) clearTimeout(controlsHideTimer);
  if (gapAdTimer) clearTimeout(gapAdTimer);
  if (gapAdRetryTimer) clearTimeout(gapAdRetryTimer);
  if (slotEndTimer) clearTimeout(slotEndTimer);
  if (upNextTimer) clearInterval(upNextTimer);
  if (idleCheckTimer) clearInterval(idleCheckTimer);
  if (upNextState.timer) clearInterval(upNextState.timer);
  clearTimeout(adState.midrollTimerId);
  try { clearAdTimers(); } catch(e){}
});
})();
</script>
