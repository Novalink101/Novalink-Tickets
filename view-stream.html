<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f14" />
<title>Stream · Novalink</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --cy:#00FFFF;--cy2:#00CCCC;--cy3:#009999;--cyf:#e6ffff;
  --bg:#f6f8fb;--sf:#ffffff;--sf2:#f1f4f8;
  --bd:#e4e9f0;--bd2:#d3dbe5;
  --tx:#0a0f14;--tx2:#2b3644;--mut:#6b7787;
  --rd:14px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --dg:#dc2626;--dgf:#fef2f2;--sv:#059669;--svf:#ecfdf5;--nv:#1e2f4d;
  --ink:#0a0f14;
  --ease:cubic-bezier(0.25,0.8,0.25,1);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.container{max-width:1480px;margin:0 auto;padding:0 20px;width:100%}
h1,h2,h3{line-height:1.15;font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;font-family:inherit;cursor:pointer;touch-action:manipulation}

.site-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 0;position:sticky;top:0;z-index:40}
.hdr{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:11px;flex-shrink:0;color:var(--nv)}
.logo svg{width:26px;height:32px;display:block}
.logo b{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.hdr-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-size:12.5px;font-weight:800;transition:.15s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--cy);background:#fff;box-shadow:0 0 0 3px rgba(0,255,255,.14)}
.hdr-btn i{width:14px;height:14px}
.hdr-btn .avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;font-family:var(--mono)}
@media (max-width:520px){.hdr-btn .lbl{display:none}}

.ch-hero-crumb{background:#0a0f14;color:#fff;padding:20px 0 22px;position:relative;overflow:hidden}
.ch-hero-crumb::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:20px 20px;pointer-events:none}
.ch-hero-crumb-in{max-width:1480px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.ch-hero-crumb .crumb{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px}
.ch-hero-crumb .crumb:hover{color:var(--cy)}
.ch-hero-crumb .crumb i{width:13px;height:13px}
.ch-hero-crumb h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;letter-spacing:-.02em;line-height:1.15;color:#fff;margin-bottom:6px;word-break:break-word}
.ch-hero-crumb .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.7);font-weight:500}
.ch-hero-crumb .meta span{display:inline-flex;align-items:center;gap:6px}
.ch-hero-crumb .meta i{width:13px;height:13px;color:var(--cy);flex-shrink:0}
.ch-hero-crumb .live-pill{background:#dc2626;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;text-transform:uppercase}
.ch-hero-crumb .live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}

main{flex:1;max-width:1480px;margin:0 auto;width:100%;padding:22px 20px 64px}
@media (max-width:560px){main{padding:14px 14px 44px}}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1024px){.layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rd);padding:18px;box-shadow:0 6px 20px rgba(10,15,20,.04)}
.card + .card{margin-top:14px}
.card-title{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--cy3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title i{width:14px;height:14px}
@media (max-width:560px){.card{padding:14px}}

/* PLAYER */
.nl-player-wrap{background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 16px 48px -12px rgba(10,15,20,.35);position:relative;}
.nl-player{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
.nl-player iframe,.nl-player #ytPlayer,.nl-player #ytPlayerHost iframe{position:absolute!important;inset:0;width:100%!important;height:100%!important;border:0;z-index:1!important;background:#000;}
#ytPlayerHost{position:absolute;inset:0;z-index:1;}

.nl-player-topbar,.nl-player-bottombar,.nl-cd-pill,.nl-progress-wrap,.nl-buffering{transition:opacity .4s ease, transform .4s ease;}
.nl-player.hide-controls .nl-player-topbar{opacity:0;transform:translateY(-8px);pointer-events:none;}
.nl-player.hide-controls .nl-player-bottombar{opacity:0;transform:translateY(8px);pointer-events:none;}
.nl-player.hide-controls .nl-cd-pill{opacity:0;pointer-events:none;}
.nl-player.hide-controls .nl-progress-wrap{opacity:0;transform:translateY(8px);pointer-events:none;}
.nl-player.hide-cursor{cursor:none;}

/* Double-tap ripple zones */
.nl-tap-zone{position:absolute;top:0;bottom:0;width:40%;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.nl-tap-zone.left{left:0;justify-content:flex-start;padding-left:8%;}
.nl-tap-zone.right{right:0;justify-content:flex-end;padding-right:8%;}
.nl-tap-ripple{
  width:100px;height:100px;border-radius:50%;
  background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;backdrop-filter:blur(10px);
  opacity:0;transform:scale(.5);
  transition:opacity .35s ease, transform .35s cubic-bezier(0.175,0.885,0.32,1.275);
  pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.nl-tap-ripple.show{opacity:1;transform:scale(1);}
.nl-tap-ripple i{width:28px;height:28px;margin-bottom:2px;}
.nl-tap-ripple span{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;}

.nl-cd-pill{position:absolute;top:12px;right:12px;z-index:6;display:none;align-items:center;gap:8px;padding:7px 12px;background:rgba(10,15,20,.88);border:1px solid rgba(0,255,255,.4);border-radius:99px;color:#fff;font-family:var(--mono);font-size:11.5px;font-weight:900;letter-spacing:.04em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.4);}
.nl-cd-pill.show{display:inline-flex}
.nl-cd-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:pulse 1.5s infinite;}
.nl-cd-pill .lbl{font-family:var(--font);font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);opacity:.85;}
@media (max-width:520px){.nl-cd-pill{top:8px;right:8px;padding:5px 9px;font-size:10.5px;gap:6px;}.nl-cd-pill .lbl{font-size:8.5px}}

.nl-player-topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);pointer-events:none;}
.nl-player-topbar .left{display:flex;align-items:center;gap:8px;min-width:0}
.nl-player-topbar .live-tag{background:#dc2626;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:4px 9px;border-radius:5px;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;pointer-events:none;}
.nl-player-topbar .live-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
.nl-player-topbar .ch-pill{background:rgba(10,15,20,.7);border:1px solid rgba(0,255,255,.35);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;pointer-events:none;}
.nl-player-topbar .wm{display:inline-flex;align-items:center;gap:6px;text-shadow:0 2px 8px rgba(0,0,0,.85);pointer-events:none;opacity:.85;}
.nl-player-topbar .wm svg{width:15px;height:19px;flex-shrink:0;display:block}
.nl-player-topbar .wm span{font-weight:900;font-size:11px;letter-spacing:.12em;color:#fff;text-transform:uppercase}

.nl-buffering{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;display:none;pointer-events:none;}
.nl-buffering.show{display:block;}
.nl-buffering .ring{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--cy);animation:spinnerRing .9s linear infinite;}
@keyframes spinnerRing{to{transform:rotate(360deg)}}

/* Progress bar */
.nl-progress-wrap{
  position:absolute;bottom:0;left:0;right:0;z-index:6;
  padding:14px 14px 8px;
  background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 100%);
  pointer-events:auto;
}
.nl-progress{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.25);cursor:pointer;transition:height .15s ease;}
.nl-progress:hover{height:6px;}
.nl-progress.dragging{height:6px;}
.nl-progress-loaded{position:absolute;top:0;left:0;bottom:0;border-radius:2px;background:rgba(255,255,255,.4);pointer-events:none;}
.nl-progress-played{position:absolute;top:0;left:0;bottom:0;border-radius:2px;background:var(--cy);pointer-events:none;}
.nl-progress-played.behind{background:#fbbf24;}
.nl-progress-handle{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;background:var(--cy);border:2px solid #04161c;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:opacity .15s ease, transform .15s ease;opacity:0;}
.nl-progress:hover .nl-progress-handle,.nl-progress.dragging .nl-progress-handle{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
.nl-progress-hover{position:absolute;bottom:10px;left:0;font-family:var(--mono);font-size:11px;font-weight:800;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.85);color:#fff;transform:translateX(-50%);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s ease;}
.nl-progress:hover .nl-progress-hover,.nl-progress.dragging .nl-progress-hover{opacity:1;}

.nl-progress-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px;}
.nl-progress-left{display:flex;align-items:center;gap:8px;min-width:0;}
.nl-progress-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nl-time{font-family:var(--mono);font-size:11.5px;font-weight:800;color:#fff;letter-spacing:.03em;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.nl-time-sep{color:rgba(255,255,255,.5);font-size:11.5px;font-weight:700;}

.nl-live-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:none;cursor:pointer;font-family:inherit;transition:.15s ease;white-space:nowrap;}
.nl-live-pill.live{background:#dc2626;color:#fff;}
.nl-live-pill.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite;}
.nl-live-pill.behind{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);}
.nl-live-pill.behind:hover{background:rgba(220,38,38,.85);border-color:#dc2626;}
.nl-live-pill:disabled{opacity:.5;cursor:not-allowed;}

.nl-player-bottombar{position:absolute;bottom:44px;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px;pointer-events:none;}
.nl-player-bottombar .controls{display:flex;gap:6px;align-items:center;pointer-events:auto;flex-wrap:wrap}
.nl-ctrl{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;transition:.15s;backdrop-filter:blur(6px);flex-shrink:0;font-size:11px;font-weight:900;letter-spacing:-1px;}
.nl-ctrl:hover{background:var(--cy);color:#04161c;border-color:var(--cy);transform:scale(1.08)}
.nl-ctrl:active{transform:scale(.95)}
.nl-ctrl i{width:16px;height:16px}
.nl-ctrl.jump-live{width:auto;padding:0 14px;border-radius:99px;font-size:11.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#04161c;background:linear-gradient(135deg,var(--cy),var(--cy2));border-color:var(--cy);display:none;align-items:center;gap:6px;height:36px;}
.nl-ctrl.jump-live.show{display:inline-flex}
.nl-ctrl.jump-live::before{content:'';width:7px;height:7px;border-radius:50%;background:#04161c;animation:pulse 1.2s infinite;}
.nl-ctrl.jump-live:hover{background:linear-gradient(135deg,#fff,#cffafe);transform:translateY(-1px);}
.nl-player-bottombar .right{display:flex;gap:6px;align-items:center;pointer-events:auto}
@media (max-width:520px){
  .nl-player-bottombar{bottom:38px;padding:4px 10px;}
  .nl-ctrl{width:32px;height:32px;}
  .nl-ctrl i{width:14px;height:14px;}
  .nl-ctrl.jump-live{height:32px;padding:0 10px;font-size:10.5px;}
  .nl-progress-wrap{padding:10px 10px 6px;}
  .nl-time,.nl-time-sep{font-size:10.5px;}
}

/* BRANDED CURTAIN */
.nl-curtain{
  position:absolute;inset:0;z-index:5;
  background:
    radial-gradient(circle at 78% 30%, rgba(0,255,255,.12), transparent 55%),
    radial-gradient(circle at 22% 82%, rgba(0,255,255,.06), transparent 45%),
    linear-gradient(160deg,#0a0f14 0%,#0f172a 45%,#0a0f14 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:32px 24px;color:#fff;overflow:hidden;
}
.nl-curtain.show{display:flex}
.nl-curtain::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.04) 1px, transparent 0);background-size:24px 24px;pointer-events:none;}
.nl-curtain .nc-logo{width:80px;height:100px;display:block;animation:ncFloat 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 28px rgba(0,255,255,.4));position:relative;z-index:1;}
@keyframes ncFloat{0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 8px 28px rgba(0,255,255,.4));}50%{transform:translateY(-6px) scale(1.04);filter:drop-shadow(0 12px 34px rgba(0,255,255,.6));}}
.nl-curtain .nc-brand{font-weight:900;font-size:13px;letter-spacing:.32em;color:var(--cy);text-transform:uppercase;position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,255,255,.4);}
.nl-curtain .nc-title{font-size:clamp(1.05rem,2.4vw,1.35rem);font-weight:900;color:#fff;margin-top:4px;position:relative;z-index:1;}
.nl-curtain .nc-sub{font-size:13px;color:rgba(255,255,255,.6);max-width:380px;line-height:1.55;position:relative;z-index:1;}
.nl-curtain .nc-progress{width:180px;height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative;z-index:1;margin-top:6px;}
.nl-curtain .nc-progress > i{display:block;height:100%;background:linear-gradient(90deg,transparent,var(--cy),transparent);animation:ncSlide 1.6s ease-in-out infinite;}
@keyframes ncSlide{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.nl-curtain .nc-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;background:rgba(0,255,255,.1);border:1px solid rgba(0,255,255,.35);font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);position:relative;z-index:1;}
.nl-curtain .nc-badge i{width:12px;height:12px;}

.nl-curtain .nc-countdown{display:flex;gap:12px;justify-content:center;margin:8px 0 4px;position:relative;z-index:1;flex-wrap:wrap;}
.nl-curtain .nc-cd-unit{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px;padding:14px 10px;background:rgba(0,255,255,.06);border:1px solid rgba(0,255,255,.3);border-radius:14px;box-shadow:0 8px 24px rgba(0,255,255,.08);}
.nl-curtain .nc-cd-unit strong{font-family:var(--mono);font-size:clamp(1.8rem,5vw,2.6rem);font-weight:900;color:#fff;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 4px 18px rgba(0,255,255,.45);}
.nl-curtain .nc-cd-unit small{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.55);text-transform:uppercase;}
.nl-curtain .nc-cd-date{font-size:12.5px;color:rgba(255,255,255,.7);font-weight:600;position:relative;z-index:1;margin-top:2px;}
.nl-curtain .nc-cd-date strong{color:#fff;font-weight:800;}
@media (max-width:520px){
  .nl-curtain .nc-cd-unit{min-width:58px;padding:10px 6px;border-radius:10px}
  .nl-curtain .nc-countdown{gap:6px}
  .nl-curtain .nc-logo{width:64px;height:80px}
}

/* Up Next transition screen */
.nl-upnext{
  position:absolute;inset:0;z-index:22;
  background:
    radial-gradient(circle at 78% 30%, rgba(0,255,255,.16), transparent 55%),
    radial-gradient(circle at 22% 82%, rgba(0,255,255,.08), transparent 45%),
    linear-gradient(160deg,#0a0f14 0%,#0f172a 45%,#0a0f14 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:28px 24px;color:#fff;overflow:hidden;
}
.nl-upnext.show{display:flex}
.nl-upnext::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.04) 1px, transparent 0);background-size:24px 24px;pointer-events:none;}
.nl-upnext .un-logo{width:60px;height:74px;display:block;filter:drop-shadow(0 6px 20px rgba(0,255,255,.35));position:relative;z-index:1;}
.nl-upnext .un-brand{font-weight:900;font-size:11.5px;letter-spacing:.3em;color:var(--cy);text-transform:uppercase;position:relative;z-index:1;}
.nl-upnext .un-label{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);position:relative;z-index:1;margin-top:2px;}
.nl-upnext .un-title{font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:900;color:#fff;position:relative;z-index:1;max-width:90%;word-break:break-word;}
.nl-upnext .un-meta{font-size:12.5px;color:rgba(255,255,255,.6);position:relative;z-index:1;}
.nl-upnext .un-ring{
  width:96px;height:96px;border-radius:50%;
  border:3px solid rgba(0,255,255,.15);
  border-top-color:var(--cy);
  animation:spinnerRing 1s linear infinite;
  position:relative;z-index:1;margin:6px 0;
  display:flex;align-items:center;justify-content:center;
}
.nl-upnext .un-ring .num{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:34px;font-weight:900;color:#fff;
  text-shadow:0 2px 10px rgba(0,255,255,.5);
  animation:none;
}
.nl-upnext .un-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;margin-top:6px;}
.nl-upnext .un-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:11px 20px;border-radius:12px;
  font-weight:900;font-size:13px;letter-spacing:.03em;
  border:1px solid transparent;cursor:pointer;

.nl-offline{position:absolute;inset:0;z-index:25;background:linear-gradient(160deg,#0a0f14 0%,#111827 50%,#0a0f14 100%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:32px 24px;color:#fff;}

.nl-offline .off-ico{width:72px;height:72px;border-radius:50%;background:rgba(220,38,38,.15);border:2px solid rgba(220,38,38,.5);display:flex;align-items:center;justify-content:center;color:#fca5a5;position:relative;}

.nl-queue-banner{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);z-index:16;display:none;align-items:center;gap:12px;padding:10px 18px;border-radius:99px;background:rgba(10,15,20,.92);border:1px solid rgba(0,255,255,.4);box-shadow:0 12px 30px rgba(0,0,0,.5);backdrop-filter:blur(12px);color:#fff;max-width:calc(100% - 40px);}

function formatDate(dateStr, timeStr){
  if (!dateStr) return 'Date TBA';
  try {
    var d = new Date(dateStr + 'T' + (timeStr || '00:00'));
    if (isNaN(d.getTime())) return dateStr;
    var opts = { weekday:'short', day:'numeric', month:'short', year:'numeric' };
    var out = d.toLocaleDateString('en-ZA', opts);
    if (timeStr) out += ' · ' + timeStr;
    return out;
  } catch(e){ return dateStr; }
}

function formatDurationShort(ms){
  if (ms < 0) ms = 0;
  var s = Math.floor(ms / 1000);
  var d = Math.floor(s / 86400);
  var h = Math.floor((s % 86400) / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + sec + 's';
  return sec + 's';
}

function formatTime(seconds){
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  var s = Math.floor(seconds);
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  return m + ':' + String(sec).padStart(2,'0');
}

function detectPlatformFromUrl(url){
  if (!url) return 'custom';
  var u = String(url).toLowerCase().trim();
  if (u.indexOf('youtube.com') !== -1 || u.indexOf('youtu.be') !== -1) return 'youtube';
  if (u.indexOf('twitch.tv') !== -1) return 'twitch';
  if (u.indexOf('vimeo.com') !== -1) return 'vimeo';
  if (u.indexOf('facebook.com') !== -1 || u.indexOf('fb.watch') !== -1) return 'facebook';
  if (u.indexOf('kick.com') !== -1) return 'kick';
  if (u.indexOf('rumble.com') !== -1) return 'rumble';
  if (u.indexOf('dailymotion.com') !== -1 || u.indexOf('dai.ly') !== -1) return 'dailymotion';
  if (u.indexOf('odysee.com') !== -1) return 'odysee';
  if (u.indexOf('bitchute.com') !== -1) return 'bitchute';
  if (u.indexOf('nicovideo.jp') !== -1) return 'nicovideo';
  if (u.indexOf('streamyard.com') !== -1) return 'streamyard';
  if (u.indexOf('restream.io') !== -1) return 'restream';
  if (u.indexOf('zoom.us') !== -1) return 'zoom';
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(u)) return 'video-file';
  if (u.indexOf('.m3u8') !== -1) return 'native-hls';
  if (u.indexOf('.mpd') !== -1) return 'native-dash';
  if (u.indexOf('.ts') !== -1) return 'native-mpegts';
  return 'custom';
}

function extractYouTubeId(input){
  if (!input) return null;
  var u = String(input).trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  u = u.replace(/\s+/g, '');
  var patterns = [
    /(?:youtube\.com\/watch\?(?:.*&)?v=)([A-Za-z0-9_-]{11})/,
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/live\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/v\/)([A-Za-z0-9_-]{11})/,
    /(?:[?&]v=)([A-Za-z0-9_-]{11})/
  ];
  for (var i = 0; i < patterns.length; i++){
    var m = u.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  var m2 = u.match(/([A-Za-z0-9_-]{11})/);
  if (m2 && m2[1]) return m2[1];
  return null;
}

/* ══════════════════════════════════════════════════════════════
   URL RESOLVER
   ══════════════════════════════════════════════════════════════ */
function resolveStreamUrl(streamDoc){
  var partnerId = streamDoc.partnerId || streamDoc.partnerChannelId;
  if (partnerId){
    return db.collection(LIVE_PARTNERS).doc(partnerId).get()
      .then(function(snap){
        if (!snap.exists) throw new Error('Partner channel not found.');
        var p = snap.data() || {};
        if (p.enabled === false) throw new Error('This partner channel is currently disabled.');
        return {
          url: p.streamUrl || '',
          protocol: p.protocol || detectPlatformFromUrl(p.streamUrl || ''),
          source: 'partner',
          partnerId: partnerId,
          partnerName: p.name || '',
          partnerLogo: p.logoUrl || ''
        };
      });
  }

  if (streamDoc.isNative && streamDoc.hlsUrl){
    return Promise.resolve({ url: streamDoc.hlsUrl, protocol: 'hls', source: 'stream' });
  }

  var segs = getSegments();
  if (segs.length){
    var first = segs[0];
    var proto = 'hls';
    var p = first.platform;
    if (p === 'youtube') proto = 'youtube';
    else if (p === 'twitch' || p === 'vimeo' || p === 'facebook' || p === 'kick' || p === 'rumble' || p === 'dailymotion' || p === 'odysee' || p === 'bitchute' || p === 'nicovideo' || p === 'streamyard' || p === 'restream' || p === 'zoom') proto = 'iframe';
    else if (p === 'native-dash') proto = 'dash';
    else if (p === 'native-mpegts') proto = 'mpegts';
    else if (p === 'native-hls') proto = 'hls';
    else if (p === 'video-file') proto = 'file';
    return Promise.resolve({ url: first.url, protocol: proto, source: 'stream' });
  }

  return Promise.resolve({ url: '', protocol: 'custom', source: 'stream' });
}

/* ══════════════════════════════════════════════════════════════
   SEGMENTS
   ══════════════════════════════════════════════════════════════ */
function getSegments(){
  if (!streamData) return [];

  if (streamData.isNative && streamData.hlsUrl) {
    var ds = streamData.startDate || '';
    var ts = streamData.startTime || '00:00';
    var dur = parseInt(streamData.durationMinutes, 10) || 120;
    var st = new Date(ds + 'T' + ts + ':00').getTime();
    if (isNaN(st)) st = Date.now();
    return [{
      url: streamData.hlsUrl, startTime: ts, endTime: '23:59',
      startMs: st, endMs: st + dur * 60000, platform: 'native-hls'
    }];
  }

  if (Array.isArray(streamData.segments) && streamData.segments.length){
    var dateStr = streamData.startDate || '';
    return streamData.segments.map(function(s){
      var startMs = new Date(dateStr + 'T' + (s.startTime || '00:00') + ':00').getTime();
      var endMs = new Date(dateStr + 'T' + (s.endTime || '23:59') + ':00').getTime();
      if (endMs <= startMs) endMs += 86400000;
      return {
        url: s.url || '', startTime: s.startTime, endTime: s.endTime,
        startMs: startMs, endMs: endMs, platform: detectPlatformFromUrl(s.url || '')
      };
    }).filter(function(s){ return !isNaN(s.startMs) && !isNaN(s.endMs); });
  }

  var ds2 = streamData.startDate || '';
  var ts2 = streamData.startTime || '00:00';
  var dur2 = parseInt(streamData.durationMinutes, 10) || 90;
  var st2 = new Date(ds2 + 'T' + ts2 + ':00').getTime();
  if (isNaN(st2)) return [];
  return [{
    url: streamData.streamUrl || '', startTime: ts2, endTime: '00:00',
    startMs: st2, endMs: st2 + dur2 * 60000,
    platform: detectPlatformFromUrl(streamData.streamUrl || '')
  }];
}

function getTiming(){
  var segs = getSegments();
  if (!segs.length) return { valid:false };
  var startMs = segs[0].startMs;
  var endMs = segs[segs.length - 1].endMs + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  return { valid:true, startMs:startMs, endMs:endMs, replayUntilMs:replayMs, segments: segs };
}

function computePhase(){
  var t = getTiming();
  if (!t.valid) return 'unknown';
  var now = Date.now();
  var segs = t.segments;
  if (now < segs[0].startMs) return 'upcoming';
  for (var i = 0; i < segs.length; i++){
    if (now >= segs[i].startMs && now <= segs[i].endMs) return 'live';
  }
  for (var j = 0; j < segs.length - 1; j++){
    if (now > segs[j].endMs && now < segs[j+1].startMs) return 'gap';
  }
  if (now <= t.replayUntilMs && streamData.replayEnabled !== false) return 'replay';
  return 'ended';
}

function getActiveSegment(){
  var segs = getSegments();
  var now = Date.now();
  for (var i = 0; i < segs.length; i++){
    if (now >= segs[i].startMs && now <= segs[i].endMs) return { seg: segs[i], index: i };
  }
  return null;
}

function getNextSegment(){
  var segs = getSegments();
  var now = Date.now();
  for (var i = 0; i < segs.length; i++){
    if (now < segs[i].startMs) return { seg: segs[i], index: i };
  }
  return null;
}

function computeStreamPhase(s){
  var dateStr = s.startDate || '';
  var timeStr = s.startTime || '00:00';
  var durMin = parseInt(s.durationMinutes, 10) || 90;
  if (!dateStr) return 'upcoming';
  var startMs = new Date(dateStr + 'T' + timeStr + ':00').getTime();
  if (isNaN(startMs)) return 'upcoming';
  var endMs = startMs + durMin * 60000 + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  var now = Date.now();
  if (now < startMs) return 'upcoming';
  if (now <= endMs) return 'live';
  if (now <= replayMs && s.replayEnabled !== false) return 'replay';
  return 'ended';
}

function streamStartMs(s){
  if (!s.startDate) return Infinity;
  var t = new Date(s.startDate + 'T' + (s.startTime || '00:00') + ':00').getTime();
  return isNaN(t) ? Infinity : t;
}

/* ══════════════════════════════════════════════════════════════
   AUTO-ADVANCE — find next slot in channel
   ══════════════════════════════════════════════════════════════ */
function findNextSlotInChannel(){
  if (!channelQueue.length) return null;
  var now = Date.now();
  var currentSlotEnd = streamEndMs(streamData);

  // Filter queue: not this stream, and starts AFTER the current stream's end time
  var candidates = channelQueue.filter(function(s){
    if (s.id === streamId) return false;
    var start = streamStartMs(s);
    if (!isFinite(start)) return false;
    return start >= (currentSlotEnd - 60000); // allow 1-min tolerance
  });

  if (!candidates.length) return null;

  // Sort by start time ascending
  candidates.sort(function(a, b){ return streamStartMs(a) - streamStartMs(b); });

  // Return the soonest one
  return candidates[0];
}

function streamEndMs(s){
  if (!s.startDate) return Infinity;
  var startMs = new Date(s.startDate + 'T' + (s.startTime || '00:00') + ':00').getTime();
  if (isNaN(startMs)) return Infinity;
  var dur = parseInt(s.durationMinutes, 10) || 90;
  return startMs + dur * 60000;
}

function renderSegmentsList(){
  var container = $('segmentsList');
  if (!container) return;
  var segs = getSegments();
  if (segs.length <= 1){ container.innerHTML = ''; return; }

  var now = Date.now();
  var html = '';
  segs.forEach(function(s, i){
    var cls = 'segment-item';
    var badge = '<span class="segment-badge done">Done</span>';
    if (now >= s.startMs && now <= s.endMs){ cls += ' active'; badge = '<span class="segment-badge now">Now</span>'; }
    else if (now < s.startMs){ cls += ' upcoming'; badge = '<span class="segment-badge next">Next</span>'; }
    else { cls += ' past'; }
    html +=
      '<div class="'+cls+'">' +
        '<div class="segment-num">' + (i+1) + '</div>' +
        '<div class="segment-info">' +
          '<div class="st">' + esc(platformLabel(s.platform)) + '</div>' +
          '<div class="sm">' + esc(s.startTime) + ' → ' + esc(s.endTime) + '</div>' +
        '</div>' +
        badge +
      '</div>';
  });
  container.innerHTML = html;
}

function renderOwnerControls(){
  var card = $('ownerCard');
  if (!card || !streamData) return;
  var canManage = isAdminUser && !streamData._isPartnerTest;
  card.style.display = canManage ? 'block' : 'none';
  if (!canManage) return;

  var edit = $('editStreamBtn');
  if (edit) edit.setAttribute('href', 'create-streams.html?id=' + encodeURIComponent(streamId));

  var del = $('deleteStreamBtn');
  if (del && !del._bound){
    del._bound = true;
    del.addEventListener('click', function(){
      if (!confirm('Delete this stream permanently?')) return;
      del.disabled = true;
      db.collection(STREAMS).doc(streamId).delete()
        .then(function(){
          toast('Stream deleted.', 'success');
          setTimeout(function(){ window.location.href = 'streams.html'; }, 800);
        })
        .catch(function(err){
          toast('Delete failed: ' + err.message, 'error', 5000);
          del.disabled = false;
        });
    });
  }
}

function renderSiblings(){
  var row = $('siblingsRow');
  if (!row || !siblingStreams.length) return;
  row.innerHTML = '';
  siblingStreams.forEach(function(s){
    var card = document.createElement('div');
    card.className = 'sibling-card';
    var st = computeStreamPhase(s);
    var badge = 'upcoming', label = 'Upcoming';
    if (st === 'live'){ badge = 'live'; label = 'Live'; }
    else if (st === 'replay'){ badge = 'replay'; label = 'Replay'; }
    else if (st === 'ended'){ badge = 'ended'; label = 'Ended'; }

    var title = s.streamTitle || s.eventName || 'Untitled Stream';
    var dateStr = formatDate(s.startDate, s.startTime);
    var thumbStyle = s.heroImage ? "background-image:url('"+esc(s.heroImage)+"');background-size:cover;background-position:center;" : '';

    card.innerHTML =
      '<div class="sibling-thumb" style="'+thumbStyle+'">' +
        '<span class="sibling-badge '+badge+'">'+esc(label)+'</span>' +
      '</div>' +
      '<div class="sibling-body">' +
        '<div class="sibling-title">'+esc(title)+'</div>' +
        '<div class="sibling-meta">'+icon('calendar')+' <span>'+esc(dateStr)+'</span></div>' +
      '</div>';

    card.addEventListener('click', function(){
      window.location.href = 'view-stream.html?id=' + encodeURIComponent(s.id);
    });
    row.appendChild(card);
  });
  refreshIcons();
}

function showCurtain(kind, title, sub){
  var c = $('curtain');
  if (!c) return;

  var logoHTML =
    '<svg class="nc-logo" viewBox="0 0 60 74" aria-hidden="true">' +
      '<path fill="#3a5a8c" d="M34.5 4.2c-8.1 0-14.7 6.6-14.7 14.7v3.4c0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9v-3.4c0-4.9 4-8.9 8.9-8.9 4.9 0 8.9 4 8.9 8.9 0 3-1.5 5.7-3.9 7.3-1.4.9-1.8 2.8-.9 4.2.9 1.4 2.8 1.8 4.2.9 4.3-2.7 6.9-7.4 6.9-12.4 0-8.1-6.6-14.7-14.7-14.7z"/>' +
      '<path fill="#00FFFF" d="M25.5 69.8c8.1 0 14.7-6.6 14.7-14.7v-3.4c0-1.6-1.3-2.9-2.9-2.9s-2.9 1.3-2.9 2.9v3.4c0 4.9-4 8.9-8.9 8.9-4.9 0-8.9-4-8.9-8.9 0-3 1.5-5.7 3.9-7.3 1.4-.9 1.8-2.8.9-4.2-.9-1.4-2.8-1.8-4.2-.9-4.3 2.7-6.9 7.4-6.9 12.4 0 8.1 6.6 14.7 14.7 14.7z"/>' +
    '</svg>';

  if (kind === 'countdown'){
    var nextSeg = getNextSegment();
    var targetMs = 0;
    var dateLabel = 'Starts soon';

    if (nextSeg){
      targetMs = nextSeg.seg.startMs;
      dateLabel = 'Segment ' + (nextSeg.index + 1) + ' starts ' + formatDate(streamData.startDate, nextSeg.seg.startTime);
    } else {
      var t = getTiming();
      if (t.valid) targetMs = t.startMs;
      var segs = getSegments();
      if (segs[0]) dateLabel = 'Starts ' + formatDate(streamData.startDate, segs[0].startTime);
    }

    c.innerHTML =
      logoHTML +
      '<span class="nc-badge">' + icon('clock') + ' Up next</span>' +
      '<div class="nc-brand">NOVALINK</div>' +
      '<div class="nc-title">' + esc(title || 'Stream starts in') + '</div>' +
      '<div class="nc-countdown">' +
        '<div class="nc-cd-unit"><strong id="ncDays">00</strong><small>Days</small></div>' +
        '<div class="nc-cd-unit"><strong id="ncHours">00</strong><small>Hours</small></div>' +
        '<div class="nc-cd-unit"><strong id="ncMins">00</strong><small>Min</small></div>' +
        '<div class="nc-cd-unit"><strong id="ncSecs">00</strong><small>Sec</small></div>' +
      '</div>' +
      '<div class="nc-cd-date">' + esc(dateLabel) + '</div>' +
      (sub ? '<div class="nc-sub">' + esc(sub) + '</div>' : '');

    c.dataset.targetMs = String(targetMs);
    c.classList.add('show');
    updateCurtainCountdown();
    refreshIcons();
    return;
  }

  var badgeHTML = '';
  if (kind === 'loading') badgeHTML = '<span class="nc-badge">' + icon('loader') + ' Loading stream</span>';
  else if (kind === 'queue') badgeHTML = '<span class="nc-badge">' + icon('megaphone') + ' Ads loading</span>';
  else if (kind === 'ended') badgeHTML = '<span class="nc-badge">' + icon('square') + ' Ended</span>';

  c.innerHTML =
    logoHTML +
    badgeHTML +
    '<div class="nc-brand">NOVALINK</div>' +
    '<div class="nc-title">' + esc(title || 'Loading…') + '</div>' +
    '<div class="nc-sub">' + esc(sub || '') + '</div>' +
    '<div class="nc-progress"><i></i></div>';

  c.classList.add('show');
  refreshIcons();
}

function hideCurtain(){
  var c = $('curtain');
  if (c) c.classList.remove('show');
}

function updateCurtainCountdown(){
  var c = $('curtain');
  if (!c || !c.classList.contains('show')) return;
  var targetMs = parseInt(c.dataset.targetMs || '0', 10);
  if (!targetMs) return;

  var diff = targetMs - Date.now();
  if (diff < 0) diff = 0;
  var s = Math.floor(diff / 1000);
  var d = Math.floor(s / 86400);
  var h = Math.floor((s % 86400) / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;

  var dEl = $('ncDays'), hEl = $('ncHours'), mEl = $('ncMins'), sEl = $('ncSecs');
  if (dEl) dEl.textContent = String(d).padStart(2,'0');
  if (hEl) hEl.textContent = String(h).padStart(2,'0');
  if (mEl) mEl.textContent = String(m).padStart(2,'0');
  if (sEl) sEl.textContent = String(sec).padStart(2,'0');
}

function showCountdownCurtain(){
  var nextSeg = getNextSegment();
  var titleText = nextSeg ? ('Segment ' + (nextSeg.index + 1) + ' starts in') : 'Stream starts in';
  showCurtain('countdown', titleText, '');
}

/* ══════════════════════════════════════════════════════════════
   UP NEXT OVERLAY
   ══════════════════════════════════════════════════════════════ */
var upNextState = { targetStream: null, countdown: 5, timer: null };

function showUpNext(stream){
  upNextState.targetStream = stream;
  upNextState.countdown = 5;

  var overlay = $('upNextOverlay');
  var titleEl = $('unTitle');
  var metaEl = $('unMeta');
  var countEl = $('unCount');

  if (!overlay) return;

  if (titleEl) titleEl.textContent = stream.streamTitle || stream.eventName || 'Next stream';
  if (metaEl){
    var startMs = streamStartMs(stream);
    var diff = startMs - Date.now();
    if (diff <= 0) metaEl.textContent = 'Starting now';
    else metaEl.textContent = 'Starts in ' + formatDurationShort(diff);
  }
  if (countEl) countEl.textContent = String(upNextState.countdown);
  overlay.classList.add('show');

  clearInterval(upNextState.timer);
  upNextState.timer = setInterval(function(){
    upNextState.countdown--;
    if (countEl) countEl.textContent = String(Math.max(0, upNextState.countdown));
    if (upNextState.countdown <= 0){
      clearInterval(upNextState.timer);
      goToNextSlot();
    }
  }, 1000);

  refreshIcons();
}

function hideUpNext(){
  var overlay = $('upNextOverlay');
  if (overlay) overlay.classList.remove('show');
  clearInterval(upNextState.timer);
}

function goToNextSlot(){
  if (!upNextState.targetStream) return;
  window.location.href = 'view-stream.html?id=' + encodeURIComponent(upNextState.targetStream.id);
}

function wireUpNextControls(){
  var skipNow = $('unSkipNow');
  var cancel = $('unCancel');
  if (skipNow) skipNow.addEventListener('click', goToNextSlot);
  if (cancel) cancel.addEventListener('click', function(){
    hideUpNext();
    toast('Staying on ads until next stream', 'info', 2200);
  });
}
