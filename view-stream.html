<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f14" />
<title>Stream · Novalink</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<!-- NEW: HLS.js for Native HLS Streams -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --cy:#00FFFF;--cy2:#00CCCC;--cy3:#009999;--cyf:#e6ffff;
  --bg:#f6f8fb;--sf:#ffffff;--sf2:#f1f4f8;
  --bd:#e4e9f0;--bd2:#d3dbe5;
  --tx:#0a0f14;--tx2:#2b3644;--mut:#6b7787;
  --rd:14px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --dg:#dc2626;--dgf:#fef2f2;--sv:#059669;--svf:#ecfdf5;--nv:#1e2f4d;
  --ink:#0a0f14;
  --ease:cubic-bezier(0.25,0.8,0.25,1);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.container{max-width:1480px;margin:0 auto;padding:0 20px;width:100%}
h1,h2,h3{line-height:1.15;font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;font-family:inherit;cursor:pointer;touch-action:manipulation}

.site-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 0;position:sticky;top:0;z-index:40}
.hdr{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:11px;flex-shrink:0;color:var(--nv)}
.logo svg{width:26px;height:32px;display:block}
.logo b{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.hdr-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-size:12.5px;font-weight:800;transition:.15s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--cy);background:#fff;box-shadow:0 0 0 3px rgba(0,255,255,.14)}
.hdr-btn i{width:14px;height:14px}
.hdr-btn .avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;font-family:var(--mono)}
@media (max-width:520px){.hdr-btn .lbl{display:none}}

.ch-hero-crumb{background:#0a0f14;color:#fff;padding:20px 0 22px;position:relative;overflow:hidden}
.ch-hero-crumb::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:20px 20px;pointer-events:none}
.ch-hero-crumb-in{max-width:1480px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.ch-hero-crumb .crumb{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px}
.ch-hero-crumb .crumb:hover{color:var(--cy)}
.ch-hero-crumb .crumb i{width:13px;height:13px}
.ch-hero-crumb h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;letter-spacing:-.02em;line-height:1.15;color:#fff;margin-bottom:6px;word-break:break-word}
.ch-hero-crumb .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.7);font-weight:500}
.ch-hero-crumb .meta span{display:inline-flex;align-items:center;gap:6px}
.ch-hero-crumb .meta i{width:13px;height:13px;color:var(--cy);flex-shrink:0}
.ch-hero-crumb .live-pill{background:#dc2626;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;text-transform:uppercase}
.ch-hero-crumb .live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}

main{flex:1;max-width:1480px;margin:0 auto;width:100%;padding:22px 20px 64px}
@media (max-width:560px){main{padding:14px 14px 44px}}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1024px){.layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rd);padding:18px;box-shadow:0 6px 20px rgba(10,15,20,.04)}
.card + .card{margin-top:14px}
.card-title{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--cy3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title i{width:14px;height:14px}
@media (max-width:560px){.card{padding:14px}}

/* PLAYER */
.nl-player-wrap{background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 16px 48px -12px rgba(10,15,20,.35);position:relative;}
.nl-player{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;}
.nl-player iframe,.nl-player #ytPlayer,.nl-player #ytPlayerHost iframe{position:absolute!important;inset:0;width:100%!important;height:100%!important;border:0;z-index:1!important;background:#000;}
#ytPlayerHost{position:absolute;inset:0;z-index:1;}

.nl-player-topbar,.nl-player-bottombar,.nl-cd-pill{transition:opacity .4s ease, transform .4s ease;}
.nl-player.hide-controls .nl-player-topbar{opacity:0;transform:translateY(-8px);pointer-events:none;}
.nl-player.hide-controls .nl-player-bottombar{opacity:0;transform:translateY(8px);pointer-events:none;}
.nl-player.hide-controls .nl-cd-pill{opacity:0;pointer-events:none;}
.nl-player.hide-cursor{cursor:none;}

.nl-cd-pill{position:absolute;top:12px;right:12px;z-index:6;display:none;align-items:center;gap:8px;padding:7px 12px;background:rgba(10,15,20,.88);border:1px solid rgba(0,255,255,.4);border-radius:99px;color:#fff;font-family:var(--mono);font-size:11.5px;font-weight:900;letter-spacing:.04em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.4);}
.nl-cd-pill.show{display:inline-flex}
.nl-cd-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:pulse 1.5s infinite;}
.nl-cd-pill .lbl{font-family:var(--font);font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);opacity:.85;}
@media (max-width:520px){.nl-cd-pill{top:8px;right:8px;padding:5px 9px;font-size:10.5px;gap:6px;}.nl-cd-pill .lbl{font-size:8.5px}}

.nl-player-topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);pointer-events:none;}
.nl-player-topbar .left{display:flex;align-items:center;gap:8px;min-width:0}
.nl-player-topbar .live-tag{background:#dc2626;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:4px 9px;border-radius:5px;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;pointer-events:none;}
.nl-player-topbar .live-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
.nl-player-topbar .ch-pill{background:rgba(10,15,20,.7);border:1px solid rgba(0,255,255,.35);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;pointer-events:none;}
.nl-player-topbar .wm{display:inline-flex;align-items:center;gap:6px;text-shadow:0 2px 8px rgba(0,0,0,.85);pointer-events:none;opacity:.85;}
.nl-player-topbar .wm svg{width:15px;height:19px;flex-shrink:0;display:block}
.nl-player-topbar .wm span{font-weight:900;font-size:11px;letter-spacing:.12em;color:#fff;text-transform:uppercase}

.nl-player-bottombar{position:absolute;bottom:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,0) 100%);pointer-events:none;}
.nl-player-bottombar .controls{display:flex;gap:6px;align-items:center;pointer-events:auto;flex-wrap:wrap}
.nl-ctrl{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;transition:.15s;backdrop-filter:blur(6px);flex-shrink:0;font-size:11px;font-weight:900;letter-spacing:-1px;}
.nl-ctrl:hover{background:var(--cy);color:#04161c;border-color:var(--cy);transform:scale(1.08)}
.nl-ctrl:active{transform:scale(.95)}
.nl-ctrl i{width:16px;height:16px}
.nl-ctrl.seek{font-family:var(--mono);font-size:13px;letter-spacing:-2px;padding-right:2px;}
.nl-ctrl.jump-live{width:auto;padding:0 14px;border-radius:99px;font-size:11.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#04161c;background:linear-gradient(135deg,var(--cy),var(--cy2));border-color:var(--cy);display:none;align-items:center;gap:6px;height:36px;}
.nl-ctrl.jump-live.show{display:inline-flex}
.nl-ctrl.jump-live::before{content:'';width:7px;height:7px;border-radius:50%;background:#04161c;animation:pulse 1.2s infinite;}
.nl-ctrl.jump-live:hover{background:linear-gradient(135deg,#fff,#cffafe);transform:translateY(-1px);}
.nl-player-bottombar .right{display:flex;gap:6px;align-items:center;pointer-events:auto}

/* BRANDED CURTAIN — z-index 5 (below ads at 15) */
.nl-curtain{
  position:absolute;inset:0;z-index:5;
  background:
    radial-gradient(circle at 78% 30%, rgba(0,255,255,.12), transparent 55%),
    radial-gradient(circle at 22% 82%, rgba(0,255,255,.06), transparent 45%),
    linear-gradient(160deg,#0a0f14 0%,#0f172a 45%,#0a0f14 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:32px 24px;color:#fff;overflow:hidden;
}
.nl-curtain.show{display:flex}
.nl-curtain::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.04) 1px, transparent 0);background-size:24px 24px;pointer-events:none;}
.nl-curtain .nc-logo{width:80px;height:100px;display:block;animation:ncFloat 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 28px rgba(0,255,255,.4));position:relative;z-index:1;}
@keyframes ncFloat{0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 8px 28px rgba(0,255,255,.4));}50%{transform:translateY(-6px) scale(1.04);filter:drop-shadow(0 12px 34px rgba(0,255,255,.6));}}
.nl-curtain .nc-brand{font-weight:900;font-size:13px;letter-spacing:.32em;color:var(--cy);text-transform:uppercase;position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,255,255,.4);}
.nl-curtain .nc-title{font-size:clamp(1.05rem,2.4vw,1.35rem);font-weight:900;color:#fff;margin-top:4px;position:relative;z-index:1;}
.nl-curtain .nc-sub{font-size:13px;color:rgba(255,255,255,.6);max-width:380px;line-height:1.55;position:relative;z-index:1;}
.nl-curtain .nc-progress{width:180px;height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative;z-index:1;margin-top:6px;}
.nl-curtain .nc-progress > i{display:block;height:100%;background:linear-gradient(90deg,transparent,var(--cy),transparent);animation:ncSlide 1.6s ease-in-out infinite;}
@keyframes ncSlide{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.nl-curtain .nc-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;background:rgba(0,255,255,.1);border:1px solid rgba(0,255,255,.35);font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);position:relative;z-index:1;}
.nl-curtain .nc-badge i{width:12px;height:12px;}

/* BIG COUNTDOWN IN CURTAIN */
.nl-curtain .nc-countdown{display:flex;gap:12px;justify-content:center;margin:8px 0 4px;position:relative;z-index:1;flex-wrap:wrap;}
.nl-curtain .nc-cd-unit{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px;padding:14px 10px;background:rgba(0,255,255,.06);border:1px solid rgba(0,255,255,.3);border-radius:14px;box-shadow:0 8px 24px rgba(0,255,255,.08);}
.nl-curtain .nc-cd-unit strong{font-family:var(--mono);font-size:clamp(1.8rem,5vw,2.6rem);font-weight:900;color:#fff;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 4px 18px rgba(0,255,255,.45);}
.nl-curtain .nc-cd-unit small{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.55);text-transform:uppercase;}
.nl-curtain .nc-cd-date{font-size:12.5px;color:rgba(255,255,255,.7);font-weight:600;position:relative;z-index:1;margin-top:2px;}
.nl-curtain .nc-cd-date strong{color:#fff;font-weight:800;}
@media (max-width:520px){
  .nl-curtain .nc-cd-unit{min-width:58px;padding:10px 6px;border-radius:10px}
  .nl-curtain .nc-countdown{gap:6px}
  .nl-curtain .nc-logo{width:64px;height:80px}
}

/* OFFLINE OVERLAY — z-index 25 (above ads) */
.nl-offline{position:absolute;inset:0;z-index:25;background:linear-gradient(160deg,#0a0f14 0%,#111827 50%,#0a0f14 100%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:32px 24px;color:#fff;}
.nl-offline.show{display:flex}
.nl-offline .off-ico{width:72px;height:72px;border-radius:50%;background:rgba(220,38,38,.15);border:2px solid rgba(220,38,38,.5);display:flex;align-items:center;justify-content:center;color:#fca5a5;position:relative;}
.nl-offline .off-ico::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(252,165,165,.35);animation:spinSlow 8s linear infinite;}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.nl-offline .off-ico i{width:32px;height:32px}
.nl-offline .off-title{font-size:clamp(1.05rem,2.4vw,1.4rem);font-weight:900;color:#fff;}
.nl-offline .off-sub{font-size:13px;color:rgba(255,255,255,.65);max-width:360px;line-height:1.55;}
.nl-offline .off-status{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:11.5px;font-weight:800;color:rgba(255,255,255,.85);letter-spacing:.04em;}
.nl-offline .off-status .pulse{width:7px;height:7px;border-radius:50%;background:#fca5a5;animation:pulse 1.2s infinite;}

/* QUEUE BANNER — z-index 16 (above ads) */
.nl-queue-banner{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:16;display:none;align-items:center;gap:12px;padding:10px 18px;border-radius:99px;background:rgba(10,15,20,.92);border:1px solid rgba(0,255,255,.4);box-shadow:0 12px 30px rgba(0,0,0,.5);backdrop-filter:blur(12px);color:#fff;max-width:calc(100% - 40px);}
.nl-queue-banner.show{display:inline-flex}
.nl-queue-banner .qb-dot{width:8px;height:8px;border-radius:50%;background:var(--cy);animation:pulse 1.2s infinite;flex-shrink:0;}
.nl-queue-banner .qb-lbl{font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);}
.nl-queue-banner .qb-title{font-size:12.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.nl-queue-banner .qb-time{font-family:var(--mono);font-size:12px;font-weight:900;color:#fff;background:rgba(0,255,255,.12);padding:3px 10px;border-radius:8px;flex-shrink:0;}
@media (max-width:520px){.nl-queue-banner{bottom:50px;padding:8px 14px;gap:8px}.nl-queue-banner .qb-title{max-width:120px;font-size:11.5px}.nl-queue-banner .qb-time{font-size:11px;padding:2px 8px}}

/* AD OVERLAY — z-index 15 (above curtain, below offline) */
.nl-ad{position:absolute;inset:0;z-index:15;background:#000;display:none;flex-direction:column;overflow:hidden}
.nl-ad.show{display:flex}
.nl-ad-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.nl-ad-media video,.nl-ad-media img{width:100%;height:100%;object-fit:contain;display:block}
.nl-ad-topbar{position:absolute;top:0;left:0;right:0;z-index:17;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 100%);pointer-events:none}
.nl-ad-topbar .lbl{background:linear-gradient(90deg,var(--cy),var(--cy2));color:#04161c;font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;pointer-events:auto;box-shadow:0 4px 14px rgba(0,255,255,.35)}
.nl-ad-topbar .lbl i{width:11px;height:11px}
.nl-ad-topbar .title{font-size:11.5px;font-weight:800;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.nl-ad-bottombar{position:absolute;bottom:0;left:0;right:0;z-index:17;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,0) 100%);pointer-events:none}
.nl-ad-cta{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;font-size:12.5px;font-weight:900;border-radius:11px;text-decoration:none;box-shadow:0 8px 22px rgba(0,255,255,.35);transition:.15s;border:none;font-family:inherit;cursor:pointer}
.nl-ad-cta:hover{transform:translateY(-2px)}
.nl-ad-cta i{width:14px;height:14px}
.nl-ad-skip{pointer-events:auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:800;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(8px);transition:.15s;font-family:inherit}
.nl-ad-skip:hover:not(:disabled){background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.45)}
.nl-ad-skip:disabled{opacity:.65;cursor:not-allowed}
.nl-ad-skip i{width:14px;height:14px}
.nl-ad-skip .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;background:rgba(255,255,255,.15);border-radius:6px;font-family:var(--mono);font-size:11px}

/* Fullscreen button inside the Ad Overlay */
.nl-ad-fs{pointer-events:auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:.15s;font-family:inherit;flex-shrink:0;}
.nl-ad-fs:hover{background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.45);}
.nl-ad-fs i{width:16px;height:16px;}

.nl-ad-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.15);z-index:18}
.nl-ad-progress > i{display:block;height:100%;background:var(--cy);border-radius:0 2px 2px 0;width:0%;transition:width .2s linear}

.house-ad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;width:100%;height:100%;background:radial-gradient(circle at 30% 30%, rgba(0,255,255,.18), transparent 55%),radial-gradient(circle at 75% 75%, rgba(0,204,204,.14), transparent 50%),linear-gradient(160deg,#0a0f14,#0f172a);color:#fff}
.house-ad .hh-brand{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.35);border-radius:99px}
.house-ad .hh-brand svg{width:22px;height:27px;display:block}
.house-ad .hh-brand .wm{font-weight:900;font-size:12px;letter-spacing:.1em;color:#e6ffff;text-transform:uppercase;line-height:1}

/* ══════════════════════════════════════════════════════════════

function detectPlatformFromUrl(url){
  if (!url) return 'custom';
  var u = String(url).toLowerCase().trim();
  if (u.indexOf('youtube.com') !== -1 || u.indexOf('youtu.be') !== -1) return 'youtube';
  if (u.indexOf('twitch.tv') !== -1) return 'twitch';
  if (u.indexOf('vimeo.com') !== -1) return 'vimeo';
  if (u.indexOf('facebook.com') !== -1 || u.indexOf('fb.watch') !== -1) return 'facebook';
  if (u.indexOf('kick.com') !== -1) return 'kick';
  if (u.indexOf('rumble.com') !== -1) return 'rumble';
  if (u.indexOf('dailymotion.com') !== -1 || u.indexOf('dai.ly') !== -1) return 'dailymotion';
  if (u.indexOf('odysee.com') !== -1) return 'odysee';
  if (u.indexOf('bitchute.com') !== -1) return 'bitchute';
  if (u.indexOf('nicovideo.jp') !== -1) return 'niconico';
  if (u.indexOf('streamyard.com') !== -1) return 'streamyard';
  if (u.indexOf('restream.io') !== -1) return 'restream';
  if (u.indexOf('zoom.us') !== -1) return 'zoom';
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(u)) return 'video-file';
  if (u.indexOf('.m3u8') !== -1) return 'native-hls';
  return 'custom';
}

function platformLabel(p){
  return {
    youtube:'YouTube Live', twitch:'Twitch', vimeo:'Vimeo Live', facebook:'Facebook Live',
    kick:'Kick', rumble:'Rumble', dailymotion:'Dailymotion', odysee:'Odysee',
    bitchute:'BitChute', niconico:'Niconico', streamyard:'StreamYard',
    restream:'Restream', zoom:'Zoom', 'video-file':'Direct video', custom:'Custom Embed',
    'native-hls':'Native HLS Stream'
  }[p] || 'Live';
}

function extractYouTubeId(input){
  if (!input) return null;
  var u = String(input).trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  u = u.replace(/\s+/g, '');
  var patterns = [
    /(?:youtube\.com\/watch\?(?:.*&)?v=)([A-Za-z0-9_-]{11})/,
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/live\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/v\/)([A-Za-z0-9_-]{11})/,
    /(?:[?&]v=)([A-Za-z0-9_-]{11})/
  ];
  for (var i = 0; i < patterns.length; i++){
    var m = u.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  var m2 = u.match(/([A-Za-z0-9_-]{11})/);
  if (m2 && m2[1]) return m2[1];
  return null;
}
function extractTwitchChannel(url){
  if (!url) return null;
  var m = url.match(/twitch\.tv\/([A-Za-z0-9_]+)/);
  return m ? m[1] : null;
}
function extractVimeoId(url){
  if (!url) return null;
  var m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}
function buildFacebookEmbed(url){
  return 'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(url) + '&show_text=false&width=734&height=413';
}
function normalizeEmbedUrl(url, platform){
  var u = String(url).trim();
  if (platform === 'kick'){
    var m = u.match(/kick\.com\/([A-Za-z0-9_]+)/i);
    if (m && u.indexOf('player.kick.com') === -1){
      return 'https://player.kick.com/' + m[1] + '?autoplay=true&muted=false';
    }
  }
  if (platform === 'rumble' && u.indexOf('/embed/') === -1){
    var m2 = u.match(/rumble\.com\/([A-Za-z0-9_-]+)/i);
    if (m2) return 'https://rumble.com/embed/' + m2[1] + '/';
  }
  if (platform === 'dailymotion' && u.indexOf('/embed/') === -1){
    var m3 = u.match(/dailymotion\.com\/video\/([A-Za-z0-9]+)/i);
    if (m3) return 'https://www.dailymotion.com/embed/video/' + m3[1] + '?autoplay=1&mute=1';
  }
  if (platform === 'odysee' && u.indexOf('/$/embed/') === -1){
    return u.replace('odysee.com/', 'odysee.com/$/embed/');
  }
  if (platform === 'bitchute' && u.indexOf('/embed/') === -1){
    var m4 = u.match(/bitchute\.com\/video\/([A-Za-z0-9_-]+)/i);
    if (m4) return 'https://www.bitchute.com/embed/' + m4[1] + '/';
  }
  return u;
}

function getSegments(){
  if (!streamData) return [];

  // If Native HLS, we return a single segment covering the whole event
  if (streamData.isNative && streamData.hlsUrl) {
    var ds = streamData.startDate || '';
    var ts = streamData.startTime || '00:00';
    var dur = parseInt(streamData.durationMinutes, 10) || 120; // Default 2hrs for native
    var st = new Date(ds + 'T' + ts + ':00').getTime();
    if (isNaN(st)) st = Date.now();
    return [{
      url: streamData.hlsUrl,
      startTime: ts,
      endTime: '23:59',
      startMs: st,
      endMs: st + dur * 60000,
      platform: 'native-hls'
    }];
  }

  if (Array.isArray(streamData.segments) && streamData.segments.length){
    var dateStr = streamData.startDate || '';
    return streamData.segments.map(function(s){
      var startMs = new Date(dateStr + 'T' + (s.startTime || '00:00') + ':00').getTime();
      var endMs = new Date(dateStr + 'T' + (s.endTime || '23:59') + ':00').getTime();
      if (endMs <= startMs) endMs += 86400000;
      return {
        url: s.url || '',
        startTime: s.startTime,
        endTime: s.endTime,
        startMs: startMs,
        endMs: endMs,
        platform: detectPlatformFromUrl(s.url || '')
      };
    }).filter(function(s){ return !isNaN(s.startMs) && !isNaN(s.endMs); });
  }

  var ds = streamData.startDate || '';
  var ts = streamData.startTime || '00:00';
  var dur = parseInt(streamData.durationMinutes, 10) || 90;
  var st = new Date(ds + 'T' + ts + ':00').getTime();
  if (isNaN(st)) return [];
  return [{
    url: streamData.streamUrl || '',
    startTime: ts,
    endTime: '00:00',
    startMs: st,
    endMs: st + dur * 60000,
    platform: detectPlatformFromUrl(streamData.streamUrl || '')
  }];
}

function getTiming(){
  var segs = getSegments();
  if (!segs.length) return { valid:false };
  var startMs = segs[0].startMs;
  var endMs = segs[segs.length - 1].endMs + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  return { valid:true, startMs:startMs, endMs:endMs, replayUntilMs:replayMs, segments: segs };
}

function computePhase(){
  var t = getTiming();
  if (!t.valid) return 'unknown';
  var now = Date.now();
  var segs = t.segments;

  if (now < segs[0].startMs) return 'upcoming';

  for (var i = 0; i < segs.length; i++){
    if (now >= segs[i].startMs && now <= segs[i].endMs) return 'live';
  }

  for (var j = 0; j < segs.length - 1; j++){
    if (now > segs[j].endMs && now < segs[j+1].startMs) return 'gap';
  }

  if (now <= t.replayUntilMs && streamData.replayEnabled !== false) return 'replay';
  return 'ended';
}

function getActiveSegment(){
  var segs = getSegments();
  var now = Date.now();
  for (var i = 0; i < segs.length; i++){
    if (now >= segs[i].startMs && now <= segs[i].endMs) return { seg: segs[i], index: i };
  }
  return null;
}

function getNextSegment(){
  var segs = getSegments();
  var now = Date.now();
  for (var i = 0; i < segs.length; i++){
    if (now < segs[i].startMs) return { seg: segs[i], index: i };
  }
  return null;
}

function computeStreamPhase(s){
  var dateStr = s.startDate || '';
  var timeStr = s.startTime || '00:00';
  var durMin = parseInt(s.durationMinutes, 10) || 90;
  if (!dateStr) return 'upcoming';
  var startMs = new Date(dateStr + 'T' + timeStr + ':00').getTime();
  if (isNaN(startMs)) return 'upcoming';
  var endMs = startMs + durMin * 60000 + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  var now = Date.now();
  if (now < startMs) return 'upcoming';
  if (now <= endMs) return 'live';
  if (now <= replayMs && s.replayEnabled !== false) return 'replay';
  return 'ended';
}

function streamStartMs(s){
  if (!s.startDate) return Infinity;
  var t = new Date(s.startDate + 'T' + (s.startTime || '00:00') + ':00').getTime();
  return isNaN(t) ? Infinity : t;
}

function renderSegmentsList(){
  var container = $('segmentsList');
  if (!container) return;
  var segs = getSegments();
  if (segs.length <= 1){ container.innerHTML = ''; return; }

  var now = Date.now();
  var html = '';
  segs.forEach(function(s, i){
    var cls = 'segment-item';
    var badge = '<span class="segment-badge done">Done</span>';
    if (now >= s.startMs && now <= s.endMs){ cls += ' active'; badge = '<span class="segment-badge now">Now</span>'; }
    else if (now < s.startMs){ cls += ' upcoming'; badge = '<span class="segment-badge next">Next</span>'; }
    else { cls += ' past'; }
    html +=
      '<div class="'+cls+'">' +
        '<div class="segment-num">' + (i+1) + '</div>' +
        '<div class="segment-info">' +
          '<div class="st">' + esc(platformLabel(s.platform)) + '</div>' +
          '<div class="sm">' + esc(s.startTime) + ' → ' + esc(s.endTime) + '</div>' +
        '</div>' +
        badge +
      '</div>';
  });
  container.innerHTML = html;
}

function renderOwnerControls(){
  var card = $('ownerCard');

  card.style.display = isAdminUser ? 'block' : 'none';

  var edit = $('editStreamBtn');
  if (edit) edit.setAttribute('href', 'create-streams.html?id=' + encodeURIComponent(streamId));

  var del = $('deleteStreamBtn');
  if (del && !del._bound){
    del._bound = true;
    del.addEventListener('click', function(){
      if (!confirm('Delete this stream permanently?')) return;
      del.disabled = true;
      db.collection(STREAMS).doc(streamId).delete()
        .then(function(){
          toast('Stream deleted.', 'success');
          setTimeout(function(){ window.location.href = 'streams.html'; }, 800);
        })
        .catch(function(err){
          toast('Delete failed: ' + err.message, 'error', 5000);
          del.disabled = false;
        });
    });
  }
}

  /* BIG COUNTDOWN CURTAIN */

      targetMs = nextSeg.seg.startMs;

function hideCurtain(){
  var c = $('curtain');
  if (c) c.classList.remove('show');
}

function updateCurtainCountdown(){
  var c = $('curtain');
  if (!c || !c.classList.contains('show')) return;
  var targetMs = parseInt(c.dataset.targetMs || '0', 10);
  if (!targetMs) return;

  var diff = targetMs - Date.now();
  if (diff < 0) diff = 0;
  var s = Math.floor(diff / 1000);
  var d = Math.floor(s / 86400);
  var h = Math.floor((s % 86400) / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;

  var dEl = $('ncDays'), hEl = $('ncHours'), mEl = $('ncMins'), sEl = $('ncSecs');
  if (dEl) dEl.textContent = String(d).padStart(2,'0');
  if (hEl) hEl.textContent = String(h).padStart(2,'0');
  if (mEl) mEl.textContent = String(m).padStart(2,'0');
  if (sEl) sEl.textContent = String(sec).padStart(2,'0');
}

  var nextSeg = getNextSegment();
  var titleText = nextSeg ? ('Segment ' + (nextSeg.index + 1) + ' starts in') : 'Stream starts in';
  showCurtain('countdown', titleText, '');
}

/* ══════════════════════════════════════════════════════════════
   NETWORK
   ══════════════════════════════════════════════════════════════ */
function wireNetworkListeners(){
  if (wireNetworkListeners._bound) return;
  wireNetworkListeners._bound = true;
  window.addEventListener('offline', handleOffline);
  window.addEventListener('online', handleOnline);
  if (!navigator.onLine) handleOffline();
}
function handleOffline(){
  isOffline = true;
  var ov = $('offlineOverlay');
  if (ov) ov.classList.add('show');
  try { if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); } catch(e){}
  var nativeVid = document.getElementById('nativeVideoPlayer');
  if (nativeVid) try { nativeVid.pause(); } catch(e){}
}
function handleOnline(){
  isOffline = false;
  var ov = $('offlineOverlay');
  if (ov) ov.classList.remove('show');
  toast('Back online', 'success', 2000);
  if (mode === 'gap-ads' || mode === 'normal'){ decideAndPlay(); }
}

/* ══════════════════════════════════════════════════════════════
   AUTO-HIDE CONTROLS
   ══════════════════════════════════════════════════════════════ */
function wireControlsAutoHide(){
  var player = $('nlPlayer');
  if (!player) return;
  function showControls(){
    player.classList.remove('hide-controls');
    player.classList.remove('hide-cursor');
    resetHideTimer();
  }
  function resetHideTimer(){
    clearTimeout(controlsHideTimer);
    controlsHideTimer = setTimeout(function(){
      var adOverlay = $('adOverlay');
      if (adOverlay && adOverlay.classList.contains('show')) return;
      var curtain = $('curtain');
      if (curtain && curtain.classList.contains('show')) return;
      var offline = $('offlineOverlay');
      if (offline && offline.classList.contains('show')) return;
      player.classList.add('hide-controls');
      player.classList.add('hide-cursor');
    }, CONTROLS_HIDE_MS);
  }
  ['mousemove','mousedown','touchstart','touchmove','click','keydown'].forEach(function(evt){
    player.addEventListener(evt, showControls, { passive: true });
  });
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') showControls();
  });
  resetHideTimer();
}

/* ══════════════════════════════════════════════════════════════
   PLAYER CONTROLS
   ══════════════════════════════════════════════════════════════ */
function wirePlayerControls(){
  var pp = $('ctrlPlayPause');
  var mute = $('ctrlMute');
  var fs = $('ctrlFullscreen');
  var back = $('ctrlSeekBack');
  var fwd = $('ctrlSeekForward');
  var jumpLive = $('ctrlJumpLive');

  function getActivePlayer() {
    if (ytPlayer && ytReady) return { type: 'youtube', instance: ytPlayer };
    var nativeVid = document.getElementById('nativeVideoPlayer');
    if (nativeVid) return { type: 'native', instance: nativeVid };
    return null;
  }

  if (pp) pp.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube') {
      var st = player.instance.getPlayerState();
      if (st === 1) player.instance.pauseVideo(); else player.instance.playVideo();
    } else {
      if (player.instance.paused) player.instance.play(); else player.instance.pause();
    }
  });

  if (mute) mute.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube') {
      if (player.instance.isMuted()){ player.instance.unMute(); mute.innerHTML = icon('volume-2'); }
      else { player.instance.mute(); mute.innerHTML = icon('volume-x'); }
    } else {
      player.instance.muted = !player.instance.muted;
      mute.innerHTML = icon(player.instance.muted ? 'volume-x' : 'volume-2');
    }
    refreshIcons();
  });

  if (fs) fs.addEventListener('click', function(){
    var wrap = $('nlPlayer'); if (!wrap) return;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (wrap.requestFullscreen) wrap.requestFullscreen();
    else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
  });

  if (back) back.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube') {
      var cur = player.instance.getCurrentTime() || 0;
      player.instance.seekTo(Math.max(0, cur - SEEK_STEP_S), true);
    } else {
      player.instance.currentTime = Math.max(0, player.instance.currentTime - SEEK_STEP_S);
    }
    updateJumpLiveButton();
    toast('−' + SEEK_STEP_S + 's', 'info', 900);
  });

  if (fwd) fwd.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube') {
      var cur = player.instance.getCurrentTime() || 0;
      var dur = player.instance.getDuration() || 0;
      var target = cur + SEEK_STEP_S;
      if (dur > 0 && target > dur - 1) target = dur - 0.5;
      player.instance.seekTo(target, true);
    } else {
      player.instance.currentTime = Math.min(player.instance.duration, player.instance.currentTime + SEEK_STEP_S);
    }
    updateJumpLiveButton();
    toast('+' + SEEK_STEP_S + 's', 'info', 900);
  });

  if (jumpLive) jumpLive.addEventListener('click', function(){
    var player = getActivePlayer(); if (!player) return;
    if (player.type === 'youtube') {
      var dur = player.instance.getDuration() || 0;
      if (dur > 0) player.instance.seekTo(dur - 0.5, true);
      else player.instance.seekTo(0, true);
    } else {
      if (player.instance.duration) player.instance.currentTime = player.instance.duration - 0.5;
    }
    updateJumpLiveButton();
    toast('Jumped to live', 'success', 1400);
  });
}

function updateJumpLiveButton(){
  var btn = $('ctrlJumpLive');
  if (!btn) return;
  if (currentPhase !== 'live'){ btn.classList.remove('show'); return; }
  
  var player = null;
  if (ytPlayer && ytReady) player = ytPlayer;
  else player = document.getElementById('nativeVideoPlayer');

  if (!player){ btn.classList.remove('show'); return; }
  
  var cur = (typeof player.getCurrentTime === 'function' ? player.getCurrentTime() : player.currentTime) || 0;
  var dur = (typeof player.getDuration === 'function' ? player.getDuration() : player.duration) || 0;
  
  if (dur <= 0 || cur <= 0){ btn.classList.remove('show'); return; }
  var distance = dur - cur;
  if (distance <= 20) btn.classList.remove('show');
  else btn.classList.add('show');
}

/* ══════════════════════════════════════════════════════════════
   DECIDE AND PLAY
   ══════════════════════════════════════════════════════════════ */
function decideAndPlay(){
  var phase = computePhase();
  currentPhase = phase;
  console.log('[Novalink] Phase:', phase, '| Segments:', getSegments().length);

  if (phase === 'upcoming'){
    mode = 'gap-ads';
    loadPlayerForIframeOnly();
    showCountdownCurtain();
    startGapAdLoop();
    renderPhaseUI();
    updateCountdownPill();
    updateQueueBanner();
    renderSegmentsList();
    return;
  }

  if (phase === 'live'){
    mode = 'normal';
    stopGapAdLoop();
    hideQueueBanner();
    hideCurtain();
    var active = getActiveSegment();
    if (active){
      if (currentLoadedSegmentIndex !== active.index){
        console.log('[Novalink] Loading segment', active.index + 1);
        currentLoadedSegmentIndex = active.index;
        loadPlayerWithUrl(active.seg.url, active.seg.platform);
      }
    }
    renderPhaseUI();
    updateCountdownPill();
    renderSegmentsList();
    setupMidrollTimer();
    return;
  }

  if (phase === 'gap'){
    mode = 'gap-ads';
    clearPlayerIframe();
    var nextSeg = getNextSegment();
    if (nextSeg) updateQueueBannerForSegment(nextSeg);
    showCountdownCurtain();
    startGapAdLoop();
    renderPhaseUI();
    updateCountdownPill();
    renderSegmentsList();
    return;
  }

  if (phase === 'replay'){
    mode = 'normal';
    stopGapAdLoop();
    hideQueueBanner();
    hideCurtain();
    var segs = getSegments();
    var last = segs[segs.length - 1];
    if (last && currentLoadedSegmentIndex !== segs.length - 1){
      currentLoadedSegmentIndex = segs.length - 1;
      loadPlayerWithUrl(last.url, last.platform);
    }
    renderPhaseUI();
    updateCountdownPill();
    renderSegmentsList();
    return;
  }

  if (phase === 'ended'){
    tryNextInQueue();
  }
}

function clearPlayerIframe(){
  var host = $('ytPlayerHost');
  if (host) host.innerHTML = '';
  ytPlayer = null;
  ytReady = false;
  currentYtVideoId = null;
  var nativeVid = document.getElementById('nativeVideoPlayer');
  if (nativeVid) nativeVid.remove();
}

function tryNextInQueue(){
  var now = Date.now();
  var next = null;
  for (var i = 0; i < channelQueue.length; i++){
    var s = channelQueue[i];
    if (s.id === streamId) continue;
    var startMs = streamStartMs(s);
    if (startMs > now && startMs - now <= QUEUE_LOOKAHEAD_MS){
      if (!next || startMs < next.startMs) next = { stream: s, startMs: startMs };
    }
  }

  if (!next){
    mode = 'ended';
    stopGapAdLoop();
    clearPlayerIframe();
    showCurtain('ended', 'Stream ended', 'Nothing else scheduled on this channel right now.');
    hideQueueBanner();
    renderPhaseUI();
    return;
  }

  nextStreamInQueue = next;
  var gapMs = next.startMs - now;

  if (gapMs <= GAP_ADS_MAX_MS){
    mode = 'gap-ads';
    updateQueueBanner();
    showCountdownCurtain();
    startGapAdLoop();
  } else {
    mode = 'ended';
    stopGapAdLoop();
    clearPlayerIframe();
    var nextTitle = next.stream.streamTitle || next.stream.eventName || 'Untitled';
    showCurtain('ended', 'Stream ended', 'Next: ' + nextTitle + ' starts ' + formatDate(next.stream.startDate, next.stream.startTime));
    hideQueueBanner();
  }
}

function updateQueueBannerForSegment(nextSeg){
  var banner = $('queueBanner');
  var lbl = $('qbLbl');
  var title = $('qbTitle');
  var time = $('qbTime');
  if (!banner) return;
  if (lbl) lbl.textContent = 'Next segment';
  if (title) title.textContent = 'Segment ' + (nextSeg.index + 1) + ' · ' + platformLabel(nextSeg.seg.platform);
  if (time) time.textContent = formatDurationShort(nextSeg.seg.startMs - Date.now());
  banner.classList.add('show');
}

function updateQueueBanner(){
  var banner = $('queueBanner');
  var lbl = $('qbLbl');
  var title = $('qbTitle');
  var time = $('qbTime');
  if (!banner || !nextStreamInQueue){ if (banner) banner.classList.remove('show'); return; }
  if (lbl) lbl.textContent = 'Next up';
  if (title) title.textContent = nextStreamInQueue.stream.streamTitle || nextStreamInQueue.stream.eventName || 'Untitled';
  if (time) time.textContent = formatDurationShort(nextStreamInQueue.startMs - Date.now());
  banner.classList.add('show');
}

function hideQueueBanner(){
  var banner = $('queueBanner');
  if (banner) banner.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   GAP ADS LOOP
   ══════════════════════════════════════════════════════════════ */
function startGapAdLoop(){
  clearTimeout(gapAdTimer);
  clearTimeout(gapAdRetryTimer);
  if (isOffline) return;

  var overlay = $('adOverlay');
  var showingAd = overlay && overlay.classList.contains('show');
  if (showingAd) return;

  /* Gap ads disabled by admin */
  if (streamData.gapAdsEnabled === false){
    if (!($('curtain') && $('curtain').classList.contains('show'))){
      showCountdownCurtain();
    }
    gapAdRetryTimer = setTimeout(function(){
      if (mode === 'gap-ads') startGapAdLoop();
    }, 5000);
    return;
  }

  var hasAds = (adPool.preroll.length || adPool.midroll.length || adPool.postroll.length);

  if (hasAds){
    adState.gapAdActive = true;
    /* Ads play on top of the countdown curtain (z-index 15 > 5) */
    showAd('preroll', function(){
      adState.gapAdActive = false;
      /* Ensure curtain is showing with fresh countdown */
      if (!$('curtain') || !$('curtain').classList.contains('show')){
        showCountdownCurtain();
      }
      if (mode === 'gap-ads'){
        gapAdTimer = setTimeout(function(){
          if (mode === 'gap-ads') startGapAdLoop();
        }, 400);
      }
    });
  } else {
    /* No ads — just show the countdown curtain */
    if (!($('curtain') && $('curtain').classList.contains('show'))){
      showCountdownCurtain();
    }
    gapAdRetryTimer = setTimeout(function(){
      if (mode === 'gap-ads') startGapAdLoop();
    }, 5000);
  }
}

function stopGapAdLoop(){
  clearTimeout(gapAdTimer);
  clearTimeout(gapAdRetryTimer);
  adState.gapAdActive = false;
}

/* ══════════════════════════════════════════════════════════════
   PHASE UI
   ══════════════════════════════════════════════════════════════ */
function renderPhaseUI(){
  var liveTag = $('playerLiveTag');
  var crumbLive = $('crumbLivePill');
  if (currentPhase === 'live'){
    if (liveTag) liveTag.style.display = 'inline-flex';
    if (crumbLive) crumbLive.style.display = 'inline-flex';
  } else {
    if (liveTag) liveTag.style.display = 'none';
    if (crumbLive) crumbLive.style.display = 'none';
  }
  updateJumpLiveButton();
}

function updateCountdownPill(){
  var pill = $('cdPill');
  var text = $('cdText');
  var lbl = $('cdLbl');
  if (!pill || !text) return;

  if (currentPhase === 'gap'){
    var nextSeg = getNextSegment();
    if (nextSeg){
      var diff = nextSeg.seg.startMs - Date.now();
      if (diff < 0) diff = 0;
      var s = Math.floor(diff / 1000);
      var d = Math.floor(s / 86400);
      var h = Math.floor((s % 86400) / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      var str = (d > 0 ? d + 'd ' : '') + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
      if (lbl) lbl.textContent = 'Next segment in';
      text.textContent = str;
      pill.classList.add('show');
      return;
    }
  }

  if (mode === 'gap-ads' && nextStreamInQueue){
    var diff2 = nextStreamInQueue.startMs - Date.now();
    if (diff2 < 0) diff2 = 0;
    var s2 = Math.floor(diff2 / 1000);
    var d2 = Math.floor(s2 / 86400);
    var h2 = Math.floor((s2 % 86400) / 3600);
    var m2 = Math.floor((s2 % 3600) / 60);
    var sec2 = s2 % 60;
    var str2 = (d2 > 0 ? d2 + 'd ' : '') + String(h2).padStart(2,'0') + ':' + String(m2).padStart(2,'0') + ':' + String(sec2).padStart(2,'0');
    if (lbl) lbl.textContent = 'Next in';
    text.textContent = str2;
    pill.classList.add('show');
    return;
  }

  if (currentPhase === 'upcoming'){
    var t = getTiming();
    if (!t.valid) return;
    var diff3 = t.startMs - Date.now();
    if (diff3 < 0) diff3 = 0;
    var s3 = Math.floor(diff3 / 1000);
    var d3 = Math.floor(s3 / 86400);
    var h3 = Math.floor((s3 % 86400) / 3600);
    var m3 = Math.floor((s3 % 3600) / 60);
    var sec3 = s3 % 60;
    var str3 = (d3 > 0 ? d3 + 'd ' : '') + String(h3).padStart(2,'0') + ':' + String(m3).padStart(2,'0') + ':' + String(sec3).padStart(2,'0');
    if (lbl) lbl.textContent = 'Live in';
    text.textContent = str3;
    pill.classList.add('show');
    return;
  }

  pill.classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════
   TICKERS
   ══════════════════════════════════════════════════════════════ */
function startTickers(){
  clearInterval(countdownTimer);
  clearInterval(phaseTickTimer);

  countdownTimer = setInterval(function(){
    updateCountdownPill();
    updateCurtainCountdown();
    if (mode === 'gap-ads' && nextStreamInQueue){
      var qbTime = $('qbTime');
      if (qbTime) qbTime.textContent = formatDurationShort(nextStreamInQueue.startMs - Date.now());
    }
    if (currentPhase === 'gap'){
      var nextSeg = getNextSegment();
      var qbTime2 = $('qbTime');
      if (nextSeg && qbTime2) qbTime2.textContent = formatDurationShort(nextSeg.seg.startMs - Date.now());
    }
  }, 1000);

  phaseTickTimer = setInterval(function(){
    if (mode === 'gap-ads' && nextStreamInQueue && Date.now() >= nextStreamInQueue.startMs){
      window.location.href = 'view-stream.html?id=' + encodeURIComponent(nextStreamInQueue.stream.id);
      return;
    }

    var newPhase = computePhase();

    if (currentPhase === 'gap' && newPhase === 'live'){
      console.log('[Novalink] Gap ended — segment is live');
      decideAndPlay();
      return;
    }

    if (newPhase === 'live'){
      var active = getActiveSegment();
      if (active && currentLoadedSegmentIndex !== active.index){
        console.log('[Novalink] Auto-switching to segment', active.index + 1);
        decideAndPlay();
        return;
      }
    }

    if (newPhase !== currentPhase){
      currentPhase = newPhase;
      renderPhaseUI();
      updateCountdownPill();
      decideAndPlay();
    }
  }, 3000);
}

/* ══════════════════════════════════════════════════════════════
   MIDROLL
   ══════════════════════════════════════════════════════════════ */
function setupMidrollTimer(){
  clearTimeout(adState.midrollTimerId);
  if (!adSettings.midrollEnabled) return;
  if (streamData.midrollEnabled === false) return;
  if (currentPhase !== 'live') return;

  var active = getActiveSegment();
  if (!active) return;

  if (adState.firedMidrollForSegment !== active.index){
    adState.firedMidroll = false;
    adState.firedMidrollForSegment = active.index;
  }
  if (adState.firedMidroll) return;

  var midMin = parseInt(streamData.midrollMinute, 10) || adSettings.midrollMinute || 30;
  var fireAt = active.seg.startMs + (midMin * 60000);
  var delay = Math.max(0, fireAt - Date.now());

  adState.midrollTimerId = setTimeout(function(){
    adState.firedMidroll = true;
    if (currentPhase === 'live') showAd('midroll', function(){});
  }, delay);
}

/* ══════════════════════════════════════════════════════════════
   LOAD PLAYER
   ══════════════════════════════════════════════════════════════ */
function loadPlayerForIframeOnly(){
  var host = $('ytPlayerHost');
  if (!host) return;
  if (host.innerHTML) return;
  var active = getActiveSegment() || (function(){
    var segs = getSegments();
    return segs[0] ? { seg: segs[0], index: 0 } : null;
  })();
  if (!active) return;
  loadPlayerWithUrl(active.seg.url, active.seg.platform, true);
}

function loadPlayerWithUrl(url, platform, silent){
  var host = $('ytPlayerHost');
  if (!host) return;

  // --- NEW: NATIVE HLS PLAYER ---
  if (platform === 'native-hls' || (url && url.endsWith('.m3u8'))) {
    if (!silent) showCurtain('loading', 'Connecting to Novalink Live…');
    
    host.innerHTML = '';
    ytPlayer = null;
    ytReady = false;
    
    var video = document.createElement('video');
    video.id = 'nativeVideoPlayer';
    video.controls = false;
    video.autoplay = true;
    video.muted = true; // Required for autoplay
    video.playsInline = true;
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.position = 'absolute';
    video.style.inset = '0';
    video.style.objectFit = 'contain';

    if (window.Hls && Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play().catch(function(e){ console.log('Autoplay blocked', e); });
        hideCurtain();
      });
      hls.on(Hls.Events.ERROR, function(event, data) {
        console.error('HLS error:', data);
        if (data.fatal) {
            switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                default: showCurtain('error', 'Stream Error', 'Could not connect to the HLS stream.'); break;
            }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native support
      video.src = url;
      video.addEventListener('loadedmetadata', function() {
        video.play().catch(function(e){ console.log('Autoplay blocked', e); });
        hideCurtain();
      });
    }
    
    host.appendChild(video);
    updateJumpLiveButton();
    return; 
  }
  // --- END NATIVE HLS PLAYER ---

  if (platform === 'youtube'){
    var vid = extractYouTubeId(url);
    if (vid && vid === currentYtVideoId && ytPlayer && ytReady){ if (!silent) hideCurtain(); return; }
  }

  host.innerHTML = '';
  ytPlayer = null;
  ytReady = false;
  currentYtVideoId = null;

  if (!url){
    showCurtain('loading', 'Stream URL missing', 'The host has not set a stream URL yet.');
    return;
  }

  platform = platform || detectPlatformFromUrl(url);

  if (platform === 'youtube'){
    var vid2 = extractYouTubeId(url);
    if (!vid2){ showCurtain('loading', 'Invalid YouTube URL', 'Could not extract a video ID from: ' + url); return; }
    if (!silent) showCurtain('loading', 'Loading stream', 'Connecting to YouTube…');
    host.innerHTML = '<div id="ytPlayer"></div>';
    currentYtVideoId = vid2;
    if (window.YT && window.YT.Player) createYTPlayer(vid2);
    else window.onYouTubeIframeAPIReady = function(){ createYTPlayer(vid2); };
    return;
  }

  var embed = '';
  if (platform === 'twitch'){
    var ch = extractTwitchChannel(url);
    if (!ch){ showCurtain('loading', 'Invalid Twitch URL', 'Could not find a channel name.'); return; }
    var parent = location.hostname || 'localhost';
    embed = 'https://player.twitch.tv/?channel=' + encodeURIComponent(ch) + '&parent=' + parent + '&autoplay=true&muted=true';
  } else if (platform === 'vimeo'){
    var v2 = extractVimeoId(url);
    if (!v2){ showCurtain('loading', 'Invalid Vimeo URL', 'Could not find a video ID.'); return; }
    embed = 'https://player.vimeo.com/video/' + v2 + '?autoplay=1&muted=1';
  } else if (platform === 'facebook'){
    embed = buildFacebookEmbed(url);
  } else {
    embed = normalizeEmbedUrl(url, platform);
  }

  if (!silent) showCurtain('loading', 'Loading stream', 'Connecting to ' + platformLabel(platform) + '…');

  var iframe = document.createElement('iframe');
  iframe.src = embed;
  iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media; camera; microphone; clipboard-write';
  iframe.setAttribute('allowfullscreen', '');
  iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = '0';
  iframe.style.position = 'absolute';
  iframe.style.inset = '0';

  var loaded = false;
  iframe.addEventListener('load', function(){ if (!loaded){ loaded = true; hideCurtain(); } });
  setTimeout(function(){ if (!loaded){ loaded = true; hideCurtain(); } }, 4000);
  host.appendChild(iframe);
}

function createYTPlayer(videoId){
  ytPlayer = new YT.Player('ytPlayer', {
    videoId: videoId,
    playerVars: {
      autoplay: 1, mute: 1, rel: 0, playsinline: 1,
      iv_load_policy: 3, modestbranding: 1, controls: 0, disablekb: 1,
      color: 'white', origin: window.location.origin
    },
    events: {
      onReady: function(event){
        ytReady = true;
        hideCurtain();
        try { event.target.mute(); event.target.playVideo(); } catch(e){}

        var attempts = 0;
        clearInterval(autoplayRetryTimer);
        autoplayRetryTimer = setInterval(function(){
          attempts++;
          if (attempts > 8){ clearInterval(autoplayRetryTimer); return; }
          try {
            var state = event.target.getPlayerState();
            if (state !== 1 && state !== 3) event.target.playVideo();
            else clearInterval(autoplayRetryTimer);
          } catch(e){}
        }, 1000);

        clearInterval(liveCheckTimer);
        liveCheckTimer = setInterval(function(){
          if (currentPhase === 'live') updateJumpLiveButton();
        }, 2000);
      },
      onStateChange: function(event){
        var pp = $('ctrlPlayPause');
        if (pp) pp.innerHTML = icon(event.data === 1 ? 'pause' : 'play');
        refreshIcons();

        if (event.data === 0){
          if (adSettings.postrollEnabled && streamData.postrollEnabled !== false && !adState.firedPostroll){
            adState.firedPostroll = true;
            showAd('postroll', function(){ handleSegmentEnd(); });
          } else {
            handleSegmentEnd();
          }
        }
        if (event.data === 1) updateJumpLiveButton();
      },
      onError: function(event){
        var msg = 'YouTube error. ';
        if (event.data === 2) msg += 'Video ID is invalid.';
        else if (event.data === 5) msg += 'HTML5 player cannot play this video.';
        else if (event.data === 100) msg += 'Video not found or is private.';
        else if (event.data === 101 || event.data === 150) msg += 'Video owner does not allow embedding.';
        else msg += 'Code: ' + event.data;
        toast(msg, 'error', 6000);
      }
    }
  });
}

function handleSegmentEnd(){
  var phase = computePhase();
  if (phase === 'gap'){
    decideAndPlay();
  } else if (phase === 'ended'){
    tryNextInQueue();
  } else if (phase === 'live'){
    var segs = getSegments();
    var active = getActiveSegment();
    if (active && active.index < segs.length - 1){
      decideAndPlay();
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   ADS
   ══════════════════════════════════════════════════════════════ */
function loadAdsInBackground(){
  var settingsPromise = db.collection(SETTINGS).doc(SETTINGS_DOC).get().then(function(snap){
    if (snap.exists) adSettings = Object.assign({}, AD_DEFAULTS, snap.data() || {});
  }).catch(function(){});

  var poolPromise = db.collection(ADS).where('active', '==', true).limit(50).get().then(function(snap){
    adPool = { preroll: [], midroll: [], postroll: [] };
    var now = Date.now();
    snap.forEach(function(doc){
      var d = doc.data() || {};
      d.id = doc.id;
      if (d.startDate){ var s = new Date(d.startDate + 'T00:00').getTime(); if (!isNaN(s) && now < s) return; }
      if (d.endDate){ var e = new Date(d.endDate + 'T23:59:59').getTime(); if (!isNaN(e) && now > e) return; }
      var t = d.type || 'any';
      if (t === 'preroll' || t === 'any') adPool.preroll.push(d);
      if (t === 'midroll' || t === 'any') adPool.midroll.push(d);
      if (t === 'postroll' || t === 'any') adPool.postroll.push(d);
    });
  }).catch(function(){});

  Promise.all([settingsPromise, poolPromise]).then(function(){
    if (currentPhase === 'live'){
      if (adSettings.prerollEnabled && streamData.prerollEnabled !== false && !adState.firedPreroll){
        adState.firedPreroll = true;
        showAd('preroll', function(){});
      }
    }
    if (mode === 'gap-ads'){
      var overlay = $('adOverlay');
      if (overlay && !overlay.classList.contains('show')) startGapAdLoop();
    }
  });
}

function getRecentAdIds(){
  try { var raw = sessionStorage.getItem('nl_recent_ads'); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
}
function rememberAd(adId){
  var recent = getRecentAdIds();
  recent.push(adId);
  if (recent.length > RECENT_ADS_MAX) recent = recent.slice(-RECENT_ADS_MAX);
  try { sessionStorage.setItem('nl_recent_ads', JSON.stringify(recent)); } catch(e){}
}
function pickAd(slot){
  var pool = adPool[slot] || [];
  if (!pool.length) return null;
  var recent = getRecentAdIds();
  var fresh = pool.filter(function(ad){ return recent.indexOf(ad.id) === -1; });
  if (!fresh.length) fresh = pool;
  var total = fresh.reduce(function(sum, ad){ return sum + (ad.weight || 1); }, 0);
  var r = Math.random() * total;
  var acc = 0;
  for (var i = 0; i < fresh.length; i++){
    acc += fresh[i].weight || 1;
    if (r <= acc) return fresh[i];
  }
  return fresh[0];
}
function trackAdEvent(ad, type){
  if (!ad || !ad.id) return;
  try {
    var update = {};
    if (type === 'impression') update.impressions = firebase.firestore.FieldValue.increment(1);
    if (type === 'click') update.clicks = firebase.firestore.FieldValue.increment(1);
    db.collection(ADS).doc(ad.id).update(update).catch(function(){});
  } catch(e){}
}

function showAd(slot, onComplete){
  var overlay = $('adOverlay'), media = $('adMedia'), title = $('adTitle');
  var cta = $('adCta'), ctaLabel = $('adCtaLabel');
  var skipBtn = $('adSkip'), skipText = $('adSkipText'), countdown = $('adCountdown');
  var progressFill = $('adProgressFill');
  if (!overlay || !media){ if (onComplete) onComplete(); return; }

  var player = $('nlPlayer');
  if (player) player.classList.remove('hide-controls');

  var ad = pickAd(slot);
  overlay.classList.add('show');
  media.innerHTML = '';
  progressFill.style.width = '0%';
  var skipAfter = parseInt(adSettings.skipAfterSeconds, 10);
  if (isNaN(skipAfter)) skipAfter = 5;

  // Wire up the ad fullscreen button
  var fsBtn = $('adFullscreen');
  if (fsBtn) {
    fsBtn.onclick = function() {
      var wrap = $('nlPlayer');
      if (!wrap) return;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    };
  }

  // Helper — start the skip countdown. Called once the ad is actually visible/playing.
  var skipStarted = false;
  function beginSkipCountdown(seconds){
    if (skipStarted) return;
    skipStarted = true;

    if (seconds === -1){
      // Advertiser disabled skipping entirely
      skipBtn.disabled = true;
      skipText.textContent = 'Ad';
      countdown.textContent = '';
      return;
    }
    if (seconds === 0){
      // Skippable immediately
      skipBtn.disabled = false;
      skipText.textContent = 'Skip ad';
      countdown.textContent = '';
      return;
    }

    var remaining = seconds;
    skipBtn.disabled = true;
    skipText.textContent = 'Skip in';
    countdown.textContent = remaining;
    clearInterval(adState.countdownTimerId);
    adState.countdownTimerId = setInterval(function(){
      remaining--;
      if (remaining <= 0){
        clearInterval(adState.countdownTimerId);
        skipBtn.disabled = false;
        skipText.textContent = 'Skip ad';
        countdown.textContent = '';
      } else {
        countdown.textContent = remaining;
      }
    }, 1000);
  }

  if (ad){
    title.textContent = ad.title || 'Advertisement';
    cta.href = ad.clickUrl || '#';
    ctaLabel.textContent = ad.ctaLabel || 'Learn more';
    if (typeof ad.skipAfterSeconds === 'number') skipAfter = ad.skipAfterSeconds;

    if (ad.mediaType === 'video' && ad.mediaUrl){
      var vid = document.createElement('video');
      vid.src = ad.mediaUrl;
      vid.autoplay = true; vid.muted = false; vid.playsInline = true;
      vid.setAttribute('playsinline', '');
      media.appendChild(vid);
      vid.addEventListener('timeupdate', function(){
        if (vid.duration) progressFill.style.width = ((vid.currentTime / vid.duration) * 100) + '%';
      });
      vid.addEventListener('ended', function(){ hideAd(); if (onComplete) onComplete(); });
      vid.addEventListener('error', function(){ media.innerHTML = ''; media.appendChild(buildHouseAd()); beginSkipCountdown(skipAfter); });
      // Only start the skip countdown once the video actually starts playing
      vid.addEventListener('playing', function(){ beginSkipCountdown(skipAfter); });
      // Fallback: if 'playing' doesn't fire (e.g. autoplay blocked), start on 'loadeddata'
      vid.addEventListener('loadeddata', function(){ setTimeout(function(){ beginSkipCountdown(skipAfter); }, 500); });
    } else if (ad.mediaUrl){
      var img = document.createElement('img');
      img.src = ad.mediaUrl; img.alt = ad.title || 'Ad';
      // Only start the skip countdown once the image has loaded
      img.addEventListener('load', function(){ beginSkipCountdown(skipAfter); });
      // Fallback: if image fails to load, still let the user skip
      img.addEventListener('error', function(){ beginSkipCountdown(skipAfter); });
      media.appendChild(img);
    } else {
      media.appendChild(buildHouseAd());
      beginSkipCountdown(skipAfter);
    }
    trackAdEvent(ad, 'impression');
    rememberAd(ad.id);
  } else {
    title.textContent = adSettings.houseAdTitle || 'Advertise on Novalink';
    cta.href = adSettings.houseAdUrl || 'mailto:ads@novalink.com';
    ctaLabel.textContent = adSettings.houseAdCtaLabel || 'Advertise here';
    media.appendChild(buildHouseAd());
    beginSkipCountdown(skipAfter);
  }

  cta.onclick = function(){ if (ad) trackAdEvent(ad, 'click'); };

  skipBtn.onclick = function(){
    if (skipBtn.disabled) return;
    hideAd();
    if (onComplete) onComplete();
  };

  // No auto-close timer. Ad only closes when:
  // - Video ad finishes playing ("ended" event)
  // - User clicks "Skip Ad"
  // - User clicks the CTA (link)
  clearTimeout(adState.skipTimerId);

  refreshIcons();
}

function hideAd(){
  var overlay = $('adOverlay');
  if (!overlay) return;
  overlay.classList.remove('show');
  var media = $('adMedia');
  if (media) media.innerHTML = '';
  clearInterval(adState.countdownTimerId);
  clearTimeout(adState.skipTimerId);
}

function buildHouseAd(){
  var wrap = document.createElement('div');
  wrap.className = 'house-ad';
  wrap.innerHTML =
    '<div class="hh-brand">' +
      '<svg viewBox="0 0 60 74" aria-hidden="true"><path fill="#3a5a8c" d="M34.5 4.2c-8.1 0-14.7 6.6-14.7 14.7v3.4c0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9v-3.4c0-4.9 4-8.9 8.9-8.9 4.9 0 8.9 4 8.9 8.9 0 3-1.5 5.7-3.9 7.3-1.4.9-1.8 2.8-.9 4.2.9 1.4 2.8 1.8 4.2.9 4.3-2.7 6.9-7.4 6.9-12.4 0-8.1-6.6-14.7-14.7-14.7z"/><path fill="#00FFFF" d="M25.5 69.8c8.1 0 14.7-6.6 14.7-14.7v-3.4c0-1.6-1.3-2.9-2.9-2.9s-2.9 1.3-2.9 2.9v3.4c0 4.9-4 8.9-8.9 8.9-4.9 0-8.9-4-8.9-8.9 0-3 1.5-5.7 3.9-7.3 1.4-.9 1.8-2.8.9-4.2-.9-1.4-2.8-1.8-4.2-.9-4.3 2.7-6.9 7.4-6.9 12.4 0 8.1 6.6 14.7 14.7 14.7z"/></svg>' +
      '<span class="wm">Novalink</span>' +
    '</div>' +
    '<div class="hh-t">'+esc(adSettings.houseAdTitle || 'Advertise on Novalink')+'</div>' +
    '<div class="hh-s">'+esc(adSettings.houseAdText || 'Reach thousands of live viewers.')+'</div>' +
    '<a class="hh-cta" href="'+esc(adSettings.houseAdUrl || 'mailto:ads@novalink.com')+'" target="_blank" rel="noopener">' +
      icon('message-circle') + ' ' + esc(adSettings.houseAdCtaLabel || 'Advertise here') +

/* ══════════════════════════════════════════════════════════════
   LOAD
   ══════════════════════════════════════════════════════════════ */
function load(){
  streamId = getParam('id');
  if (!streamId){ renderError('No stream specified', 'This page needs a stream ID.'); return; }

  db.collection(STREAMS).doc(streamId).get()
    .then(function(doc){
      if (!doc.exists){ renderError('Stream not found', 'This stream may have been deleted.'); return; }
      streamData = doc.data() || {};
      streamData.id = doc.id;

      var chId = streamData.channelId;
      var chPromise = chId
        ? db.collection(CHANNELS).doc(chId).get().then(function(cs){
            if (cs.exists){ channelData = cs.data() || {}; channelData.id = cs.id; }
          }).catch(function(){})
        : Promise.resolve();

      var sibPromise = chId
        ? db.collection(STREAMS).where('channelId', '==', chId).limit(50).get().then(function(snap){
            channelQueue = [];
            siblingStreams = [];
            snap.forEach(function(s){
              var d = s.data() || {};
              d.id = s.id;
              channelQueue.push(d);
              if (s.id !== streamId) siblingStreams.push(d);
            });
            channelQueue.sort(function(a, b){ return streamStartMs(a) - streamStartMs(b); });
            siblingStreams.sort(function(a, b){
              var rank = { live:0, upcoming:1, replay:2, ended:3 };
              return (rank[computeStreamPhase(a)] || 4) - (rank[computeStreamPhase(b)] || 4);
            });
          }).catch(function(){})
        : Promise.resolve();

      Promise.all([chPromise, sibPromise]).then(function(){
        currentPhase = computePhase();
        renderPage();
      });
    })
    .catch(function(err){
      console.error('[load]', err);
      renderError('Could not load', err.message || 'Please try again.');
    });
}

  refreshIcons();
  $('signInBtn').addEventListener('click', function(){ window.location.href = 'index.html#signin'; });
  $('userChip').addEventListener('click', function(){
    if (!currentUser) return;
    if (confirm('Sign out of ' + (currentUser.email || 'your account') + '?')){
      auth.signOut().then(function(){ toast('Signed out.', 'success'); });
    }
  });
  auth.onAuthStateChanged(function(user){ applyAuth(user); });
  load();
});

window.addEventListener('beforeunload', function(){
  if (countdownTimer) clearInterval(countdownTimer);
  if (phaseTickTimer) clearInterval(phaseTickTimer);
  if (autoplayRetryTimer) clearInterval(autoplayRetryTimer);
  if (liveCheckTimer) clearInterval(liveCheckTimer);
  if (controlsHideTimer) clearTimeout(controlsHideTimer);
  if (gapAdTimer) clearTimeout(gapAdTimer);
  if (gapAdRetryTimer) clearTimeout(gapAdRetryTimer);
  clearTimeout(adState.midrollTimerId);
  clearInterval(adState.countdownTimerId);
  clearTimeout(adState.skipTimerId);
});
})();
