<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f14" />
<title>Stream · Novalink</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --cy:#00FFFF;--cy2:#00CCCC;--cy3:#009999;--cyf:#e6ffff;
  --bg:#f6f8fb;--sf:#ffffff;--sf2:#f1f4f8;
  --bd:#e4e9f0;--bd2:#d3dbe5;
  --tx:#0a0f14;--tx2:#2b3644;--mut:#6b7787;
  --rd:14px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --dg:#dc2626;--dgf:#fef2f2;--sv:#059669;--svf:#ecfdf5;--nv:#1e2f4d;
  --ink:#0a0f14;
  --ease:cubic-bezier(0.25,0.8,0.25,1);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.container{max-width:1480px;margin:0 auto;padding:0 20px;width:100%}
h1,h2,h3{line-height:1.15;font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;font-family:inherit;cursor:pointer;touch-action:manipulation}

.site-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 0;position:sticky;top:0;z-index:40}
.hdr{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:11px;flex-shrink:0;color:var(--nv)}
.logo svg{width:26px;height:32px;display:block}
.logo b{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.hdr-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-size:12.5px;font-weight:800;transition:.15s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--cy);background:#fff;box-shadow:0 0 0 3px rgba(0,255,255,.14)}
.hdr-btn i{width:14px;height:14px}
.hdr-btn .avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;font-family:var(--mono)}
@media (max-width:520px){.hdr-btn .lbl{display:none}}

.ch-hero-crumb{background:#0a0f14;color:#fff;padding:20px 0 22px;position:relative;overflow:hidden}
.ch-hero-crumb::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:20px 20px;pointer-events:none}
.ch-hero-crumb-in{max-width:1480px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.ch-hero-crumb .crumb{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px}
.ch-hero-crumb .crumb:hover{color:var(--cy)}
.ch-hero-crumb .crumb i{width:13px;height:13px}
.ch-hero-crumb h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;letter-spacing:-.02em;line-height:1.15;color:#fff;margin-bottom:6px;word-break:break-word}
.ch-hero-crumb .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.7);font-weight:500}
.ch-hero-crumb .meta span{display:inline-flex;align-items:center;gap:6px}
.ch-hero-crumb .meta i{width:13px;height:13px;color:var(--cy);flex-shrink:0}
.ch-hero-crumb .live-pill{background:#dc2626;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;text-transform:uppercase}
.ch-hero-crumb .live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}

main{flex:1;max-width:1480px;margin:0 auto;width:100%;padding:22px 20px 64px}
@media (max-width:560px){main{padding:14px 14px 44px}}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1024px){.layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rd);padding:18px;box-shadow:0 6px 20px rgba(10,15,20,.04)}
.card + .card{margin-top:14px}
.card-title{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--cy3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title i{width:14px;height:14px}
@media (max-width:560px){.card{padding:14px}}

/* PLAYER */
.nl-player-wrap{
  background:#000;border-radius:16px;overflow:hidden;
  border:1px solid var(--bd);
  box-shadow:0 16px 48px -12px rgba(10,15,20,.35);
  position:relative;
}
.nl-player{
  position:relative;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
}
.nl-player iframe,
.nl-player #ytPlayer,
.nl-player #ytPlayerHost iframe{
  position:absolute!important;
  inset:0;
  width:100%!important;
  height:100%!important;
  border:0;
  z-index:1!important;
  background:#000;
}
#ytPlayerHost{
  position:absolute;
  inset:0;
  z-index:1;
}

/* COUNTDOWN PILL (top-right, doesn't block player) */
.nl-cd-pill{
  position:absolute;
  top:12px;
  right:12px;
  z-index:6;
  display:none;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  background:rgba(10,15,20,.88);
  border:1px solid rgba(0,255,255,.4);
  border-radius:99px;
  color:#fff;
  font-family:var(--mono);
  font-size:11.5px;
  font-weight:900;
  letter-spacing:.04em;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.nl-cd-pill.show{display:inline-flex}
.nl-cd-pill .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--cy);
  animation:pulse 1.5s infinite;
}
.nl-cd-pill .lbl{
  font-family:var(--font);
  font-size:9.5px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--cy);
  opacity:.85;
}
@media (max-width:520px){
  .nl-cd-pill{top:8px;right:8px;padding:5px 9px;font-size:10.5px;gap:6px}
  .nl-cd-pill .lbl{font-size:8.5px}
}

/* PLAYER BARS */
.nl-player-topbar{
  position:absolute;top:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);
  pointer-events:none;
}
.nl-player-topbar .left{display:flex;align-items:center;gap:8px;min-width:0}
.nl-player-topbar .live-tag{
  background:#dc2626;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.08em;
  padding:4px 9px;border-radius:5px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:5px;
  pointer-events:none;
}
.nl-player-topbar .live-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
.nl-player-topbar .ch-pill{
  background:rgba(10,15,20,.7);border:1px solid rgba(0,255,255,.35);color:#fff;
  font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;backdrop-filter:blur(8px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;
  pointer-events:none;
}
.nl-player-topbar .wm{
  display:inline-flex;align-items:center;gap:6px;
  text-shadow:0 2px 8px rgba(0,0,0,.85);pointer-events:none;opacity:.85;
}
.nl-player-topbar .wm svg{width:15px;height:19px;flex-shrink:0;display:block}
.nl-player-topbar .wm span{font-weight:900;font-size:11px;letter-spacing:.12em;color:#fff;text-transform:uppercase}

.nl-player-bottombar{
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px;
  background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,0) 100%);
  pointer-events:none;
}
.nl-player-bottombar .controls{display:flex;gap:6px;align-items:center;pointer-events:auto}
.nl-ctrl{
  width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;
  border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;
  transition:.15s;backdrop-filter:blur(6px);flex-shrink:0;
}
.nl-ctrl:hover{background:var(--cy);color:#04161c;border-color:var(--cy);transform:scale(1.08)}
.nl-ctrl i{width:16px;height:16px}
.nl-player-bottombar .right{display:flex;gap:6px;align-items:center;pointer-events:auto}

.nl-curtain{
  position:absolute;inset:0;z-index:3;background:#000;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px;color:#fff;
}
.nl-curtain.show{display:flex}
.nl-curtain .ico{width:64px;height:64px;border-radius:50%;background:rgba(0,255,255,.15);border:2px solid rgba(0,255,255,.5);display:flex;align-items:center;justify-content:center}
.nl-curtain .ico i{width:28px;height:28px;color:var(--cy)}
.nl-curtain h3{font-size:1.1rem;font-weight:900;color:#fff;margin:0}
.nl-curtain p{font-size:13px;color:rgba(255,255,255,.7);max-width:340px;margin:0;line-height:1.55}

.tap-to-play{position:absolute;inset:0;z-index:4;background:radial-gradient(circle at 50% 40%, rgba(0,255,255,.08), transparent 60%),#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.tap-to-play.show{display:flex}
.tap-to-play .ttp-title{font-size:clamp(1rem,2.4vw,1.4rem);font-weight:900;color:#fff;letter-spacing:-.01em;max-width:80%;line-height:1.25}
.tap-to-play .ttp-sub{font-size:12px;color:rgba(255,255,255,.55);max-width:340px}
.tap-to-play .ttp-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;border:none;border-radius:99px;font-family:inherit;font-weight:900;font-size:14px;letter-spacing:.02em;cursor:pointer;box-shadow:0 16px 40px rgba(0,255,255,.4);transition:.2s}
.tap-to-play .ttp-btn:hover{transform:scale(1.05)}
.tap-to-play .ttp-btn i{width:20px;height:20px;stroke-width:2.6}

/* AD OVERLAY */
.nl-ad{position:absolute;inset:0;z-index:10;background:#000;display:none;flex-direction:column;overflow:hidden}
.nl-ad.show{display:flex}
.nl-ad-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.nl-ad-media video,.nl-ad-media img{width:100%;height:100%;object-fit:contain;display:block}
.nl-ad-topbar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 100%);pointer-events:none}
.nl-ad-topbar .lbl{background:linear-gradient(90deg,var(--cy),var(--cy2));color:#04161c;font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;pointer-events:auto;box-shadow:0 4px 14px rgba(0,255,255,.35)}
.nl-ad-topbar .lbl i{width:11px;height:11px}
.nl-ad-topbar .title{font-size:11.5px;font-weight:800;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.nl-ad-bottombar{position:absolute;bottom:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,0) 100%);pointer-events:none}
.nl-ad-cta{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;font-size:12.5px;font-weight:900;border-radius:11px;text-decoration:none;box-shadow:0 8px 22px rgba(0,255,255,.35);transition:.15s;border:none;font-family:inherit;cursor:pointer}
.nl-ad-cta:hover{transform:translateY(-2px)}
.nl-ad-cta i{width:14px;height:14px}
.nl-ad-skip{pointer-events:auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:800;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(8px);transition:.15s;font-family:inherit}
.nl-ad-skip:hover:not(:disabled){background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.45)}
.nl-ad-skip:disabled{opacity:.65;cursor:not-allowed}
.nl-ad-skip i{width:14px;height:14px}
.nl-ad-skip .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;background:rgba(255,255,255,.15);border-radius:6px;font-family:var(--mono);font-size:11px}
.nl-ad-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.15);z-index:13}
.nl-ad-progress > i{display:block;height:100%;background:var(--cy);border-radius:0 2px 2px 0;width:0%;transition:width .2s linear}

.house-ad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;width:100%;height:100%;background:radial-gradient(circle at 30% 30%, rgba(0,255,255,.18), transparent 55%),radial-gradient(circle at 75% 75%, rgba(0,204,204,.14), transparent 50%),linear-gradient(160deg,#0a0f14,#0f172a);color:#fff}
.house-ad .hh-brand{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.35);border-radius:99px}
.house-ad .hh-brand svg{width:22px;height:27px;display:block}
.house-ad .hh-brand .wm{font-weight:900;font-size:12px;letter-spacing:.1em;color:#e6ffff;text-transform:uppercase;line-height:1}
.house-ad .hh-t{font-size:15px;font-weight:900;letter-spacing:.02em;color:#fff;margin-top:4px}
.house-ad .hh-s{font-size:12.5px;color:rgba(255,255,255,.72);line-height:1.55;max-width:340px}
.house-ad .hh-cta{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;font-size:13px;font-weight:900;border-radius:11px;text-decoration:none;box-shadow:0 8px 22px rgba(0,255,255,.35);border:none;font-family:inherit;cursor:pointer}
.house-ad .hh-cta i{width:14px;height:14px}

.info-list{display:flex;flex-direction:column;gap:10px}
.info-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--tx2);line-height:1.5}
.info-row i{width:15px;height:15px;color:var(--cy3);flex-shrink:0;margin-top:3px}
.info-row .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:block;margin-bottom:2px}
.info-row .val{font-weight:700;color:var(--tx);word-break:break-word}

.free-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(0,255,255,.04));border:1px solid rgba(16,185,129,.3);border-radius:11px;margin-top:12px}
.free-note i{width:16px;height:16px;color:#059669;flex-shrink:0;margin-top:2px}
.free-note .t{font-size:12px;font-weight:800;color:#065f46;margin-bottom:2px}
.free-note .s{font-size:11px;color:#047857;line-height:1.5;font-weight:500}

.owner-actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.owner-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:10px;font-weight:800;font-size:12.5px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);transition:.15s;font-family:inherit;text-decoration:none;cursor:pointer}
.owner-btn:hover{border-color:var(--cy);color:var(--cy3)}
.owner-btn.danger{color:var(--dg);border-color:#fecaca;background:var(--dgf)}
.owner-btn.danger:hover{background:var(--dg);color:#fff;border-color:var(--dg)}
.owner-btn i{width:14px;height:14px}

.siblings-section{margin-top:22px}
.siblings-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.siblings-head h2{font-size:1.05rem;font-weight:900;color:var(--nv);letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.siblings-head h2 i{width:17px;height:17px;color:var(--cy3)}
.siblings-row{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -4px}
.siblings-row::-webkit-scrollbar{display:none}
.sibling-card{flex:0 0 260px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(15,23,42,.05);cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s ease;scroll-snap-align:start;display:flex;flex-direction:column}
.sibling-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(10,15,20,.12);border-color:var(--cy)}
.sibling-thumb{aspect-ratio:16/9;position:relative;overflow:hidden;background:linear-gradient(135deg,#0a0f14,#0f172a);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.sibling-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,15,20,.5),transparent 55%)}
.sibling-badge{position:absolute;top:10px;left:10px;z-index:3;font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.sibling-badge.live{background:#dc2626}
.sibling-badge.upcoming{background:rgba(10,15,20,.85);color:#67e8f9;border:1px solid rgba(103,232,249,.35)}
.sibling-badge.replay{background:rgba(139,92,246,.92)}
.sibling-badge.ended{background:rgba(71,85,105,.85)}
.sibling-body{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.sibling-title{font-size:14px;font-weight:800;line-height:1.25;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sibling-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);font-weight:500}
.sibling-meta i{width:12px;height:12px;color:var(--cy3);flex-shrink:0}

.state{max-width:560px;margin:60px auto;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:44px 32px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.state .ico{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.state .ico i{width:28px;height:28px}
.state h2{font-size:1.3rem;font-weight:900;color:var(--nv);margin-bottom:8px}
.state p{font-size:13.5px;color:var(--mut);margin-bottom:22px;line-height:1.6}
.state .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.state .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:11px;font-weight:800;font-size:13.5px;transition:.15s;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit}
.state .btn i{width:15px;height:15px}
.state .btn.primary{background:var(--cy);color:#04161c}
.state .btn.ghost{background:var(--sf2);border-color:var(--bd);color:var(--tx2)}

/* ══════════════════════════════════════════════════════════════
   BULLETPROOF YOUTUBE ID EXTRACTION
   Accepts: full URLs, short URLs, raw IDs, mobile URLs, share URLs
   ══════════════════════════════════════════════════════════════ */
function extractYouTubeId(input){
  if (!input) return null;
  var u = String(input).trim();

  // Raw 11-char ID
  if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;

  // Strip whitespace/newlines
  u = u.replace(/\s+/g, '');

  // Try every known pattern
  var patterns = [
    /(?:youtube\.com\/watch\?(?:.*&)?v=)([A-Za-z0-9_-]{11})/,
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/live\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/v\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/attribution_link\?.*v%3D)([A-Za-z0-9_-]{11})/,
    /(?:[?&]v=)([A-Za-z0-9_-]{11})/
  ];
  for (var i = 0; i < patterns.length; i++){
    var m = u.match(patterns[i]);
    if (m && m[1]) return m[1];
  }

  // Last resort — pull any 11-char token that could be a video ID
  var m2 = u.match(/([A-Za-z0-9_-]{11})/);
  if (m2 && m2[1]) return m2[1];

  return null;
}

/* ── PHASE ── */
function getTiming(){
  if (!streamData) return { valid:false };
  var dateStr = streamData.startDate || '';
  var timeStr = streamData.startTime || '00:00';
  var durMin = parseInt(streamData.durationMinutes, 10) || 90;
  if (!dateStr) return { valid:false };
  var startMs = new Date(dateStr + 'T' + timeStr + ':00').getTime();
  if (isNaN(startMs)) return { valid:false };
  var durMs = durMin * 60000;
  var endMs = startMs + durMs + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  return { valid:true, startMs:startMs, endMs:endMs, durationMs:durMs, replayUntilMs:replayMs };
}
function computePhase(){
  var t = getTiming();
  if (!t.valid) return 'unknown';
  var now = Date.now();
  if (now < t.startMs) return 'upcoming';
  if (now <= t.endMs) return 'live';
  if (now <= t.replayUntilMs && streamData.replayEnabled !== false) return 'replay';
  return 'ended';
}

  var durMin = parseInt(s.durationMinutes, 10) || 90;
  if (!dateStr) return 'upcoming';
  var startMs = new Date(dateStr + 'T' + timeStr + ':00').getTime();
  if (isNaN(startMs)) return 'upcoming';
  var endMs = startMs + durMin * 60000 + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  var now = Date.now();
  if (now < startMs) return 'upcoming';
  if (now <= endMs) return 'live';
  if (now <= replayMs && s.replayEnabled !== false) return 'replay';
  return 'ended';
}

/* ── PLAYER CONTROLS ── */
function wirePlayerControls(){
  var pp = $('ctrlPlayPause');
  var mute = $('ctrlMute');
  var fs = $('ctrlFullscreen');

  if (pp){
    pp.addEventListener('click', function(){
      if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
      var st = ytPlayer.getPlayerState();
      if (st === 1) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    });
  }
  if (mute){
    mute.addEventListener('click', function(){
      if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
      if (ytPlayer.isMuted()){
        ytPlayer.unMute();
        mute.innerHTML = icon('volume-2');
      } else {
        ytPlayer.mute();
        mute.innerHTML = icon('volume-x');
      }
      refreshIcons();
    });
  }
  if (fs){
    fs.addEventListener('click', function(){
      var wrap = $('nlPlayer');
      if (!wrap) return;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    });
  }
}

function setCurtain(html){
  var c = $('curtain');
  if (!c) return;
  c.innerHTML = html;
  c.classList.add('show');
  refreshIcons();
}
function hideCurtain(){
  var c = $('curtain');
  if (c) c.classList.remove('show');
}

/* ── PHASE UI ── */
function renderPhaseUI(){
  var liveTag = $('playerLiveTag');
  var crumbLive = $('crumbLivePill');
  if (currentPhase === 'live'){
    if (liveTag) liveTag.style.display = 'inline-flex';
    if (crumbLive) crumbLive.style.display = 'inline-flex';
  } else {
    if (liveTag) liveTag.style.display = 'none';
    if (crumbLive) crumbLive.style.display = 'none';
  }
}

/* ── COUNTDOWN PILL ── */
function updateCountdownPill(){
  var pill = $('cdPill');
  var text = $('cdText');
  if (!pill || !text) return;

  if (currentPhase !== 'upcoming'){
    pill.classList.remove('show');
    return;
  }

  var t = getTiming();
  if (!t.valid) return;

  var diff = t.startMs - Date.now();
  if (diff < 0) diff = 0;
  var s = Math.floor(diff / 1000);
  var d = Math.floor(s / 86400);
  var h = Math.floor((s % 86400) / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;

  var str;
  if (d > 0){
    str = d + 'd ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  } else {
    str = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }
  text.textContent = str;
  pill.classList.add('show');
}

function startTickers(){
  clearInterval(countdownTimer);
  clearInterval(phaseTickTimer);

  countdownTimer = setInterval(function(){
    updateCountdownPill();
  }, 1000);

  phaseTickTimer = setInterval(function(){
    var newPhase = computePhase();
    if (newPhase !== currentPhase){
      currentPhase = newPhase;
      renderPhaseUI();
      updateCountdownPill();
      if (newPhase === 'live'){
        /* Stream just went live — tell the YouTube player to load */
        if (ytReady && ytPlayer && typeof ytPlayer.playVideo === 'function'){
          try { ytPlayer.playVideo(); } catch(e){}
        }
        setupMidrollTimer();
      }
    }
  }, 5000);
}

/* ══════════════════════════════════════════════════════════════
   LOAD PLAYER — always tries to play
   ══════════════════════════════════════════════════════════════ */
function loadPlayer(){
  var host = $('ytPlayerHost');
  if (!host) return;
  host.innerHTML = '';

  var platform = streamData.streamPlatform || 'youtube';
  var url = (streamData.streamUrl || '').trim();

  console.log('[Novalink] Loading player. Platform:', platform, 'URL:', url);

  if (!url){
    setCurtain('<div class="ico"><i data-lucide="alert-triangle"></i></div><h3>Stream URL missing</h3><p>The host has not set a stream URL yet.</p>');
    return;
  }

  if (platform === 'youtube'){
    var vid = extractYouTubeId(url);
    console.log('[Novalink] Extracted YouTube ID:', vid);

    if (!vid){
      setCurtain('<div class="ico"><i data-lucide="alert-triangle"></i></div><h3>Invalid YouTube URL</h3><p>Could not extract a video ID from:<br><br><code style="font-size:11px;background:rgba(0,0,0,.3);padding:4px 8px;border-radius:4px;word-break:break-all;color:#fff;">' + esc(url) + '</code></p>');
      return;
    }

    /* Show loading curtain while YT API loads */
    setCurtain('<div class="ico"><i data-lucide="loader"></i></div><h3>Loading player…</h3><p>Connecting to YouTube.</p>');
    host.innerHTML = '<div id="ytPlayer"></div>';

    /* If YT API is ready, create player immediately */
    if (window.YT && window.YT.Player){
      createYTPlayer(vid);
    } else {
      window.onYouTubeIframeAPIReady = function(){ createYTPlayer(vid); };
    }
  } else {
    var embed = '';
    if (platform === 'twitch'){
      var ch = extractTwitchChannel(url);
      if (!ch){ setCurtain('<div class="ico"><i data-lucide="alert-triangle"></i></div><h3>Invalid Twitch URL</h3><p>Could not find a channel name.</p>'); return; }
      var parent = location.hostname || 'localhost';
      embed = 'https://player.twitch.tv/?channel=' + encodeURIComponent(ch) + '&parent=' + parent + '&autoplay=true&muted=true';
    } else if (platform === 'vimeo'){
      var vid2 = extractVimeoId(url);
      if (!vid2){ setCurtain('<div class="ico"><i data-lucide="alert-triangle"></i></div><h3>Invalid Vimeo URL</h3><p>Could not find a video ID.</p>'); return; }
      embed = 'https://player.vimeo.com/video/' + vid2 + '?autoplay=1&muted=1';
    } else if (platform === 'facebook'){
      embed = buildFacebookEmbed(url);
    } else {
      embed = url;
    }
    var iframe = document.createElement('iframe');
    iframe.src = embed;
    iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    iframe.setAttribute('allowfullscreen', '');
    iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = '0';
    host.appendChild(iframe);
    hideCurtain();
  }
}

/* ══════════════════════════════════════════════════════════════
   YOUTUBE PLAYER — aggressive autoplay
   ══════════════════════════════════════════════════════════════ */
function createYTPlayer(videoId){
  console.log('[Novalink] Creating YT player with ID:', videoId);

  ytPlayer = new YT.Player('ytPlayer', {
    videoId: videoId,
    playerVars: {
      autoplay: 1,
      mute: 1,
      rel: 0,
      playsinline: 1,
      iv_load_policy: 3,
      modestbranding: 1,
      controls: 1,
      disablekb: 0,
      color: 'white',
      origin: window.location.origin
    },
    events: {
      onReady: function(event){
        ytReady = true;
        console.log('[Novalink] YT player ready. Attempting autoplay.');
        hideCurtain();

        /* Force play with mute — standard autoplay pattern */
        try {
          event.target.mute();
          event.target.playVideo();
        } catch(e){ console.warn('[Novalink] playVideo error:', e); }

        /* Retry every 1s for 8 seconds — some browsers block the first attempt */
        var attempts = 0;
        clearInterval(autoplayRetryTimer);
        autoplayRetryTimer = setInterval(function(){
          attempts++;
          if (attempts > 8){ clearInterval(autoplayRetryTimer); return; }
          try {
            var state = event.target.getPlayerState();
            /* If not playing (1), try to play */
            if (state !== 1 && state !== 3){
              event.target.playVideo();
            } else {
              clearInterval(autoplayRetryTimer);
            }
          } catch(e){}
        }, 1000);
      },
      onStateChange: function(event){
        console.log('[Novalink] YT state change:', event.data);
        var pp = $('ctrlPlayPause');
        if (pp) pp.innerHTML = icon(event.data === 1 ? 'pause' : 'play');
        refreshIcons();

        /* If video ends and there's a postroll, fire it */
        if (event.data === 0){
          if (adSettings.postrollEnabled && streamData.postrollEnabled !== false && !adState.firedPostroll){
            adState.firedPostroll = true;
            showAd('postroll', function(){});
          }
        }

        /* YT error codes */
        if (event.data === -1 || event.data === 5 || event.data === 100 || event.data === 101 || event.data === 150){
          var errMsg = 'YouTube error ' + event.data;
          if (event.data === 100 || event.data === 101 || event.data === 150){
            errMsg = 'This video is private or does not allow embedding.';
          } else if (event.data === 5){
            errMsg = 'This video format is not supported by the player.';
          } else if (event.data === -1){
            errMsg = 'Waiting for the stream to start on YouTube…';
          }
          console.warn('[Novalink]', errMsg);
          /* For -1 (unstarted), don't show error — it's just waiting */
          if (event.data !== -1 && !(currentPhase === 'upcoming')){
            toast(errMsg, 'error', 5000);
          }
        }
      },
      onError: function(event){
        console.error('[Novalink] YT error:', event.data);
        var msg = 'YouTube error. ';
        if (event.data === 2){
          msg += 'Video ID is invalid.';
        } else if (event.data === 5){
          msg += 'HTML5 player cannot play this video.';
        } else if (event.data === 100){
          msg += 'Video not found or is private.';
        } else if (event.data === 101 || event.data === 150){
          msg += 'Video owner does not allow embedding.';
        } else {
          msg += 'Code: ' + event.data;
        }
        toast(msg, 'error', 6000);
      }
    }
  });
}

/* ══════════════════════════════════════════════════════════════
   MIDROLL
   ══════════════════════════════════════════════════════════════ */
function setupMidrollTimer(){
  clearTimeout(adState.midrollTimerId);
  if (!adSettings.midrollEnabled) return;
  if (streamData.midrollEnabled === false) return;
  if (adState.firedMidroll) return;

  var t = getTiming();
  if (!t.valid) return;
  if (currentPhase !== 'live') return;

  var midMin = parseInt(streamData.midrollMinute, 10) || adSettings.midrollMinute || 30;
  var fireAt = t.startMs + (midMin * 60000);
  var delay = Math.max(0, fireAt - Date.now());

  adState.midrollTimerId = setTimeout(function(){
    adState.firedMidroll = true;
    showAd('midroll', function(){});
  }, delay);
}

/* ══════════════════════════════════════════════════════════════
   ADS
   ══════════════════════════════════════════════════════════════ */
function loadAdsAndMaybePlay(){
  var settingsPromise = db.collection(SETTINGS).doc(SETTINGS_DOC).get().then(function(snap){
    if (snap.exists) adSettings = Object.assign({}, AD_DEFAULTS, snap.data() || {});
  }).catch(function(){});

  var poolPromise = db.collection(ADS).where('active', '==', true).limit(50).get().then(function(snap){
    adPool = { preroll: [], midroll: [], postroll: [] };
    var now = Date.now();
    snap.forEach(function(doc){
      var d = doc.data() || {};
      d.id = doc.id;
      if (d.startDate){
        var s = new Date(d.startDate + 'T00:00').getTime();
        if (!isNaN(s) && now < s) return;
      }
      if (d.endDate){
        var e = new Date(d.endDate + 'T23:59:59').getTime();
        if (!isNaN(e) && now > e) return;
      }
      var t = d.type || 'any';
      if (t === 'preroll' || t === 'any') adPool.preroll.push(d);
      if (t === 'midroll' || t === 'any') adPool.midroll.push(d);
      if (t === 'postroll' || t === 'any') adPool.postroll.push(d);
    });
  }).catch(function(){});

  Promise.all([settingsPromise, poolPromise]).then(function(){
    /* Pre-roll only fires when the stream is live */
    if (currentPhase === 'live'){
      if (adSettings.prerollEnabled && streamData.prerollEnabled !== false && !adState.firedPreroll){
        adState.firedPreroll = true;
        showAd('preroll', function(){});
      }
    }
  });
}

function getRecentAdIds(){
  try {
    var raw = sessionStorage.getItem('nl_recent_ads');
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function rememberAd(adId){
  var recent = getRecentAdIds();
  recent.push(adId);
  if (recent.length > RECENT_ADS_MAX) recent = recent.slice(-RECENT_ADS_MAX);
  try { sessionStorage.setItem('nl_recent_ads', JSON.stringify(recent)); } catch(e){}
}

function pickAd(slot){
  var pool = adPool[slot] || [];
  if (!pool.length) return null;
  var recent = getRecentAdIds();
  var fresh = pool.filter(function(ad){ return recent.indexOf(ad.id) === -1; });
  if (!fresh.length) fresh = pool;
  var total = fresh.reduce(function(sum, ad){ return sum + (ad.weight || 1); }, 0);
  var r = Math.random() * total;
  var acc = 0;
  for (var i = 0; i < fresh.length; i++){
    acc += fresh[i].weight || 1;
    if (r <= acc) return fresh[i];
  }
  return fresh[0];
}

function trackAdEvent(ad, type){
  if (!ad || !ad.id) return;
  try {
    var update = {};
    if (type === 'impression') update.impressions = firebase.firestore.FieldValue.increment(1);
    if (type === 'click') update.clicks = firebase.firestore.FieldValue.increment(1);
    db.collection(ADS).doc(ad.id).update(update).catch(function(){});
  } catch(e){}
}

function showAd(slot, onComplete){
  var overlay = $('adOverlay');
  var media = $('adMedia');
  var title = $('adTitle');
  var cta = $('adCta');
  var ctaLabel = $('adCtaLabel');
  var skipBtn = $('adSkip');
  var skipText = $('adSkipText');
  var countdown = $('adCountdown');
  var progressFill = $('adProgressFill');

  if (!overlay || !media) { if (onComplete) onComplete(); return; }

  var ad = pickAd(slot);
  overlay.classList.add('show');
  media.innerHTML = '';
  progressFill.style.width = '0%';

  var skipAfter = parseInt(adSettings.skipAfterSeconds, 10) || 5;

  if (ad){
    title.textContent = ad.title || 'Advertisement';
    cta.href = ad.clickUrl || '#';
    ctaLabel.textContent = ad.ctaLabel || 'Learn more';

    if (ad.mediaType === 'video' && ad.mediaUrl){
      var vid = document.createElement('video');
      vid.src = ad.mediaUrl;
      vid.autoplay = true;
      vid.muted = false;
      vid.playsInline = true;
      vid.setAttribute('playsinline', '');
      media.appendChild(vid);

      vid.addEventListener('timeupdate', function(){
        if (vid.duration) progressFill.style.width = ((vid.currentTime / vid.duration) * 100) + '%';
      });
      vid.addEventListener('ended', function(){
        hideAd();
        if (onComplete) onComplete();
      });
      vid.addEventListener('error', function(){
        media.innerHTML = '';
        media.appendChild(buildHouseAd());
      });
    } else if (ad.mediaUrl){
      var img = document.createElement('img');
      img.src = ad.mediaUrl;
      img.alt = ad.title || 'Ad';
      media.appendChild(img);
    } else {
      media.appendChild(buildHouseAd());
    }
    trackAdEvent(ad, 'impression');
    rememberAd(ad.id);

    if (typeof ad.skipAfterSeconds === 'number'){
      skipAfter = ad.skipAfterSeconds;
    }
  } else {
    title.textContent = adSettings.houseAdTitle || 'Advertise on Novalink';
    cta.href = adSettings.houseAdUrl || 'mailto:ads@novalink.com';
    ctaLabel.textContent = adSettings.houseAdCtaLabel || 'Advertise here';
    media.appendChild(buildHouseAd());
  }

  cta.onclick = function(){ if (ad) trackAdEvent(ad, 'click'); };

  if (skipAfter === -1){
    skipBtn.disabled = true;
    skipText.textContent = 'Ad';
    countdown.textContent = '';
  } else {
    var remaining = skipAfter;
    skipBtn.disabled = true;
    skipText.textContent = 'Skip in';
    countdown.textContent = remaining;
    clearInterval(adState.countdownTimerId);
    adState.countdownTimerId = setInterval(function(){
      remaining--;
      if (remaining <= 0){
        clearInterval(adState.countdownTimerId);
        skipBtn.disabled = false;
        skipText.textContent = 'Skip ad';
        countdown.textContent = '';
      } else {
        countdown.textContent = remaining;
      }
    }, 1000);
  }

  skipBtn.onclick = function(){
    if (skipBtn.disabled) return;
    hideAd();
    if (onComplete) onComplete();
  };

  if (!(ad && ad.mediaType === 'video')){
    clearTimeout(adState.skipTimerId);
    adState.skipTimerId = setTimeout(function(){
      hideAd();
      if (onComplete) onComplete();
    }, 10000);
  }
  refreshIcons();
}

function hideAd(){
  var overlay = $('adOverlay');
  if (!overlay) return;
  overlay.classList.remove('show');
  var media = $('adMedia');
  if (media) media.innerHTML = '';
  clearInterval(adState.countdownTimerId);
  clearTimeout(adState.skipTimerId);
}

function buildHouseAd(){
  var wrap = document.createElement('div');
  wrap.className = 'house-ad';
  wrap.innerHTML =
    '<div class="hh-brand">' +
      '<svg viewBox="0 0 60 74" aria-hidden="true"><path fill="#3a5a8c" d="M34.5 4.2c-8.1 0-14.7 6.6-14.7 14.7v3.4c0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9v-3.4c0-4.9 4-8.9 8.9-8.9 4.9 0 8.9 4 8.9 8.9 0 3-1.5 5.7-3.9 7.3-1.4.9-1.8 2.8-.9 4.2.9 1.4 2.8 1.8 4.2.9 4.3-2.7 6.9-7.4 6.9-12.4 0-8.1-6.6-14.7-14.7-14.7z"/><path fill="#00FFFF" d="M25.5 69.8c8.1 0 14.7-6.6 14.7-14.7v-3.4c0-1.6-1.3-2.9-2.9-2.9s-2.9 1.3-2.9 2.9v3.4c0 4.9-4 8.9-8.9 8.9-4.9 0-8.9-4-8.9-8.9 0-3 1.5-5.7 3.9-7.3 1.4-.9 1.8-2.8.9-4.2-.9-1.4-2.8-1.8-4.2-.9-4.3 2.7-6.9 7.4-6.9 12.4 0 8.1 6.6 14.7 14.7 14.7z"/></svg>' +
      '<span class="wm">Novalink</span>' +
    '</div>' +
    '<div class="hh-t">'+esc(adSettings.houseAdTitle || 'Advertise on Novalink')+'</div>' +
    '<div class="hh-s">'+esc(adSettings.houseAdText || 'Reach thousands of live viewers.')+'</div>' +
    '<a class="hh-cta" href="'+esc(adSettings.houseAdUrl || 'mailto:ads@novalink.com')+'" target="_blank" rel="noopener">' +
      icon('message-circle') + ' ' + esc(adSettings.houseAdCtaLabel || 'Advertise here') +
    '</a>';
  return wrap;
}

/* ══════════════════════════════════════════════════════════════
   LOAD
   ══════════════════════════════════════════════════════════════ */
function load(){
  streamId = getParam('id');
  if (!streamId){ renderError('No stream specified', 'This page needs a stream ID.'); return; }

  db.collection(STREAMS).doc(streamId).get()
    .then(function(doc){
      if (!doc.exists){ renderError('Stream not found', 'This stream may have been deleted.'); return; }
      streamData = doc.data() || {};
      streamData.id = doc.id;

      var chId = streamData.channelId;
      var chPromise = chId
        ? db.collection(CHANNELS).doc(chId).get().then(function(cs){
            if (cs.exists){
              channelData = cs.data() || {};
              channelData.id = cs.id;
            }
          }).catch(function(){})
        : Promise.resolve();

      var sibPromise = chId
        ? db.collection(STREAMS).where('channelId', '==', chId).limit(20).get().then(function(snap){
            siblingStreams = [];
            snap.forEach(function(s){
              var d = s.data() || {};
              if (s.id === streamId) return;
              d.id = s.id;
              siblingStreams.push(d);
            });
            siblingStreams.sort(function(a, b){
              var rank = { live:0, upcoming:1, replay:2, ended:3 };
              return (rank[computeStreamPhase(a)] || 4) - (rank[computeStreamPhase(b)] || 4);
            });
          }).catch(function(){})
        : Promise.resolve();

      Promise.all([chPromise, sibPromise]).then(function(){
        currentPhase = computePhase();
        renderPage();
      });
    })
    .catch(function(err){
      console.error('[load]', err);
      renderError('Could not load', err.message || 'Please try again.');
    });
}

/* ── BOOT ── */
document.addEventListener('DOMContentLoaded', function(){
  refreshIcons();
  $('signInBtn').addEventListener('click', function(){ window.location.href = 'index.html#signin'; });
  $('userChip').addEventListener('click', function(){
    if (!currentUser) return;
    if (confirm('Sign out of ' + (currentUser.email || 'your account') + '?')){
      auth.signOut().then(function(){ toast('Signed out.', 'success'); });
    }
  });
  auth.onAuthStateChanged(function(user){ applyAuth(user); });
  load();
});

window.addEventListener('beforeunload', function(){
  if (countdownTimer) clearInterval(countdownTimer);
  if (phaseTickTimer) clearInterval(phaseTickTimer);
  if (autoplayRetryTimer) clearInterval(autoplayRetryTimer);
  clearTimeout(adState.midrollTimerId);
  clearInterval(adState.countdownTimerId);
  clearTimeout(adState.skipTimerId);
});
})();
