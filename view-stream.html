<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f14" />
<title>Stream · Novalink</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --cy:#00FFFF;--cy2:#00CCCC;--cy3:#009999;--cyf:#e6ffff;
  --bg:#f6f8fb;--sf:#ffffff;--sf2:#f1f4f8;
  --bd:#e4e9f0;--bd2:#d3dbe5;
  --tx:#0a0f14;--tx2:#2b3644;--mut:#6b7787;
  --rd:14px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --dg:#dc2626;--dgf:#fef2f2;--sv:#059669;--svf:#ecfdf5;--nv:#1e2f4d;
  --ink:#0a0f14;
  --ease:cubic-bezier(0.25,0.8,0.25,1);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.container{max-width:1480px;margin:0 auto;padding:0 20px;width:100%}
h1,h2,h3{line-height:1.15;font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;font-family:inherit;cursor:pointer;touch-action:manipulation}

.site-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 0;position:sticky;top:0;z-index:40}
.hdr{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:11px;flex-shrink:0;color:var(--nv)}
.logo svg{width:26px;height:32px;display:block}
.logo b{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.hdr-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-size:12.5px;font-weight:800;transition:.15s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--cy);background:#fff;box-shadow:0 0 0 3px rgba(0,255,255,.14)}
.hdr-btn i{width:14px;height:14px}
.hdr-btn .avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;font-family:var(--mono)}
@media (max-width:520px){.hdr-btn .lbl{display:none}}

.ch-hero-crumb{background:#0a0f14;color:#fff;padding:20px 0 22px;position:relative;overflow:hidden}
.ch-hero-crumb::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:20px 20px;pointer-events:none}
.ch-hero-crumb-in{max-width:1480px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.ch-hero-crumb .crumb{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px}
.ch-hero-crumb .crumb:hover{color:var(--cy)}
.ch-hero-crumb .crumb i{width:13px;height:13px}
.ch-hero-crumb h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;letter-spacing:-.02em;line-height:1.15;color:#fff;margin-bottom:6px;word-break:break-word}
.ch-hero-crumb .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.7);font-weight:500}
.ch-hero-crumb .meta span{display:inline-flex;align-items:center;gap:6px}
.ch-hero-crumb .meta i{width:13px;height:13px;color:var(--cy);flex-shrink:0}
.ch-hero-crumb .live-pill{background:#dc2626;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;text-transform:uppercase}
.ch-hero-crumb .live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}

main{flex:1;max-width:1480px;margin:0 auto;width:100%;padding:22px 20px 64px}
@media (max-width:560px){main{padding:14px 14px 44px}}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1024px){.layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rd);padding:18px;box-shadow:0 6px 20px rgba(10,15,20,.04)}
.card + .card{margin-top:14px}
.card-title{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--cy3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title i{width:14px;height:14px}
@media (max-width:560px){.card{padding:14px}}

/* PLAYER */
.nl-player-wrap{background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 16px 48px -12px rgba(10,15,20,.35);position:relative;}
.nl-player{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;}
.nl-player iframe,.nl-player #ytPlayer,.nl-player #ytPlayerHost iframe{position:absolute!important;inset:0;width:100%!important;height:100%!important;border:0;z-index:1!important;background:#000;}
#ytPlayerHost{position:absolute;inset:0;z-index:1;}

/* AUTO-HIDE */
.nl-player-topbar,.nl-player-bottombar,.nl-cd-pill{transition:opacity .4s ease, transform .4s ease;}
.nl-player.hide-controls .nl-player-topbar{opacity:0;transform:translateY(-8px);pointer-events:none;}
.nl-player.hide-controls .nl-player-bottombar{opacity:0;transform:translateY(8px);pointer-events:none;}
.nl-player.hide-controls .nl-cd-pill{opacity:0;pointer-events:none;}
.nl-player.hide-cursor{cursor:none;}

/* COUNTDOWN PILL */
.nl-cd-pill{position:absolute;top:12px;right:12px;z-index:6;display:none;align-items:center;gap:8px;padding:7px 12px;background:rgba(10,15,20,.88);border:1px solid rgba(0,255,255,.4);border-radius:99px;color:#fff;font-family:var(--mono);font-size:11.5px;font-weight:900;letter-spacing:.04em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.4);}
.nl-cd-pill.show{display:inline-flex}
.nl-cd-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:pulse 1.5s infinite;}
.nl-cd-pill .lbl{font-family:var(--font);font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);opacity:.85;}
@media (max-width:520px){.nl-cd-pill{top:8px;right:8px;padding:5px 9px;font-size:10.5px;gap:6px;}.nl-cd-pill .lbl{font-size:8.5px}}

/* PLAYER BARS */
.nl-player-topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);pointer-events:none;}
.nl-player-topbar .left{display:flex;align-items:center;gap:8px;min-width:0}
.nl-player-topbar .live-tag{background:#dc2626;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:4px 9px;border-radius:5px;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;pointer-events:none;}
.nl-player-topbar .live-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
.nl-player-topbar .ch-pill{background:rgba(10,15,20,.7);border:1px solid rgba(0,255,255,.35);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;pointer-events:none;}
.nl-player-topbar .wm{display:inline-flex;align-items:center;gap:6px;text-shadow:0 2px 8px rgba(0,0,0,.85);pointer-events:none;opacity:.85;}
.nl-player-topbar .wm svg{width:15px;height:19px;flex-shrink:0;display:block}
.nl-player-topbar .wm span{font-weight:900;font-size:11px;letter-spacing:.12em;color:#fff;text-transform:uppercase}

.nl-player-bottombar{position:absolute;bottom:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,0) 100%);pointer-events:none;}
.nl-player-bottombar .controls{display:flex;gap:6px;align-items:center;pointer-events:auto;flex-wrap:wrap}
.nl-ctrl{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;transition:.15s;backdrop-filter:blur(6px);flex-shrink:0;font-size:11px;font-weight:900;letter-spacing:-1px;}
.nl-ctrl:hover{background:var(--cy);color:#04161c;border-color:var(--cy);transform:scale(1.08)}
.nl-ctrl:active{transform:scale(.95)}
.nl-ctrl i{width:16px;height:16px}
.nl-ctrl.seek{font-family:var(--mono);font-size:13px;letter-spacing:-2px;padding-right:2px;}
.nl-ctrl.jump-live{width:auto;padding:0 14px;border-radius:99px;font-size:11.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#04161c;background:linear-gradient(135deg,var(--cy),var(--cy2));border-color:var(--cy);display:none;align-items:center;gap:6px;height:36px;}
.nl-ctrl.jump-live.show{display:inline-flex}
.nl-ctrl.jump-live::before{content:'';width:7px;height:7px;border-radius:50%;background:#04161c;animation:pulse 1.2s infinite;}
.nl-ctrl.jump-live:hover{background:linear-gradient(135deg,#fff,#cffafe);transform:translateY(-1px);}
.nl-player-bottombar .right{display:flex;gap:6px;align-items:center;pointer-events:auto}

/* FULL-SCREEN CURTAIN (Novalink branded loading / offline / ended) */
.nl-curtain{
  position:absolute;inset:0;z-index:20;background:
    radial-gradient(circle at 78% 30%, rgba(0,255,255,.12), transparent 55%),
    radial-gradient(circle at 22% 82%, rgba(0,255,255,.06), transparent 45%),
    linear-gradient(160deg,#0a0f14 0%,#0f172a 45%,#0a0f14 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;text-align:center;padding:32px 24px;color:#fff;overflow:hidden;
}
.nl-curtain.show{display:flex}
.nl-curtain::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.04) 1px, transparent 0);
  background-size:24px 24px;pointer-events:none;
}
.nl-curtain .nc-logo{
  width:80px;height:100px;display:block;
  animation:ncFloat 2.8s ease-in-out infinite;
  filter:drop-shadow(0 8px 28px rgba(0,255,255,.4));
  position:relative;z-index:1;
}
@keyframes ncFloat{
  0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 8px 28px rgba(0,255,255,.4));}
  50%{transform:translateY(-6px) scale(1.04);filter:drop-shadow(0 12px 34px rgba(0,255,255,.6));}
}
.nl-curtain .nc-brand{
  font-weight:900;font-size:13px;letter-spacing:.32em;
  color:var(--cy);text-transform:uppercase;position:relative;z-index:1;
  text-shadow:0 2px 12px rgba(0,255,255,.4);
}
.nl-curtain .nc-title{
  font-size:clamp(1.05rem,2.4vw,1.35rem);
  font-weight:900;color:#fff;margin-top:4px;position:relative;z-index:1;
}
.nl-curtain .nc-sub{
  font-size:13px;color:rgba(255,255,255,.6);
  max-width:380px;line-height:1.55;position:relative;z-index:1;
}
.nl-curtain .nc-progress{
  width:180px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.1);overflow:hidden;
  position:relative;z-index:1;margin-top:6px;
}
.nl-curtain .nc-progress > i{
  display:block;height:100%;
  background:linear-gradient(90deg,transparent,var(--cy),transparent);
  animation:ncSlide 1.6s ease-in-out infinite;
}
@keyframes ncSlide{
  0%{transform:translateX(-100%);}
  100%{transform:translateX(100%);}
}
.nl-curtain .nc-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 13px;border-radius:99px;
  background:rgba(0,255,255,.1);
  border:1px solid rgba(0,255,255,.35);
  font-size:10.5px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--cy);
  position:relative;z-index:1;
}
.nl-curtain .nc-badge i{width:12px;height:12px;}

/* OFFLINE OVERLAY (specifically for network loss) */
.nl-offline{
  position:absolute;inset:0;z-index:25;
  background:linear-gradient(160deg,#0a0f14 0%,#111827 50%,#0a0f14 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:32px 24px;color:#fff;
}
.nl-offline.show{display:flex}
.nl-offline .off-ico{
  width:72px;height:72px;border-radius:50%;
  background:rgba(220,38,38,.15);
  border:2px solid rgba(220,38,38,.5);
  display:flex;align-items:center;justify-content:center;
  color:#fca5a5;position:relative;
}
.nl-offline .off-ico::after{
  content:'';position:absolute;inset:-8px;
  border-radius:50%;border:1px dashed rgba(252,165,165,.35);
  animation:spinSlow 8s linear infinite;
}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.nl-offline .off-ico i{width:32px;height:32px}
.nl-offline .off-title{
  font-size:clamp(1.05rem,2.4vw,1.4rem);
  font-weight:900;color:#fff;
}
.nl-offline .off-sub{
  font-size:13px;color:rgba(255,255,255,.65);
  max-width:360px;line-height:1.55;
}
.nl-offline .off-status{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:99px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  font-size:11.5px;font-weight:800;color:rgba(255,255,255,.85);
  letter-spacing:.04em;
}
.nl-offline .off-status .pulse{
  width:7px;height:7px;border-radius:50%;
  background:#fca5a5;animation:pulse 1.2s infinite;
}

/* AD OVERLAY */
.nl-ad{position:absolute;inset:0;z-index:10;background:#000;display:none;flex-direction:column;overflow:hidden}
.nl-ad.show{display:flex}
.nl-ad-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.nl-ad-media video,.nl-ad-media img{width:100%;height:100%;object-fit:contain;display:block}
.nl-ad-topbar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 100%);pointer-events:none}
.nl-ad-topbar .lbl{background:linear-gradient(90deg,var(--cy),var(--cy2));color:#04161c;font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;pointer-events:auto;box-shadow:0 4px 14px rgba(0,255,255,.35)}
.nl-ad-topbar .lbl i{width:11px;height:11px}
.nl-ad-topbar .title{font-size:11.5px;font-weight:800;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.nl-ad-bottombar{position:absolute;bottom:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,0) 100%);pointer-events:none}
.nl-ad-cta{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;font-size:12.5px;font-weight:900;border-radius:11px;text-decoration:none;box-shadow:0 8px 22px rgba(0,255,255,.35);transition:.15s;border:none;font-family:inherit;cursor:pointer}
.nl-ad-cta:hover{transform:translateY(-2px)}
.nl-ad-cta i{width:14px;height:14px}
.nl-ad-skip{pointer-events:auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:800;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(8px);transition:.15s;font-family:inherit}
.nl-ad-skip:hover:not(:disabled){background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.45)}
.nl-ad-skip:disabled{opacity:.65;cursor:not-allowed}
.nl-ad-skip i{width:14px;height:14px}
.nl-ad-skip .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;background:rgba(255,255,255,.15);border-radius:6px;font-family:var(--mono);font-size:11px}
.nl-ad-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.15);z-index:13}
.nl-ad-progress > i{display:block;height:100%;background:var(--cy);border-radius:0 2px 2px 0;width:0%;transition:width .2s linear}

.house-ad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;width:100%;height:100%;background:radial-gradient(circle at 30% 30%, rgba(0,255,255,.18), transparent 55%),radial-gradient(circle at 75% 75%, rgba(0,204,204,.14), transparent 50%),linear-gradient(160deg,#0a0f14,#0f172a);color:#fff}
.house-ad .hh-brand{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.35);border-radius:99px}
.house-ad .hh-brand svg{width:22px;height:27px;display:block}
.house-ad .hh-brand .wm{font-weight:900;font-size:12px;letter-spacing:.1em;color:#e6ffff;text-transform:uppercase;line-height:1}
.house-ad .hh-t{font-size:15px;font-weight:900;letter-spacing:.02em;color:#fff;margin-top:4px}
.house-ad .hh-s{font-size:12.5px;color:rgba(255,255,255,.72);line-height:1.55;max-width:340px}
.house-ad .hh-cta{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;font-size:13px;font-weight:900;border-radius:11px;text-decoration:none;box-shadow:0 8px 22px rgba(0,255,255,.35);border:none;font-family:inherit;cursor:pointer}
.house-ad .hh-cta i{width:14px;height:14px}

/* QUEUE BANNER (shown above player during gap ads) */
.nl-queue-banner{
  position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
  z-index:14;display:none;align-items:center;gap:12px;
  padding:10px 18px;border-radius:99px;
  background:rgba(10,15,20,.92);
  border:1px solid rgba(0,255,255,.4);
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  backdrop-filter:blur(12px);
  color:#fff;max-width:calc(100% - 40px);
}
.nl-queue-banner.show{display:inline-flex}
.nl-queue-banner .qb-dot{
  width:8px;height:8px;border-radius:50%;background:var(--cy);
  animation:pulse 1.2s infinite;flex-shrink:0;
}
.nl-queue-banner .qb-lbl{
  font-size:9.5px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--cy);
}
.nl-queue-banner .qb-title{
  font-size:12.5px;font-weight:800;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:220px;
}
.nl-queue-banner .qb-time{
  font-family:var(--mono);font-size:12px;font-weight:900;
  color:#fff;background:rgba(0,255,255,.12);
  padding:3px 10px;border-radius:8px;flex-shrink:0;
}
@media (max-width:520px){
  .nl-queue-banner{bottom:50px;padding:8px 14px;gap:8px}
  .nl-queue-banner .qb-title{max-width:120px;font-size:11.5px}
  .nl-queue-banner .qb-time{font-size:11px;padding:2px 8px}
}

.info-list{display:flex;flex-direction:column;gap:10px}
.info-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--tx2);line-height:1.5}
.info-row i{width:15px;height:15px;color:var(--cy3);flex-shrink:0;margin-top:3px}
.info-row .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:block;margin-bottom:2px}
.info-row .val{font-weight:700;color:var(--tx);word-break:break-word}

function formatDate(dateStr, timeStr){
  if (!dateStr) return 'Date TBA';
  try {
    var d = new Date(dateStr + 'T' + (timeStr || '00:00'));
    if (isNaN(d.getTime())) return dateStr;
    var opts = { weekday:'short', day:'numeric', month:'short', year:'numeric' };
    var out = d.toLocaleDateString('en-ZA', opts);
    if (timeStr) out += ' · ' + timeStr;
    return out;
  } catch(e){ return dateStr; }
}

function extractYouTubeId(input){
  if (!input) return null;
  var u = String(input).trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  u = u.replace(/\s+/g, '');
  var patterns = [
    /(?:youtube\.com\/watch\?(?:.*&)?v=)([A-Za-z0-9_-]{11})/,
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/live\/)([A-Za-z0-9_-]{11})/,

    /(?:[?&]v=)([A-Za-z0-9_-]{11})/
  ];
  for (var i = 0; i < patterns.length; i++){
    var m = u.match(patterns[i]);
    if (m && m[1]) return m[1];
  }

  return null;
}

function getTiming(){
  if (!streamData) return { valid:false };
  var dateStr = streamData.startDate || '';
  var timeStr = streamData.startTime || '00:00';
  var durMin = parseInt(streamData.durationMinutes, 10) || 90;
  if (!dateStr) return { valid:false };
  var startMs = new Date(dateStr + 'T' + timeStr + ':00').getTime();
  if (isNaN(startMs)) return { valid:false };
  var durMs = durMin * 60000;
  var endMs = startMs + durMs + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  return { valid:true, startMs:startMs, endMs:endMs, durationMs:durMs, replayUntilMs:replayMs };
}
function computePhase(){
  var t = getTiming();
  if (!t.valid) return 'unknown';
  var now = Date.now();
  if (now < t.startMs) return 'upcoming';
  if (now <= t.endMs) return 'live';
  if (now <= t.replayUntilMs && streamData.replayEnabled !== false) return 'replay';
  return 'ended';
}

function renderSiblings(){
  var row = $('siblingsRow');
  if (!row || !siblingStreams.length) return;
  row.innerHTML = '';
  siblingStreams.forEach(function(s){
    var card = document.createElement('div');
    card.className = 'sibling-card';
    var st = computeStreamPhase(s);
    var badge = 'upcoming', label = 'Upcoming';
    if (st === 'live'){ badge = 'live'; label = 'Live'; }
    else if (st === 'replay'){ badge = 'replay'; label = 'Replay'; }
    else if (st === 'ended'){ badge = 'ended'; label = 'Ended'; }
    var title = s.streamTitle || s.eventName || 'Untitled Stream';
    var dateStr = formatDate(s.startDate, s.startTime);
    var thumbStyle = s.heroImage ? "background-image:url('"+esc(s.heroImage)+"');background-size:cover;background-position:center;" : '';
    card.innerHTML =
      '<div class="sibling-thumb" style="'+thumbStyle+'">' +
        '<span class="sibling-badge '+badge+'">'+esc(label)+'</span>' +
      '</div>' +

        '<div class="sibling-title">'+esc(title)+'</div>' +
        '<div class="sibling-meta">'+icon('calendar')+' <span>'+esc(dateStr)+'</span></div>' +
      '</div>';
    card.addEventListener('click', function(){ window.location.href = 'view-stream.html?id=' + encodeURIComponent(s.id); });
    row.appendChild(card);
  });
  refreshIcons();
}

function computeStreamPhase(s){
  var dateStr = s.startDate || '';
  var timeStr = s.startTime || '00:00';
  var durMin = parseInt(s.durationMinutes, 10) || 90;
  if (!dateStr) return 'upcoming';
  var startMs = new Date(dateStr + 'T' + timeStr + ':00').getTime();
  if (isNaN(startMs)) return 'upcoming';
  var endMs = startMs + durMin * 60000 + 15 * 60000;
  var replayMs = endMs + REPLAY_DAYS * 86400000;
  var now = Date.now();
  if (now < startMs) return 'upcoming';
  if (now <= endMs) return 'live';
  if (now <= replayMs && s.replayEnabled !== false) return 'replay';
  return 'ended';
}
function streamStartMs(s){
  if (!s.startDate) return Infinity;
  var t = new Date(s.startDate + 'T' + (s.startTime || '00:00') + ':00').getTime();
  return isNaN(t) ? Infinity : t;
}
function streamEndMs(s){
  var start = streamStartMs(s);
  if (!isFinite(start)) return 0;
  var dur = (parseInt(s.durationMinutes, 10) || 90) * 60000;
  return start + dur + 15 * 60000;
}

/* ══════════════════════════════════════════════════════════════
   NETWORK LISTENERS
   ══════════════════════════════════════════════════════════════ */
function wireNetworkListeners(){
  if (wireNetworkListeners._bound) return;
  wireNetworkListeners._bound = true;

  window.addEventListener('offline', handleOffline);
  window.addEventListener('online', handleOnline);

  /* Initial check */
  if (!navigator.onLine) handleOffline();
}

function handleOffline(){
  isOffline = true;
  var ov = $('offlineOverlay');
  if (ov) ov.classList.add('show');
  /* Pause player to preserve state */
  try { if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); } catch(e){}
}

function handleOnline(){
  isOffline = false;
  var ov = $('offlineOverlay');
  if (ov) ov.classList.remove('show');
  toast('Back online', 'success', 2000);
  /* Resume */
  if (mode === 'gap-ads'){
    startGapAdLoop();
  } else if (mode === 'normal'){
    try {
      if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
    } catch(e){}
  }
}

/* ══════════════════════════════════════════════════════════════
   AUTO-HIDE CONTROLS
   ══════════════════════════════════════════════════════════════ */
function wireControlsAutoHide(){
  var player = $('nlPlayer');
  if (!player) return;

  function showControls(){
    player.classList.remove('hide-controls');
    player.classList.remove('hide-cursor');
    resetHideTimer();
  }
  function resetHideTimer(){
    clearTimeout(controlsHideTimer);
    controlsHideTimer = setTimeout(function(){
      var adOverlay = $('adOverlay');
      if (adOverlay && adOverlay.classList.contains('show')) return;
      var curtain = $('curtain');
      if (curtain && curtain.classList.contains('show')) return;
      var offline = $('offlineOverlay');
      if (offline && offline.classList.contains('show')) return;
      player.classList.add('hide-controls');
      player.classList.add('hide-cursor');
    }, CONTROLS_HIDE_MS);
  }

  ['mousemove','mousedown','touchstart','touchmove','click','keydown'].forEach(function(evt){
    player.addEventListener(evt, showControls, { passive: true });
  });
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') showControls();
  });
  resetHideTimer();
}

/* ══════════════════════════════════════════════════════════════
   PLAYER CONTROLS
   ══════════════════════════════════════════════════════════════ */
function wirePlayerControls(){
  var pp = $('ctrlPlayPause');
  var mute = $('ctrlMute');
  var fs = $('ctrlFullscreen');
  var back = $('ctrlSeekBack');
  var fwd = $('ctrlSeekForward');
  var jumpLive = $('ctrlJumpLive');

  function safePlayer(){
    if (!ytPlayer) return null;
    if (typeof ytPlayer.getPlayerState !== 'function') return null;
    return ytPlayer;
  }

  if (pp) pp.addEventListener('click', function(){
    var p = safePlayer(); if (!p) return;
    var st = p.getPlayerState();
    if (st === 1) p.pauseVideo(); else p.playVideo();
  });
  if (mute) mute.addEventListener('click', function(){
    var p = safePlayer(); if (!p) return;
    if (p.isMuted()){ p.unMute(); mute.innerHTML = icon('volume-2'); }
    else { p.mute(); mute.innerHTML = icon('volume-x'); }
    refreshIcons();
  });
  if (fs) fs.addEventListener('click', function(){
    var wrap = $('nlPlayer'); if (!wrap) return;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (wrap.requestFullscreen) wrap.requestFullscreen();
    else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
  });
  if (back) back.addEventListener('click', function(){
    var p = safePlayer(); if (!p || typeof p.getCurrentTime !== 'function') return;
    var cur = p.getCurrentTime() || 0;
    p.seekTo(Math.max(0, cur - SEEK_STEP_S), true);
    updateJumpLiveButton();
    toast('−' + SEEK_STEP_S + 's', 'info', 900);
  });
  if (fwd) fwd.addEventListener('click', function(){
    var p = safePlayer(); if (!p || typeof p.getCurrentTime !== 'function') return;
    var cur = p.getCurrentTime() || 0;
    var dur = (typeof p.getDuration === 'function' ? p.getDuration() : 0) || 0;
    var target = cur + SEEK_STEP_S;
    if (dur > 0 && target > dur - 1) target = dur - 0.5;
    p.seekTo(target, true);
    updateJumpLiveButton();
    toast('+' + SEEK_STEP_S + 's', 'info', 900);
  });
  if (jumpLive) jumpLive.addEventListener('click', function(){
    var p = safePlayer(); if (!p) return;
    var dur = (typeof p.getDuration === 'function' ? p.getDuration() : 0) || 0;
    if (dur > 0) p.seekTo(dur - 0.5, true);
    else p.seekTo(0, true);
    updateJumpLiveButton();
    toast('Jumped to live', 'success', 1400);
  });
}

function updateJumpLiveButton(){
  var btn = $('ctrlJumpLive');
  if (!btn) return;
  if (currentPhase !== 'live'){ btn.classList.remove('show'); return; }
  var p = ytPlayer;
  if (!p || typeof p.getDuration !== 'function'){ btn.classList.remove('show'); return; }
  var cur = (typeof p.getCurrentTime === 'function' ? p.getCurrentTime() : 0) || 0;
  var dur = p.getDuration() || 0;
  if (dur <= 0 || cur <= 0){ btn.classList.remove('show'); return; }
  var distance = dur - cur;
  if (distance <= 20) btn.classList.remove('show');
  else btn.classList.add('show');
}

/* ══════════════════════════════════════════════════════════════
   DECIDE MODE AND PLAY
   ══════════════════════════════════════════════════════════════ */
function decideAndPlay(){
  var phase = computePhase();
  currentPhase = phase;

  if (phase === 'upcoming'){
    /* Stream hasn't started — play ads + countdown */
    mode = 'gap-ads';
    startGapAdLoop();
    renderPhaseUI();
    updateCountdownPill();
    updateQueueBanner();
    /* Also keep the YouTube iframe loaded but hidden */
    loadPlayerForIframeOnly();
    return;
  }

  if (phase === 'live' || phase === 'replay'){
    mode = 'normal';
    stopGapAdLoop();
    var qb = $('queueBanner'); if (qb) qb.classList.remove('show');
    loadPlayer();
    renderPhaseUI();
    updateCountdownPill();
    return;
  }

  if (phase === 'ended'){
    /* Stream ended — check for next in queue */
    tryNextInQueue();
  }
}

function tryNextInQueue(){
  var now = Date.now();
  var nextStart = null;
  for (var i = 0; i < channelQueue.length; i++){
    var s = channelQueue[i];
    if (s.id === streamId) continue;
    var startMs = streamStartMs(s);
    if (startMs > now && startMs - now <= QUEUE_LOOKAHEAD_MS){
      if (nextStart === null || startMs < nextStart.startMs){
        nextStart = { stream: s, startMs: startMs };
      }
    }
  }

  if (!nextStart){
    mode = 'ended';
    stopGapAdLoop();
    showCurtain('ended', 'Stream ended', 'Nothing else scheduled on this channel right now. Check back soon or explore other channels.');
    var qb = $('queueBanner'); if (qb) qb.classList.remove('show');
    return;
  }

  var gapMs = nextStart.startMs - now;
  nextStreamInQueue = nextStart;

  if (gapMs <= GAP_ADS_MAX_MS){
    /* Short gap — play ads with queue banner */
    mode = 'gap-ads';
    updateQueueBanner();
    startGapAdLoop();
  } else {
    /* Long gap — show ended message with next-up info */
    mode = 'ended';
    stopGapAdLoop();
    var nextTitle = nextStart.stream.streamTitle || nextStart.stream.eventName || 'Untitled';
    showCurtain('ended', 'Stream ended', 'Next: ' + nextTitle + ' starts ' + formatDate(nextStart.stream.startDate, nextStart.stream.startTime));
    var qb2 = $('queueBanner'); if (qb2) qb2.classList.remove('show');
  }
}

/* ══════════════════════════════════════════════════════════════
   GAP AD LOOP
   ══════════════════════════════════════════════════════════════ */
function startGapAdLoop(){
  clearTimeout(gapAdTimer);
  if (isOffline) return;

  /* Show curtain with "waiting" message only if no ad is currently playing */
  var overlay = $('adOverlay');
  var showingAd = overlay && overlay.classList.contains('show');

  if (!showingAd){
    /* Try to fire the first ad */
    if (adPool.preroll.length || adPool.midroll.length || adPool.postroll.length){
      showAd('preroll', function(){
        /* Ad finished — loop back */
        if (mode === 'gap-ads') startGapAdLoop();
      });
    } else {
      /* No ads available — show branded curtain */
      showCurtain('queue', 'Waiting for next stream',
        nextStreamInQueue
          ? 'Next: ' + (nextStreamInQueue.stream.streamTitle || nextStreamInQueue.stream.eventName || 'Stream') + ' in ' + formatCountdownShort(nextStreamInQueue.startMs - Date.now())
          : 'Stream will begin shortly');
    }
  }
}

function stopGapAdLoop(){
  clearTimeout(gapAdTimer);
  gapAdTimer = null;
}

function formatCountdownShort(ms){
  if (ms < 0) ms = 0;
  var s = Math.floor(ms / 1000);
  var d = Math.floor(s / 86400);
  var h = Math.floor((s % 86400) / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + sec + 's';
  return sec + 's';
}

function updateQueueBanner(){
  var banner = $('queueBanner');
  var title = $('qbTitle');
  var time = $('qbTime');
  if (!banner || !title || !time) return;

  if (!nextStreamInQueue){
    banner.classList.remove('show');
    return;
  }

  title.textContent = nextStreamInQueue.stream.streamTitle || nextStreamInQueue.stream.eventName || 'Untitled';
  banner.classList.add('show');
}

/* ══════════════════════════════════════════════════════════════
   LOAD PLAYER (iframe only — used during countdown)
   ══════════════════════════════════════════════════════════════ */
function loadPlayerForIframeOnly(){
  var host = $('ytPlayerHost');
  if (!host) return;
  if (host.innerHTML) return; /* already loaded */
  var platform = streamData.streamPlatform || 'youtube';
  var url = (streamData.streamUrl || '').trim();
  if (!url) return;

  if (platform === 'youtube'){
    var vid = extractYouTubeId(url);
    if (!vid) return;
    host.innerHTML = '<div id="ytPlayer"></div>';
    if (window.YT && window.YT.Player) createYTPlayer(vid);
    else window.onYouTubeIframeAPIReady = function(){ createYTPlayer(vid); };
  }
}

/* ══════════════════════════════════════════════════════════════
   FULL PLAYER LOAD
   ══════════════════════════════════════════════════════════════ */
function loadPlayer(){
  var host = $('ytPlayerHost');
  if (!host) return;
  host.innerHTML = '';
  hideCurtain();

  var platform = streamData.streamPlatform || 'youtube';
  var url = (streamData.streamUrl || '').trim();

  if (!url){
    showCurtain('loading', 'Stream URL missing', 'The host has not set a stream URL yet.');
    return;
  }

  if (platform === 'youtube'){
    var vid = extractYouTubeId(url);
    if (!vid){
      showCurtain('loading', 'Invalid YouTube URL', 'Could not extract a video ID from: ' + url);
      return;
    }
    showCurtain('loading', 'Loading stream', 'Connecting to YouTube…');
    host.innerHTML = '<div id="ytPlayer"></div>';
    if (window.YT && window.YT.Player) createYTPlayer(vid);
    else window.onYouTubeIframeAPIReady = function(){ createYTPlayer(vid); };
  } else {
    var embed = '';
    if (platform === 'twitch'){
      var ch = extractTwitchChannel(url);
      if (!ch){ showCurtain('loading', 'Invalid Twitch URL', 'Could not find a channel name.'); return; }
      var parent = location.hostname || 'localhost';
      embed = 'https://player.twitch.tv/?channel=' + encodeURIComponent(ch) + '&parent=' + parent + '&autoplay=true&muted=true';
    } else if (platform === 'vimeo'){
      var vid2 = extractVimeoId(url);
      if (!vid2){ showCurtain('loading', 'Invalid Vimeo URL', 'Could not find a video ID.'); return; }
      embed = 'https://player.vimeo.com/video/' + vid2 + '?autoplay=1&muted=1';
    } else if (platform === 'facebook'){
      embed = buildFacebookEmbed(url);
    } else {
      embed = url;
    }
    var iframe = document.createElement('iframe');
    iframe.src = embed;
    iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    iframe.setAttribute('allowfullscreen', '');
    iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = '0';
    host.appendChild(iframe);
    hideCurtain();
  }
}

function createYTPlayer(videoId){
  ytPlayer = new YT.Player('ytPlayer', {
    videoId: videoId,
    playerVars: {
      autoplay: 1, mute: 1, rel: 0, playsinline: 1,
      iv_load_policy: 3, modestbranding: 1, controls: 0, disablekb: 1,
      color: 'white', origin: window.location.origin
    },
    events: {
      onReady: function(event){
        ytReady = true;
        hideCurtain();
        try { event.target.mute(); event.target.playVideo(); } catch(e){}

        var attempts = 0;
        clearInterval(autoplayRetryTimer);
        autoplayRetryTimer = setInterval(function(){
          attempts++;
          if (attempts > 8){ clearInterval(autoplayRetryTimer); return; }
          try {
            var state = event.target.getPlayerState();
            if (state !== 1 && state !== 3) event.target.playVideo();
            else clearInterval(autoplayRetryTimer);
          } catch(e){}
        }, 1000);

        clearInterval(liveCheckTimer);
        liveCheckTimer = setInterval(function(){
          if (currentPhase === 'live') updateJumpLiveButton();
        }, 2000);
      },
      onStateChange: function(event){
        var pp = $('ctrlPlayPause');
        if (pp) pp.innerHTML = icon(event.data === 1 ? 'pause' : 'play');
        refreshIcons();

        /* Stream ended → check queue */
        if (event.data === 0){
          /* Post-roll first */
          if (adSettings.postrollEnabled && streamData.postrollEnabled !== false && !adState.firedPostroll){
            adState.firedPostroll = true;
            showAd('postroll', function(){
              tryNextInQueue();
            });
          } else {
            tryNextInQueue();
          }
        }
        if (event.data === 1) updateJumpLiveButton();
      },
      onError: function(event){
        var msg = 'YouTube error. ';
        if (event.data === 2) msg += 'Video ID is invalid.';
        else if (event.data === 5) msg += 'HTML5 player cannot play this video.';
        else if (event.data === 100) msg += 'Video not found or is private.';
        else if (event.data === 101 || event.data === 150) msg += 'Video owner does not allow embedding.';
        else msg += 'Code: ' + event.data;
        toast(msg, 'error', 6000);
      }
    }
  });
}

function renderPhaseUI(){
  var liveTag = $('playerLiveTag');
  var crumbLive = $('crumbLivePill');
  if (currentPhase === 'live'){
    if (liveTag) liveTag.style.display = 'inline-flex';
    if (crumbLive) crumbLive.style.display = 'inline-flex';
  } else {
    if (liveTag) liveTag.style.display = 'none';
    if (crumbLive) crumbLive.style.display = 'none';
  }
  updateJumpLiveButton();
}

function updateCountdownPill(){
  var pill = $('cdPill');
  var text = $('cdText');
  if (!pill || !text) return;

  /* If we're in a gap with a next stream, show countdown to next stream */
  if (mode === 'gap-ads' && nextStreamInQueue){
    var diff = nextStreamInQueue.startMs - Date.now();
    if (diff < 0) diff = 0;
    var s = Math.floor(diff / 1000);
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var str = (d > 0 ? d + 'd ' : '') + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    var lbl = pill.querySelector('.lbl');
    if (lbl) lbl.textContent = 'Next in';
    text.textContent = str;
    pill.classList.add('show');
    return;
  }

  /* Upcoming countdown to this stream's start */
  if (currentPhase === 'upcoming'){
    var t = getTiming();
    if (!t.valid) return;
    var diff2 = t.startMs - Date.now();
    if (diff2 < 0) diff2 = 0;
    var s2 = Math.floor(diff2 / 1000);
    var d2 = Math.floor(s2 / 86400);
    var h2 = Math.floor((s2 % 86400) / 3600);
    var m2 = Math.floor((s2 % 3600) / 60);
    var sec2 = s2 % 60;
    var str2 = (d2 > 0 ? d2 + 'd ' : '') + String(h2).padStart(2,'0') + ':' + String(m2).padStart(2,'0') + ':' + String(sec2).padStart(2,'0');
    var lbl2 = pill.querySelector('.lbl');
    if (lbl2) lbl2.textContent = 'Live in';
    text.textContent = str2;
    pill.classList.add('show');
    return;
  }

  pill.classList.remove('show');
}

function startTickers(){
  clearInterval(countdownTimer);
  clearInterval(phaseTickTimer);
  countdownTimer = setInterval(function(){
    updateCountdownPill();
    /* Also update queue banner time */
    if (mode === 'gap-ads' && nextStreamInQueue){
      var qbTime = $('qbTime');
      if (qbTime) qbTime.textContent = formatCountdownShort(nextStreamInQueue.startMs - Date.now());
    }
  }, 1000);

  phaseTickTimer = setInterval(function(){
    /* Check if we should switch streams */
    if (mode === 'gap-ads' && nextStreamInQueue && Date.now() >= nextStreamInQueue.startMs){
      /* Time to switch — reload page with next stream */
      window.location.href = 'view-stream.html?id=' + encodeURIComponent(nextStreamInQueue.stream.id);
      return;
    }
    var newPhase = computePhase();
    if (newPhase !== currentPhase){
      currentPhase = newPhase;
      renderPhaseUI();
      updateCountdownPill();
      if (newPhase === 'live'){
        mode = 'normal';
        stopGapAdLoop();
        var qb = $('queueBanner'); if (qb) qb.classList.remove('show');
        if (ytReady && ytPlayer && typeof ytPlayer.playVideo === 'function'){
          try { ytPlayer.playVideo(); } catch(e){}
        }
        setupMidrollTimer();
      } else if (newPhase === 'ended'){
        tryNextInQueue();
      }
    }
  }, 5000);
}

function setupMidrollTimer(){
  clearTimeout(adState.midrollTimerId);
  if (!adSettings.midrollEnabled) return;
  if (streamData.midrollEnabled === false) return;
  if (adState.firedMidroll) return;
  var t = getTiming();
  if (!t.valid) return;
  if (currentPhase !== 'live') return;
  var midMin = parseInt(streamData.midrollMinute, 10) || adSettings.midrollMinute || 30;
  var fireAt = t.startMs + (midMin * 60000);
  var delay = Math.max(0, fireAt - Date.now());
  adState.midrollTimerId = setTimeout(function(){
    adState.firedMidroll = true;
    showAd('midroll', function(){});
  }, delay);
}

function loadAdsInBackground(){
  var settingsPromise = db.collection(SETTINGS).doc(SETTINGS_DOC).get().then(function(snap){
    if (snap.exists) adSettings = Object.assign({}, AD_DEFAULTS, snap.data() || {});
  }).catch(function(){});

  var poolPromise = db.collection(ADS).where('active', '==', true).limit(50).get().then(function(snap){
    adPool = { preroll: [], midroll: [], postroll: [] };
    var now = Date.now();
    snap.forEach(function(doc){
      var d = doc.data() || {};
      d.id = doc.id;
      if (d.startDate){ var s = new Date(d.startDate + 'T00:00').getTime(); if (!isNaN(s) && now < s) return; }
      if (d.endDate){ var e = new Date(d.endDate + 'T23:59:59').getTime(); if (!isNaN(e) && now > e) return; }
      var t = d.type || 'any';
      if (t === 'preroll' || t === 'any') adPool.preroll.push(d);
      if (t === 'midroll' || t === 'any') adPool.midroll.push(d);
      if (t === 'postroll' || t === 'any') adPool.postroll.push(d);
    });
  }).catch(function(){});

  Promise.all([settingsPromise, poolPromise]).then(function(){
    /* Pre-roll only fires when live */
    if (currentPhase === 'live'){
      if (adSettings.prerollEnabled && streamData.prerollEnabled !== false && !adState.firedPreroll){
        adState.firedPreroll = true;
        showAd('preroll', function(){});
      }
    }
    /* During a gap, if the loop is running but ads weren't loaded yet, kick it */
    if (mode === 'gap-ads'){
      var overlay = $('adOverlay');
      if (overlay && !overlay.classList.contains('show')) startGapAdLoop();
    }
  });
}

function getRecentAdIds(){
  try { var raw = sessionStorage.getItem('nl_recent_ads'); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
}
function rememberAd(adId){
  var recent = getRecentAdIds();
  recent.push(adId);
  if (recent.length > RECENT_ADS_MAX) recent = recent.slice(-RECENT_ADS_MAX);
  try { sessionStorage.setItem('nl_recent_ads', JSON.stringify(recent)); } catch(e){}
}
function pickAd(slot){
  var pool = adPool[slot] || [];
  if (!pool.length) return null;
  var recent = getRecentAdIds();
  var fresh = pool.filter(function(ad){ return recent.indexOf(ad.id) === -1; });
  if (!fresh.length) fresh = pool;
  var total = fresh.reduce(function(sum, ad){ return sum + (ad.weight || 1); }, 0);
  var r = Math.random() * total;
  var acc = 0;
  for (var i = 0; i < fresh.length; i++){
    acc += fresh[i].weight || 1;
    if (r <= acc) return fresh[i];
  }
  return fresh[0];
}
function trackAdEvent(ad, type){
  if (!ad || !ad.id) return;
  try {
    var update = {};
    if (type === 'impression') update.impressions = firebase.firestore.FieldValue.increment(1);
    if (type === 'click') update.clicks = firebase.firestore.FieldValue.increment(1);
    db.collection(ADS).doc(ad.id).update(update).catch(function(){});
  } catch(e){}
}

function showAd(slot, onComplete){
  var overlay = $('adOverlay'), media = $('adMedia'), title = $('adTitle');
  var cta = $('adCta'), ctaLabel = $('adCtaLabel');
  var skipBtn = $('adSkip'), skipText = $('adSkipText'), countdown = $('adCountdown');
  var progressFill = $('adProgressFill');
  if (!overlay || !media) { if (onComplete) onComplete(); return; }

  var player = $('nlPlayer');
  if (player) player.classList.remove('hide-controls');

  var ad = pickAd(slot);
  overlay.classList.add('show');
  media.innerHTML = '';
  progressFill.style.width = '0%';
  var skipAfter = parseInt(adSettings.skipAfterSeconds, 10) || 5;

  if (ad){
    title.textContent = ad.title || 'Advertisement';
    cta.href = ad.clickUrl || '#';
    ctaLabel.textContent = ad.ctaLabel || 'Learn more';
    if (ad.mediaType === 'video' && ad.mediaUrl){
      var vid = document.createElement('video');
      vid.src = ad.mediaUrl;
      vid.autoplay = true; vid.muted = false; vid.playsInline = true;
      vid.setAttribute('playsinline', '');
      media.appendChild(vid);
      vid.addEventListener('timeupdate', function(){
        if (vid.duration) progressFill.style.width = ((vid.currentTime / vid.duration) * 100) + '%';
      });
      vid.addEventListener('ended', function(){ hideAd(); if (onComplete) onComplete(); });
      vid.addEventListener('error', function(){ media.innerHTML = ''; media.appendChild(buildHouseAd()); });
    } else if (ad.mediaUrl){
      var img = document.createElement('img');
      img.src = ad.mediaUrl; img.alt = ad.title || 'Ad';
      media.appendChild(img);
    } else {
      media.appendChild(buildHouseAd());
    }
    trackAdEvent(ad, 'impression');
    rememberAd(ad.id);
    if (typeof ad.skipAfterSeconds === 'number') skipAfter = ad.skipAfterSeconds;
  } else {
    title.textContent = adSettings.houseAdTitle || 'Advertise on Novalink';
    cta.href = adSettings.houseAdUrl || 'mailto:ads@novalink.com';
    ctaLabel.textContent = adSettings.houseAdCtaLabel || 'Advertise here';
    media.appendChild(buildHouseAd());
  }
  cta.onclick = function(){ if (ad) trackAdEvent(ad, 'click'); };
  if (skipAfter === -1){
    skipBtn.disabled = true; skipText.textContent = 'Ad'; countdown.textContent = '';
  } else {
    var remaining = skipAfter;
    skipBtn.disabled = true; skipText.textContent = 'Skip in'; countdown.textContent = remaining;
    clearInterval(adState.countdownTimerId);
    adState.countdownTimerId = setInterval(function(){
      remaining--;
      if (remaining <= 0){
        clearInterval(adState.countdownTimerId);
        skipBtn.disabled = false; skipText.textContent = 'Skip ad'; countdown.textContent = '';
      } else countdown.textContent = remaining;
    }, 1000);
  }
  skipBtn.onclick = function(){
    if (skipBtn.disabled) return;
    hideAd(); if (onComplete) onComplete();
  };
  if (!(ad && ad.mediaType === 'video')){
    clearTimeout(adState.skipTimerId);
    adState.skipTimerId = setTimeout(function(){ hideAd(); if (onComplete) onComplete(); }, 10000);
  }
  refreshIcons();
}

function hideAd(){
  var overlay = $('adOverlay');
  if (!overlay) return;
  overlay.classList.remove('show');
  var media = $('adMedia');
  if (media) media.innerHTML = '';
  clearInterval(adState.countdownTimerId);
  clearTimeout(adState.skipTimerId);
}

  wrap.className = 'house-ad';
  wrap.innerHTML =
    '<div class="hh-brand">' +

      '<span class="wm">Novalink</span>' +
    '</div>' +

/* ══════════════════════════════════════════════════════════════
   LOAD
   ══════════════════════════════════════════════════════════════ */
function load(){
  streamId = getParam('id');
  if (!streamId){ renderError('No stream specified', 'This page needs a stream ID.'); return; }

  db.collection(STREAMS).doc(streamId).get()
    .then(function(doc){
      if (!doc.exists){ renderError('Stream not found', 'This stream may have been deleted.'); return; }
      streamData = doc.data() || {};
      streamData.id = doc.id;

      var chId = streamData.channelId;

      var chPromise = chId
        ? db.collection(CHANNELS).doc(chId).get().then(function(cs){
            if (cs.exists){ channelData = cs.data() || {}; channelData.id = cs.id; }
          }).catch(function(){})
        : Promise.resolve();

      var sibPromise = chId
        ? db.collection(STREAMS).where('channelId', '==', chId).limit(50).get().then(function(snap){
            channelQueue = [];
            siblingStreams = [];
            snap.forEach(function(s){
              var d = s.data() || {};
              d.id = s.id;
              channelQueue.push(d);
              if (s.id !== streamId) siblingStreams.push(d);
            });
            /* Sort channel queue by start time */
            channelQueue.sort(function(a, b){ return streamStartMs(a) - streamStartMs(b); });
            siblingStreams.sort(function(a, b){
              var rank = { live:0, upcoming:1, replay:2, ended:3 };
              return (rank[computeStreamPhase(a)] || 4) - (rank[computeStreamPhase(b)] || 4);
            });
          }).catch(function(){})
        : Promise.resolve();

      Promise.all([chPromise, sibPromise]).then(function(){
        currentPhase = computePhase();
        renderPage();
      });
    })
    .catch(function(err){
      console.error('[load]', err);
      renderError('Could not load', err.message || 'Please try again.');
    });
}

document.addEventListener('DOMContentLoaded', function(){
  refreshIcons();
  $('signInBtn').addEventListener('click', function(){ window.location.href = 'index.html#signin'; });
  $('userChip').addEventListener('click', function(){
    if (!currentUser) return;
    if (confirm('Sign out of ' + (currentUser.email || 'your account') + '?')){
      auth.signOut().then(function(){ toast('Signed out.', 'success'); });
    }
  });
  auth.onAuthStateChanged(function(user){ applyAuth(user); });
  load();
});

window.addEventListener('beforeunload', function(){
  if (countdownTimer) clearInterval(countdownTimer);
  if (phaseTickTimer) clearInterval(phaseTickTimer);
  if (autoplayRetryTimer) clearInterval(autoplayRetryTimer);
  if (liveCheckTimer) clearInterval(liveCheckTimer);
  if (controlsHideTimer) clearTimeout(controlsHideTimer);
  if (gapAdTimer) clearTimeout(gapAdTimer);
  clearTimeout(adState.midrollTimerId);
  clearInterval(adState.countdownTimerId);
  clearTimeout(adState.skipTimerId);
});
})();
