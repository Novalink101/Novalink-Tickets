<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f14" />
<title>Scanner · Novalink</title>

<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root{
  --brand:#00E5E5;--brand-dark:#00B8B8;--brand-darker:#00999A;
  --brand-soft:#E6FFFF;--brand-tint:#B3FFFF;--brand-ink:#04161C;
  --ink:#0A0F14;--ink-2:#1A2129;--ink-3:#2B3644;
  --slate:#6B7787;--slate-2:#94A3B8;
  --line:#E4E9F0;--line-2:#D3DBE5;
  --bg:#F6F8FB;--surface:#FFFFFF;--surface-2:#F1F4F8;
  --success:#059669;--success-soft:#ECFDF5;--success-line:#A7F3D0;
  --warning:#D97706;--warning-soft:#FFFBEB;--warning-line:#FDE68A;
  --danger:#DC2626;--danger-soft:#FEF2F2;--danger-line:#FECACA;
  --purple:#7C3AED;--purple-soft:#EDE9FE;--purple-line:#C4B5FD;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-full:999px;
  --shadow-sm:0 1px 3px rgba(10,15,20,.06);
  --shadow-md:0 4px 14px rgba(10,15,20,.06);
  --shadow-lg:0 12px 32px rgba(10,15,20,.10);
  --shadow-xl:0 24px 60px rgba(10,15,20,.14);
  --ease:cubic-bezier(.25,.8,.25,1);
  --ease-out:cubic-bezier(.22,.9,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:14px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;touch-action:manipulation}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* Nav — compact, dark for door context */
.nav{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10}
.nav-brand{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:12px;letter-spacing:.15em;color:var(--ink-2);text-transform:uppercase;flex-shrink:0}
.nav-brand svg{width:18px;height:22px}
.nav-event{flex:1;padding:8px 12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:12.5px;font-weight:700;min-width:0;color:var(--ink);transition:all .2s var(--ease)}
.nav-event:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(0,229,229,.15)}
.nav-back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);flex-shrink:0}
.nav-back:hover{background:#fff;border-color:var(--brand);color:var(--brand-darker)}
.nav-back svg{width:16px;height:16px}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:4px;margin:12px 14px 0;flex-shrink:0}
.tab{flex:1;padding:11px 14px;background:transparent;border-radius:var(--r-sm);color:var(--slate);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s var(--ease)}
.tab svg{width:15px;height:15px}
.tab.active{background:var(--ink);color:#fff}
.tab:disabled{opacity:.4;cursor:not-allowed}

/* Main */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:14px;gap:12px;min-height:0}

/* Panels */
.panel{display:none;flex-direction:column;align-items:center;gap:12px;width:100%;height:100%;justify-content:center}
.panel.active{display:flex}

/* Camera */
#reader{
  width:100%;
  max-width:420px;
  aspect-ratio:1;
  border-radius:var(--r-xl);
  overflow:hidden;
  position:relative;
  background:#000;
  box-shadow:var(--shadow-lg);
}
#reader video{width:100%!important;height:100%!important;object-fit:cover;display:block}
#reader__scan_region{background:transparent!important}
#reader__scan_region img{display:none!important}
#reader__dashboard,#reader__dashboard_section,#reader__header_message{display:none!important}

/* Scan frame overlay */
.scan-frame-wrap{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
.scan-frame{
  width:64%;aspect-ratio:1;
  border:3px solid var(--brand);
  border-radius:var(--r-lg);
  box-shadow:0 0 0 9999px rgba(10,15,20,.55), 0 0 30px rgba(0,229,229,.5);
  position:relative;
}
.scan-frame::before,
.scan-frame::after{
  content:'';position:absolute;width:28px;height:28px;border:4px solid var(--brand);border-radius:4px;
}
.scan-frame::before{top:-3px;left:-3px;border-right:none;border-bottom:none;border-radius:var(--r-lg) 0 0 0}
.scan-frame::after{bottom:-3px;right:-3px;border-left:none;border-top:none;border-radius:0 0 var(--r-lg) 0}
.scan-line{
  position:absolute;left:12%;right:12%;height:2px;
  background:linear-gradient(90deg,transparent,var(--brand),transparent);
  animation:scanLine 2s ease-in-out infinite;
  top:20%;
  box-shadow:0 0 14px var(--brand);
}
@keyframes scanLine{0%,100%{top:20%}50%{top:80%}}

/* Status bar */
.status-bar{
  padding:11px 16px;
  text-align:center;
  font-size:13px;
  font-weight:700;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  color:var(--brand-darker);
  max-width:420px;
  width:100%;
}
.status-bar.hint{color:var(--slate);font-weight:500;font-size:12px;background:transparent;border:none;padding:2px 12px}

/* Search panel */
.search-panel{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;height:100%}
.search-bar{position:relative;flex-shrink:0}
.search-bar input{
  width:100%;
  padding:14px 42px 14px 44px;
  background:var(--surface);
  border:1.5px solid var(--line-2);
  border-radius:var(--r-md);
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  transition:all .2s var(--ease);
}
.search-bar input:focus{
  outline:none;border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 3px rgba(0,229,229,.15);
}
.search-bar > svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--slate);pointer-events:none}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink-3);display:none;align-items:center;justify-content:center;
}
.search-clear.show{display:inline-flex}
.search-clear svg{width:13px;height:13px}

.search-hint{font-size:12px;color:var(--slate);text-align:center;padding:0 4px;line-height:1.55}

.search-results{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;
  -webkit-overflow-scrolling:touch;
}
.search-empty{
  text-align:center;padding:40px 20px;color:var(--slate);
  font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.search-empty svg{width:36px;height:36px;color:var(--line-2);stroke-width:1.5}

/* Result card */
.result-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:14px 16px;
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  transition:all .15s var(--ease);
  text-align:left;
}
.result-card:hover{border-color:var(--brand);box-shadow:var(--shadow-md)}
.result-card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.result-name{font-size:15px;font-weight:800;color:var(--ink);word-break:break-word}
.result-meta{font-size:12px;color:var(--slate);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.result-chip{
  background:var(--surface-2);padding:2px 8px;border-radius:var(--r-full);
  font-weight:800;font-family:var(--mono);font-size:11px;color:var(--ink-3);
}
.result-seat{font-family:var(--mono);font-size:12px;color:var(--brand-darker);font-weight:700}
.result-status{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:900;padding:4px 10px;
  border-radius:var(--r-full);text-transform:uppercase;letter-spacing:.04em;
  white-space:nowrap;flex-shrink:0;
}
.result-status.valid{background:var(--success-soft);color:#065F46;border:1px solid var(--success-line)}
.result-status.used{background:var(--warning-soft);color:#92400E;border:1px solid var(--warning-line)}
.result-status.pending{background:var(--warning-soft);color:#92400E;border:1px solid var(--warning-line)}
.result-status.cancelled{background:var(--danger-soft);color:#991B1B;border:1px solid var(--danger-line)}
.result-status.expired{background:var(--surface-2);color:var(--slate);border:1px solid var(--line-2)}

.result-action{
  padding:10px 16px;border-radius:var(--r-md);
  font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
  flex-shrink:0;min-width:88px;
}
.result-action.checkin{background:var(--ink);color:#fff;border:1px solid var(--ink)}
.result-action.checkin:hover:not(:disabled){background:var(--ink-2)}
.result-action:disabled{opacity:.4;cursor:not-allowed;background:var(--surface-2);color:var(--slate);border-color:var(--line)}

/* Result overlay */
.result-overlay{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;
  padding:24px;text-align:center;
  animation:fadeIn .25s ease;overflow-y:auto;
}
.result-overlay.open{display:flex}
.result-overlay.valid{background:linear-gradient(135deg,rgba(5,150,105,.98),rgba(6,78,59,.98))}
.result-overlay.used{background:linear-gradient(135deg,rgba(217,119,6,.98),rgba(120,53,15,.98))}
.result-overlay.cancelled{background:linear-gradient(135deg,rgba(220,38,38,.98),rgba(127,29,29,.98))}
.result-overlay.pending{background:linear-gradient(135deg,rgba(217,119,6,.98),rgba(120,53,15,.98))}
.result-overlay.invalid{background:linear-gradient(135deg,rgba(220,38,38,.98),rgba(127,29,29,.98))}
.result-overlay.error{background:linear-gradient(135deg,rgba(220,38,38,.98),rgba(127,29,29,.98))}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.result-inner{
  max-width:460px;width:100%;color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin:auto;
}
.result-big-icon{
  width:96px;height:96px;border-radius:50%;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);border:3px solid rgba(255,255,255,.4);
  flex-shrink:0;
}
.result-big-icon svg{width:52px;height:52px;stroke-width:2.5}
.result-title{
  font-size:28px;font-weight:900;text-transform:uppercase;
  letter-spacing:.04em;
  text-shadow:0 2px 12px rgba(0,0,0,.3);
}
.result-subtitle{
  font-size:14px;color:rgba(255,255,255,.85);
  font-weight:600;line-height:1.5;
}
.result-info{
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r-lg);
  padding:16px;width:100%;
  display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(8px);
  text-align:left;
}
.result-row{
  display:flex;justify-content:space-between;gap:12px;
  font-size:13.5px;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.result-row:last-child{border-bottom:none}
.result-row .lbl{
  color:rgba(255,255,255,.7);font-weight:700;
  text-transform:uppercase;font-size:10.5px;
  letter-spacing:.06em;flex-shrink:0;padding-top:2px;
}
.result-row .val{
  color:#fff;font-weight:800;text-align:right;
  word-break:break-word;min-width:0;
}
.result-row .val.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}

.result-actions{
  display:flex;flex-direction:column;gap:10px;
  width:100%;margin-top:6px;
}
.result-btn{
  padding:15px 22px;border-radius:var(--r-lg);
  background:#fff;color:var(--ink);
  font-size:15px;font-weight:900;
  border:none;transition:transform .15s ease;
  text-transform:uppercase;letter-spacing:.04em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;
}
.result-btn:hover{transform:translateY(-2px)}
.result-btn svg{width:17px;height:17px}
.result-btn.ghost{
  background:rgba(255,255,255,.18);color:#fff;
  border:1.5px solid rgba(255,255,255,.4);
}

/* Paused overlay */
.paused-overlay{
  position:fixed;inset:0;z-index:90;
  background:rgba(10,15,20,.94);
  display:none;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.paused-overlay.open{display:flex}
.paused-inner{
  max-width:400px;color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.paused-icon{
  width:72px;height:72px;border-radius:50%;
  background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
}
.paused-icon svg{width:36px;height:36px;color:var(--brand)}
.paused-title{
  font-size:20px;font-weight:900;
  text-transform:uppercase;letter-spacing:.06em;
}
.paused-msg{
  font-size:13.5px;color:rgba(255,255,255,.75);line-height:1.55;
}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(120%);
  background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:var(--r-full);
  font-size:13.5px;font-weight:700;
  z-index:200;
  transition:transform .3s var(--ease),opacity .3s ease;
  display:flex;align-items:center;gap:10px;
  pointer-events:none;opacity:0;
  max-width:calc(100vw - 40px);
  box-shadow:var(--shadow-lg);
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast svg{width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-back" aria-label="Back">
    <i data-lucide="arrow-left"></i>
  </a>
  <div class="nav-brand">
    <svg viewBox="0 0 60 74" aria-hidden="true"><path fill="#3a5a8c" d="M34.5 4.2c-8.1 0-14.7 6.6-14.7 14.7v3.4c0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9v-3.4c0-4.9 4-8.9 8.9-8.9 4.9 0 8.9 4 8.9 8.9 0 3-1.5 5.7-3.9 7.3-1.4.9-1.8 2.8-.9 4.2.9 1.4 2.8 1.8 4.2.9 4.3-2.7 6.9-7.4 6.9-12.4 0-8.1-6.6-14.7-14.7-14.7z"/><path fill="#00E5E5" d="M25.5 69.8c8.1 0 14.7-6.6 14.7-14.7v-3.4c0-1.6-1.3-2.9-2.9-2.9s-2.9 1.3-2.9 2.9v3.4c0 4.9-4 8.9-8.9 8.9-4.9 0-8.9-4-8.9-8.9 0-3 1.5-5.7 3.9-7.3 1.4-.9 1.8-2.8.9-4.2-.9-1.4-2.8-1.8-4.2-.9-4.3 2.7-6.9 7.4-6.9 12.4 0 8.1 6.6 14.7 14.7 14.7z"/></svg>
    <span>Scanner</span>
  </div>
  <select class="nav-event" id="eventSelect">
    <option value="">Loading…</option>
  </select>
</nav>

<div class="tabs">
  <button class="tab active" data-mode="scan" type="button">
    <i data-lucide="camera"></i> Scan
  </button>
  <button class="tab" data-mode="search" type="button">
    <i data-lucide="search"></i> Search
  </button>
</div>

<main>

  <!-- SCAN PANEL -->
  <div class="panel active" id="scanPanel">
    <div id="reader">
      <div class="scan-frame-wrap">
        <div class="scan-frame">
          <div class="scan-line"></div>
        </div>
      </div>
    </div>
    <div class="status-bar" id="statusBar">Starting camera…</div>
    <div class="status-bar hint" id="hintBar">Point at a Novalink QR code</div>
  </div>

  <!-- SEARCH PANEL -->
  <div class="panel" id="searchPanel">
    <div class="search-panel">
      <div class="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="Guest name or NL-XXXX-XXXX-XXXX…" autocomplete="off" />
        <button type="button" class="search-clear" id="clearSearchBtn" aria-label="Clear">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="search-hint" id="searchHint">
        Type at least 2 characters to look up a ticket.
      </div>
      <div class="search-results" id="searchResults">
        <div class="search-empty">
          <i data-lucide="users"></i>
          <div>Type a guest name or reference to find a ticket.</div>
        </div>
      </div>
    </div>
  </div>

</main>

<!-- ═══════════════════ RESULT OVERLAY ═══════════════════ -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-inner">
    <div class="result-big-icon" id="resultIcon"><i data-lucide="check"></i></div>
    <div class="result-title" id="resultTitle">Valid</div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-info" id="resultInfo"></div>
    <div class="result-actions">
      <button class="result-btn" id="continueBtn" type="button">
        <i data-lucide="scan-line"></i> Scan next
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════ PAUSED OVERLAY ═══════════════════ -->
<div class="paused-overlay" id="pausedOverlay">
  <div class="paused-inner">
    <div class="paused-icon"><i data-lucide="pause-circle"></i></div>
    <div class="paused-title">Scanner paused</div>
    <div class="paused-msg" id="pausedMsg">Sign in and pick an event to start scanning.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ═══════════════════ SCRIPTS ═══════════════════ -->

<script>
/* ═══════════════════════════════════════════════════════════════
   INLINE SCHEMA HELPERS
   ═══════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var TIER_DEFAULT_NAMES={black:'Elite',elite:'Elite',gold:'VIP',silver:'Silver',cyan:'Standard',standard:'Standard',tier5:'Platinum',tier6:'Diamond'};
  function isObject(v){return v!==null&&typeof v==='object'&&!Array.isArray(v);}
  function isNonEmptyString(v){return typeof v==='string'&&v.trim().length>0;}

  function getTierName(event,key){
    if(!key)return '';
    if(event&&isObject(event.tierNames)&&isNonEmptyString(event.tierNames[key]))return event.tierNames[key];
    if(TIER_DEFAULT_NAMES[key])return TIER_DEFAULT_NAMES[key];
    return String(key).charAt(0).toUpperCase()+String(key).slice(1);
  }
  function formatSeat(t){
    if(!t)return '';
    if(t.generalAdmission)return 'General admission';
    var parts=[];
    if(isNonEmptyString(t.seatBlock))parts.push(t.seatBlock);
    if(isNonEmptyString(t.seatSection))parts.push(t.seatSection);
    if(t.seatTable)parts.push('Table '+t.seatTable);
    if(isNonEmptyString(t.seatRow))parts.push('Row '+t.seatRow);
    if(t.seatNumber)parts.push('Seat '+t.seatNumber);
    if(parts.length)return parts.join(' · ');
    var raw=t.seat;
    if(!isNonEmptyString(raw))return '';
    var m1=/^([A-Z])-T(\d+)-C(\d+)$/i.exec(raw);
    if(m1)return 'Table '+m1[1]+parseInt(m1[2],10)+' · Seat '+parseInt(m1[3],10);
    var m2=/^([A-Z])-T(\d+)$/i.exec(raw);
    if(m2)return 'Table '+m2[1]+parseInt(m2[2],10);
    var m3=/^([A-Z])-(\d+)$/i.exec(raw);
    if(m3)return 'Block '+m3[1]+' · Seat '+parseInt(m3[2],10);
    return raw;
  }
  function looksLikeNovalinkRef(text){
    return /^NL-[A-Z0-9]{1,4}-[A-Z0-9]{1,4}-[A-Z0-9]{1,4}$/i.test(String(text||'').trim());
  }
  function short4(s){
    var t=String(s||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
    if(t.length<=4)return t.padStart(4,'0');
    return t.slice(-4);
  }
  function rand4(){
    var c='ABCDEFGHJKMNPQRSTUVWXYZ23456789',out='';
    for(var i=0;i<4;i++)out+=c.charAt(Math.floor(Math.random()*c.length));
    return out;
  }
  function buildTicketRef(eventId,ticketId,rand){
    var e=short4(eventId),t=short4(ticketId);
    var r=isNonEmptyString(rand)?String(rand).toUpperCase():rand4();
    return 'NL-'+e+'-'+t+'-'+r;
  }

  window.NovalinkSchema={
    getTierName:getTierName,
    formatSeat:formatSeat,
    looksLikeNovalinkRef:looksLikeNovalinkRef,
    buildTicketRef:buildTicketRef
  };
})();
</script>

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════════
   FIREBASE
   ═══════════════════════════════════════════════════════════════ */
var firebaseConfig={
  apiKey:"AIzaSyDSnns131jOlBXAqKo6qy7lTW4Rij-1oWU",
  authDomain:"novalink-864cf.firebaseapp.com",
  projectId:"novalink-864cf",
  storageBucket:"novalink-864cf.firebasestorage.app",
  messagingSenderId:"602780280140",
  appId:"1:602780280140:web:5d9ff2351e5a7d5e66dbe9"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var auth=firebase.auth();
var EVENTS='events';
var ADMINS=['nylnathan340@gmail.com','customerservicesnovalink@gmail.com'];

/* ═══════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════ */
var SCAN_COOLDOWN_MS=2500;
var SEARCH_DEBOUNCE_MS=220;

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function refreshIcons(){if(window.lucide)lucide.createIcons();}
function showToast(msg,type,ms){
  type=type||'info';ms=ms||3200;
  var t=$('toast');
  var ic=type==='error'?'alert-circle':(type==='success'?'check-circle':'info');
  t.className='toast '+type;
  t.innerHTML='<i data-lucide="'+ic+'"></i><span>'+esc(msg)+'</span>';
  refreshIcons();
  requestAnimationFrame(function(){t.classList.add('show');});
  clearTimeout(showToast._t);
  showToast._t=setTimeout(function(){t.classList.remove('show');},ms);
}
function isAdmin(user){
  if(!user||!user.email)return false;
  var e=String(user.email).toLowerCase().trim();
  return ADMINS.some(function(a){return a.toLowerCase()===e;});
}
function statusKind(s){
  s=String(s||'').toLowerCase();
  if(s==='checked-in'||s==='checked_in'||s==='used')return 'used';
  if(s==='cancelled')return 'cancelled';
  if(s==='expired')return 'expired';
  if(s==='pending')return 'pending';
  return 'valid';
}
function statusLabel(k){
  return {valid:'Valid',used:'Checked in',cancelled:'Cancelled',expired:'Expired',pending:'Pending'}[k]||k;
}

/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
var currentUser=null;
var myEvents=[];
var currentEventId=null;
var currentEvent=null;
var html5Qr=null;
var isScanning=false;
var scannerReady=false;
var lastScanAt=0;
var currentMode='scan';
var searchTimer=null;
var allEventTickets=[];
var ticketsLoaded=false;
var loadingTickets=false;

/* ═══════════════════════════════════════════════════════════════
   PAUSED STATE
   ═══════════════════════════════════════════════════════════════ */
function showPaused(msg){
  $('pausedMsg').textContent=msg;
  $('pausedOverlay').classList.add('open');
  refreshIcons();
}
function hidePaused(){
  $('pausedOverlay').classList.remove('open');
}

/* ═══════════════════════════════════════════════════════════════
   RESULT OVERLAY
   ═══════════════════════════════════════════════════════════════ */
function showResult(kind,title,subtitle,info){
  var overlay=$('resultOverlay');
  overlay.className='result-overlay open '+kind;
  $('resultTitle').textContent=title;
  $('resultSubtitle').textContent=subtitle||'';

  var iconMap={
    valid:'check-circle',
    used:'alert-triangle',
    cancelled:'x-circle',
    pending:'clock',
    invalid:'x-circle',
    error:'alert-circle'
  };
  $('resultIcon').innerHTML='<i data-lucide="'+(iconMap[kind]||'info')+'"></i>';

  var infoEl=$('resultInfo');
  infoEl.innerHTML='';
  if(info&&info.length){
    info.forEach(function(row){
      var div=document.createElement('div');
      div.className='result-row';
      div.innerHTML=
        '<span class="lbl">'+esc(row.lbl)+'</span>'+
        '<span class="val'+(row.mono?' mono':'')+'">'+esc(row.val)+'</span>';
      infoEl.appendChild(div);
    });
    infoEl.classList.remove('hidden');
  }else{
    infoEl.classList.add('hidden');
  }
  refreshIcons();
}
function hideResult(){
  $('resultOverlay').classList.remove('open');
}

/* ═══════════════════════════════════════════════════════════════
   AUTH + LOAD EVENTS
   ═══════════════════════════════════════════════════════════════ */
function applyAuth(user){
  currentUser=user;
}
function loadMyEvents(){
  var q=db.collection(EVENTS).where('status','==','live');
  if(!isAdmin(currentUser)){
    q=q.where('ownerUid','==',currentUser.uid);
  }
  return q.get().then(function(snap){
    myEvents=[];
    snap.forEach(function(doc){
      var d=doc.data()||{};
      d.id=doc.id;
      myEvents.push(d);
    });
    myEvents.sort(function(a,b){
      return String(b.startDate||'').localeCompare(String(a.startDate||''));
    });
    return myEvents;
  });
}

function populateEventSelect(){
  var sel=$('eventSelect');
  sel.innerHTML='';
  if(!myEvents.length){
    var opt=document.createElement('option');
    opt.value='';
    opt.textContent='No live events';
    sel.appendChild(opt);
    sel.disabled=true;
    return;
  }
  myEvents.forEach(function(ev,i){
    var opt=document.createElement('option');
    opt.value=ev.id;
    var label=ev.eventName||'Untitled';
    if(ev.startDate)label+=' · '+ev.startDate;
    opt.textContent=label;
    if(i===0)opt.selected=true;
    sel.appendChild(opt);
  });
  sel.disabled=false;
  currentEventId=myEvents[0].id;
  currentEvent=myEvents[0];
}

/* ═══════════════════════════════════════════════════════════════
   SCANNER (camera)
   ═══════════════════════════════════════════════════════════════ */
function startScanner(){
  if(currentMode!=='scan')return;
  if(scannerReady)return;
  if(!currentEventId){showPaused('No event selected.');return;}
  hidePaused();

  $('statusBar').textContent='Starting camera…';

  if(!window.Html5Qrcode){
    $('statusBar').textContent='Scanner library failed to load.';
    showPaused('Could not load the scanner library. Refresh the page.');
    return;
  }

  html5Qr=new Html5Qrcode('reader',{verbose:false});

  html5Qr.start(
    {facingMode:'environment'},
    {
      fps:12,
      qrbox:function(w,h){
        var m=Math.min(w,h);
        var size=Math.floor(m*0.7);
        return {width:size,height:size};
      },
      aspectRatio:1.0
    },
    onScanSuccess,
    function(){/* ignore per-frame errors */}
  ).then(function(){
    scannerReady=true;
    isScanning=true;
    $('statusBar').textContent='Scanning…';
    $('hintBar').textContent='Point at a Novalink QR code';
  }).catch(function(err){
    console.error('[scanner start]',err);
    $('statusBar').textContent='Camera access denied.';
    showPaused('Could not access the camera. Check browser permissions and reload.');
  });
}

function stopScanner(){
  return new Promise(function(resolve){
    if(html5Qr&&isScanning){
      html5Qr.stop().then(function(){
        isScanning=false;scannerReady=false;html5Qr=null;resolve();
      }).catch(function(){
        isScanning=false;scannerReady=false;html5Qr=null;resolve();
      });
    }else{
      resolve();
    }
  });
}

function pauseScanning(){
  if(html5Qr&&isScanning){try{html5Qr.pause(true);}catch(e){}}
}
function resumeScanning(){
  hideResult();
  if(html5Qr&&isScanning){
    try{html5Qr.resume();}catch(e){startScanner();}
  }else{
    startScanner();
  }
  $('statusBar').textContent='Scanning…';
  $('hintBar').textContent='Point at a Novalink QR code';
}

async function onScanSuccess(decodedText){
  var now=Date.now();
  if(now-lastScanAt<SCAN_COOLDOWN_MS)return;
  lastScanAt=now;
  pauseScanning();
  await handleScannedCode(decodedText);
}

async function handleScannedCode(text){
  var ref=String(text||'').trim();

  if(!ref||!NovalinkSchema.looksLikeNovalinkRef(ref)){
    showResult('invalid','Invalid code',"This QR doesn't belong to a Novalink ticket.",[],true);
    return;
  }

  $('statusBar').textContent='Verifying…';

  try{
    var snap=await db.collection(EVENTS).doc(currentEventId)
      .collection('tickets')
      .where('paymentRef','==',ref)
      .limit(1)
      .get();

    var ticketDoc=null,ticket=null;
    if(!snap.empty){
      ticketDoc=snap.docs[0];
      ticket=ticketDoc.data()||{};
      ticket.id=ticketDoc.id;
    }

    if(!ticketDoc){
      showResult('invalid','Ticket not found',
        'No ticket matches this reference in the selected event.',
        [{lbl:'Reference',val:ref,mono:true}]);
      $('statusBar').textContent='Scanning…';
      return;
    }

    await processTicket(ticketDoc,ticket,ref,'scan');
    $('statusBar').textContent='Scanning…';
  }catch(err){
    console.error('[scan]',err);
    showResult('error','Verification failed',err.message||'Could not verify this ticket.',
      [{lbl:'Reference',val:ref,mono:true}]);
    $('statusBar').textContent='Scanning…';
  }
}

/* ═══════════════════════════════════════════════════════════════
   PROCESS TICKET
   ═══════════════════════════════════════════════════════════════ */
async function processTicket(ticketDoc,ticket,ref,source){
  var ev=currentEvent||{};
  var status=String(ticket.status||'').toLowerCase();
  var kind=statusKind(status);

  var info=[
    {lbl:'Guest',val:ticket.guestName||ticket.buyerName||'Guest'},
    {lbl:'Tier',val:NovalinkSchema.getTierName(ev,ticket.tier)}
  ];
  var seatDisplay=NovalinkSchema.formatSeat(ticket);
  if(seatDisplay)info.push({lbl:'Seat',val:seatDisplay});
  info.push({lbl:'Reference',val:ref,mono:true});

  if(kind==='pending'){
    showResult('pending','Not yet paid',
      'This ticket is still pending payment. Do not let them in until payment is confirmed.',
      info);
    return false;
  }
  if(kind==='expired'){
    showResult('cancelled','Ticket expired',
      'This reservation expired before payment. Do not let them in.',
      info);
    return false;
  }
  if(kind==='cancelled'){
    showResult('cancelled','Ticket cancelled',
      'This ticket was cancelled. Do not let them in.',
      info);
    return false;
  }
  if(kind==='used'){
    var checkedAt='earlier';
    if(ticket.checkedInAt){
      try{
        var d=ticket.checkedInAt.toDate?ticket.checkedInAt.toDate():new Date(ticket.checkedInAt);
        if(!isNaN(d.getTime()))checkedAt=d.toLocaleString('en-ZA');
      }catch(e){}
    }
    showResult('used','Already checked in',
      'This ticket was already scanned at '+checkedAt+'.',
      info);
    return false;
  }

  // Valid — check in
  var nowTs=firebase.firestore.FieldValue.serverTimestamp();
  await db.collection(EVENTS).doc(currentEventId)
    .collection('tickets').doc(ticket.id)
    .update({
      status:'checked-in',
      checkedInAt:nowTs,
      checkedInBy:currentUser?currentUser.uid:null,
      checkedInByEmail:currentUser?(currentUser.email||''):'',
      scannerUid:currentUser?currentUser.uid:null,
      scannerSource:source
    });

  // Update local cache
  var cached=allEventTickets.find(function(t){return t.id===ticket.id;});
  if(cached){
    cached.status='checked-in';
    cached.checkedInAt=new Date();
  }

  showResult('valid','Valid ticket','Let them in.',info);
  return true;
}

/* ═══════════════════════════════════════════════════════════════
   SEARCH MODE
   ═══════════════════════════════════════════════════════════════ */
function loadAllEventTickets(){
  if(!currentEventId)return Promise.resolve([]);
  if(loadingTickets)return Promise.resolve(allEventTickets);
  loadingTickets=true;
  return db.collection(EVENTS).doc(currentEventId)
    .collection('tickets')
    .limit(500)
    .get()
    .then(function(snap){
      allEventTickets=[];
      snap.forEach(function(doc){
        var d=doc.data()||{};
        d.id=doc.id;
        allEventTickets.push(d);
      });
      ticketsLoaded=true;
      loadingTickets=false;
      return allEventTickets;
    })
    .catch(function(err){
      console.warn('[load tickets]',err);
      allEventTickets=[];
      loadingTickets=false;
      return [];
    });
}

function renderSearchResults(){
  var q=String($('searchInput').value||'').trim().toLowerCase();
  var resultsEl=$('searchResults');
  var hintEl=$('searchHint');

  if(q.length<2){
    resultsEl.innerHTML=
      '<div class="search-empty">'+
        '<i data-lucide="users"></i>'+
        '<div>Type at least 2 characters to look up a ticket.</div>'+
      '</div>';
    hintEl.textContent='Type a guest name or NL-XXXX-XXXX-XXXX reference.';
    refreshIcons();
    return;
  }

  var isRefQuery=/^nl[-_ ]?/i.test(q);
  var matches=[];

  if(isRefQuery){
    var upperQ=q.replace(/[-_ ]/g,'').toUpperCase();
    matches=allEventTickets.filter(function(t){
      var ref=String(t.paymentRef||'').replace(/[-_ ]/g,'').toUpperCase();
      return ref.indexOf(upperQ)!==-1;
    });
  }else{
    matches=allEventTickets.filter(function(t){
      var name=String(t.guestName||t.buyerName||'').toLowerCase();
      var email=String(t.buyerEmail||'').toLowerCase();
      return name.indexOf(q)!==-1||email.indexOf(q)!==-1;
    });
  }

  // Sort: valid first, then pending, then used/cancelled
  var order={valid:0,pending:1,used:2,expired:3,cancelled:4};
  matches.sort(function(a,b){
    var ka=statusKind(a.status),kb=statusKind(b.status);
    if(order[ka]!==order[kb])return order[ka]-order[kb];
    return String(a.guestName||'').localeCompare(String(b.guestName||''));
  });

  resultsEl.innerHTML='';

  if(!matches.length){
    resultsEl.innerHTML=
      '<div class="search-empty">'+
        '<i data-lucide="search-x"></i>'+
        '<div>No tickets match "'+esc(q)+'".</div>'+
      '</div>';
    hintEl.textContent='';
    refreshIcons();
    return;
  }

  hintEl.textContent=matches.length+' ticket'+(matches.length===1?'':'s')+' found';

  matches.slice(0,50).forEach(function(t){
    var card=document.createElement('div');
    card.className='result-card';

    var kind=statusKind(t.status);
    var ref=t.paymentRef||NovalinkSchema.buildTicketRef(currentEventId,t.id,t.paymentRefRand);
    var seatDisplay=NovalinkSchema.formatSeat(t);
    var tierName=NovalinkSchema.getTierName(currentEvent,t.tier);

    var meta=[];
    meta.push('<span class="result-chip">'+esc(tierName)+'</span>');
    if(seatDisplay)meta.push('<span class="result-seat">'+esc(seatDisplay)+'</span>');
    meta.push('<span class="result-chip">'+esc(ref)+'</span>');

    var actionLabel='Check in';
    var actionCls='checkin';
    var actionDisabled=false;
    if(kind!=='valid'){
      actionDisabled=true;
      actionLabel=statusLabel(kind);
    }

    card.innerHTML=
      '<div class="result-card-main">'+
        '<div class="result-name">'+esc(t.guestName||t.buyerName||'Guest')+'</div>'+
        '<div class="result-meta">'+meta.join('')+'</div>'+
      '</div>'+
      '<span class="result-status '+kind+'">'+esc(statusLabel(kind))+'</span>'+
      '<button type="button" class="result-action '+actionCls+'" '+(actionDisabled?'disabled':'')+'>'+esc(actionLabel)+'</button>';

    var btn=card.querySelector('.result-action');
    if(!actionDisabled){
      btn.addEventListener('click',function(){
        btn.disabled=true;
        btn.textContent='…';
        processTicket({id:t.id},t,ref,'search').then(function(ok){
          if(ok){
            renderSearchResults();
          }else{
            btn.disabled=false;
            btn.textContent='Check in';
          }
        }).catch(function(err){
          showToast(err.message||'Check-in failed','error');
          btn.disabled=false;
          btn.textContent='Check in';
        });
      });
    }

    resultsEl.appendChild(card);
  });

  refreshIcons();
}

/* ═══════════════════════════════════════════════════════════════
   MODE SWITCHING
   ═══════════════════════════════════════════════════════════════ */
function switchMode(mode){
  if(mode===currentMode)return;
  currentMode=mode;

  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active',t.dataset.mode===mode);
  });
  document.querySelectorAll('.panel').forEach(function(p){
    p.classList.toggle('active',p.id===(mode==='scan'?'scanPanel':'searchPanel'));
  });

  if(mode==='scan'){
    if(currentEventId){
      setTimeout(startScanner,200);
    }
  }else{
    stopScanner();
    if(!ticketsLoaded||!allEventTickets.length){
      loadAllEventTickets().then(function(){
        if($('searchInput').value.trim().length>=2)renderSearchResults();
      });
    }
    setTimeout(function(){$('searchInput').focus();},200);
  }
}

/* ═══════════════════════════════════════════════════════════════
   WIRE UP
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',function(){
  refreshIcons();

  // Continue button on result overlay
  $('continueBtn').addEventListener('click',function(){
    hideResult();
    if(currentMode==='scan')resumeScanning();
  });

  // Mode tabs
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      switchMode(this.dataset.mode);
    });
  });

  // Event change
  $('eventSelect').addEventListener('change',function(){
    currentEventId=this.value;
    currentEvent=myEvents.find(function(e){return e.id===currentEventId;})||null;
    ticketsLoaded=false;
    allEventTickets=[];
    if(!currentEventId){showPaused('No event selected.');return;}
    hidePaused();
    if(currentMode==='scan'){
      stopScanner().then(function(){startScanner();});
    }else{
      loadAllEventTickets();
    }
    $('searchInput').value='';
    $('clearSearchBtn').classList.remove('show');
    $('searchResults').innerHTML=
      '<div class="search-empty">'+
        '<i data-lucide="users"></i>'+
        '<div>Type a guest name or reference to find a ticket.</div>'+
      '</div>';
    refreshIcons();
    showToast('Event changed','success',1500);
  });

  // Search input
  var input=$('searchInput');
  var clearBtn=$('clearSearchBtn');

  input.addEventListener('input',function(){
    clearBtn.classList.toggle('show',this.value.length>0);
    clearTimeout(searchTimer);
    searchTimer=setTimeout(renderSearchResults,SEARCH_DEBOUNCE_MS);
  });
  clearBtn.addEventListener('click',function(){
    input.value='';
    clearBtn.classList.remove('show');
    renderSearchResults();
    input.focus();
  });

  // Escape key
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if($('resultOverlay').classList.contains('open')){hideResult();if(currentMode==='scan')resumeScanning();}
    }
  });

  // Boot
  showPaused('Signing in…');

  auth.onAuthStateChanged(function(user){
    applyAuth(user);

    if(!user){
      showPaused('Sign in to use the scanner. Open the home page and sign in, then come back.');
      return;
    }

    loadMyEvents().then(function(){
      populateEventSelect();
      if(!myEvents.length){
        showPaused("You don't have any live events yet. Events must be approved before scanning.");
        return;
      }
      hidePaused();
      if(currentMode==='scan')startScanner();
      else loadAllEventTickets();
    }).catch(function(err){
      console.error('[loadMyEvents]',err);
      showPaused('Could not load your events: '+(err.message||'unknown error'));
    });
  });

  window.addEventListener('beforeunload',function(){
    if(html5Qr&&isScanning){try{html5Qr.stop();}catch(e){}}
  });
});

})();
</script>
