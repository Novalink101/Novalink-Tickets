<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f14" />
<title>Scanner · Novalink</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --cy:#00FFFF;--cy2:#00CCCC;--cy3:#009999;--cyf:#e6ffff;
  --bg:#0a0f14;--sf:#111827;--sf2:#1a2129;
  --bd:#1f2937;--bd2:#374151;
  --tx:#ffffff;--tx2:#cbd5e1;--mut:#94a3b8;
  --rd:14px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --dg:#dc2626;--dgf:#7f1d1d;--sv:#059669;--svf:#064e3b;--am:#f59e0b;--amf:#78350f;
  --ease:cubic-bezier(0.25,0.8,0.25,1);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;font-family:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}

.header{background:#000;border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.header .logo{display:inline-flex;align-items:center;gap:9px;color:var(--cy);font-weight:900;letter-spacing:.15em;font-size:12px;text-transform:uppercase}
.header .logo i{width:16px;height:16px}
.header .ev-select{flex:1;max-width:280px;padding:7px 11px;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:12px;font-family:inherit}
.header .ev-select:focus{outline:none;border-color:var(--cy)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:16px;gap:14px}
#reader{width:100%;max-width:420px;aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;background:#000;box-shadow:0 20px 60px rgba(0,255,255,0.15)}
#reader video{width:100%!important;height:100%!important;object-fit:cover;display:block}
#reader__scan_region{background:transparent!important}
#reader__scan_region img{display:none!important}
#reader__dashboard,#reader__dashboard_section,#reader__header_message{display:none!important}

.scan-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
.scan-frame{width:64%;aspect-ratio:1;border:3px solid var(--cy);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,0.55),0 0 30px rgba(0,255,255,0.5);position:relative}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;width:26px;height:26px;border:4px solid var(--cy);border-radius:0}
.scan-frame::before{top:-3px;left:-3px;border-right:none;border-bottom:none}
.scan-frame::after{bottom:-3px;right:-3px;border-left:none;border-top:none}
.scan-line{position:absolute;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--cy),transparent);animation:scanLine 2s ease-in-out infinite;top:20%;box-shadow:0 0 14px var(--cy)}
@keyframes scanLine{0%,100%{top:20%}50%{top:80%}}

.status-bar{padding:10px 16px;text-align:center;font-size:13px;font-weight:700;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;color:var(--cy);max-width:420px;width:100%}
.status-bar.hint{color:var(--mut);font-weight:500;font-size:12px}

.result-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fadeIn .25s ease}
.result-overlay.open{display:flex}
.result-overlay.valid{background:linear-gradient(135deg,rgba(5,150,105,0.98),rgba(6,78,59,0.98))}
.result-overlay.used{background:linear-gradient(135deg,rgba(245,158,11,0.98),rgba(120,53,15,0.98))}
.result-overlay.cancelled{background:linear-gradient(135deg,rgba(220,38,38,0.98),rgba(127,29,29,0.98))}
.result-overlay.pending{background:linear-gradient(135deg,rgba(245,158,11,0.98),rgba(120,53,15,0.98))}
.result-overlay.invalid{background:linear-gradient(135deg,rgba(220,38,38,0.98),rgba(127,29,29,0.98))}
.result-overlay.error{background:linear-gradient(135deg,rgba(220,38,38,0.98),rgba(127,29,29,0.98))}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-inner{max-width:460px;width:100%;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px}
.result-icon{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);border:3px solid rgba(255,255,255,0.4)}
.result-icon i{width:52px;height:52px;stroke-width:2.5}
.result-title{font-size:28px;font-weight:900;letter-spacing:-0.02em;text-transform:uppercase;letter-spacing:0.04em;text-shadow:0 2px 12px rgba(0,0,0,0.3)}
.result-subtitle{font-size:14px;color:rgba(255,255,255,0.85);font-weight:600;line-height:1.5}
.result-info{background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.22);border-radius:14px;padding:16px;width:100%;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(8px);text-align:left}
.result-row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
.result-row:last-child{border-bottom:none}
.result-row .lbl{color:rgba(255,255,255,0.7);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;flex-shrink:0;padding-top:2px}
.result-row .val{color:#fff;font-weight:800;text-align:right;word-break:break-word;min-width:0}
.result-row .val.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
.result-actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
.result-btn{padding:15px 22px;border-radius:14px;background:#fff;color:#0a0f14;font-size:15px;font-weight:900;border:none;transition:transform .15s ease;text-transform:uppercase;letter-spacing:.04em;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.result-btn:hover{transform:translateY(-2px)}
.result-btn i{width:17px;height:17px}
.result-btn.ghost{background:rgba(255,255,255,0.18);color:#fff;border:1.5px solid rgba(255,255,255,0.4)}

.paused-overlay{position:fixed;inset:0;z-index:90;background:rgba(10,15,20,0.94);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.paused-overlay.open{display:flex}
.paused-inner{max-width:400px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px}
.paused-icon{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center}
.paused-icon i{width:36px;height:36px;color:var(--cy)}
.paused-title{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.paused-msg{font-size:13.5px;color:rgba(255,255,255,0.75);line-height:1.55}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:#000;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:200;transition:transform .3s var(--ease),opacity .3s ease;display:flex;align-items:center;gap:10px;pointer-events:none;opacity:0;max-width:calc(100vw - 40px);border:1px solid var(--bd)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:#065f46;border-color:#10b981}
.toast.error{background:#991b1b;border-color:#dc2626}
.toast i{width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>

<header class="header">
  <span class="logo"><i data-lucide="scan-line"></i> Scanner</span>
  <select class="ev-select" id="eventSelect">
    <option value="">Loading events…</option>
  </select>
</header>

<div class="stage">
  <div id="reader"></div>
  <div class="scan-overlay">
    <div class="scan-frame">
      <div class="scan-line"></div>
    </div>
  </div>
  <div class="status-bar" id="statusBar">Starting camera…</div>
  <div class="status-bar hint" id="hintBar">Point the camera at a Novalink QR code</div>
</div>

<div class="paused-overlay" id="pausedOverlay">
  <div class="paused-inner">
    <div class="paused-icon"><i data-lucide="pause-circle"></i></div>
    <div class="paused-title">Scanner paused</div>
    <div class="paused-msg" id="pausedMsg">Sign in and pick an event to start scanning.</div>
  </div>
</div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-inner">
    <div class="result-icon" id="resultIcon"><i data-lucide="check"></i></div>
    <div class="result-title" id="resultTitle">Valid</div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-info" id="resultInfo"></div>
    <div class="result-actions">
      <button class="result-btn" id="scanNextBtn"><i data-lucide="scan-line"></i> Scan next</button>
      <button class="result-btn ghost" id="closeResultBtn" style="display:none"><i data-lucide="x"></i> Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════════════════════
   FIREBASE
   ══════════════════════════════════════════════════════════════ */
var firebaseConfig = {
  apiKey: "AIzaSyDSnns131jOlBXAqKo6qy7lTW4Rij-1oWU",
  authDomain: "novalink-864cf.firebaseapp.com",
  projectId: "novalink-864cf",
  storageBucket: "novalink-864cf.firebasestorage.app",
  messagingSenderId: "602780280140",
  appId: "1:602780280140:web:5d9ff2351e5a7d5e66dbe9"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var auth = firebase.auth();
var EVENTS = "events";
var ADMINS = [
  "nylnathan340@gmail.com",
  "customerservicesnovalink@gmail.com"
];

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
var currentUser = null;
var isAdmin = false;
var myEvents = [];
var currentEventId = null;
var html5Qr = null;
var isScanning = false;
var lastScanAt = 0;
var scanCooldownMs = 2500;
var scannerReady = false;

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function showToast(msg, type, ms){
  type = type || "info"; ms = ms || 3000;
  var t = $("toast");
  var ic = type === "error" ? "alert-circle" : (type === "success" ? "check-circle" : "info");
  t.className = "toast " + type;
  t.innerHTML = '<i data-lucide="' + ic + '"></i><span>' + esc(msg) + '</span>';
  refreshIcons();
  requestAnimationFrame(function(){ t.classList.add("show"); });
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.classList.remove("show"); }, ms);
}

function formatMoney(v){
  if (typeof v !== "number") v = parseFloat(v) || 0;
  if (v <= 0) return "Free";
  return "R " + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function short4(s){
  var t = String(s || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  if (t.length <= 4) return t.padStart(4, "0");
  return t.slice(-4);
}
function buildTicketRef(eId, tId, rand){
  var r = rand || "XXXX";
  return "NL-" + short4(eId) + "-" + short4(tId) + "-" + r;
}

/* ══════════════════════════════════════════════════════════════
   AUTH
   ══════════════════════════════════════════════════════════════ */
function applyAuth(user){
  currentUser = user;
  isAdmin = !!(user && ADMINS.map(function(e){ return e.toLowerCase(); }).indexOf(String(user.email || "").toLowerCase()) !== -1);
}

/* ══════════════════════════════════════════════════════════════
   LOAD EVENTS (only events owned by this scanner, or all if admin)
   ══════════════════════════════════════════════════════════════ */
function loadMyEvents(){
  var q = db.collection(EVENTS).where("status", "==", "live");
  if (!isAdmin){
    q = q.where("ownerUid", "==", currentUser.uid);
  }
  return q.get().then(function(snap){
    myEvents = [];
    snap.forEach(function(doc){
      var d = doc.data() || {};
      d.id = doc.id;
      myEvents.push(d);
    });
    myEvents.sort(function(a, b){
      return String(b.startDate || "").localeCompare(String(a.startDate || ""));
    });
    return myEvents;
  });
}

function populateEventSelect(){
  var sel = $("eventSelect");
  sel.innerHTML = "";
  if (!myEvents.length){
    var opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "No live events";
    sel.appendChild(opt);
    sel.disabled = true;
    return;
  }
  myEvents.forEach(function(ev, i){
    var opt = document.createElement("option");
    opt.value = ev.id;
    var label = ev.eventName || "Untitled";
    if (ev.startDate) label += " · " + ev.startDate;
    opt.textContent = label;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.disabled = false;
  currentEventId = myEvents[0].id;
}

/* ══════════════════════════════════════════════════════════════
   PAUSED OVERLAY   ══════════════════════════════════════════════════════════════ */
function showPaused(msg){
  $("pausedMsg").textContent = msg;
  $("pausedOverlay").classList.add("open");
  refreshIcons();
}
function hidePaused(){
  $("pausedOverlay").classList.remove("open");
}

/* ══════════════════════════════════════════════════════════════
   RESULT OVERLAY
   ══════════════════════════════════════════════════════════════ */
function showResult(kind, title, subtitle, info, opts){
  opts = opts || {};
  var overlay = $("resultOverlay");
  overlay.className = "result-overlay open " + kind;
  $("resultTitle").textContent = title;
  $("resultSubtitle").textContent = subtitle || "";

  var iconMap = {
    valid: "check-circle",
    used: "alert-triangle",
    cancelled: "x-circle",
    pending: "clock",
    invalid: "x-circle",
    error: "alert-circle"
  };
  var iconName = iconMap[kind] || "info";
  $("resultIcon").innerHTML = '<i data-lucide="' + iconName + '"></i>';

  var infoEl = $("resultInfo");
  infoEl.innerHTML = "";
  if (info && info.length){
    info.forEach(function(row){
      var div = document.createElement("div");
      div.className = "result-row";
      div.innerHTML = '<span class="lbl">' + esc(row.lbl) + '</span>' +
                      '<span class="val' + (row.mono ? ' mono' : '') + '">' + esc(row.val) + '</span>';
      infoEl.appendChild(div);
    });
    infoEl.style.display = "flex";
  } else {
    infoEl.style.display = "none";
  }

  $("closeResultBtn").style.display = opts.showClose ? "inline-flex" : "none";
  refreshIcons();
}
function hideResult(){
  $("resultOverlay").classList.remove("open");
}

/* ══════════════════════════════════════════════════════════════
   SCANNER
   ══════════════════════════════════════════════════════════════ */
function startScanner(){
  if (scannerReady) return;
  if (!currentEventId){
    showPaused("No event selected. Create or select a live event to start scanning.");
    return;
  }
  hidePaused();

  $("statusBar").textContent = "Starting camera…";

  if (!window.Html5Qrcode){
    $("statusBar").textContent = "Scanner library failed to load.";
    showPaused("Could not load the scanner library. Refresh the page.");
    return;
  }

  html5Qr = new Html5Qrcode("reader", { verbose: false });

  html5Qr.start(
    { facingMode: "environment" },
    {
      fps: 12,
      qrbox: function(w, h){
        var m = Math.min(w, h);
        var size = Math.floor(m * 0.7);
        return { width: size, height: size };
      },
      aspectRatio: 1.0
    },
    onScanSuccess,
    onScanError
  ).then(function(){
    scannerReady = true;
    isScanning = true;
    $("statusBar").textContent = "Scanning…";
    $("hintBar").textContent = "Point the camera at a Novalink QR code";
  }).catch(function(err){
    console.error("Scanner start failed:", err);
    $("statusBar").textContent = "Camera access denied.";
    showPaused("Could not access the camera. Check browser permissions and reload.");
  });
}

function stopScanner(){
  if (html5Qr && isScanning){
    html5Qr.stop().then(function(){
      isScanning = false;
      scannerReady = false;
    }).catch(function(err){ console.warn("Stop failed:", err); });
  }
}

function onScanError(err){
  // ignore — fires constantly when no QR in view
}

async function onScanSuccess(decodedText){
  var now = Date.now();
  if (now - lastScanAt < scanCooldownMs) return;
  lastScanAt = now;

  // Pause scan immediately to avoid double reads
  if (html5Qr && isScanning){
    try { html5Qr.pause(true); } catch(e){}
  }

  await handleScannedCode(decodedText);
}

async function handleScannedCode(text){
  var ref = String(text || "").trim();

  if (!ref || ref.indexOf("NL-") !== 0){
    showResult("invalid", "Invalid code", "This QR doesn't belong to a Novalink ticket.", [], { showClose: true });
    return;
  }

  $("statusBar").textContent = "Verifying…";

  try {
    // Try exact match on paymentRef
    var snap = await db.collection(EVENTS).doc(currentEventId)
      .collection("tickets")
      .where("paymentRef", "==", ref)
      .limit(1)
      .get();

    var ticketDoc = null;
    var ticket = null;
    if (!snap.empty){
      ticketDoc = snap.docs[0];
      ticket = ticketDoc.data() || {};
      ticket.id = ticketDoc.id;
    }

    // Fallback: if not found in this event, try all events (admin only)
    if (!ticketDoc && isAdmin){
      // Scan the events collection for a match
      var allEvents = await db.collection(EVENTS).get();
      for (var i = 0; i < allEvents.docs.length; i++){
        var evId = allEvents.docs[i].id;
        var s2 = await db.collection(EVENTS).doc(evId)
          .collection("tickets")
          .where("paymentRef", "==", ref)
          .limit(1)
          .get();
        if (!s2.empty){
          ticketDoc = s2.docs[0];
          ticket = ticketDoc.data() || {};
          ticket.id = ticketDoc.id;
          ticket.eventId = evId;
          break;
        }
      }
    }

    if (!ticketDoc){
      showResult("invalid", "Ticket not found", "No ticket matches this reference in the selected event.",
        [{ lbl: "Reference", val: ref, mono: true }],
        { showClose: true });
      $("statusBar").textContent = "Scanning…";
      return;
    }

    var evId = ticket.eventId || currentEventId;
    var evSnap = await db.collection(EVENTS).doc(evId).get();
    var ev = evSnap.exists ? (evSnap.data() || {}) : {};

    // ══════════════════════════════════════════════════════
    // GUARD: only these statuses can be scanned
    // ══════════════════════════════════════════════════════
    var status = String(ticket.status || "").toLowerCase();

    // REJECT PENDING
    if (status === "pending"){
      showResult("pending", "Not yet paid",
        "This ticket is still pending payment. Do not let them in until payment is confirmed.",
        [
          { lbl: "Guest", val: ticket.guestName || "Guest" },
          { lbl: "Tier", val: (ev.tierNames && ev.tierNames[ticket.tier]) || ticket.tier },
          { lbl: "Reference", val: ref, mono: true },
          { lbl: "Amount", val: formatMoney(ticket.pricePaid || 0) }
        ],
        { showClose: true });
      $("statusBar").textContent = "Scanning…";
      return;
    }

    // REJECT EXPIRED
    if (status === "expired"){
      showResult("cancelled", "Ticket expired",
        "This reservation expired before payment. Do not let them in.",
        [
          { lbl: "Guest", val: ticket.guestName || "Guest" },
          { lbl: "Reference", val: ref, mono: true }
        ],
        { showClose: true });
      $("statusBar").textContent = "Scanning…";
      return;
    }

    // REJECT CANCELLED
    if (status === "cancelled"){
      showResult("cancelled", "Ticket cancelled",
        "This ticket was cancelled. Do not let them in.",
        [
          { lbl: "Guest", val: ticket.guestName || "Guest" },
          { lbl: "Tier", val: (ev.tierNames && ev.tierNames[ticket.tier]) || ticket.tier },
          { lbl: "Reference", val: ref, mono: true }
        ],
        { showClose: true });
      $("statusBar").textContent = "Scanning…";
      return;
    }

    // ALREADY CHECKED IN
    if (status === "checked-in" || status === "checked_in" || status === "used"){
      var checkedAt = ticket.checkedInAt && ticket.checkedInAt.toDate
        ? ticket.checkedInAt.toDate().toLocaleString("en-ZA")
        : "earlier";
      showResult("used", "Already checked in",
        "This ticket was already scanned at " + checkedAt + ".",
        [
          { lbl: "Guest", val: ticket.guestName || "Guest" },
          { lbl: "Tier", val: (ev.tierNames && ev.tierNames[ticket.tier]) || ticket.tier },
          { lbl: "Reference", val: ref, mono: true }
        ],
        { showClose: true });
      $("statusBar").textContent = "Scanning…";
      return;
    }

    // ══════════════════════════════════════════════════════
    // VALID TICKET — CHECK THEM IN
    // ══════════════════════════════════════════════════════
    var nowTs = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection(EVENTS).doc(evId)
      .collection("tickets").doc(ticket.id)
      .update({
        status: "checked-in",
        checkedInAt: nowTs,
        checkedInBy: currentUser ? currentUser.uid : null,
        checkedInByEmail: currentUser ? (currentUser.email || "") : "",
        scannerUid: currentUser ? currentUser.uid : null
      });

    showResult("valid", "Valid ticket",
      "Let them in.",
      [
        { lbl: "Guest", val: ticket.guestName || "Guest" },
        { lbl: "Tier", val: (ev.tierNames && ev.tierNames[ticket.tier]) || ticket.tier },
        { lbl: "Quantity", val: String(ticket.quantity || 1) },
        { lbl: "Reference", val: ref, mono: true }
      ],
      { showClose: false });

    $("statusBar").textContent = "Checked in ✓";
  } catch(err){
    console.error("handleScannedCode error:", err);
    showResult("error", "Verification failed", err.message || "Could not verify this ticket. Try again.",
      [{ lbl: "Reference", val: ref, mono: true }],
      { showClose: true });
    $("statusBar").textContent = "Scanning…";
  }
}

/* ══════════════════════════════════════════════════════════════
   RESUME / NEXT SCAN
   ══════════════════════════════════════════════════════════════ */
function resumeScanning(){
  hideResult();
  if (html5Qr && isScanning){
    try { html5Qr.resume(); } catch(e){}
  } else {
    startScanner();
  }
  $("statusBar").textContent = "Scanning…";
  $("hintBar").textContent = "Point the camera at a Novalink QR code";
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", function(){
  refreshIcons();

  $("scanNextBtn").addEventListener("click", resumeScanning);
  $("closeResultBtn").addEventListener("click", resumeScanning);

  $("eventSelect").addEventListener("change", function(){
    currentEventId = this.value;
    if (!currentEventId){ showPaused("No event selected."); return; }
    hidePaused();
    if (html5Qr && isScanning){
      stopScanner();
      setTimeout(startScanner, 400);
    }
    showToast("Event changed", "success", 1500);
  });

  showPaused("Signing in…");
  refreshIcons();

  auth.onAuthStateChanged(function(user){
    applyAuth(user);

    if (!user){
      showPaused("Sign in to use the scanner. Open the home page and sign in, then come back.");
      return;
    }

    loadMyEvents().then(function(){
      populateEventSelect();
      if (!myEvents.length){
        showPaused("You don't have any live events yet. Events must be approved before scanning.");
        return;
      }
      hidePaused();
      startScanner();
    }).catch(function(err){
      console.error("loadMyEvents error:", err);
      showPaused("Could not load your events: " + (err.message || "unknown error"));
    });
  });
});

window.addEventListener("beforeunload", function(){
  if (html5Qr && isScanning){
    try { html5Qr.stop(); } catch(e){}
  }
});
})();
</script>
</body>
</html>
