<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f6f8fb" />
<title>Scanner · Novalink</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --cy:#00CCCC;--cy2:#00AAAA;--cy3:#007777;--cyf:#e6ffff;
  --bg:#f6f8fb;--sf:#ffffff;--sf2:#f1f4f8;
  --bd:#e4e9f0;--bd2:#d3dbe5;
  --tx:#0a0f14;--tx2:#2b3644;--mut:#6b7787;
  --nv:#1e2f4d;--ink:#0a0f14;
  --dg:#dc2626;--dgf:#fef2f2;--sv:#059669;--svf:#ecfdf5;--am:#f59e0b;--amf:#fffbeb;
  --rd:14px;--ease:cubic-bezier(0.25,0.8,0.25,1);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;font-family:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
input{font:inherit;font-family:inherit}

/* HEADER */
.header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header .logo{display:inline-flex;align-items:center;gap:9px;color:var(--nv);font-weight:900;letter-spacing:.15em;font-size:12px;text-transform:uppercase;flex-shrink:0}
.header .logo i{width:16px;height:16px;color:var(--cy)}
.header .ev-select{flex:1;padding:8px 12px;background:var(--sf2);border:1px solid var(--bd2);border-radius:9px;color:var(--tx);font-size:12.5px;font-weight:700;min-width:0}
.header .ev-select:focus{outline:none;border-color:var(--cy)}

/* MODE TOGGLE */
.mode-tabs{display:flex;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:4px;margin:12px 16px 0;flex-shrink:0}
.mode-tab{flex:1;padding:10px;background:transparent;border:none;border-radius:9px;color:var(--mut);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .2s ease}
.mode-tab i{width:15px;height:15px}
.mode-tab.active{background:var(--ink);color:#fff}

/* STAGE */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:16px;gap:14px;min-height:0}
.mode-panel{display:none;flex-direction:column;align-items:center;gap:14px;width:100%;height:100%;justify-content:center}
.mode-panel.active{display:flex}

#reader{width:100%;max-width:420px;aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;background:#000;box-shadow:0 20px 60px rgba(10,15,20,0.15)}
#reader video{width:100%!important;height:100%!important;object-fit:cover;display:block}
#reader__scan_region{background:transparent!important}
#reader__scan_region img{display:none!important}
#reader__dashboard,#reader__dashboard_section,#reader__header_message{display:none!important}

.scan-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
.scan-frame{width:64%;aspect-ratio:1;border:3px solid var(--cy);border-radius:16px;box-shadow:0 0 0 9999px rgba(10,15,20,0.55),0 0 30px rgba(0,204,204,0.5);position:relative}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;width:26px;height:26px;border:4px solid var(--cy);border-radius:0}
.scan-frame::before{top:-3px;left:-3px;border-right:none;border-bottom:none}
.scan-frame::after{bottom:-3px;right:-3px;border-left:none;border-top:none}
.scan-line{position:absolute;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--cy),transparent);animation:scanLine 2s ease-in-out infinite;top:20%;box-shadow:0 0 14px var(--cy)}
@keyframes scanLine{0%,100%{top:20%}50%{top:80%}}

.status-bar{padding:10px 16px;text-align:center;font-size:13px;font-weight:700;background:var(--sf);border:1px solid var(--bd);border-radius:12px;color:var(--cy3);max-width:420px;width:100%}
.status-bar.hint{color:var(--mut);font-weight:500;font-size:12px}

/* SEARCH MODE */
.search-panel{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;height:100%}
.search-bar{position:relative;flex-shrink:0}
.search-bar input{width:100%;padding:14px 16px 14px 44px;background:var(--sf);border:1.5px solid var(--bd2);border-radius:12px;font-size:15px;color:var(--tx);font-weight:600}
.search-bar input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,204,204,.15);background:#fff}
.search-bar i{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);pointer-events:none}
.search-bar .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;padding:0}
.search-bar .clear-btn.show{display:inline-flex}
.search-bar .clear-btn i{position:static;transform:none;width:14px;height:14px;color:var(--tx2)}

.search-hint{font-size:12px;color:var(--mut);text-align:center;padding:0 4px;line-height:1.55}

.search-results{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.search-empty{text-align:center;padding:40px 20px;color:var(--mut);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:8px}
.search-empty i{width:36px;height:36px;color:var(--bd2)}

.result-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;transition:all .15s ease}
.result-card:hover{border-color:var(--cy);box-shadow:0 4px 14px rgba(10,15,20,0.05)}
.result-card .rc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.result-card .rc-name{font-size:15px;font-weight:800;color:var(--tx);word-break:break-word}
.result-card .rc-meta{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.result-card .rc-meta .rc-chip{background:var(--sf2);padding:2px 8px;border-radius:99px;font-weight:700;font-family:var(--mono);font-size:11px}
.result-card .rc-seat{font-family:var(--mono);font-size:12px;color:var(--cy3);font-weight:700}
.result-card .rc-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:900;padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;flex-shrink:0}
.result-card .rc-status.valid{background:var(--svf);color:#065f46}
.result-card .rc-status.used{background:var(--amf);color:#92400e}
.result-card .rc-status.cancelled{background:var(--dgf);color:#991b1b}
.result-card .rc-status.pending{background:var(--amf);color:#92400e}
.result-card .rc-status.expired{background:#f1f5f9;color:#475569}

.result-card .rc-action{background:var(--ink);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.result-card .rc-action:disabled{opacity:.4;cursor:not-allowed}
.result-card .rc-action.checkin{background:var(--ink)}
.result-card .rc-action.blocked{background:#f1f5f9;color:#64748b}

/* RESULT OVERLAY */
.result-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fadeIn .25s ease;overflow-y:auto}
.result-overlay.open{display:flex}
.result-overlay.valid{background:linear-gradient(135deg,rgba(5,150,105,0.98),rgba(6,78,59,0.98))}
.result-overlay.used{background:linear-gradient(135deg,rgba(245,158,11,0.98),rgba(120,53,15,0.98))}
.result-overlay.cancelled{background:linear-gradient(135deg,rgba(220,38,38,0.98),rgba(127,29,29,0.98))}
.result-overlay.pending{background:linear-gradient(135deg,rgba(245,158,11,0.98),rgba(120,53,15,0.98))}
.result-overlay.invalid{background:linear-gradient(135deg,rgba(220,38,38,0.98),rgba(127,29,29,0.98))}
.result-overlay.error{background:linear-gradient(135deg,rgba(220,38,38,0.98),rgba(127,29,29,0.98))}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-inner{max-width:460px;width:100%;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
.result-icon{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);border:3px solid rgba(255,255,255,0.4);flex-shrink:0}
.result-icon i{width:52px;height:52px;stroke-width:2.5}
.result-title{font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,0.3)}
.result-subtitle{font-size:14px;color:rgba(255,255,255,0.85);font-weight:600;line-height:1.5}
.result-info{background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.22);border-radius:14px;padding:16px;width:100%;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(8px);text-align:left}
.result-row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
.result-row:last-child{border-bottom:none}
.result-row .lbl{color:rgba(255,255,255,0.7);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;flex-shrink:0;padding-top:2px}
.result-row .val{color:#fff;font-weight:800;text-align:right;word-break:break-word;min-width:0}
.result-row .val.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
.result-actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
.result-btn{padding:15px 22px;border-radius:14px;background:#fff;color:#0a0f14;font-size:15px;font-weight:900;border:none;transition:transform .15s ease;text-transform:uppercase;letter-spacing:.04em;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.result-btn:hover{transform:translateY(-2px)}
.result-btn i{width:17px;height:17px}
.result-btn.ghost{background:rgba(255,255,255,0.18);color:#fff;border:1.5px solid rgba(255,255,255,0.4)}

/* PAUSED OVERLAY */
.paused-overlay{position:fixed;inset:0;z-index:90;background:rgba(10,15,20,0.94);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.paused-overlay.open{display:flex}
.paused-inner{max-width:400px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px}
.paused-icon{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center}
.paused-icon i{width:36px;height:36px;color:var(--cy)}
.paused-title{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.paused-msg{font-size:13.5px;color:rgba(255,255,255,0.75);line-height:1.55}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:200;transition:transform .3s var(--ease),opacity .3s ease;display:flex;align-items:center;gap:10px;pointer-events:none;opacity:0;max-width:calc(100vw - 40px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:#065f46}
.toast.error{background:#991b1b}
.toast i{width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>

<header class="header">
  <span class="logo"><i data-lucide="scan-line"></i> Scanner</span>
  <select class="ev-select" id="eventSelect">
    <option value="">Loading events…</option>
  </select>
</header>

<div class="mode-tabs">
  <button class="mode-tab active" data-mode="scan" type="button"><i data-lucide="camera"></i> Scan</button>
  <button class="mode-tab" data-mode="search" type="button"><i data-lucide="search"></i> Search</button>
</div>

<div class="stage">

  <!-- SCAN MODE -->
  <div class="mode-panel active" id="scanPanel">
    <div id="reader"></div>
    <div class="scan-overlay">
      <div class="scan-frame">
        <div class="scan-line"></div>
      </div>
    </div>
    <div class="status-bar" id="statusBar">Starting camera…</div>
    <div class="status-bar hint" id="hintBar">Point the camera at a Novalink QR code</div>
  </div>

  <!-- SEARCH MODE -->
  <div class="mode-panel" id="searchPanel">
    <div class="search-panel">
      <div class="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="Search by guest name or reference…" autocomplete="off" />
        <button type="button" class="clear-btn" id="clearSearchBtn" aria-label="Clear"><i data-lucide="x"></i></button>
      </div>
      <div class="search-hint" id="searchHint">Type a guest name or NL-XXXX-XXXX-XXXX reference to look up a ticket.</div>
      <div class="search-results" id="searchResults">
        <div class="search-empty">
          <i data-lucide="users"></i>
          <div>Type at least 2 characters to search.</div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="paused-overlay" id="pausedOverlay">
  <div class="paused-inner">
    <div class="paused-icon"><i data-lucide="pause-circle"></i></div>
    <div class="paused-title">Scanner paused</div>
    <div class="paused-msg" id="pausedMsg">Sign in and pick an event to start scanning.</div>
  </div>
</div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-inner">
    <div class="result-icon" id="resultIcon"><i data-lucide="check"></i></div>
    <div class="result-title" id="resultTitle">Valid</div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-info" id="resultInfo"></div>
    <div class="result-actions">
      <button class="result-btn" id="scanNextBtn"><i data-lucide="scan-line"></i> Continue</button>
      <button class="result-btn ghost" id="closeResultBtn" style="display:none"><i data-lucide="x"></i> Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var firebaseConfig = {
  apiKey: "AIzaSyDSnns131jOlBXAqKo6qy7lTW4Rij-1oWU",
  authDomain: "novalink-864cf.firebaseapp.com",
  projectId: "novalink-864cf",
  storageBucket: "novalink-864cf.firebasestorage.app",
  messagingSenderId: "602780280140",
  appId: "1:602780280140:web:5d9ff2351e5a7d5e66dbe9"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var auth = firebase.auth();
var EVENTS = "events";
var ADMINS = [
  "nylnathan340@gmail.com",
  "customerservicesnovalink@gmail.com"
];

var currentUser = null;
var isAdmin = false;
var myEvents = [];
var currentEventId = null;
var currentEvent = null;
var html5Qr = null;
var isScanning = false;
var lastScanAt = 0;
var scanCooldownMs = 2500;
var scannerReady = false;
var currentMode = 'scan';
var searchTimer = null;
var allEventTickets = [];   // cached for search
var ticketsLoaded = false;

function $(id){ return document.getElementById(id); }
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function showToast(msg, type, ms){
  type = type || "info"; ms = ms || 3000;
  var t = $("toast");
  var ic = type === "error" ? "alert-circle" : (type === "success" ? "check-circle" : "info");
  t.className = "toast " + type;
  t.innerHTML = '<i data-lucide="' + ic + '"></i><span>' + esc(msg) + '</span>';
  refreshIcons();
  requestAnimationFrame(function(){ t.classList.add("show"); });
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.classList.remove("show"); }, ms);
}

function formatMoney(v){
  if (typeof v !== "number") v = parseFloat(v) || 0;
  if (v <= 0) return "Free";
  return "R " + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function short4(s){
  var t = String(s || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  if (t.length <= 4) return t.padStart(4, "0");
  return t.slice(-4);
}
function buildTicketRef(eId, tId, rand){
  var r = rand || "XXXX";
  return "NL-" + short4(eId) + "-" + short4(tId) + "-" + r;
}

/* Tier helpers — semantic keys */
function getTierName(ev, tierKey){
  if (ev && ev.tierNames && ev.tierNames[tierKey]) return ev.tierNames[tierKey];
  var N = { elite:"Elite", silver:"Silver", standard:"Standard" };
  return N[tierKey] || tierKey || "Standard";
}

/* Structured seat display */
function formatSeatDisplay(t){
  if (t.generalAdmission) return "General admission";
  if (t.seatBlock || t.seatSection || t.seatTable || t.seatRow || t.seatNumber){
    var parts = [];
    if (t.seatBlock)   parts.push(t.seatBlock);
    if (t.seatSection) parts.push(t.seatSection);
    if (t.seatTable)   parts.push("Table " + t.seatTable);
    if (t.seatRow)     parts.push("Row " + t.seatRow);
    if (t.seatNumber)  parts.push("Seat " + t.seatNumber);
    if (parts.length) return parts.join(" · ");
  }
  return t.seat || "";
}

function statusKind(status){
  var s = String(status || "").toLowerCase();
  if (s === "checked-in" || s === "checked_in" || s === "used") return "used";
  if (s === "cancelled") return "cancelled";
  if (s === "expired") return "expired";
  if (s === "pending") return "pending";
  return "valid";
}
function statusLabel(kind){
  return {
    valid: "Valid",
    used: "Checked in",
    cancelled: "Cancelled",
    expired: "Expired",
    pending: "Pending"
  }[kind] || kind;
}

/* AUTH */
function applyAuth(user){
  currentUser = user;
  isAdmin = !!(user && ADMINS.map(function(e){ return e.toLowerCase(); }).indexOf(String(user.email || "").toLowerCase()) !== -1);
}

/* LOAD EVENTS */
function loadMyEvents(){
  var q = db.collection(EVENTS).where("status", "==", "live");
  if (!isAdmin){
    q = q.where("ownerUid", "==", currentUser.uid);
  }
  return q.get().then(function(snap){
    myEvents = [];
    snap.forEach(function(doc){
      var d = doc.data() || {};
      d.id = doc.id;
      myEvents.push(d);
    });
    myEvents.sort(function(a, b){
      return String(b.startDate || "").localeCompare(String(a.startDate || ""));
    });
    return myEvents;
  });
}

function populateEventSelect(){
  var sel = $("eventSelect");
  sel.innerHTML = "";
  if (!myEvents.length){
    var opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "No live events";
    sel.appendChild(opt);
    sel.disabled = true;
    return;
  }
  myEvents.forEach(function(ev, i){
    var opt = document.createElement("option");
    opt.value = ev.id;
    var label = ev.eventName || "Untitled";
    if (ev.startDate) label += " · " + ev.startDate;
    opt.textContent = label;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.disabled = false;
  currentEventId = myEvents[0].id;
  currentEvent = myEvents[0];
}

/* PAUSED */
function showPaused(msg){
  $("pausedMsg").textContent = msg;
  $("pausedOverlay").classList.add("open");
  refreshIcons();
}
function hidePaused(){
  $("pausedOverlay").classList.remove("open");
}

/* RESULT OVERLAY */
function showResult(kind, title, subtitle, info, opts){
  opts = opts || {};
  var overlay = $("resultOverlay");
  overlay.className = "result-overlay open " + kind;
  $("resultTitle").textContent = title;
  $("resultSubtitle").textContent = subtitle || "";

  var iconMap = {
    valid: "check-circle",
    used: "alert-triangle",
    cancelled: "x-circle",
    pending: "clock",
    invalid: "x-circle",
    error: "alert-circle"
  };
  $("resultIcon").innerHTML = '<i data-lucide="' + (iconMap[kind] || "info") + '"></i>';

  var infoEl = $("resultInfo");
  infoEl.innerHTML = "";
  if (info && info.length){
    info.forEach(function(row){
      var div = document.createElement("div");
      div.className = "result-row";
      div.innerHTML = '<span class="lbl">' + esc(row.lbl) + '</span>' +
                      '<span class="val' + (row.mono ? ' mono' : '') + '">' + esc(row.val) + '</span>';
      infoEl.appendChild(div);
    });
    infoEl.style.display = "flex";
  } else {
    infoEl.style.display = "none";
  }
  $("closeResultBtn").style.display = opts.showClose ? "inline-flex" : "none";
  refreshIcons();
}
function hideResult(){
  $("resultOverlay").classList.remove("open");
}

/* ══════════════════════════════════════════════════════════════
   SCANNER
   ══════════════════════════════════════════════════════════════ */
function startScanner(){
  if (currentMode !== 'scan') return;
  if (scannerReady) return;
  if (!currentEventId){ showPaused("No event selected."); return; }
  hidePaused();

  $("statusBar").textContent = "Starting camera…";

  if (!window.Html5Qrcode){
    $("statusBar").textContent = "Scanner library failed to load.";
    showPaused("Could not load the scanner library. Refresh the page.");
    return;
  }

  html5Qr = new Html5Qrcode("reader", { verbose: false });

  html5Qr.start(
    { facingMode: "environment" },
    {
      fps: 12,
      qrbox: function(w, h){
        var m = Math.min(w, h);
        var size = Math.floor(m * 0.7);
        return { width: size, height: size };
      },
      aspectRatio: 1.0
    },
    onScanSuccess,
    function(){ /* ignore scan errors */ }
  ).then(function(){
    scannerReady = true;
    isScanning = true;
    $("statusBar").textContent = "Scanning…";
    $("hintBar").textContent = "Point the camera at a Novalink QR code";
  }).catch(function(err){
    console.error("Scanner start failed:", err);
    $("statusBar").textContent = "Camera access denied.";
    showPaused("Could not access the camera. Check browser permissions and reload.");
  });
}

function stopScanner(){
  return new Promise(function(resolve){
    if (html5Qr && isScanning){
      html5Qr.stop().then(function(){
        isScanning = false;
        scannerReady = false;
        html5Qr = null;
        resolve();
      }).catch(function(err){
        console.warn("Stop failed:", err);
        isScanning = false;
        scannerReady = false;
        html5Qr = null;
        resolve();
      });
    } else {
      resolve();
    }
  });
}

async function onScanSuccess(decodedText){
  var now = Date.now();
  if (now - lastScanAt < scanCooldownMs) return;
  lastScanAt = now;
  if (html5Qr && isScanning){ try { html5Qr.pause(true); } catch(e){} }
  await handleScannedCode(decodedText);
}

async function handleScannedCode(text){
  var ref = String(text || "").trim();

  if (!ref || ref.indexOf("NL-") !== 0){
    showResult("invalid", "Invalid code", "This QR doesn't belong to a Novalink ticket.", [], { showClose: true });
    return;
  }

  $("statusBar").textContent = "Verifying…";

  try {
    var snap = await db.collection(EVENTS).doc(currentEventId)
      .collection("tickets")
      .where("paymentRef", "==", ref)
      .limit(1)
      .get();

    var ticketDoc = null, ticket = null;
    if (!snap.empty){
      ticketDoc = snap.docs[0];
      ticket = ticketDoc.data() || {};
      ticket.id = ticketDoc.id;
    }

    if (!ticketDoc){
      showResult("invalid", "Ticket not found", "No ticket matches this reference in the selected event.",
        [{ lbl: "Reference", val: ref, mono: true }],
        { showClose: true });
      $("statusBar").textContent = "Scanning…";
      return;
    }

    await processTicketForCheckIn(ticketDoc, ticket, ref, 'scan');
    $("statusBar").textContent = "Scanning…";
  } catch(err){
    console.error("handleScannedCode error:", err);
    showResult("error", "Verification failed", err.message || "Could not verify this ticket.",
      [{ lbl: "Reference", val: ref, mono: true }], { showClose: true });
    $("statusBar").textContent = "Scanning…";
  }
}

/* ══════════════════════════════════════════════════════════════
   PROCESS TICKET FOR CHECK-IN (used by both scanner and search)
   ══════════════════════════════════════════════════════════════ */
async function processTicketForCheckIn(ticketDoc, ticket, ref, source){
  var ev = currentEvent || {};
  var status = String(ticket.status || "").toLowerCase();
  var kind = statusKind(status);

  var info = [
    { lbl: "Guest", val: ticket.guestName || ticket.buyerName || "Guest" },
    { lbl: "Tier", val: getTierName(ev, ticket.tier) }
  ];
  var seatDisplay = formatSeatDisplay(ticket);
  if (seatDisplay) info.push({ lbl: "Seat", val: seatDisplay });
  info.push({ lbl: "Quantity", val: String(ticket.quantity || 1) });
  info.push({ lbl: "Reference", val: ref, mono: true });

  if (kind === "pending"){
    showResult("pending", "Not yet paid",
      "This ticket is still pending payment. Do not let them in until payment is confirmed.",
      info, { showClose: true });
    return false;
  }
  if (kind === "expired"){
    showResult("cancelled", "Ticket expired",
      "This reservation expired before payment. Do not let them in.",
      info, { showClose: true });
    return false;
  }
  if (kind === "cancelled"){
    showResult("cancelled", "Ticket cancelled",
      "This ticket was cancelled. Do not let them in.",
      info, { showClose: true });
    return false;
  }
  if (kind === "used"){
    var checkedAt = ticket.checkedInAt && ticket.checkedInAt.toDate
      ? ticket.checkedInAt.toDate().toLocaleString("en-ZA")
      : "earlier";
    showResult("used", "Already checked in",
      "This ticket was already scanned at " + checkedAt + ".",
      info, { showClose: true });
    return false;
  }

  /* Valid — check in */
  var nowTs = firebase.firestore.FieldValue.serverTimestamp();
  await db.collection(EVENTS).doc(currentEventId)
    .collection("tickets").doc(ticket.id)
    .update({
      status: "checked-in",
      checkedInAt: nowTs,
      checkedInBy: currentUser ? currentUser.uid : null,
      checkedInByEmail: currentUser ? (currentUser.email || "") : "",
      scannerUid: currentUser ? currentUser.uid : null,
      scannerSource: source
    });

  /* Update local cache */
  var cached = allEventTickets.find(function(t){ return t.id === ticket.id; });
  if (cached){
    cached.status = "checked-in";
    cached.checkedInAt = new Date();
  }

  showResult("valid", "Valid ticket", "Let them in.", info, { showClose: false });
  return true;
}

/* ══════════════════════════════════════════════════════════════
   SEARCH
   ══════════════════════════════════════════════════════════════ */
function loadAllTicketsForEvent(){
  if (!currentEventId) return Promise.resolve([]);
  return db.collection(EVENTS).doc(currentEventId)
    .collection("tickets")
    .limit(500)
    .get()
    .then(function(snap){
      allEventTickets = [];
      snap.forEach(function(doc){
        var d = doc.data() || {};
        d.id = doc.id;
        allEventTickets.push(d);
      });
      ticketsLoaded = true;
      return allEventTickets;
    })
    .catch(function(err){
      console.warn("loadAllTicketsForEvent:", err);
      allEventTickets = [];
      return [];
    });
}

function runSearch(query){
  var q = String(query || "").trim().toLowerCase();
  var resultsEl = $("searchResults");
  var hintEl = $("searchHint");

  if (q.length < 2){
    resultsEl.innerHTML = '<div class="search-empty"><i data-lucide="users"></i><div>Type at least 2 characters to search.</div></div>';
    hintEl.textContent = "Type a guest name or NL-XXXX-XXXX-XXXX reference to look up a ticket.";
    refreshIcons();
    return;
  }

  /* Query Firestore for reference match if it looks like a ref */
  var isRefQuery = /^nl[-_ ]?/i.test(q);
  var matches = [];

  if (isRefQuery){
    /* exact reference — matches against allEventTickets OR fetch from Firestore */
    var upperQ = q.replace(/[-_ ]/g, '').toUpperCase();
    matches = allEventTickets.filter(function(t){
      var ref = String(t.paymentRef || '').replace(/[-_ ]/g, '').toUpperCase();
      return ref.indexOf(upperQ) !== -1;
    });
  } else {
    matches = allEventTickets.filter(function(t){
      var name = String(t.guestName || t.buyerName || '').toLowerCase();
      var email = String(t.buyerEmail || '').toLowerCase();
      return name.indexOf(q) !== -1 || email.indexOf(q) !== -1;
    });
  }

  /* Sort: valid first, then pending, then used/cancelled */
  var order = { valid: 0, pending: 1, used: 2, expired: 3, cancelled: 4 };
  matches.sort(function(a, b){
    var ka = statusKind(a.status), kb = statusKind(b.status);
    if (order[ka] !== order[kb]) return order[ka] - order[kb];
    return String(a.guestName || '').localeCompare(String(b.guestName || ''));
  });

  resultsEl.innerHTML = '';

  if (!matches.length){
    resultsEl.innerHTML = '<div class="search-empty"><i data-lucide="search-x"></i><div>No tickets match "' + esc(query) + '".</div></div>';
    hintEl.textContent = "";
    refreshIcons();
    return;
  }

  hintEl.textContent = matches.length + " ticket" + (matches.length === 1 ? "" : "s") + " found";

  matches.slice(0, 50).forEach(function(t){
    var card = document.createElement('div');
    card.className = "result-card";

    var kind = statusKind(t.status);
    var ref = t.paymentRef || buildTicketRef(currentEventId, t.id, t.paymentRefRand);
    var seatDisplay = formatSeatDisplay(t);
    var tierName = getTierName(currentEvent, t.tier);

    var meta = [];
    meta.push('<span class="rc-chip">' + esc(tierName) + '</span>');
    if (seatDisplay) meta.push('<span class="rc-seat">' + esc(seatDisplay) + '</span>');
    meta.push('<span class="rc-chip">' + esc(ref) + '</span>');

    var actionLabel = "Check in";
    var actionCls = "checkin";
    var actionDisabled = false;
    if (kind !== "valid"){
      actionDisabled = true;
      actionCls = "blocked";
      actionLabel = statusLabel(kind);
    }

    card.innerHTML =
      '<div class="rc-info">' +
        '<div class="rc-name">' + esc(t.guestName || t.buyerName || 'Guest') + '</div>' +
        '<div class="rc-meta">' + meta.join('') + '</div>' +
      '</div>' +
      '<span class="rc-status ' + kind + '">' + statusLabel(kind) + '</span>' +
      '<button type="button" class="rc-action ' + actionCls + '" ' + (actionDisabled ? 'disabled' : '') + '>' + actionLabel + '</button>';

    var btn = card.querySelector('.rc-action');
    if (!actionDisabled){
      btn.addEventListener('click', function(){
        btn.disabled = true;
        btn.textContent = "…";
        processTicketForCheckIn({ id: t.id }, t, ref, 'search').then(function(ok){
          if (ok){
            /* refresh search results to reflect new status */
            runSearch(query);
          } else {
            btn.disabled = false;
            btn.textContent = "Check in";
          }
        }).catch(function(err){
          showToast(err.message || "Check-in failed", "error");
          btn.disabled = false;
          btn.textContent = "Check in";
        });
      });
    }

    resultsEl.appendChild(card);
  });

  refreshIcons();
}

/* ══════════════════════════════════════════════════════════════
   MODE SWITCHING
   ══════════════════════════════════════════════════════════════ */
function switchMode(mode){
  if (mode === currentMode) return;
  currentMode = mode;

  document.querySelectorAll('.mode-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  document.querySelectorAll('.mode-panel').forEach(function(p){
    p.classList.toggle('active', p.id === (mode === 'scan' ? 'scanPanel' : 'searchPanel'));
  });

  if (mode === 'scan'){
    /* returning to scan — start camera */
    if (currentEventId){
      setTimeout(startScanner, 200);
    }
  } else {
    /* entering search — stop camera to save battery */
    stopScanner();
    /* preload tickets */
    if (!ticketsLoaded || !allEventTickets.length){
      loadAllTicketsForEvent().then(function(){
        if ($("searchInput").value.trim().length >= 2){
          runSearch($("searchInput").value);
        }
      });
    }
    setTimeout(function(){ $("searchInput").focus(); }, 200);
  }
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", function(){
  refreshIcons();

  $("scanNextBtn").addEventListener("click", function(){
    hideResult();
    if (currentMode === 'scan'){
      resumeScanning();
    }
  });
  $("closeResultBtn").addEventListener("click", function(){
    hideResult();
    if (currentMode === 'scan') resumeScanning();
  });

  document.querySelectorAll('.mode-tab').forEach(function(tab){
    tab.addEventListener('click', function(){ switchMode(this.dataset.mode); });
  });

  $("eventSelect").addEventListener("change", function(){
    currentEventId = this.value;
    currentEvent = myEvents.find(function(e){ return e.id === currentEventId; }) || null;
    ticketsLoaded = false;
    allEventTickets = [];
    if (!currentEventId){ showPaused("No event selected."); return; }
    hidePaused();
    if (currentMode === 'scan'){
      stopScanner().then(function(){ startScanner(); });
    } else {
      loadAllTicketsForEvent();
    }
    /* clear search */
    $("searchInput").value = "";
    $("clearSearchBtn").classList.remove("show");
    $("searchResults").innerHTML = '<div class="search-empty"><i data-lucide="users"></i><div>Type at least 2 characters to search.</div></div>';
    refreshIcons();
    showToast("Event changed", "success", 1500);
  });

  /* Search input */
  var input = $("searchInput");
  var clearBtn = $("clearSearchBtn");

  input.addEventListener("input", function(){
    clearBtn.classList.toggle("show", this.value.length > 0);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ runSearch(input.value); }, 220);
  });
  clearBtn.addEventListener("click", function(){
    input.value = "";
    clearBtn.classList.remove("show");
    runSearch("");
    input.focus();
  });

  function resumeScanning(){
    hideResult();
    if (html5Qr && isScanning){
      try { html5Qr.resume(); } catch(e){}
    } else {
      startScanner();
    }
    $("statusBar").textContent = "Scanning…";
    $("hintBar").textContent = "Point the camera at a Novalink QR code";
  }

  showPaused("Signing in…");
  refreshIcons();

  auth.onAuthStateChanged(function(user){
    applyAuth(user);

    if (!user){
      showPaused("Sign in to use the scanner. Open the home page and sign in, then come back.");
      return;
    }

    loadMyEvents().then(function(){
      populateEventSelect();
      if (!myEvents.length){
        showPaused("You don't have any live events yet. Events must be approved before scanning.");
        return;
      }
      hidePaused();
      if (currentMode === 'scan') startScanner();
      else loadAllTicketsForEvent();
    }).catch(function(err){
      console.error("loadMyEvents error:", err);
      showPaused("Could not load your events: " + (err.message || "unknown error"));
    });
  });
});

window.addEventListener("beforeunload", function(){
  if (html5Qr && isScanning){ try { html5Qr.stop(); } catch(e){} }
});
})();
</script>
