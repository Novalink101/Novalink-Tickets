<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f14" />
<meta name="description" content="Novalink — live streams, channels, and replays." />
<title>Streams · Novalink</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --cy:#00FFFF;--cy2:#00CCCC;--cy3:#009999;--cyf:#e6ffff;
  --bg:#f6f8fb;--sf:#ffffff;--sf2:#f1f4f8;
  --bd:#e4e9f0;--bd2:#d3dbe5;
  --tx:#0a0f14;--tx2:#2b3644;--mut:#6b7787;
  --rd:14px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --dg:#dc2626;--dgf:#fef2f2;--sv:#059669;--svf:#ecfdf5;--nv:#1e2f4d;
  --ink:#0a0f14;
  --ease:cubic-bezier(0.25,0.8,0.25,1);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.container{max-width:1480px;margin:0 auto;padding:0 20px;width:100%}
h1,h2,h3{line-height:1.15;font-weight:700}
a{color:inherit;text-decoration:none}
button{font:inherit;font-family:inherit;cursor:pointer;touch-action:manipulation}
input{font-family:inherit}

/* HEADER */
.site-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 0;position:sticky;top:0;z-index:50}
.hdr{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:11px;flex-shrink:0;color:var(--nv)}
.logo svg{width:26px;height:32px;display:block}
.logo b{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.hdr-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-size:12.5px;font-weight:800;transition:.15s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--cy);background:#fff;box-shadow:0 0 0 3px rgba(0,255,255,.14)}
.hdr-btn i{width:14px;height:14px}
.hdr-btn .avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#04161c;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;font-family:var(--mono)}
@media (max-width:520px){.hdr-btn .lbl{display:none}}

/* SEARCH BAR */
.search-bar{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 0}
.search-in{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-input{position:relative;flex:1;min-width:220px;display:flex;align-items:center}
.search-input i{position:absolute;left:14px;width:16px;height:16px;color:var(--mut);pointer-events:none}
.search-input input{width:100%;padding:11px 40px 11px 42px;background:var(--sf2);border:1px solid var(--bd2);border-radius:99px;font-size:14px;transition:.15s}
.search-input input:focus{outline:none;border-color:var(--cy);background:#fff;box-shadow:0 0 0 3px rgba(0,255,255,.15)}
.search-input .clear{position:absolute;right:8px;width:26px;height:26px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);color:var(--mut);display:none;align-items:center;justify-content:center}
.search-input .clear.show{display:inline-flex}
.search-input .clear:hover{background:var(--dgf);color:var(--dg);border-color:#fecaca}
.search-input .clear i{position:static;width:13px;height:13px}
.cat-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1;min-width:0;padding:2px}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);font-size:12.5px;font-weight:800;white-space:nowrap;transition:.15s}
.cat-chip:hover{border-color:var(--cy)}
.cat-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* CHANNEL STRIP */
.ch-strip-wrap{background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:64px;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.ch-strip{max-width:1480px;margin:0 auto;padding:12px 20px;display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ch-strip::-webkit-scrollbar{display:none}
.ch-chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;
  padding:8px 14px 8px 8px;border-radius:99px;
  background:transparent;border:1px solid transparent;color:var(--mut);
  font-size:13px;font-weight:800;white-space:nowrap;transition:.15s;
  position:relative;
}
.ch-chip:hover{background:var(--sf2);color:var(--tx2)}
.ch-chip.active{background:var(--ink);color:#fff}
.ch-chip.active::after{content:'';position:absolute;bottom:-13px;left:20%;right:20%;height:2px;background:var(--cy);border-radius:2px}
.ch-chip-logo{width:24px;height:24px;border-radius:8px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#0a0f14,#0f172a);display:flex;align-items:center;justify-content:center;border:1px solid var(--bd)}
.ch-chip.active .ch-chip-logo{border-color:var(--cy)}
.ch-chip-logo img{width:100%;height:100%;object-fit:cover}
.ch-chip-logo span{font-size:10px;font-weight:900;color:var(--cy);font-family:var(--mono)}
.ch-chip .live-pill{background:#dc2626;color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:99px;letter-spacing:.06em}
@media (max-width:560px){.ch-chip{padding:7px 12px 7px 7px;font-size:12px}.ch-chip-logo{width:22px;height:22px;border-radius:7px}}

/* PAGER */
.pager{position:relative;flex:1;overflow:hidden}
.pager-track{display:flex;transition:transform .38s var(--ease);will-change:transform}
.channel-slide{flex:0 0 100%;width:100%;min-width:0}

/* HERO */
.ch-hero{
  position:relative;
  background:#0a0f14;color:#fff;
  overflow:hidden;margin-bottom:26px;
  border-radius:0 0 26px 26px;
  box-shadow:0 20px 40px -22px rgba(10,15,20,.5);
}
.ch-banner{
  position:relative;aspect-ratio:21/9;max-height:340px;min-height:190px;
  background:linear-gradient(135deg,#1e2f4d,#0a0f14 60%,#0f172a);
  background-size:cover;background-position:center;
}
.ch-banner::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:20px 20px;opacity:.5}
.ch-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,20,.2) 0%,rgba(10,15,20,.65) 55%,rgba(10,15,20,.97) 100%)}
.ch-hero-in{position:absolute;bottom:0;left:0;right:0;padding:22px 30px 24px;z-index:2;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
@media (max-width:640px){.ch-hero-in{padding:16px 20px 18px;gap:12px}}
.ch-hero-logo{
  width:88px;height:88px;border-radius:20px;overflow:hidden;
  background:linear-gradient(135deg,#0a0f14,#0f172a);
  display:flex;align-items:center;justify-content:center;
  border:3px solid rgba(0,255,255,.35);box-shadow:0 12px 30px rgba(0,0,0,.5);
  flex-shrink:0;position:relative;z-index:3;
}
.ch-hero-logo img{width:100%;height:100%;object-fit:cover;display:block}
.ch-hero-logo span{font-size:30px;font-weight:900;color:var(--cy);font-family:var(--mono)}
@media (max-width:640px){.ch-hero-logo{width:68px;height:68px;border-radius:16px}.ch-hero-logo span{font-size:22px}}
.ch-hero-text{flex:1;min-width:0}
.ch-name-big{font-size:clamp(1.5rem,3.4vw,2.3rem);font-weight:900;letter-spacing:-.02em;line-height:1.05;color:#fff;margin-bottom:8px;text-shadow:0 4px 20px rgba(0,0,0,.6);word-break:break-word;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch-partner-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(0,255,255,.15);border:1px solid rgba(0,255,255,.5);
  color:var(--cy);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;
}
.ch-partner-pill i{width:11px;height:11px}
.ch-meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.78);font-weight:500}
.ch-meta-row span{display:inline-flex;align-items:center;gap:6px}
.ch-meta-row i{width:13px;height:13px;color:var(--cy);flex-shrink:0}
.ch-cat{font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:rgba(0,255,255,.15);color:var(--cy);border:1px solid rgba(0,255,255,.4)}
.ch-live-dot{display:inline-flex;align-items:center;gap:6px;color:#fca5a5;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.ch-live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:#fca5a5;animation:livePulse 1.5s infinite;box-shadow:0 0 10px rgba(252,165,165,.7)}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}

/* MAIN */
main{flex:1}
main .inner{max-width:1480px;margin:0 auto;padding:0 20px 64px}
@media (max-width:560px){main .inner{padding:0 14px 44px}}

.section{margin-bottom:28px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px;padding:0 4px}
.section-title{font-size:1rem;color:var(--nv);font-weight:900;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.section-title i{width:17px;height:17px;color:var(--cy3)}
.section-title .cnt{font-size:11px;font-weight:800;color:var(--mut);background:var(--sf2);padding:2px 9px;border-radius:99px;letter-spacing:0;font-family:var(--mono)}

/* STREAM ROW */
.stream-row{
  display:flex;gap:14px;overflow-x:auto;padding:4px 4px 10px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin:0 -4px;
}
.stream-row::-webkit-scrollbar{display:none}
.stream-row .stream-card{flex:0 0 280px;scroll-snap-align:start}
@media (max-width:560px){.stream-row .stream-card{flex:0 0 240px}}

/* STREAM GRID */
.stream-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));padding:0 4px}

/* STREAM CARD */
.stream-card{
  background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;
  box-shadow:0 4px 12px rgba(15,23,42,.05);cursor:pointer;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s ease;
  display:flex;flex-direction:column;
}
.stream-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(10,15,20,.12);border-color:var(--cy)}
.stream-thumb{
  aspect-ratio:16/9;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0a0f14,#0f172a);background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;
}
.stream-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,15,20,.5),transparent 55%);pointer-events:none}
.stream-badge{
  position:absolute;top:10px;left:10px;z-index:3;
  font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;color:#fff;
  display:inline-flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap;
}
.stream-badge.live{background:#dc2626}
.stream-badge.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:livePulse 1.5s infinite}
.stream-badge.upcoming{background:rgba(10,15,20,.85);color:#67e8f9;border:1px solid rgba(103,232,249,.35);backdrop-filter:blur(8px)}
.stream-badge.replay{background:rgba(139,92,246,.92)}
.stream-badge.highlight{background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(124,58,237,.95))}
.partner-tag{
  position:absolute;top:10px;right:10px;z-index:3;
  background:rgba(0,255,255,.9);color:#04161c;
  font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:5px;
  display:inline-flex;align-items:center;gap:4px;
  backdrop-filter:blur(6px);
}
.partner-tag i{width:10px;height:10px}
.platform-tag{
  position:absolute;bottom:10px;right:10px;z-index:3;
  background:rgba(10,15,20,.75);color:#fff;
  font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;backdrop-filter:blur(8px);
}
.play-ico{
  width:52px;height:52px;border-radius:50%;z-index:2;
  background:rgba(0,255,255,.22);border:2px solid rgba(0,255,255,.6);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);transition:transform .3s var(--ease);
}
.stream-card:hover .play-ico{transform:scale(1.12);background:rgba(0,255,255,.4)}
.play-ico i{width:22px;height:22px;color:var(--cy)}
.stream-body{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.stream-title{font-size:14.5px;font-weight:800;line-height:1.25;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.005em;word-break:break-word}
.stream-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:500;min-width:0}
.stream-meta i{width:12px;height:12px;flex-shrink:0;color:var(--cy3)}
.stream-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stream-status{margin-top:auto;padding-top:8px;border-top:1px dashed var(--bd);font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px;color:var(--tx2)}
.stream-status i{width:13px;height:13px;color:var(--cy3)}
.stream-status.live{color:#dc2626}
.stream-status.live i{color:#dc2626}
.stream-status.replay{color:#7c3aed}
.stream-status.replay i{color:#7c3aed}
.stream-status.ended{color:var(--mut)}
.stream-status.ended i{color:var(--mut)}

/* SLIDE NAV ARROWS */
.slide-nav{
  position:fixed;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border-radius:50%;
  background:rgba(10,15,20,.72);color:#fff;border:1px solid rgba(255,255,255,.18);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);z-index:45;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.slide-nav:hover:not(:disabled){background:var(--cy);color:#04161c;border-color:var(--cy);transform:translateY(-50%) scale(1.08)}
.slide-nav:disabled{opacity:.25;cursor:not-allowed}
.slide-nav i{width:22px;height:22px}
.slide-nav.prev{left:18px}
.slide-nav.next{right:18px}
@media (min-width:1024px){.slide-nav{display:flex}}

/* STATE */
.state{max-width:560px;margin:60px auto;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:44px 32px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.state .ico{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.state .ico i{width:28px;height:28px}
.state h2{font-size:1.3rem;font-weight:900;color:var(--nv);margin-bottom:8px}
.state p{font-size:13.5px;color:var(--mut);margin-bottom:22px;line-height:1.6}
.state .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.state .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:11px;font-weight:800;font-size:13.5px;transition:.15s;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit}
.state .btn i{width:15px;height:15px}
.state .btn.primary{background:var(--cy);color:#04161c}
.state .btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,255,255,.35)}
.state .btn.ghost{background:var(--sf2);border-color:var(--bd);color:var(--tx2)}
.state .btn.ghost:hover{border-color:var(--cy);color:var(--cy3)}
.spinner-lg{width:28px;height:28px;border:3px solid rgba(0,255,255,.2);border-top-color:var(--cy);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);background:var(--ink);color:var(--cy);font-size:13px;font-weight:800;padding:13px 22px;border-radius:99px;box-shadow:0 14px 34px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:90vw;text-align:center;display:flex;align-items:center;gap:9px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{width:15px;height:15px;flex-shrink:0}
#toast.success{background:#065f46;color:#d1fae5}
#toast.error{background:#991b1b;color:#fef2f2}

/* FOOTER */
.site-footer{background:#0a0f14;color:#c9d2dd;padding:32px 0 22px;margin-top:auto;font-size:13px}
.footer-in{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center;font-size:12px;color:#6b7787}
.footer-in a{color:#8a96a4}
.footer-in a:hover{color:#22d3ee}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header class="site-header">
  <div class="hdr">
    <a href="index.html" class="logo" aria-label="Novalink home">
      <svg viewBox="0 0 60 74"><path fill="#3a5a8c" d="M34.5 4.2c-8.1 0-14.7 6.6-14.7 14.7v3.4c0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9v-3.4c0-4.9 4-8.9 8.9-8.9 4.9 0 8.9 4 8.9 8.9 0 3-1.5 5.7-3.9 7.3-1.4.9-1.8 2.8-.9 4.2.9 1.4 2.8 1.8 4.2.9 4.3-2.7 6.9-7.4 6.9-12.4 0-8.1-6.6-14.7-14.7-14.7z"/><path fill="#00FFFF" d="M25.5 69.8c8.1 0 14.7-6.6 14.7-14.7v-3.4c0-1.6-1.3-2.9-2.9-2.9s-2.9 1.3-2.9 2.9v3.4c0 4.9-4 8.9-8.9 8.9-4.9 0-8.9-4-8.9-8.9 0-3 1.5-5.7 3.9-7.3 1.4-.9 1.8-2.8.9-4.2-.9-1.4-2.8-1.8-4.2-.9-4.3 2.7-6.9 7.4-6.9 12.4 0 8.1 6.6 14.7 14.7 14.7z"/></svg>
      <b>NOVALINK</b>
    </a>
    <div class="hdr-actions">
      <a href="index.html" class="hdr-btn"><i data-lucide="home"></i><span class="lbl">Home</span></a>
      <a href="create-streams.html" class="hdr-btn" id="goLiveBtn" style="display:none;"><i data-lucide="radio"></i><span class="lbl">Go live</span></a>
      <button class="hdr-btn" id="signInBtn" type="button"><i data-lucide="log-in"></i><span class="lbl">Sign in</span></button>
      <button class="hdr-btn" id="userChip" type="button" style="display:none;">
        <span class="avatar" id="userAvatar">?</span>
        <span class="lbl" id="userName">User</span>
      </button>
    </div>
  </div>
</header>

<div class="search-bar">
  <div class="search-in">
    <div class="search-input">
      <i data-lucide="search"></i>
      <input type="text" id="searchInput" placeholder="Search streams across all channels…" autocomplete="off" />
      <button class="clear" id="searchClear" type="button" aria-label="Clear search"><i data-lucide="x"></i></button>
    </div>
    <div class="cat-chips" id="catChips"></div>
  </div>
</div>

<div class="ch-strip-wrap" id="chStripWrap" style="display:none">
  <div class="ch-strip" id="chStrip"></div>

var $ = function(id){ return document.getElementById(id); };

var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };
var refreshIcons = function(){ if (window.lucide) lucide.createIcons(); };

function toast(msg, type, ms){
  type = type || 'info'; ms = ms || 3200;
  var t = $('toast');
  var ic = type === 'error' ? 'alert-circle' : (type === 'success' ? 'check-circle' : 'info');
  t.className = type;
  t.innerHTML = icon(ic) + '<span>' + esc(msg) + '</span>';
  refreshIcons();
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, ms);
}

function initials(name){
  if (!name) return '?';
  var p = String(name).trim().split(/\s+/);
  if (p.length >= 2) return (p[0][0]+p[1][0]).toUpperCase();
  return p[0].slice(0,2).toUpperCase();
}

function categoryLabel(c){
  return {
    sports:'Sports', concerts:'Concerts', entertainment:'Entertainment',
    news:'News', music:'Music', gaming:'Gaming', education:'Education',
    talk:'Talk Shows', movies:'Movies', business:'Business',
    creative:'Creative', other:'Other',
    documentary:'Documentary', nature:'Nature & Wildlife', science:'Science',
    kids:'Kids'
  }[c] || '';
}

function platformLabel(p){
  return {
    youtube:'YouTube', twitch:'Twitch', vimeo:'Vimeo', facebook:'Facebook',
    custom:'Embed', 'native-hls':'HLS Stream', 'native-dash':'DASH Stream',
    'native-mpegts':'MPEG-TS', partner:'Partner Feed'
  }[p] || 'Live';
}

function prettyDate(dateStr, timeStr){
  if (!dateStr) return 'Date TBA';
  try {
    var d = new Date(dateStr + 'T' + (timeStr || '00:00'));
    if (isNaN(d.getTime())) return dateStr;
    var opts = { day:'numeric', month:'short', year:'numeric' };
    var out = d.toLocaleDateString('en-ZA', opts);
    if (timeStr) out += ' · ' + timeStr;
    return out;
  } catch(e){ return dateStr; }
}

function streamStatus(s){
  var dateStr = s.startDate || '';
  var timeStr = s.startTime || '00:00';
  var durMin = parseInt(s.durationMinutes, 10) || 90;
  if (!dateStr) return { status:'upcoming', startMs:0, endMs:0, replayOk:false };
  var startMs = new Date(dateStr + 'T' + timeStr + ':00').getTime();
  if (isNaN(startMs)) return { status:'upcoming', startMs:0, endMs:0, replayOk:false };
  var endMs = startMs + durMin * 60000 + 15 * 60000;
  var replayUntilMs = endMs + REPLAY_DAYS * 86400000;
  var now = Date.now();
  if (now < startMs) return { status:'upcoming', startMs:startMs, endMs:endMs, replayOk:false };
  if (now <= endMs)  return { status:'live',     startMs:startMs, endMs:endMs, replayOk:false };
  var replayOk = s.replayEnabled !== false && now <= replayUntilMs;
  return { status:'past', startMs:startMs, endMs:endMs, replayOk:replayOk };
}

function streamTypeOf(s){ return s.streamType === 'highlight' ? 'highlight' : 'live'; }

function isPartnerStream(s){
  return !!(s.partnerId || s.streamPlatform === 'partner');
}

function isAdmin(user){
  if (!user || !user.email) return false;
  var e = String(user.email).toLowerCase();
  return ADMIN_EMAILS.some(function(x){ return x.toLowerCase() === e; });
}

/* ══════════════════════════════════════════════════════════════
   STREAM CARD
   ══════════════════════════════════════════════════════════════ */
function buildStreamCard(s){
  var card = document.createElement('div');
  card.className = 'stream-card';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');

  var st = streamStatus(s);
  var title = s.streamTitle || s.eventName || 'Untitled Stream';
  var dateStr = prettyDate(s.startDate, s.startTime);
  var platform = platformLabel(s.streamPlatform);
  var isHL = streamTypeOf(s) === 'highlight';
  var isPartner = isPartnerStream(s);

  var badgeClass = 'upcoming', badgeText = 'Upcoming';
  if (st.status === 'live'){
    if (isHL){ badgeClass = 'highlight'; badgeText = 'Highlight'; }
    else { badgeClass = 'live'; badgeText = 'Live'; }
  } else if (st.status === 'past'){
    if (st.replayOk){ badgeClass = 'replay'; badgeText = 'Replay'; }
    else { badgeClass = 'ended'; badgeText = 'Ended'; }
  }

  var statusCls = '', statusIcon = 'clock', statusText = 'Starts soon';
  if (st.status === 'live'){
    statusCls = isHL ? 'highlight' : 'live';
    statusIcon = isHL ? 'film' : 'radio';
    statusText = isHL ? 'Highlight' : 'Live now';
  } else if (st.status === 'past'){
    if (st.replayOk){ statusCls = 'replay'; statusIcon = 'history'; statusText = 'Replay available'; }
    else { statusCls = 'ended'; statusIcon = 'square'; statusText = 'Ended'; }
  } else {
    statusText = 'Starts ' + dateStr;
  }

  var thumbStyle = s.heroImage
    ? "background-image:url('"+esc(s.heroImage)+"');background-size:cover;background-position:center;"
    : '';

  var partnerTagHTML = isPartner
    ? '<span class="partner-tag">'+icon('shield-check')+' Partner</span>'
    : '';

  card.innerHTML =
    '<div class="stream-thumb" style="'+thumbStyle+'">'+
      '<span class="stream-badge '+badgeClass+'">'+esc(badgeText)+'</span>'+
      partnerTagHTML +
      '<span class="platform-tag">'+esc(platform)+'</span>'+
      '<div class="play-ico">'+icon('play')+'</div>'+
    '</div>'+
    '<div class="stream-body">'+
      '<div class="stream-title">'+esc(title)+'</div>'+
      '<div class="stream-meta">'+icon('calendar')+' <span>'+esc(dateStr)+'</span></div>'+
      '<div class="stream-status '+statusCls+'">'+icon(statusIcon)+' <span>'+esc(statusText)+'</span></div>'+
    '</div>';

  function go(){ window.location.href = 'view-stream.html?id=' + encodeURIComponent(s.id); }
  card.addEventListener('click', go);
  card.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
  });

  return card;
}

/* ══════════════════════════════════════════════════════════════
   CHANNEL SLIDE
   ══════════════════════════════════════════════════════════════ */
function buildChannelSlide(ch){
  var slide = document.createElement('div');
  slide.className = 'channel-slide';
  slide.dataset.channelId = ch.id;

  var streams = streamsByChannel[ch.id] || [];
  var live = [], upcoming = [], past = [];
  streams.forEach(function(s){
    var st = streamStatus(s);
    if (st.status === 'live') live.push(s);
    else if (st.status === 'upcoming') upcoming.push(s);
    else if (st.replayOk) past.push(s);
  });
  live.sort(function(a, b){ return (streamStatus(a).startMs || 0) - (streamStatus(b).startMs || 0); });
  upcoming.sort(function(a, b){ return (streamStatus(a).startMs || 0) - (streamStatus(b).startMs || 0); });
  past.sort(function(a, b){ return (streamStatus(b).startMs || 0) - (streamStatus(a).startMs || 0); });

  // Does this channel have any partner streams?
  var hasPartner = streams.some(function(s){ return isPartnerStream(s); });

  var catLabel = ch.category ? categoryLabel(ch.category) : 'Channel';
  var bannerStyle = ch.bannerUrl
    ? "background-image:url('"+esc(ch.bannerUrl)+"');background-size:cover;background-position:center;"
    : '';
  var logoHTML = ch.logoUrl
    ? '<img alt="'+esc(ch.name)+'" src="'+esc(ch.logoUrl)+'" />'
    : '<span>'+esc(initials(ch.name))+'</span>';

  var partnerPillHTML = hasPartner
    ? '<span class="ch-partner-pill">'+icon('shield-check')+' Partner</span>'
    : '';

  var heroHTML =
    '<section class="ch-hero">'+
      '<div class="ch-banner" style="'+bannerStyle+'"></div>'+
      '<div class="ch-hero-in">'+
        '<div class="ch-hero-logo">'+logoHTML+'</div>'+
        '<div class="ch-hero-text">'+
          '<h1 class="ch-name-big">'+esc(ch.name)+' '+partnerPillHTML+'</h1>'+
          '<div class="ch-meta-row">'+
            '<span class="ch-cat">'+esc(catLabel)+'</span>'+
            (ch.channelNumber ? '<span>'+icon('hash')+' CH '+esc(String(ch.channelNumber))+'</span>' : '')+
            (live.length > 0 ? '<span class="ch-live-dot">'+live.length+' live now</span>' : '')+
            (streams.length > 0 ? '<span>'+icon('video')+' '+streams.length+' stream'+(streams.length === 1 ? '' : 's')+'</span>' : '')+
          '</div>'+
          (ch.tagline ? '<div style="margin-top:6px;font-size:13px;color:rgba(255,255,255,.7);font-weight:500;">'+esc(ch.tagline)+'</div>' : '')+
        '</div>'+
      '</div>'+
    '</section>';

  var bodyHTML = '<div class="inner">';

  if (live.length){
    bodyHTML +=
      '<section class="section">'+
        '<div class="section-head">'+
          '<div class="section-title">'+icon('radio')+' Live Now <span class="cnt">'+live.length+'</span></div>'+
        '</div>'+
        '<div class="stream-row" data-row="live"></div>'+
      '</section>';
  }
  if (upcoming.length){
    bodyHTML +=
      '<section class="section">'+
        '<div class="section-head">'+
          '<div class="section-title">'+icon('clock')+' Coming Up <span class="cnt">'+upcoming.length+'</span></div>'+
        '</div>'+
        '<div class="stream-row" data-row="upcoming"></div>'+
      '</section>';
  }
  if (past.length){
    bodyHTML +=
      '<section class="section">'+
        '<div class="section-head">'+
          '<div class="section-title">'+icon('history')+' Replays <span class="cnt">'+past.length+'</span></div>'+
          '<span style="font-size:12px;color:var(--mut);">Available for '+REPLAY_DAYS+' days after each stream</span>'+
        '</div>'+
        '<div class="stream-row" data-row="past"></div>'+
      '</section>';
  }
  if (!live.length && !upcoming.length && !past.length){
    bodyHTML +=
      '<div class="state">'+
        '<div class="ico">'+icon('tv')+'</div>'+
        '<h2>No streams yet</h2>'+
        '<p>This channel hasn\'t published any streams yet. Check back soon.</p>'+
      '</div>';
  }

  bodyHTML += '</div>';

  slide.innerHTML = heroHTML + bodyHTML;

  setTimeout(function(){
    var rowL = slide.querySelector('[data-row="live"]');
    var rowU = slide.querySelector('[data-row="upcoming"]');
    var rowP = slide.querySelector('[data-row="past"]');
    if (rowL) live.forEach(function(s){ rowL.appendChild(buildStreamCard(s)); });
    if (rowU) upcoming.forEach(function(s){ rowU.appendChild(buildStreamCard(s)); });
    if (rowP) past.forEach(function(s){ rowP.appendChild(buildStreamCard(s)); });
  }, 0);

  return slide;

            '<button class="btn ghost" id="clearFiltersBtn" type="button">'+icon('x')+' Clear filters</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    refreshIcons();
    $('chStripWrap').style.display = 'none';
    updateNavArrows();

    var clr = $('clearFiltersBtn');
    if (clr) clr.addEventListener('click', function(){
      activeCategory = '';
      activePartnerFilter = false;
      applyFilters();
      renderCategoryChips();

  }

  if (currentIndex >= allChannels.length) currentIndex = 0;
  if (currentIndex < 0) currentIndex = allChannels.length - 1;

  $('main').innerHTML = '<div class="pager" id="pager"><div class="pager-track" id="pagerTrack"></div></div>';

  var track = $('pagerTrack');
  allChannels.forEach(function(ch){ track.appendChild(buildChannelSlide(ch)); });

  requestAnimationFrame(function(){ goTo(currentIndex, true); });

  renderChannelStrip();
  updateNavArrows();
  refreshIcons();
}

function renderChannelStrip(){
  var wrap = $('chStripWrap');
  var strip = $('chStrip');
  if (!allChannels.length){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';

  strip.innerHTML = '';
  allChannels.forEach(function(ch, i){
    var liveCount = (streamsByChannel[ch.id] || []).filter(function(s){
      return streamStatus(s).status === 'live';
    }).length;

    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'ch-chip' + (i === currentIndex ? ' active' : '');
    chip.dataset.idx = i;

    var logoHTML = ch.logoUrl
      ? '<img alt="" src="'+esc(ch.logoUrl)+'" />'
      : '<span>'+esc(initials(ch.name))+'</span>';

    chip.innerHTML =
      '<span class="ch-chip-logo">'+logoHTML+'</span>'+
      '<span>'+esc(ch.name)+'</span>'+
      (liveCount > 0 ? '<span class="live-pill">'+liveCount+' LIVE</span>' : '');

    chip.addEventListener('click', function(){
      goTo(i);
      chip.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    });

    strip.appendChild(chip);
  });

  setTimeout(function(){
    var active = strip.querySelector('.ch-chip.active');
    if (active) active.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }, 100);
}

function goTo(idx, instant){
  if (idx < 0) idx = 0;
  if (idx >= allChannels.length) idx = allChannels.length - 1;
  currentIndex = idx;

  var track = $('pagerTrack');
  if (!track) return;

  track.style.transition = instant ? 'none' : 'transform .38s cubic-bezier(0.25,0.8,0.25,1)';
  track.style.transform = 'translateX(-' + (currentIndex * 100) + '%)';

  $$('.ch-chip').forEach(function(c, i){
    c.classList.toggle('active', i === currentIndex);
  });

  updateNavArrows();
  refreshIcons();

  try {
    var url = new URL(window.location.href);
    url.searchParams.set('ch', allChannels[currentIndex].id);
    history.replaceState(null, '', url.toString());
  } catch(e){}
}

function updateNavArrows(){
  var prev = $('navPrev');
  var next = $('navNext');
  if (!prev || !next) return;
  var show = allChannels.length > 1 && !searchActive;
  prev.style.display = show ? '' : 'none';
  next.style.display = show ? '' : 'none';
  prev.disabled = currentIndex <= 0;
  next.disabled = currentIndex >= allChannels.length - 1;
}

/* ══════════════════════════════════════════════════════════════
   SEARCH
   ══════════════════════════════════════════════════════════════ */
function renderSearchResults(){
  var q = searchQuery.toLowerCase();
  var matches = [];

  Object.keys(streamsByChannel).forEach(function(cid){
    (streamsByChannel[cid] || []).forEach(function(s){
      var title = String(s.streamTitle || s.eventName || '').toLowerCase();
      var channelName = String(s.channelName || '').toLowerCase();
      var tagline = String(s.eventTagline || '').toLowerCase();
      if (title.indexOf(q) !== -1 || channelName.indexOf(q) !== -1 || tagline.indexOf(q) !== -1){
        matches.push(s);
      }
    });
  });

  matches.sort(function(a, b){
    var sa = streamStatus(a), sb = streamStatus(b);
    var ra = sa.status === 'live' ? 0 : (sa.status === 'upcoming' ? 1 : 2);
    var rb = sb.status === 'live' ? 0 : (sb.status === 'upcoming' ? 1 : 2);
    if (ra !== rb) return ra - rb;
    return (sa.startMs || 0) - (sb.startMs || 0);
  });

  $('chStripWrap').style.display = 'none';
  updateNavArrows();

  if (!matches.length){
    $('main').innerHTML =
      '<div class="inner">'+
        '<div class="state">'+
          '<div class="ico">'+icon('search-x')+'</div>'+
          '<h2>No streams found</h2>'+
          '<p>Try a different search term.</p>'+
        '</div>'+
      '</div>';
    refreshIcons();
    return;
  }

  $('main').innerHTML =
    '<div class="inner">'+
      '<section class="section" style="padding-top:22px;">'+
        '<div class="section-head">'+
          '<div class="section-title">'+icon('search')+' Results <span class="cnt">'+matches.length+'</span></div>'+
        '</div>'+
        '<div class="stream-grid" id="searchGrid"></div>'+
      '</section>'+
    '</div>';

  var grid = $('searchGrid');
  matches.forEach(function(s){ grid.appendChild(buildStreamCard(s)); });
  refreshIcons();
}

/* ══════════════════════════════════════════════════════════════
   SWIPE
   ══════════════════════════════════════════════════════════════ */
var swipe = {
  active: false,
  startX: 0, startY: 0,
  dx: 0, dy: 0,
  startTime: 0,
  startTranslate: 0,
  locked: false
};

function setupSwipe(){
  var main = $('main');
  if (!main || main._swipeBound) return;
  main._swipeBound = true;

  main.addEventListener('touchstart', function(e){
    if (searchActive || allChannels.length < 2) return;
    if (e.target.closest('.stream-row')) return;
    if (e.target.closest('.stream-grid')) return;
    if (e.target.closest('button')) return;

    var t = e.touches[0];
    swipe.active = true;
    swipe.startX = t.clientX;
    swipe.startY = t.clientY;
    swipe.dx = 0;
    swipe.dy = 0;
    swipe.startTime = Date.now();
    swipe.startTranslate = -currentIndex * main.clientWidth;
    swipe.locked = false;
  }, { passive: true });

  main.addEventListener('touchmove', function(e){
    if (!swipe.active) return;
    var t = e.touches[0];
    swipe.dx = t.clientX - swipe.startX;
    swipe.dy = t.clientY - swipe.startY;

    if (!swipe.locked){
      if (Math.abs(swipe.dx) > 8 || Math.abs(swipe.dy) > 8){
        if (Math.abs(swipe.dy) > Math.abs(swipe.dx)){
          swipe.active = false;
          return;
        }
        swipe.locked = true;
      } else {
        return;
      }
    }

    e.preventDefault();

    var offset = swipe.startTranslate + swipe.dx;
    if (currentIndex === 0 && swipe.dx > 0) offset = swipe.dx * 0.35;
    if (currentIndex === allChannels.length - 1 && swipe.dx < 0)
      offset = swipe.startTranslate + swipe.dx * 0.35;

    var track = $('pagerTrack');
    if (!track) return;
    track.style.transition = 'none';
    track.style.transform = 'translateX(' + offset + 'px)';
  }, { passive: false });

  main.addEventListener('touchend', function(e){
    if (!swipe.active) return;
    swipe.active = false;

    var W = main.clientWidth;
    var elapsed = Date.now() - swipe.startTime;
    var velocity = Math.abs(swipe.dx) / Math.max(1, elapsed);

    var shouldNext = swipe.dx < -W * 0.15 || (velocity > 0.5 && swipe.dx < -40);
    var shouldPrev = swipe.dx >  W * 0.15 || (velocity > 0.5 && swipe.dx >  40);

    if (shouldNext && currentIndex < allChannels.length - 1) goTo(currentIndex + 1);
    else if (shouldPrev && currentIndex > 0) goTo(currentIndex - 1);
    else goTo(currentIndex);
  }, { passive: true });
}

/* ══════════════════════════════════════════════════════════════
   FILTERS — category chips + partner toggle
   ══════════════════════════════════════════════════════════════ */
function renderCategoryChips(){
  var wrap = $('catChips');
  var cats = {};
  allChannelsRaw.forEach(function(c){
    if (c.category) cats[c.category] = (cats[c.category] || 0) + 1;
  });

  // Does any channel have a partner stream?
  var anyPartner = false;
  Object.keys(streamsByChannel).forEach(function(cid){
    (streamsByChannel[cid] || []).forEach(function(s){
      if (isPartnerStream(s)) anyPartner = true;
    });
  });

  var html = '<button class="cat-chip' + (!activeCategory && !activePartnerFilter ? ' active' : '') + '" data-cat="">All</button>';

  if (anyPartner){
    html += '<button class="cat-chip' + (activePartnerFilter ? ' active' : '') + '" data-partner="1" style="display:inline-flex;align-items:center;gap:5px;">'+icon('shield-check')+' Partners</button>';
  }

  Object.keys(cats).sort().forEach(function(cat){
    html += '<button class="cat-chip' + (activeCategory === cat && !activePartnerFilter ? ' active' : '') + '" data-cat="'+esc(cat)+'">'+esc(categoryLabel(cat))+'</button>';
  });
  wrap.innerHTML = html;

  wrap.querySelectorAll('.cat-chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      if (chip.dataset.partner){
        activePartnerFilter = true;
        activeCategory = '';
      } else {
        activePartnerFilter = false;
        activeCategory = chip.dataset.cat || '';
      }
      applyFilters();
      renderCategoryChips();
    });
  });
  refreshIcons();
}

function applyFilters(){
  // Start with all channels
  var pool = allChannelsRaw.slice();

  // If partner filter is on, keep only channels that have at least one partner stream
  if (activePartnerFilter){
    pool = pool.filter(function(c){
      var streams = streamsByChannel[c.id] || [];
      return streams.some(function(s){ return isPartnerStream(s); });
    });
  } else if (activeCategory){
    pool = pool.filter(function(c){ return c.category === activeCategory; });
  }

  allChannels = pool;
  currentIndex = 0;
  renderPager();
}

/* ══════════════════════════════════════════════════════════════
   LOAD DATA
   ══════════════════════════════════════════════════════════════ */
function loadData(){
  var chPromise = db.collection(CHANNELS).get().then(function(snap){
    allChannelsRaw = [];
    snap.forEach(function(doc){
      var d = doc.data() || {};
      if (d.active === false) return;
      d.id = doc.id;
      allChannelsRaw.push(d);
    });
    allChannelsRaw.sort(function(a, b){
      var oa = a.order || 99, ob = b.order || 99;
      if (oa !== ob) return oa - ob;
      return String(a.name || '').localeCompare(String(b.name || ''));
    });
  });

  var stPromise = db.collection(STREAMS).get().then(function(snap){
    streamsByChannel = {};
    orphanStreams = [];
    snap.forEach(function(doc){
      var d = doc.data() || {};
      d.id = doc.id;
      if (d.channelId){
        if (!streamsByChannel[d.channelId]) streamsByChannel[d.channelId] = [];
        streamsByChannel[d.channelId].push(d);
      } else {
        orphanStreams.push(d);
      }
    });
  });

  Promise.all([chPromise, stPromise]).then(function(){
    allChannels = allChannelsRaw.slice();
    renderCategoryChips();

    // If URL has ?ch=channelId, jump to it
    var urlCh = null;
    try { urlCh = new URLSearchParams(window.location.search).get('ch'); } catch(e){}
    if (urlCh){
      var idx = allChannels.findIndex(function(c){ return c.id === urlCh; });
      if (idx >= 0) currentIndex = idx;
    }

    renderPager();
    setupSwipe();
  }).catch(function(err){
    console.error('[load]', err);
    $('main').innerHTML =
      '<div class="inner">'+
        '<div class="state">'+
          '<div class="ico">'+icon('alert-triangle')+'</div>'+
          '<h2>Could not load</h2>'+
          '<p>'+esc(err.message || 'Please try again.')+'</p>'+
          '<div class="actions">'+
            '<a class="btn primary" href="index.html">'+icon('home')+' Home</a>'+
          '</div>'+
        '</div>'+
      '</div>';
    refreshIcons();
  });
}

/* ══════════════════════════════════════════════════════════════
   WIRE UP
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function(){
  $('year').textContent = new Date().getFullYear();
  refreshIcons();

  $('signInBtn').addEventListener('click', function(){ window.location.href = 'index.html#signin'; });
  $('userChip').addEventListener('click', function(){
    if (!currentUser) return;
    if (confirm('Sign out of ' + (currentUser.email || 'your account') + '?')){
      auth.signOut().then(function(){ toast('Signed out.', 'success'); });
    }
  });

  auth.onAuthStateChanged(function(user){ applyAuth(user); });

  var searchEl = $('searchInput');
  var searchClear = $('searchClear');
  var searchTimer = null;
  searchEl.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var v = searchEl.value.trim();
    searchClear.classList.toggle('show', !!v);
    searchTimer = setTimeout(function(){
      searchQuery = v;
      searchActive = !!v;
      if (searchActive) renderSearchResults();
      else renderPager();
    }, 200);
  });
  searchClear.addEventListener('click', function(){
    searchEl.value = '';
    searchClear.classList.remove('show');
    searchQuery = '';
    searchActive = false;
    renderPager();
    searchEl.focus();
  });

  $('navPrev').addEventListener('click', function(){ goTo(currentIndex - 1); });
  $('navNext').addEventListener('click', function(){ goTo(currentIndex + 1); });

  document.addEventListener('keydown', function(e){
    if (searchActive) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
    else if (e.key === 'ArrowRight') goTo(currentIndex + 1);
  });

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if (!searchActive && allChannels.length){ goTo(currentIndex, true); }
    }, 120);
  });

  loadData();
});
})();
</script>
</body>
</html>
