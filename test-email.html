<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmailJS Test</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
body{font-family:Arial;padding:20px;max-width:600px;margin:auto;background:#f6f8fb}
h1{color:#0a0f14}
button{padding:15px 30px;font-size:18px;background:#00FFFF;border:none;border-radius:10px;font-weight:bold;cursor:pointer;width:100%}
pre{background:#fff;padding:20px;margin-top:20px;border-radius:10px;white-space:pre-wrap;word-break:break-all;font-size:13px;border:1px solid #e4e9f0}
</style>
</head>
<body>
<h1>EmailJS Test</h1>
<button onclick="runTest()">Send Test Email</button>
<pre id="output">Tap the button above…</pre>

<script>
function runTest(){
  document.getElementById('output').textContent = 'Starting…';
  
  emailjs.init({ publicKey: "bmHeI_nQwa4UY6mR4" });
  
  emailjs.send("service_prn9hay", "template_5pt25oi", {
    to_email: "nylnathan340@gmail.com",
    event_name: "TEST EVENT",
    event_date: "Today",
    event_time: "18:00",
    event_venue: "Test Venue",
    guest_name: "Test Guest",
    tier_name: "Standard",
    seat: "A-1",
    ticket_ref: "NL-TEST-001",
    ticket_url: "https://google.com"
  })
  .then(function(r){
    document.getElementById('output').textContent = 
      "✅ SUCCESS!\n\nStatus: " + r.status + "\nText: " + r.text + 
      "\n\nCheck your Gmail — email should arrive in 10 seconds.";
  })
  .catch(function(e){
    document.getElementById('output').textContent = 
      "❌ FAILED\n\n" + JSON.stringify(e, null, 2);
  });
}
</script>
</body>
</html>
